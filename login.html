<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Bear Mrkt</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #fafaf8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #1a1a1a; }
    .login-card { background: #fff; border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); border: 1px solid #e8e6e1; }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand-pill { background: #1a1a1a; padding: 16px 28px; border-radius: 8px; display: inline-block; margin-bottom: 12px; }
    .brand-wordmark { height: 32px; width: auto; display: block; }
    .brand-sub  { font-size: 13px; color: #999; margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }
    .field { margin-bottom: 16px; }
    label  { display: block; font-size: 12px; color: #666; margin-bottom: 5px; font-weight: 500; }
    input  { width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid #e8e6e1; font-size: 15px; font-family: inherit; box-sizing: border-box; background: #fff; color: #1a1a1a; }
    input:focus { outline: none; border-color: #1a1a1a; box-shadow: 0 0 0 3px rgba(26,26,26,0.08); }
    .btn-login { width: 100%; padding: 13px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; font-family: inherit; transition: background 0.15s; }
    .btn-login:hover    { background: #000; }
    .btn-login:disabled { background: #999; cursor: not-allowed; }
    .msg-err  { background: #fdecea; border: 1px solid #dc2626; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #dc2626; margin-top: 14px; }
    .msg-info { background: #f4f2ed; border: 1px solid #d4d1ca; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #1a1a1a; margin-top: 14px; }
    .login-footer { margin-top: 24px; text-align: center; font-size: 12px; color: #999; }
    h2 { font-size: 18px; margin-bottom: 6px; color: #1a1a1a; }
    .hint { font-size: 13px; color: #666; margin-bottom: 18px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="login-card" id="card">
    <div class="brand">
      <div class="brand-pill">
        <img src="wordmark.png" alt="Bear Mrkt" class="brand-wordmark" />
      </div>
      <div class="brand-sub">Operations Platform</div>
    </div>
    <div id="form-area"></div>
    <div id="msg" style="display:none"></div>
  </div>
  <div class="login-footer">Bear Mrkt · Internal Use Only</div>
  <script>
    const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const formArea = document.getElementById("form-area");
    const msgEl    = document.getElementById("msg");

    function showMsg(text, type="err") {
      msgEl.className = type==="err" ? "msg-err" : "msg-info";
      msgEl.textContent = text;
      msgEl.style.display = "block";
    }
    function hideMsg() { msgEl.style.display = "none"; }

    // Determine which mode we're in — login or set_password
    // Supabase email links arrive in a few different shapes depending on flow + version:
    //   • New PKCE flow: ?code=xxx  → SDK auto-exchanges for session
    //   • Legacy hash flow: #access_token=xxx&type=recovery|invite|signup
    //   • Manual override: ?mode=set_password
    const url_params  = new URLSearchParams(window.location.search);
    const hash_params = new URLSearchParams(window.location.hash.slice(1));
    const has_code         = url_params.has("code");
    const hash_type        = hash_params.get("type");
    const manual_set_pw    = url_params.get("mode") === "set_password";
    const password_flows   = ["recovery", "invite", "signup", "magiclink"];
    const is_set_password_flow = manual_set_pw || has_code || password_flows.includes(hash_type);

    async function bootstrap() {
      // Wait briefly for the SDK to process URL params (e.g. exchange ?code= for session)
      // The SDK fires onAuthStateChange when this completes.
      let session = (await supabaseClient.auth.getSession()).data.session;
      if (!session && (has_code || hash_type)) {
        session = await new Promise(resolve => {
          const timeout = setTimeout(() => resolve(null), 3000);
          supabaseClient.auth.onAuthStateChange((_evt, sess) => {
            if (sess) { clearTimeout(timeout); resolve(sess); }
          });
        });
      }

      if (is_set_password_flow && session) {
        renderSetPassword();
      } else if (session) {
        window.location.href = "index.html";
      } else if (is_set_password_flow) {
        // Tried to enter set-password flow but session never materialised
        showMsg("Invitation link is invalid or has expired. Please ask an admin to resend it.");
        renderLogin();
      } else {
        renderLogin();
      }
    }

    function renderLogin() {
      formArea.innerHTML = `
        <div class="field"><label for="email">Email</label><input type="email" id="email" placeholder="you@bearmarket.ie" autocomplete="email"></div>
        <div class="field"><label for="password">Password</label><input type="password" id="password" placeholder="••••••••" autocomplete="current-password"></div>
        <button class="btn-login" id="login-btn">Log In</button>
        <div style="text-align:center;margin-top:14px"><a href="#" id="forgot-link" style="font-size:13px;color:#1a1a1a;text-decoration:underline;font-weight:500">Forgot your password?</a></div>`;
      document.getElementById("forgot-link")?.addEventListener("click", e => { e.preventDefault(); renderForgot(); });
      const emailEl    = document.getElementById("email");
      const passwordEl = document.getElementById("password");
      const loginBtn   = document.getElementById("login-btn");
      async function doLogin() {
        const email = emailEl.value.trim().toLowerCase(), password = passwordEl.value;
        if (!email || !password) { showMsg("Please enter your email and password."); return; }
        loginBtn.disabled = true; loginBtn.textContent = "Logging in…"; hideMsg();
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          const friendly = error.message.includes("Invalid login") ? "Incorrect email or password. Please try again."
            : error.message.includes("Email not confirmed") ? "Please confirm your email address before logging in."
            : error.message;
          showMsg(friendly); loginBtn.disabled = false; loginBtn.textContent = "Log In";
        } else {
          showMsg("Logged in! Redirecting…", "info");
          window.location.href = "index.html";
        }
      }
      loginBtn.addEventListener("click", doLogin);
      passwordEl.addEventListener("keydown", e => { if (e.key==="Enter") doLogin(); });
      emailEl.addEventListener("keydown",    e => { if (e.key==="Enter") passwordEl.focus(); });
    }

    function renderForgot() {
      hideMsg();
      formArea.innerHTML = `
        <h2>Reset your password</h2>
        <p class="hint">Enter your email and we'll send you a link to reset your password.</p>
        <div class="field"><label for="forgot-email">Email</label><input type="email" id="forgot-email" placeholder="you@bearmarket.ie" autocomplete="email"></div>
        <button class="btn-login" id="forgot-btn">Send Reset Link</button>
        <div style="text-align:center;margin-top:14px"><a href="#" id="back-to-login" style="font-size:13px;color:#1a1a1a;text-decoration:underline;font-weight:500">← Back to log in</a></div>`;
      const emailEl = document.getElementById("forgot-email");
      const btn     = document.getElementById("forgot-btn");
      async function doReset() {
        const email = emailEl.value.trim().toLowerCase();
        if (!email) { showMsg("Please enter your email."); return; }
        btn.disabled = true; btn.textContent = "Sending…"; hideMsg();
        const redirect_url = window.location.origin + window.location.pathname;
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: redirect_url });
        if (error) {
          showMsg(error.message); btn.disabled = false; btn.textContent = "Send Reset Link";
        } else {
          showMsg(`If an account exists for ${email}, a reset link has been sent. Check your inbox.`, "info");
          btn.textContent = "Sent ✓";
        }
      }
      btn.addEventListener("click", doReset);
      emailEl.addEventListener("keydown", e => { if (e.key==="Enter") doReset(); });
      document.getElementById("back-to-login")?.addEventListener("click", e => { e.preventDefault(); hideMsg(); renderLogin(); });
    }

    function renderSetPassword() {
      formArea.innerHTML = `
        <h2>Welcome! Set your password</h2>
        <p class="hint">Choose a password to finish setting up your RoasterHub account.</p>
        <div class="field"><label for="new-password">New password</label><input type="password" id="new-password" placeholder="At least 8 characters" autocomplete="new-password"></div>
        <div class="field"><label for="confirm-password">Confirm password</label><input type="password" id="confirm-password" placeholder="Repeat password" autocomplete="new-password"></div>
        <button class="btn-login" id="set-password-btn">Set Password &amp; Continue</button>`;
      const newPwEl  = document.getElementById("new-password");
      const confPwEl = document.getElementById("confirm-password");
      const btn      = document.getElementById("set-password-btn");
      async function doSet() {
        const pw1 = newPwEl.value, pw2 = confPwEl.value;
        if (pw1.length < 8) { showMsg("Password must be at least 8 characters."); return; }
        if (pw1 !== pw2)    { showMsg("Passwords don't match.");  return; }
        btn.disabled = true; btn.textContent = "Setting password…"; hideMsg();
        const { error } = await supabaseClient.auth.updateUser({ password: pw1 });
        if (error) {
          showMsg(error.message); btn.disabled = false; btn.textContent = "Set Password & Continue";
        } else {
          showMsg("Password set! Redirecting…", "info");
          // Strip hash params so a refresh doesn't bounce back here
          history.replaceState(null, "", window.location.pathname);
          setTimeout(() => { window.location.href = "index.html"; }, 800);
        }
      }
      btn.addEventListener("click", doSet);
      confPwEl.addEventListener("keydown", e => { if (e.key==="Enter") doSet(); });
      newPwEl.addEventListener("keydown",  e => { if (e.key==="Enter") confPwEl.focus(); });
    }

    bootstrap();
  </script>
</body>
</html>
