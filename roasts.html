<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roasts — Bear Roastery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f0eb; min-height: 100vh; color: #1a1008; }
    input, select, button { font-family: inherit; font-size: 14px; }
    button { cursor: pointer; }
    .header { background: #1a1008; color: #e8d5b0; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-back { background: none; border: none; color: #c8a96e; font-size: 13px; cursor: pointer; padding: 4px 0; display: flex; align-items: center; gap: 6px; }
    .header-back:hover { color: #e8d5b0; }
    .header-title { font-weight: 700; font-size: 18px; letter-spacing: 0.5px; }
    .header-sub { font-size: 12px; color: #c8a96e; margin-top: 1px; }
    .btn-logout { background: none; border: 1px solid #c8a96e; color: #c8a96e; border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-logout:hover { background: #c8a96e; color: #1a1008; }
    .content { padding: 24px; max-width: 760px; margin: 0 auto; }
    .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 12px; }
    label.lbl { display: block; font-size: 12px; color: #888; margin-bottom: 4px; font-weight: 500; }
    input, select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px; }
    input:focus, select:focus { outline: 2px solid #c8a96e; border-color: #c8a96e; }
    input.big { font-size: 22px; padding: 12px; text-align: center; font-weight: 700; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .span-2 { grid-column: 1 / -1; }
    .btn { color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-size: 14px; font-weight: 600; }
    .btn-dark { background: #1a1008; }
    .btn-green { background: #4a9e6b; }
    .btn-ghost { background: #f5f0eb; color: #5a3e1b; border: 1px solid #e0d5c5; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-lg { padding: 12px 24px; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .tag { border-radius: 10px; padding: 2px 8px; font-size: 12px; font-weight: 600; display: inline-block; }
    .steps { display: flex; margin-bottom: 24px; }
    .step { flex: 1; text-align: center; padding: 10px 8px; font-size: 12px; font-weight: 600; border-bottom: 3px solid #e0d5c5; color: #aaa; }
    .step.active { border-bottom-color: #1a1008; color: #1a1008; }
    .step.done { border-bottom-color: #4a9e6b; color: #4a9e6b; }
    .batch-row { background: #f5f0eb; border-radius: 8px; padding: 14px; margin-bottom: 10px; }
    .batch-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .batch-num { background: #1a1008; color: #e8d5b0; border-radius: 6px; padding: 5px 10px; font-weight: 700; font-size: 13px; white-space: nowrap; }
    .yield-good { color: #4a9e6b; font-weight: 600; }
    .yield-warn { color: #e0a82a; font-weight: 600; }
    .yield-bad { color: #e05c2a; font-weight: 600; }
    .history-card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 10px; border-left: 4px solid #4a9e6b; }
    .mono { font-family: monospace; }
    .err { color: #e05c2a; font-size: 13px; margin-top: 8px; }
    .hint { color: #888; font-size: 13px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .flex-wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .mt-4 { margin-top: 4px; }
    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mb-8 { margin-bottom: 8px; }
    .mb-12 { margin-bottom: 12px; }
    .mb-16 { margin-bottom: 16px; }
    h2 { color: #1a1008; }
    h3 { color: #1a1008; margin-bottom: 12px; }
    .section-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #c8a96e; margin-bottom: 12px; }
    .empty { text-align: center; color: #aaa; padding: 40px 20px; }
    .empty .icon { font-size: 36px; margin-bottom: 8px; }
    .loading { text-align: center; padding: 60px 20px; color: #888; font-size: 15px; }
    @media (max-width: 600px) {
      .grid-2 { grid-template-columns: 1fr; }
      .content { padding: 16px; }
      .steps .step { font-size: 10px; padding: 8px 4px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
<div id="app"></div>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// BEAR ROASTERY — Roasts Module
// Roasting flow:
//   1. Pick coffee to roast + roast date
//   2. Select container to fill + how many batches
//   3. For each batch: enter Cropster roast ID + green weight going in
//   4. After roasting: enter roasted weight of the full container
//   5. Save to Supabase
// ─────────────────────────────────────────────────────────────────────────────

const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if (!session) window.location.href = "login.html";
  else init();
});


const state = {
  view:           "home",
  roast_sessions: [],
  coffees:        [],
  loading:        true,
  saving:         false,
  session:        new_session(),
  ui: { step: 1, err: "" },
};

function new_session() {
  return {
    coffee: "", date: today(), container_id: "",
    batch_count: 1, batches: [], roasted_weight: "",
  };
}

function today() { return new Date().toISOString().split("T")[0]; }
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function gen_session_id() { return `RST-${today().replace(/-/g,"")}-${String(state.roast_sessions.length + 1).padStart(3,"0")}`; }
function yield_pct(green, roasted) { if (!Number(green)||!Number(roasted)) return null; return Math.round((Number(roasted)/Number(green))*100); }
function yield_class(pct) { if (pct===null) return "hint"; if (pct>=80&&pct<=90) return "yield-good"; if (pct>=75) return "yield-warn"; return "yield-bad"; }

async function load_data() {
  const { data: coffees_data } = await supabaseClient.from("coffees").select("id, name").order("name");
  state.coffees = (coffees_data || []).map(c => c.name);
  const { data: sessions, error } = await supabaseClient.from("roast_sessions").select("*, roast_batches(*)").order("date", { ascending: false });
  if (error) { console.error("Failed to load roast sessions:", error); return; }
  state.roast_sessions = (sessions||[]).map(s => ({ ...s, batches: (s.roast_batches||[]).sort((a,b) => a.batch_number - b.batch_number) }));
}

async function save_session() {
  state.saving = true; render();
  const s = state.session;
  const total_green = s.batches.reduce((sum,b) => sum+(Number(b.green_weight)||0), 0);
  const id = gen_session_id();
  const { error: session_err } = await supabaseClient.from("roast_sessions").insert({
    id, coffee: s.coffee, date: s.date, container_id: s.container_id,
    roasted_weight: Number(s.roasted_weight),
  });
  if (session_err) { state.saving = false; state.ui.err = "Failed to save session. Please try again."; render(); return; }

  const batches = s.batches.map((b,i) => ({
    id: `${id}-B${i+1}`, roast_session_id: id, batch_number: i+1,
    cropster_id: b.cropster_id || null, green_weight: Number(b.green_weight) || null,
  }));
  await supabaseClient.from("roast_batches").insert(batches);

  if (total_green > 0) {
    await supabaseClient.from("stock_adjustments").insert({
      id: `ADJ-${id}`, date: s.date, coffee: s.coffee, change_kg: -total_green,
      reason: "roast", note: `Auto-deducted from roast session ${id}`, auto: true, roast_session_id: id,
    });
    const { data: stock_item } = await supabaseClient.from("stock_items").select("id, current_kg").eq("coffee", s.coffee).maybeSingle();
    if (stock_item) {
      await supabaseClient.from("stock_items").update({ current_kg: Math.max(0, stock_item.current_kg - total_green) }).eq("id", stock_item.id);
    }
  }

  state.saving = false;
  await load_data();
  state.ui.step = 4;
  render();
}

async function init() { await load_data(); state.loading = false; render(); }

function render() { document.getElementById("app").innerHTML = build_app(); attach_listeners(); }

function build_app() {
  const header = `
    <div class="header">
      <div class="header-left">
        <button class="header-back" id="go-dashboard">← Dashboard</button>
        <div style="width:1px;height:28px;background:#333;margin:0 4px"></div>
        <div><div class="header-title">🔥 Roasts</div><div class="header-sub">Bear Roastery</div></div>
      </div>
      ${state.view==="home" ? `
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn btn-ghost btn-sm" id="go-history">History</button>
          <button class="btn btn-dark" id="start-new">+ New Roast</button>
          <button class="btn-logout" id="logout-btn">Log Out</button>
        </div>` : `<button class="btn-logout" id="logout-btn">Log Out</button>`}
    </div>`;
  if (state.loading) return header + `<div class="loading">Loading roasts…</div>`;
  return header + `<div class="content">${state.view==="home" ? build_home() : state.view==="new" ? build_new() : state.view==="history" ? build_history() : ""}</div>`;
}

function build_home() {
  const sessions = state.roast_sessions;
  const total_green = sessions.reduce((s,r) => s+r.batches.reduce((bs,b) => bs+(Number(b.green_weight)||0),0), 0);
  const total_roasted = sessions.reduce((s,r) => s+(Number(r.roasted_weight)||0), 0);
  const stats_html = `
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px">
      ${[{icon:"🔥",label:"Sessions",value:sessions.length},{icon:"🌱",label:"Total Green In",value:`${total_green.toFixed(1)}kg`},{icon:"⚖️",label:"Total Roasted",value:`${total_roasted.toFixed(1)}kg`},{icon:"☕",label:"Coffees",value:new Set(sessions.map(r=>r.coffee)).size}]
        .map(({icon,label,value}) => `<div class="card" style="text-align:center;padding:14px 10px;margin-bottom:0"><div style="font-size:22px;margin-bottom:4px">${icon}</div><div style="font-size:20px;font-weight:700">${value}</div><div style="font-size:11px;color:#888;margin-top:2px">${label}</div></div>`).join("")}
    </div>`;
  if (sessions.length===0) return `<h2 class="mb-16">Roasts</h2>${stats_html}<div class="card empty"><div class="icon">🔥</div>No roast sessions yet. Hit <strong>+ New Roast</strong> to get started.</div>`;
  const recent = sessions.slice(0,5);
  return `<h2 class="mb-16">Roasts</h2>${stats_html}<div class="section-label">Recent Sessions</div>${recent.map(s => build_session_card(s)).join("")}${sessions.length>5?`<button class="btn btn-ghost" style="width:100%;padding:10px;margin-top:4px" id="go-history">View all ${sessions.length} sessions →</button>`:""}`;
}

function build_session_card(s) {
  const total_green = s.batches.reduce((sum,b) => sum+(Number(b.green_weight)||0), 0);
  const yp = yield_pct(total_green, s.roasted_weight);
  const ids = s.batches.map(b => b.cropster_id).filter(Boolean).join(", ");
  return `
    <div class="history-card">
      <div class="flex-between mb-8">
        <div class="flex-wrap">
          <span style="font-weight:700;font-size:15px">${esc(s.coffee)}</span>
          <span class="tag" style="background:#fff8ee;color:#c8a96e">${s.date}</span>
          ${s.container_id?`<span class="tag" style="background:#f0ebe4;color:#888">${esc(s.container_id)}</span>`:""}
          <span class="tag" style="background:#f5f0eb;color:#888">${s.batches.length} batch${s.batches.length!==1?"es":""}</span>
        </div>
        ${yp!==null?`<span class="${yield_class(yp)}">${yp}% yield</span>`:""}
      </div>
      <div style="display:flex;gap:20px;font-size:13px;color:#888;flex-wrap:wrap">
        ${total_green>0?`<span>Green in: <strong style="color:#1a1008">${total_green.toFixed(1)}kg</strong></span>`:""}
        ${s.roasted_weight?`<span>Roasted out: <strong style="color:#1a1008">${Number(s.roasted_weight).toFixed(1)}kg</strong></span>`:""}
        ${ids?`<span>IDs: <span class="mono" style="background:#f0ebe4;padding:1px 6px;border-radius:3px">${esc(ids)}</span></span>`:""}
      </div>
    </div>`;
}

function build_new() {
  const { step } = state.ui;
  const step_labels = ["1. Coffee & Container","2. Batch IDs & Green Weight","3. Roasted Weight"];
  const steps_html = `<div class="steps mb-16">${step_labels.map((label,i) => `<div class="step ${step===i+1?"active":step>i+1?"done":""}">${step>i+1?"✓ ":""}${label}</div>`).join("")}</div>`;
  if (step===1) return steps_html + build_step1();
  if (step===2) return steps_html + build_step2();
  if (step===3) return steps_html + build_step3();
  if (step===4) return build_done();
  return "";
}

function build_step1() {
  const s = state.session;
  return `
    <div class="flex-between mb-16">
      <h2>Coffee &amp; Container</h2>
      <button class="btn btn-ghost" id="cancel-new">Cancel</button>
    </div>
    <div class="card">
      <div class="grid-2">
        <div><label class="lbl">Coffee to Roast *</label>
          <select id="s1-coffee">
            <option value="">— Select coffee —</option>
            ${state.coffees.map(c=>`<option value="${esc(c)}" ${s.coffee===c?"selected":""}>${esc(c)}</option>`).join("")}
          </select>
        </div>
        <div><label class="lbl">Roast Date *</label><input type="date" id="s1-date" value="${s.date}" /></div>
        <div><label class="lbl">Container to Fill *</label><input id="s1-container" value="${esc(s.container_id)}" placeholder="e.g. XL01042601" /></div>
        <div><label class="lbl">Number of Batches *</label><input type="number" id="s1-count" value="${s.batch_count}" min="1" max="20" /></div>
      </div>
      <p id="s1-err" class="err" style="display:none"></p>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-dark btn-lg" id="s1-next">Next — Enter Batch Data →</button>
      </div>
    </div>`;
}

function build_step2() {
  const s = state.session;
  const total_green = s.batches.reduce((sum,b) => sum+(Number(b.green_weight)||0), 0);
  const batch_rows = s.batches.map((b,i) => `
    <div class="batch-row">
      <div class="batch-header">
        <div class="batch-num">Batch ${i+1}</div>
        <span class="hint">Going into <strong>${esc(s.container_id||"container")}</strong></span>
      </div>
      <div class="grid-2">
        <div><label class="lbl">Cropster Roast ID *</label><input class="b-id" data-idx="${i}" value="${esc(b.cropster_id)}" placeholder="e.g. 42" /></div>
        <div><label class="lbl">Green Weight In (kg) *</label><input type="number" class="b-green" data-idx="${i}" value="${b.green_weight}" placeholder="0.0" step="0.1" /></div>
      </div>
    </div>`).join("");
  return `
    <div class="flex-between mb-16">
      <div><h2>${esc(s.coffee)}</h2><div class="hint mt-4">${s.date} · ${esc(s.container_id)} · ${s.batches.length} batch${s.batches.length!==1?"es":""}</div></div>
      <button class="btn btn-ghost" id="cancel-new">Cancel</button>
    </div>
    <div class="card">
      <h3>Batch Details</h3>
      <p class="hint mb-12">Enter the Cropster roast ID and green weight for each batch going into <strong>${esc(s.container_id)}</strong>.</p>
      ${batch_rows}
      ${total_green>0?`<div style="background:#f5f0eb;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:4px">Total green weight in: <strong>${total_green.toFixed(1)}kg</strong></div>`:""}
      <p id="s2-err" class="err" style="display:none"></p>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-dark btn-lg" id="s2-next">Next — Enter Roasted Weight →</button>
        <button class="btn btn-ghost btn-lg" id="s2-back">← Back</button>
      </div>
    </div>`;
}

function build_step3() {
  const s = state.session;
  const total_green = s.batches.reduce((sum,b) => sum+(Number(b.green_weight)||0), 0);
  const yp = yield_pct(total_green, s.roasted_weight);
  const yp_class = yield_class(yp);
  return `
    <div class="flex-between mb-16">
      <div><h2>${esc(s.coffee)}</h2><div class="hint mt-4">${s.date} · ${esc(s.container_id)}</div></div>
      <button class="btn btn-ghost" id="cancel-new">Cancel</button>
    </div>
    <div class="card">
      <h3>Weigh the Container</h3>
      <p class="hint mb-16">All batches are done. Weigh <strong>${esc(s.container_id)}</strong> and enter the total roasted weight below.</p>
      <div style="background:#f5f0eb;border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:13px">
        <div style="font-weight:600;color:#1a1008;margin-bottom:6px">What went in</div>
        ${s.batches.map((b,i) => `
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span>Batch ${i+1} ${b.cropster_id?`<span class="mono" style="background:#e8d5b0;padding:1px 5px;border-radius:3px;margin-left:4px">${esc(b.cropster_id)}</span>`:""}</span>
            <span>${b.green_weight?`${Number(b.green_weight).toFixed(1)}kg green`:"—"}</span>
          </div>`).join("")}
        <div style="border-top:1px solid #e0d5c5;margin-top:8px;padding-top:8px;font-weight:600;display:flex;justify-content:space-between">
          <span>Total green in</span><span>${total_green.toFixed(1)}kg</span>
        </div>
      </div>
      <div style="margin-bottom:16px">
        <label class="lbl" style="font-size:15px;color:#333;margin-bottom:8px">Roasted Weight of ${esc(s.container_id)} (kg)</label>
        <input type="number" id="s3-roasted" class="big" value="${s.roasted_weight}" placeholder="0.0" step="0.1" />
      </div>
      <div id="yield-display" style="text-align:center;font-size:15px;margin-bottom:16px;min-height:22px">
        ${yp!==null?`<span class="${yp_class}">Yield: ${yp}% ${yp>=80&&yp<=90?"✓":"⚠️ Check weights"}</span>`:""}
      </div>
      <p id="s3-err" class="err" style="display:none"></p>
      <div style="display:flex;gap:8px">
        <button class="btn btn-dark btn-lg" id="s3-save" ${state.saving?"disabled":""}>${state.saving?"Saving…":"✓ Save Roast Session"}</button>
        <button class="btn btn-ghost btn-lg" id="s3-back">← Back</button>
      </div>
    </div>`;
}

function build_done() {
  const s = state.roast_sessions[0];
  const total_green = s.batches.reduce((sum,b) => sum+(Number(b.green_weight)||0), 0);
  const yp = yield_pct(total_green, s.roasted_weight);
  const ids = s.batches.map(b => b.cropster_id).filter(Boolean).join(", ");
  return `
    <div style="max-width:480px;margin:48px auto">
      <div class="card" style="text-align:center;padding:32px">
        <div style="font-size:56px;margin-bottom:12px">✅</div>
        <h2 style="margin-bottom:8px">Roast Session Saved</h2>
        <p style="color:#555;font-size:15px;margin-bottom:20px">
          <strong>${esc(s.coffee)}</strong> · ${s.date}<br/>
          ${s.batches.length} batch${s.batches.length!==1?"es":""} into <strong>${esc(s.container_id)}</strong>
        </p>
        <div style="display:flex;justify-content:center;gap:24px;font-size:14px;margin-bottom:16px;flex-wrap:wrap">
          ${total_green>0?`<span>🌱 ${total_green.toFixed(1)}kg green in</span>`:""}
          ${s.roasted_weight?`<span>⚖️ ${Number(s.roasted_weight).toFixed(1)}kg roasted</span>`:""}
          ${yp!==null?`<span class="${yield_class(yp)}">${yp}% yield</span>`:""}
        </div>
        ${ids?`<div style="background:#f5f0eb;border-radius:8px;padding:10px 14px;margin-bottom:20px;font-size:13px">Roast IDs: <span class="mono">${esc(ids)}</span></div>`:""}
        <div style="display:flex;gap:8px;justify-content:center">
          <button class="btn btn-dark" id="done-home">Back to Roasts</button>
          <button class="btn btn-ghost" id="done-another">+ Another Roast</button>
        </div>
      </div>
    </div>`;
}

function build_history() {
  return `
    <div class="flex-between mb-16">
      <h2>All Roast Sessions</h2>
      <button class="btn btn-ghost" id="history-back">← Back</button>
    </div>
    ${state.roast_sessions.length===0
      ? `<div class="card empty"><div class="icon">🔥</div>No sessions yet.</div>`
      : state.roast_sessions.map(s => build_session_card(s)).join("")}`;
}

function attach_listeners() {
  const app = document.getElementById("app");
  app.querySelector("#go-dashboard")?.addEventListener("click", () => window.location.href="index.html");
  app.querySelector("#logout-btn")?.addEventListener("click", async () => { await supabaseClient.auth.signOut(); window.location.href="login.html"; });
  app.querySelector("#start-new")?.addEventListener("click", () => { state.session=new_session(); state.ui.step=1; state.view="new"; render(); });
  app.querySelector("#go-history")?.addEventListener("click", () => { state.view="history"; render(); });
  app.querySelector("#history-back")?.addEventListener("click", () => { state.view="home"; render(); });
  app.querySelector("#cancel-new")?.addEventListener("click", () => { state.view="home"; state.ui.step=1; render(); });

  app.querySelector("#s1-next")?.addEventListener("click", () => {
    const coffee = document.getElementById("s1-coffee")?.value;
    const date = document.getElementById("s1-date")?.value;
    const container = document.getElementById("s1-container")?.value.trim();
    const count = Number(document.getElementById("s1-count")?.value)||0;
    const err_el = document.getElementById("s1-err");
    if (!coffee) { err_el.textContent="Please select a coffee."; err_el.style.display="block"; return; }
    if (!container) { err_el.textContent="Please enter a container ID."; err_el.style.display="block"; return; }
    if (count<1) { err_el.textContent="At least one batch required."; err_el.style.display="block"; return; }
    state.session.coffee=coffee; state.session.date=date; state.session.container_id=container;
    state.session.batch_count=count;
    state.session.batches=Array.from({length:count},(_,i) => state.session.batches[i]||{cropster_id:"",green_weight:""});
    state.ui.step=2; render();
  });

  app.querySelectorAll(".b-id").forEach(inp => inp.addEventListener("input", e => { state.session.batches[Number(inp.dataset.idx)].cropster_id=e.target.value.trim(); }));
  app.querySelectorAll(".b-green").forEach(inp => inp.addEventListener("input", e => { state.session.batches[Number(inp.dataset.idx)].green_weight=e.target.value; }));

  app.querySelector("#s2-next")?.addEventListener("click", async () => {
    app.querySelectorAll(".b-id").forEach(inp => { state.session.batches[Number(inp.dataset.idx)].cropster_id=inp.value.trim(); });
    app.querySelectorAll(".b-green").forEach(inp => { state.session.batches[Number(inp.dataset.idx)].green_weight=inp.value; });
    const err_el = document.getElementById("s2-err");
    if (!state.session.batches.some(b=>b.cropster_id)) { err_el.textContent="Please enter at least one Cropster roast ID."; err_el.style.display="block"; return; }
    // Validate green stock availability
    const total_green = state.session.batches.reduce((sum,b) => sum+(Number(b.green_weight)||0), 0);
    if (total_green > 0) {
      const { data: stock_item } = await supabaseClient.from("stock_items").select("current_kg").eq("coffee", state.session.coffee).maybeSingle();
      if (!stock_item) {
        err_el.textContent = `No green stock found for ${state.session.coffee}. Log a delivery in the Stock module before roasting.`;
        err_el.style.display = "block"; return;
      }
      if (stock_item.current_kg < total_green) {
        err_el.textContent = `Not enough green stock — need ${total_green.toFixed(1)}kg of ${state.session.coffee}, only ${stock_item.current_kg.toFixed(1)}kg available. Update your stock before roasting.`;
        err_el.style.display = "block"; return;
      }
    }
    err_el.style.display = "none";
    state.ui.step=3; render();
  });
  app.querySelector("#s2-back")?.addEventListener("click", () => { state.ui.step=1; render(); });

  app.querySelector("#s3-roasted")?.addEventListener("input", e => {
    state.session.roasted_weight=e.target.value;
    const total_green=state.session.batches.reduce((s,b)=>s+(Number(b.green_weight)||0),0);
    const yp=yield_pct(total_green,e.target.value);
    const el=document.getElementById("yield-display");
    if (el) el.innerHTML=yp!==null?`<span class="${yield_class(yp)}">Yield: ${yp}% ${yp>=80&&yp<=90?"✓":"⚠️ Check weights"}</span>`:"";
  });

  app.querySelector("#s3-save")?.addEventListener("click", () => {
    state.session.roasted_weight=document.getElementById("s3-roasted")?.value||state.session.roasted_weight;
    const err_el=document.getElementById("s3-err");
    if (!state.session.roasted_weight) { err_el.textContent="Please enter the roasted weight."; err_el.style.display="block"; return; }
    save_session();
  });
  app.querySelector("#s3-back")?.addEventListener("click", () => { state.ui.step=2; render(); });
  app.querySelector("#done-home")?.addEventListener("click", () => { state.view="home"; state.ui.step=1; render(); });
  app.querySelector("#done-another")?.addEventListener("click", () => { state.session=new_session(); state.ui.step=1; state.view="new"; render(); });
}
</script>
</body>
</html>
