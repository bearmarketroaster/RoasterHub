  <style>

    .note { font-size: 12px; color: #888; margin-top: 10px; line-height: 1.5; }

    /* Config grid */
    .cfg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .cfg-field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: #666; margin-bottom: 5px; }

    .btn-ghost { background: #fff; color: #1a1a1a; border: 1px solid #d8d4cc; border-radius: 6px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
    .btn-x { background: none; border: none; color: #dc2626; font-size: 16px; padding: 2px 6px; }
    .save-flash { color: #16a34a; font-size: 13px; font-weight: 600; }

    .sp-table td { padding: 5px 6px; }
    .sp-table input, .sp-table select { padding: 6px 8px; font-size: 13px; }

    /* Checks */
    .checks-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0eee9; font-size: 14px; }
    .checks-row:last-child { border-bottom: none; }
    .checks-name { flex: 1; }
    .checks-count { font-weight: 700; min-width: 28px; text-align: right; }
    .tag { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; }
    .tag-ok { background: #e7f5ec; color: #16a34a; }
    .tag-review { background: #fff7ed; color: #d97706; }
    .tag-bad { background: #fdecea; color: #dc2626; }
    .checks-list { font-size: 12px; color: #666; padding: 0 0 8px 4px; line-height: 1.6; }
    details summary { cursor: pointer; list-style: none; }
    details summary::-webkit-details-marker { display: none; }

    /* Coffee cards */
    .coffee-head { margin-bottom: 10px; }
    .coffee-name { font-size: 16px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
    .coffee-params { font-size: 12px; color: #666; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .coffee-params .lbl { font-weight: 600; color: #666; }
    .coffee-params .num-input { width: 86px; padding: 5px 8px; font-size: 13px; text-align: right; }
    .coffee-params select { width: auto; padding: 5px 8px; font-size: 13px; }
    .coffee-params .src { color: #999; font-style: italic; }
    .coffee-params .sep { color: #ccc; margin: 0 2px; }
    .coffee-params b { color: #1a1a1a; }
    .size-chip { border: 1px solid #d8d4cc; background: #fff; color: #999; border-radius: 14px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
    .size-chip.on { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 9px 8px; background: #f4f2ed; font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; border-bottom: 1px solid #e8e6e1; }
    th.num, td.num { text-align: right; }
    td { padding: 9px 8px; border-bottom: 1px solid #f0eee9; vertical-align: middle; }
    td.size { font-weight: 600; }
    .table-wrap { overflow-x: auto; }
    .your-wrap { display: inline-flex; align-items: center; gap: 3px; }
    .your-wrap .eur-pre { color: #666; font-size: 13px; }
    .final-input { width: 78px; padding: 6px 8px; font-size: 14px; text-align: right; border: 1px solid #d8d4cc; border-radius: 6px; }
    .final-input:focus { outline: none; border-color: #1a1a1a; }
    .band-sub { font-size: 11px; color: #999; white-space: nowrap; }
    .coffee-actions { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #f0eee9; }
    .coffee-status { font-size: 12px; color: #999; }
    .coffee-status.dirty { color: #d97706; font-weight: 600; }
    .how-btn { background: #fff; border: 1px solid #d8d4cc; color: #666; border-radius: 6px; padding: 5px 8px; font-size: 11px; font-weight: 700; margin-left: 4px; white-space: nowrap; }
    .how-btn:hover, .how-btn.on { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
    .drilldown { white-space: normal; text-align: left; margin-top: 10px; background: #faf9f7; border: 1px solid #eee; border-radius: 8px; padding: 12px 14px; font-size: 13px; color: #444; font-variant-numeric: tabular-nums; }
    .dl-head { font-weight: 700; color: #1a1a1a; margin-bottom: 4px; font-family: inherit; }
    .dl-row { padding: 2px 0; line-height: 1.5; }
    .dl-row b { color: #1a1a1a; }
    .dl-size { display: inline-block; min-width: 22px; font-weight: 700; color: #1a1a1a; }
    .money-range { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: #666; }
    .money-range input { margin-left: 6px; padding: 5px 8px; font-size: 13px; }
    .money-stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .money-stat { flex: 1; min-width: 110px; text-align: center; background: #faf9f7; border: 1px solid #eee; border-radius: 10px; padding: 14px 8px; }
    .money-val { font-size: 24px; font-weight: 800; }
    .money-lbl { font-size: 12px; color: #666; margin-top: 2px; }
    .money-split { font-size: 13px; color: #555; background: #faf9f7; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
    .money-table { width: 100%; border-collapse: collapse; }
    .money-table th, .money-table td { padding: 7px 8px; border-bottom: 1px solid #f0eee9; font-size: 13px; }
    .money-table th { color: #666; font-weight: 600; text-align: left; }
    .money-warn { margin-top: 12px; font-size: 12px; color: #d97706; background: #fff8ef; border: 1px solid #f5dca8; border-radius: 8px; padding: 8px 12px; }
    .no-green { color: #d97706; font-style: italic; font-size: 13px; }
    .empty { color: #999; font-style: italic; padding: 20px 0; text-align: center; }
    @media (max-width: 600px) {
      .content { padding: 16px 12px; }
      th, td { padding: 7px 5px; font-size: 12px; }
    }
    /* Phones: let the header wrap rather than run off the screen, and use 16px form
       text - iPhones zoom the page in when a smaller field is tapped */
    @media (max-width: 600px) {
      .header { flex-wrap: wrap; row-gap: 10px; }
      input, select, textarea { font-size: 16px !important; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

function esc(s) { return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function eur(n) { return "€" + (Number(n)||0).toFixed(2); }
function pct1(x) { return x == null || !isFinite(x) ? "—" : (x * 100).toFixed(1) + "%"; }
function round_to(n, step) { return Math.round((Number(n)||0)/step)*step; }
function money_val(n) { return n == null || isNaN(n) ? "" : Number(n).toFixed(2); }   // a price box's value
function num_or_null(v) { const s = String(v ?? "").trim(); if (s === "") return null; const n = Number(s); return isFinite(n) ? n : null; }

// ─────────────────────────────────────────────────────────────────────────────
// The maths follows Bear_Market_Pricing_Model.xlsx:
//   Landed €/kg      = green €/kg + shipping €/kg
//   Roasted €/kg     = landed ÷ (1 − roast loss)                    one roast-loss rate for every coffee
//   Cost (per bag)   = roasted €/kg × bag weight + packaging        packaging: standard bag, or the
//                                                                   coffee's special packaging for that size
//   Roastery → Shop  = cost ÷ (1 − roastery margin)                 optional rounding (the only rounding)
//   Shop sell price  = typed — this is the price on the bag
//   Shop margin      = (sell − roastery→shop) ÷ sell
//   Combined margin  = (sell − cost) ÷ sell                          checked against the target band
//   Band low / high  = cost ÷ (1 − band low / high)
// ─────────────────────────────────────────────────────────────────────────────

// Every size the sheet prices, and its weight. Which ones a coffee sells is ticked per coffee.
const SIZES = [
  { label: "100g", kg: 0.1 },
  { label: "200g", kg: 0.2 },
  { label: "500g", kg: 0.5 },
  { label: "1kg",  kg: 1   },
  { label: "5kg",  kg: 5   },
];
const SIZE_KG = Object.fromEntries(SIZES.map(s => [s.label, s.kg]));
const DEFAULT_SIZES = ["200g", "500g", "1kg"];     // a coffee with no options saved yet
const ROUNDING = [
  { value: "none",       label: "None" },
  { value: "nearest_5c", label: "Nearest 5c" },
  { value: "up_5c",      label: "Up to 5c" },
];

const DEFAULTS = {
  roast_loss_pct: 15, roastery_margin_pct: 15, rounding_rule: "none",
  target_low_pct: 70, target_high_pct: 80,
};

const state = {
  loaded: false,
  cfg: { ...DEFAULTS },        // working draft of pricing_settings
  pkg: {},                     // working draft of standard packaging: { "200g": 0.349, "100g": null, ... }
  special_pkg: [],             // working draft of special packaging: [{ name, bag_size, cost, notes }]
  saved_special_keys: [],      // "name|size" keys as saved, so removed rows can be deleted
  coffees: [],                 // [{ id, name }]
  opts: {},                    // { coffeeId: { sizes: [...], packaging: null|name } }
  green_delivery: {},          // { coffeeId: { price, date } }  derived from stock deliveries
  green_override: {},          // { coffeeId: price }            manual entry in this tool
  shipping_override: {},       // { coffeeId: shipping €/kg }
  final: {},                   // { coffeeId: { "200g": { retail, wholesale }, ... } } saved prices (draft)
                               //   retail = shop sell (bag, online) · wholesale = roastery → shop
  price_history: {},           // { "coffeeId|size": [{ date, retail, wholesale }] } oldest first
  green_history: {},           // { coffeeId: [{ date, price }] } priced deliveries, oldest first
  coffee_dirty: {},            // { coffeeId: true } unsaved per-coffee price edits
  coffee_saving: {},           // { coffeeId: true } in-flight save
  how: {},                     // { "coffeeId|size": true } "How?" breakdown open for that size
  dispatches: [],              // for the revenue/profit view
  shop_mappings: [],
  fp_codes: [],
  fillmap: {},                 // fill_id -> coffee_id (from roast sessions)
  money_from: "",
  money_to: "",
  dirty: false,
  saving: false,
  flash_until: 0,
  err: "",
};

(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = "login.html?next=" + encodeURIComponent(location.pathname.split("/").pop() + location.search); return; }
  // Admin-only — pricing exposes cost data.
  const { data: role_row } = await supabaseClient.from("user_roles").select("role").eq("user_id", session.user.id).maybeSingle();
  if (role_row?.role !== "admin") { window.location.href = "index.html"; return; }
  UnsavedWork.track(session.user.id, collect_unsaved);
  await load();
  const restored = restore_unsaved();
  render();
  if (restored) UnsavedWork.notice(UnsavedWork.RESTORED_MSG);
})();

// ── UNSAVED WORK ──────────────────────────────────────────────────────────────
// Edits not yet saved (see unsaved-work.js): the settings / packaging draft while "Unsaved changes"
// shows, and each coffee's sell prices while marked dirty. Green, shipping, sizes and packaging choice
// save as soon as they're changed, so aren't included.
function collect_unsaved() {
  if (!state.loaded) return null;
  const finals = {};
  for (const [id, dirty] of Object.entries(state.coffee_dirty)) {
    if (dirty) finals[id] = state.final[id] || {};
  }
  const inputs = state.dirty ? { cfg: state.cfg, pkg: state.pkg, special_pkg: state.special_pkg } : null;
  if (!inputs && !Object.keys(finals).length) return null;
  return { inputs, finals };
}

// Runs after load(), so the saved drafts go back on top of the freshly loaded prices
function restore_unsaved() {
  const saved = UnsavedWork.take();
  if (!saved) return false;
  if (saved.inputs) {
    state.cfg = { ...state.cfg, ...saved.inputs.cfg };
    state.pkg = { ...state.pkg, ...saved.inputs.pkg };
    if (Array.isArray(saved.inputs.special_pkg)) state.special_pkg = saved.inputs.special_pkg;
    state.dirty = true;
  }
  for (const [id, prices] of Object.entries(saved.finals || {})) {
    if (!state.coffees.some(c => String(c.id) === id)) continue;   // coffee since retired
    state.final[id] = prices;
    state.coffee_dirty[id] = true;
  }
  return true;
}

// Supabase returns at most 1000 rows per request (dispatches are past 4000), so page through everything
async function fetch_all(build) {
  const PAGE = 1000, out = [];
  for (let i = 0; i < 100; i++) {
    const { data, error } = await build().range(i * PAGE, i * PAGE + PAGE - 1);
    if (error) { console.error(error); break; }
    out.push(...(data || []));
    if (!data || data.length < PAGE) break;
  }
  return out;
}

async function load() {
  // Settings
  const { data: settings } = await supabaseClient.from("pricing_settings").select("*").eq("id", 1).maybeSingle();
  if (settings) {
    const n = (v, d) => (v == null || v === "" || isNaN(Number(v))) ? d : Number(v);
    state.cfg = {
      roast_loss_pct:      n(settings.roast_loss_pct,      DEFAULTS.roast_loss_pct),
      roastery_margin_pct: n(settings.roastery_margin_pct, DEFAULTS.roastery_margin_pct),
      rounding_rule:       settings.rounding_rule || DEFAULTS.rounding_rule,
      target_low_pct:      n(settings.target_low_pct,      DEFAULTS.target_low_pct),
      target_high_pct:     n(settings.target_high_pct,     DEFAULTS.target_high_pct),
    };
  }

  // Standard packaging — a size with no row has no cost yet (blank, not €0)
  const { data: pkg_rows } = await supabaseClient.from("pricing_packaging").select("*");
  const pkg = {};
  SIZES.forEach(s => { pkg[s.label] = null; });
  (pkg_rows || []).forEach(r => { pkg[r.bag_size] = r.cost == null ? null : Number(r.cost); });
  state.pkg = pkg;

  // Special packaging
  const { data: sp_rows } = await supabaseClient.from("pricing_special_packaging").select("name, bag_size, cost, notes").order("name").order("bag_size");
  state.special_pkg = (sp_rows || []).map(r => ({ name: r.name, bag_size: r.bag_size, cost: Number(r.cost), notes: r.notes || "" }));
  state.saved_special_keys = state.special_pkg.map(r => `${r.name}|${r.bag_size}`);

  // Active coffees and their options (sizes sold, packaging, own roastery margin)
  const { data: coffees } = await supabaseClient.from("coffees").select("id, name, retired_at").is("retired_at", null).order("name");
  state.coffees = (coffees || []).map(c => ({ id: c.id, name: c.name }));
  const { data: opt_rows } = await supabaseClient.from("pricing_coffee_options").select("coffee_id, sizes, packaging, roastery_margin_pct");
  state.opts = {};
  (opt_rows || []).forEach(r => {
    state.opts[r.coffee_id] = { sizes: r.sizes || [], packaging: r.packaging || null,
                                margin: r.roastery_margin_pct == null ? null : Number(r.roastery_margin_pct) };
  });

  // Latest green price per coffee: newest delivery that carries a price (a delivery logged before its
  // invoice arrived has none, and shouldn't wipe out the last known one).
  const deliveries = await fetch_all(() => supabaseClient
    .from("green_deliveries")
    .select("id, coffee_id, price_per_kg, arrived_on")
    .not("price_per_kg", "is", null)
    .order("arrived_on", { ascending: false }).order("id"));
  const green = {}, green_hist = {};
  (deliveries || []).forEach(d => {
    if (d.coffee_id == null) return;
    (green_hist[d.coffee_id] = green_hist[d.coffee_id] || []).unshift({ date: d.arrived_on || "", price: Number(d.price_per_kg) });
    if (green[d.coffee_id]) return;   // already captured a newer price
    green[d.coffee_id] = { price: Number(d.price_per_kg), date: d.arrived_on || null };
  });
  state.green_delivery = green;
  state.green_history = green_hist;   // { coffeeId: [{ date, price }] } oldest first — for valuing past sales

  // Per-coffee green override + shipping €/kg, entered on this page
  const { data: overrides } = await supabaseClient.from("pricing_green").select("coffee_id, green_price, shipping_per_kg");
  const ov = {}, ship = {};
  (overrides || []).forEach(r => {
    if (r.coffee_id == null) return;
    if (r.green_price != null) ov[r.coffee_id] = Number(r.green_price);
    if (r.shipping_per_kg != null) ship[r.coffee_id] = Number(r.shipping_per_kg);
  });
  state.green_override = ov;
  state.shipping_override = ship;

  // Saved prices: retail = shop sell (the price on the bag, also online), wholesale = roastery → shop
  const { data: finals } = await supabaseClient.from("pricing_final").select("coffee_id, bag_size, retail, wholesale");
  const fin = {};
  (finals || []).forEach(r => {
    if (r.coffee_id == null) return;
    (fin[r.coffee_id] = fin[r.coffee_id] || {})[r.bag_size] = {
      retail:    r.retail    != null ? Number(r.retail)    : null,
      wholesale: r.wholesale != null ? Number(r.wholesale) : null,
    };
  });
  state.final = fin;

  // Price history (pricing-step2.sql) — each sale is valued at the prices in force on its day
  const hist = await fetch_all(() => supabaseClient.from("pricing_price_history")
    .select("id, coffee_id, bag_size, retail, wholesale, effective_from").order("effective_from").order("id"));
  const ph = {};
  (hist || []).forEach(h => {
    (ph[`${h.coffee_id}|${h.bag_size}`] = ph[`${h.coffee_id}|${h.bag_size}`] || []).push({
      date: String(h.effective_from || "").slice(0, 10),
      retail:    h.retail    != null ? Number(h.retail)    : null,
      wholesale: h.wholesale != null ? Number(h.wholesale) : null,
    });
  });
  state.price_history = ph;

  // Revenue/profit view data
  const disp = await fetch_all(() => supabaseClient.from("dispatches").select("*, dispatch_lines(*)").order("id"));
  state.dispatches = (disp || []).map(d => ({ ...d, lines: d.dispatch_lines || [] }));
  const { data: maps } = await supabaseClient.from("shop_mappings").select("master_name, kind");
  state.shop_mappings = maps || [];
  const { data: fps } = await supabaseClient.from("fp_codes").select("fp_code, coffee_id");
  state.fp_codes = fps || [];
  const rs = await fetch_all(() => supabaseClient.from("roast_sessions").select("id, fill_id, coffee_id").order("date").order("id"));
  const fm = {};
  (rs || []).forEach(r => { if (r.fill_id && r.coffee_id != null && !(r.fill_id in fm)) fm[r.fill_id] = r.coffee_id; });
  state.fillmap = fm;
  if (!state.money_from) {
    const now = new Date();
    state.money_from = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
    state.money_to = now.toISOString().slice(0, 10);
  }

  state.loaded = true;
}

// ── Pricing maths ───────────────────────────────────────────────────────────
// Effective green price for a coffee: manual override wins, else latest delivery.
function green_for(coffeeId) {
  const ov = state.green_override[coffeeId];
  if (ov != null && !isNaN(ov)) return { price: ov, source: "manual" };
  const d = state.green_delivery[coffeeId];
  if (d) return { price: d.price, source: "delivery", date: d.date };
  return null;
}
function opts_for(coffeeId) {
  return state.opts[coffeeId] || { sizes: DEFAULT_SIZES.slice(), packaging: null, margin: null };
}
function special_names() {
  return [...new Set(state.special_pkg.map(r => (r.name || "").trim()).filter(Boolean))];
}
// Packaging € for one bag: the coffee's special packaging if it lists this size, else the standard bag.
// null = no cost entered for that size yet.
function packaging_for(coffeeId, size) {
  const name = opts_for(coffeeId).packaging;
  if (name) {
    const sp = state.special_pkg.find(r => r.name === name && r.bag_size === size && r.cost != null && r.cost !== "");
    if (sp) return { cost: Number(sp.cost), source: name };
  }
  const std = state.pkg[size];
  return std == null ? null : { cost: Number(std), source: "Standard" };
}
// green_price: use this green €/kg instead of the current one (valuing a past sale)
function roasted_per_kg(coffeeId, green_price) {
  const g = green_price != null ? { price: green_price } : green_for(coffeeId);
  if (!g) return null;
  const shipping = Number(state.shipping_override[coffeeId]) || 0;
  const landed = g.price + shipping;
  return { green: g.price, shipping, landed, roasted: landed / (1 - state.cfg.roast_loss_pct / 100) };
}
// Roastery → shop price: cost ÷ (1 − margin), with the sheet's optional rounding
// A coffee's roastery margin %: its own if set, else the default from Settings
function margin_for(coffeeId) {
  const m = opts_for(coffeeId).margin;
  return m == null || isNaN(m) ? state.cfg.roastery_margin_pct : Number(m);
}
function roastery_price(cost, coffeeId) {
  const raw = cost / (1 - margin_for(coffeeId) / 100);
  if (state.cfg.rounding_rule === "nearest_5c") return Math.round(raw / 0.05) * 0.05;
  if (state.cfg.rounding_rule === "up_5c") return Math.ceil(raw / 0.05 - 1e-9) * 0.05;
  return raw;
}
// One coffee + size. null = no green price; cost null = no packaging cost for that size.
// `shop_calc` is the roastery → shop price the maths gives today; `shop` is the one that's charged —
// the saved price if there is one, else the calculated one.
function compute(coffeeId, size, green_price) {
  const r = roasted_per_kg(coffeeId, green_price);
  if (!r) return null;
  const p = packaging_for(coffeeId, size);
  if (!p) return { ...r, packaging: null, cost: null };
  const cost = r.roasted * SIZE_KG[size] + p.cost;
  const shop_calc = roastery_price(cost, coffeeId);
  const shop_saved = roastery_for(coffeeId, size);
  return {
    ...r, packaging: p.cost, packaging_source: p.source, cost,
    shop_calc, shop_saved,
    shop: shop_saved ?? shop_calc,
    band_low:  cost / (1 - state.cfg.target_low_pct / 100),
    band_high: cost / (1 - state.cfg.target_high_pct / 100),
  };
}
// Where a sell price lands
function evaluate(c, sell) {
  if (!c || c.cost == null || sell == null || !(sell > 0)) return null;
  const combined = (sell - c.cost) / sell;
  const low = state.cfg.target_low_pct / 100, high = state.cfg.target_high_pct / 100;
  return {
    shop_margin: (sell - c.shop) / sell,
    combined,
    status: combined < low ? "BELOW" : combined > high ? "ABOVE" : "in band",
    below_shop: sell < c.shop,
  };
}
function saved_price(coffeeId, size, field) {
  const v = state.final[coffeeId]?.[size]?.[field];
  return v == null || isNaN(v) ? null : Number(v);
}
function sell_for(coffeeId, size)     { return saved_price(coffeeId, size, "retail"); }      // shop sell (bag, online)
function roastery_for(coffeeId, size) { return saved_price(coffeeId, size, "wholesale"); }   // roastery → shop

// ── Prices on a past date (Revenue & Profit) ────────────────────────────────
// A saved price as it stood on `date`: the latest change on or before it. Sales from before prices were
// first saved use the first saved price. null = never set.
function price_on(coffeeId, size, field, date) {
  const h = state.price_history[`${coffeeId}|${size}`];
  if (!h || !h.length) return saved_price(coffeeId, size, field);
  let row = h[0];
  for (const x of h) { if (x.date <= date) row = x; else break; }
  return row[field];
}
// Green €/kg on `date`: the latest priced delivery on or before it (else the first one). A coffee with no
// priced deliveries uses its current green price.
function green_on(coffeeId, date) {
  const h = state.green_history?.[coffeeId];
  if (!h || !h.length) return green_for(coffeeId)?.price ?? null;
  let price = h[0].price;
  for (const x of h) { if (x.date <= date) price = x.price; else break; }
  return price;
}

// ── Checks (the sheet's Checks tab) ─────────────────────────────────────────
function compute_checks() {
  const no_green = [], no_cost = [], no_roastery = [], roastery_loss = [], no_sell = [], below_shop = [], out_band = [];
  state.coffees.forEach(coffee => {
    if (!green_for(coffee.id)) no_green.push(coffee.name);
    opts_for(coffee.id).sizes.forEach(size => {
      const label = `${coffee.name} ${size}`;
      const c = compute(coffee.id, size);
      if (!c || c.cost == null) no_cost.push(label);
      else if (c.shop_saved == null) no_roastery.push(`${label} (calculated ${eur(c.shop_calc)})`);
      else if (c.shop_saved < c.cost) roastery_loss.push(`${label} (${eur(c.shop_saved)} < cost ${eur(c.cost)})`);
      const sell = sell_for(coffee.id, size);
      if (sell == null) { no_sell.push(label); return; }
      const e = evaluate(c, sell);
      if (!e) return;
      if (e.below_shop) below_shop.push(`${label} (${eur(sell)} < ${eur(c.shop)})`);
      if (e.status !== "in band") out_band.push(`${label} — ${pct1(e.combined)} ${e.status}`);
    });
  });
  return [
    { name: "Active coffees with no green price", list: no_green, means: "That coffee costs nothing and prices nothing. Enter its green €/kg." },
    { name: "Sizes with no cost", list: no_cost, means: "A size is ticked but the green price or the packaging cost for that size is missing." },
    { name: "Sizes missing a roastery → shop price", list: no_roastery, means: "Until one is set, the calculated price is used. Type one in, then save." },
    { name: "Roastery → shop price below cost", list: roastery_loss, means: "The roastery loses money on every bag at this price.", bad: true },
    { name: "Sizes missing a shop sell price", list: no_sell, means: "Set a price, or untick that size if you don't sell it." },
    { name: "Shop price below what the shop pays", list: below_shop, means: "Selling at a loss.", bad: true },
    { name: "Combined margin outside the target band", list: out_band, means: "Not necessarily wrong — but each one should be a decision rather than an accident." },
  ];
}
function render_checks() {
  const el = document.getElementById("checks");
  if (!el) return;
  const checks = compute_checks();
  el.innerHTML = `
    <div class="card">
      <div class="section-title">✅ Checks <span style="font-weight:400;color:#999;font-size:12px;text-transform:none;letter-spacing:0">· glance down after any change</span></div>
      ${checks.map(ch => {
        const n = ch.list.length;
        const tag = n === 0 ? `<span class="tag tag-ok">OK</span>` : `<span class="tag ${ch.bad ? "tag-bad" : "tag-review"}">Review</span>`;
        const row = `<span class="checks-name">${esc(ch.name)}</span><span class="checks-count">${n}</span>${tag}`;
        return n === 0
          ? `<div class="checks-row">${row}</div>`
          : `<details><summary class="checks-row">${row}</summary>
               <div class="checks-list"><div style="color:#999;font-style:italic">${esc(ch.means)}</div>${ch.list.map(x => `· ${esc(x)}`).join("<br>")}</div>
             </details>`;
      }).join("")}
    </div>`;
}

// ── "How?" breakdown: how one size got to its prices ─────────────────────────
function build_how(cid, size) {
  const c = compute(cid, size);
  if (!c || c.cost == null) return "";
  const d4 = x => "€" + (Number(x) || 0).toFixed(4);
  const loss = state.cfg.roast_loss_pct, m = margin_for(cid);
  const low = state.cfg.target_low_pct, high = state.cfg.target_high_pct;
  const raw_shop = c.cost / (1 - m / 100);
  const rounding = state.cfg.rounding_rule === "nearest_5c" ? "rounded to the nearest 5c"
                 : state.cfg.rounding_rule === "up_5c" ? "rounded up to the next 5c" : "";
  const g = green_for(cid);
  const sell = sell_for(cid, size);
  const e = evaluate(c, sell);
  const step = (n, text) => `<div class="dl-row"><span class="dl-size">${n}</span>${text}</div>`;
  return `
    <div class="drilldown">
      <div class="dl-head">How ${esc(size)} is priced</div>
      ${step("1", `Green ${d4(c.green)}/kg <span style="color:#999">(${g?.source === "manual" ? "entered here" : `latest delivery${g?.date ? ` ${esc(g.date)}` : ""}`})</span> + shipping ${d4(c.shipping)}/kg = landed <b>${d4(c.landed)}/kg</b>`)}
      ${step("2", `Landed ÷ (1 − ${loss}% roast loss) = roasted <b>${d4(c.roasted)}/kg</b> <span style="color:#999">— coffee is lost in the roast, so each roasted kg costs more</span>`)}
      ${step("3", `Roasted ${d4(c.roasted)} × ${SIZE_KG[size]}kg = ${d4(c.roasted * SIZE_KG[size])} coffee + ${d4(c.packaging)} packaging <span style="color:#999">(${c.packaging_source === "Standard" ? `standard ${esc(size)} bag` : esc(c.packaging_source)})</span> = cost <b>${eur(c.cost)}</b>`)}
      ${step("4", `Cost ÷ (1 − ${m}% roastery margin) = ${d4(raw_shop)}${rounding ? `, ${rounding}` : ""} = calculated roastery → shop <b>${eur(c.shop_calc)}</b>`
        + (c.shop_saved == null
            ? ` <span style="color:#d97706">— no price set yet, so this is what's used</span>`
            : `<br>Your roastery → shop price: <b>${eur(c.shop_saved)}</b>`)
        + ` <span style="color:#999">— roastery keeps ${eur(c.shop - c.cost)} per bag = <b style="color:#444">${pct1((c.shop - c.cost) / c.shop)}</b> margin</span>`)}
      ${step("5", `Target band: cost ÷ (1 − ${low}%) = <b>${eur(c.band_low)}</b> up to cost ÷ (1 − ${high}%) = <b>${eur(c.band_high)}</b>`)}
      ${e ? `
        ${step("6", `Shop sell <b>${eur(sell)}</b> — shop margin = (${eur(sell)} − ${eur(c.shop)}) ÷ ${eur(sell)} = <b>${pct1(e.shop_margin)}</b> <span style="color:#999">— shop keeps ${eur(sell - c.shop)}</span>`)}
        ${step("7", `Combined margin = (${eur(sell)} − ${eur(c.cost)}) ÷ ${eur(sell)} = <b>${pct1(e.combined)}</b> → ${e.below_shop ? `<b style="color:#dc2626">selling below what the shop pays</b>` : e.status === "in band" ? `<b style="color:#16a34a">in band</b> (${low}–${high}%)` : `<b style="color:#d97706">${e.status}</b> the ${low}–${high}% band`}`)}`
      : step("6", `<span style="color:#999">No shop sell price yet — type one to see where it lands.</span>`)}
    </div>`;
}

// ── Revenue / profit ────────────────────────────────────────────────────────
function line_coffee_id(l) {
  let id = null;
  if (l.fp_code) id = state.fp_codes.find(x => x.fp_code === l.fp_code)?.coffee_id ?? null;
  if (id == null && l.fill_id) id = state.fillmap[l.fill_id] ?? null;
  return state.coffees.some(c => c.id === id) ? id : null;   // active coffees only
}

// Value one dispatch line, at the prices in force on its date: shops pay the roastery → shop price, online
// sells at the shop sell price. Cost uses the green price of the day too. A size with no saved roastery
// price falls back to the calculated one. Returns { revenue, cogs } | { unpriced:true } | null (not a sale).
function value_line(l, channel, date) {
  const bs = l.bag_size;
  if (bs === "30g sample" || bs === "Emptied") return null;     // samples & write-offs aren't sales
  const cid = line_coffee_id(l);
  if (cid == null) return { unpriced: true };
  const green = green_on(cid, date);
  const r = roasted_per_kg(cid, green);
  if (!r) return { unpriced: true };
  const is_bulk = l.type === "bulk" || bs === "Batch brew" || bs === "Bar 5kg";
  if (is_bulk) {
    const kg = Number(l.kg) || 0;
    const cost = r.roasted * kg;
    // A saved 5kg roastery → shop price sets the bulk rate (per kg = price ÷ 5); otherwise the maths
    const saved5 = price_on(cid, "5kg", "wholesale", date);
    const revenue = saved5 != null ? saved5 / 5 * kg : cost / (1 - margin_for(cid) / 100);
    return { revenue, cogs: cost, cid };
  }
  if (!(bs in SIZE_KG)) return { unpriced: true };
  const c = compute(cid, bs, green);
  if (!c || c.cost == null) return { unpriced: true };
  const bags = Number(l.bags) || 0;
  let price;
  if (channel === "online") {
    price = price_on(cid, bs, "retail", date);                  // online sells at the shop sell price
    if (price == null) return { unpriced: true };
  } else {
    price = price_on(cid, bs, "wholesale", date) ?? c.shop_calc; // shops pay the roastery → shop price
  }
  return { revenue: price * bags, cogs: c.cost * bags, cid };
}

function compute_money() {
  const kind_of = d => (state.shop_mappings.find(m => m.master_name === d.shop)?.kind) || "shop";
  const acc = { shop: { rev: 0, cogs: 0 }, online: { rev: 0, cogs: 0 } };
  const by_coffee = {};
  let unpriced = 0;
  state.dispatches.forEach(d => {
    if (d.shop === "Samples" || d.shop === "Staff" || d.shop === "Emptied") return;
    const kind = kind_of(d);
    if (kind !== "shop" && kind !== "online") return;          // shops + online only
    if (state.money_from && (d.date || "") < state.money_from) return;
    if (state.money_to   && (d.date || "") > state.money_to)   return;
    (d.lines || []).forEach(l => {
      const v = value_line(l, kind, d.date || "");
      if (!v) return;
      if (v.unpriced) { unpriced++; return; }
      acc[kind].rev += v.revenue; acc[kind].cogs += (v.cogs || 0);
      const nm = state.coffees.find(c => c.id === v.cid)?.name || "—";
      const bc = (by_coffee[nm] = by_coffee[nm] || { rev: 0, cogs: 0 });
      bc.rev += v.revenue; bc.cogs += (v.cogs || 0);
    });
  });
  return { acc, by_coffee, unpriced };
}

function render_money() {
  const el = document.getElementById("money");
  if (!el) return;
  const { acc, by_coffee, unpriced } = compute_money();
  const rev = acc.shop.rev + acc.online.rev;

  const profit = rev - cogs;
  const stat = (label, val, color) => `<div class="money-stat"><div class="money-val" style="color:${color}">${eur(val)}</div><div class="money-lbl">${label}</div></div>`;
  const coffee_rows = Object.entries(by_coffee).sort((a, b) => b[1].rev - a[1].rev)
    .map(([nm, v]) => `<tr><td>${esc(nm)}</td><td class="num">${eur(v.rev)}</td><td class="num">${eur(v.cogs)}</td><td class="num">${eur(v.rev - v.cogs)}</td></tr>`).join("");
  el.innerHTML = `
    <div class="card">
      <div class="section-title">💶 Revenue &amp; Profit <span style="font-weight:400;color:#999;font-size:12px">· shops + online only</span></div>
      <div class="money-range">
        <label>From <input type="date" id="money-from" value="${state.money_from}" /></label>
        <label>To <input type="date" id="money-to" value="${state.money_to}" /></label>
      </div>
      <div class="money-stats">
        ${stat("Revenue", rev, "#1a1a1a")}
        ${stat("COGS", cogs, "#999")}
        ${stat("Profit", profit, profit >= 0 ? "#16a34a" : "#dc2626")}
      </div>
      <div class="money-split">🏪 Shops &nbsp;<b>${eur(acc.shop.rev)}</b> rev · <b>${eur(acc.shop.rev - acc.shop.cogs)}</b> profit &nbsp;&nbsp;|&nbsp;&nbsp; 🌐 Online &nbsp;<b>${eur(acc.online.rev)}</b> rev · <b>${eur(acc.online.rev - acc.online.cogs)}</b> profit</div>
      ${coffee_rows ? `<table class="money-table"><thead><tr><th>Coffee</th><th class="num">Revenue</th><th class="num">COGS</th><th class="num">Profit</th></tr></thead><tbody>${coffee_rows}</tbody></table>` : `<div class="empty" style="padding:14px">No sales in this range.</div>`}
      ${unpriced ? `<div class="money-warn">⚠ ${unpriced} line${unpriced > 1 ? "s" : ""} skipped — that coffee/size isn't priced yet. Set prices below so they count.</div>` : ""}
    </div>`;
  document.getElementById("money-from")?.addEventListener("change", e => { state.money_from = e.target.value; render_money(); });
  document.getElementById("money-to")?.addEventListener("change", e => { state.money_to = e.target.value; render_money(); });
}

        <div class="coffee-params">
          <span class="lbl">Green €/kg</span>
          <input type="number" inputmode="decimal" step="0.01" min="0" class="num-input" data-green="${coffee.id}" value="${input_val}" placeholder="0.00" />
          <span class="src">${src_hint}</span>
          <span class="sep">·</span>
          <span class="lbl">Shipping €/kg</span>
          <input type="number" inputmode="decimal" step="0.01" min="0" class="num-input" data-ship="${coffee.id}" value="${ship_val}" placeholder="0.00" />
          ${r ? `<span class="sep">·</span><span>Landed <b>${eur(r.landed)}</b></span><span class="sep">·</span><span>Roasted <b>${eur(r.roasted)}/kg</b></span>` : ""}
        </div>
        <div class="coffee-params">
          <span class="lbl">Roastery margin</span>
          <input type="number" inputmode="decimal" step="0.5" min="0" max="99" class="num-input" style="width:64px" data-margin="${coffee.id}"
                 value="${o.margin ?? ""}" placeholder="${state.cfg.roastery_margin_pct}" title="Blank = the default (${state.cfg.roastery_margin_pct}%) from Settings" />
          <span>%</span><span class="src">${o.margin == null ? "default" : "this coffee only"}</span>
          <span class="sep">·</span>
          <span class="lbl">Packaging</span>
          <select data-pkg-choice="${coffee.id}">${pkg_options}</select>
          <span class="sep">·</span>
          <span class="lbl">Sizes sold</span>
          ${SIZES.map(s => `<button type="button" class="size-chip ${o.sizes.includes(s.label) ? "on" : ""}" data-size-toggle="${coffee.id}|${s.label}">${s.label}</button>`).join("")}
        </div>
      </div>`;

    if (!g) return `<div class="card">${head}<div class="no-green">No green price — enter one above to see costs.</div></div>`;
    if (!o.sizes.length) return `<div class="card">${head}<div class="hint">No sizes ticked.</div></div>`;

    const rows = SIZES.filter(s => o.sizes.includes(s.label)).map(s => {
      const c = compute(coffee.id, s.label);
      const sell = sell_for(coffee.id, s.label);
      const key = `${coffee.id}|${s.label}`;
      if (!c || c.cost == null) {
        return `<tr><td class="size">${esc(s.label)}</td><td colspan="7" class="no-green">No packaging cost for ${esc(s.label)} — set it in Settings above.</td></tr>`;
      }
      const open = !!state.how[key];
      return `
        <tr>
          <td class="size">${esc(s.label)}</td>
          <td class="num">${eur(c.cost)}</td>
          <td class="num" data-roastery-cell="${key}">${roastery_cell(c, key)}</td>
          <td class="num">
            <div class="your-wrap"><span class="eur-pre">€</span>
              <input type="number" inputmode="decimal" step="0.01" min="0" class="final-input" data-final="${key}|retail" value="${money_val(sell)}" placeholder="—" />
              <button type="button" class="how-btn ${open ? "on" : ""}" data-how="${key}" title="How this price is worked out">How?</button></div>
          </td>
          ${eval_cells(c, sell, key)}
        </tr>`;
    }).join("");

    const dirty = !!state.coffee_dirty[coffee.id];
    const saving = !!state.coffee_saving[coffee.id];
    return `
      <div class="card">
        ${head}
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Size</th>
                <th class="num">Cost</th>
                <th class="num">Roastery → Shop<br><span style="font-weight:400;text-transform:none;letter-spacing:0">what shops pay us</span></th>
                <th class="num">Shop sell (bag)<br><span style="font-weight:400;text-transform:none;letter-spacing:0">shops &amp; online</span></th>
                <th class="num">Shop margin</th>
                <th class="num">Combined</th>
                <th class="num">Band</th>
                <th>Check</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        ${SIZES.filter(s => o.sizes.includes(s.label) && state.how[`${coffee.id}|${s.label}`])
          .map(s => `<div data-how-box="${coffee.id}|${s.label}">${build_how(coffee.id, s.label)}</div>`).join("")}
        <div class="coffee-actions">
          <button class="btn-save" data-save-coffee="${coffee.id}" ${saving?"disabled":""}>${saving?"Saving…":"Save prices"}</button>
          <span class="coffee-status ${dirty?"dirty":""}">${dirty?"Unsaved changes":""}</span>
        </div>
      </div>`;
  }).join("");

  attach_green();
  attach_final();
}

// Roastery → shop: the saved price (typed); today's calculated price shows faintly while it's empty
function roastery_cell(c, key) {
  return `
    <div class="your-wrap"><span class="eur-pre">€</span>
      <input type="number" inputmode="decimal" step="0.01" min="0" class="final-input" data-final="${key}|wholesale" value="${money_val(c.shop_saved)}" placeholder="${c.shop_calc.toFixed(2)}" /></div>
    <div data-roastery-hint="${key}">${roastery_hint(c, key)}</div>`;
}
// Under the roastery price: its actual margin once set
function roastery_hint(c, key) {
  if (c.shop_saved == null) return `<div class="band-sub" style="color:#d97706">not set</div>`;
  const m = c.shop_saved > 0 ? (c.shop_saved - c.cost) / c.shop_saved : null;
  return `<div class="band-sub" style="${m != null && m < 0 ? "color:#dc2626;font-weight:700" : ""}">margin ${pct1(m)}</div>`;
}

// The four cells that depend on the sell price — redrawn in place while typing
function eval_cells(c, sell, key) {
  const e = evaluate(c, sell);
  const status = !e ? `<span class="hint" style="font-size:12px">no price</span>`
    : e.below_shop ? `<span class="tag tag-bad">LOSS</span>`
    : e.status === "in band" ? `<span class="tag tag-ok">in band</span>`
    : `<span class="tag tag-review">${e.status}</span>`;
  return `
    <td class="num" data-eval="${key}|shop_margin">${e ? pct1(e.shop_margin) : "—"}</td>
    <td class="num" data-eval="${key}|combined">${e ? `<strong>${pct1(e.combined)}</strong>` : "—"}</td>
    <td class="num"><span class="band-sub">${eur(c.band_low)} – ${eur(c.band_high)}</span></td>
    <td data-eval="${key}|status">${status}</td>`;
}
function refresh_row(cid, size) {
  const key = `${cid}|${size}`;
  const input = document.querySelector(`.final-input[data-final="${key}|retail"]`);
  const tr = input?.closest("tr");
  const c = compute(cid, size);
  if (!tr || !c || c.cost == null) return;
  const hint = document.querySelector(`[data-roastery-hint="${key}"]`);   // not the input — keeps focus
  if (hint) hint.innerHTML = roastery_hint(c, key);
  const tmp = document.createElement("tbody");
  tmp.innerHTML = `<tr>${eval_cells(c, sell_for(cid, size), key)}</tr>`;
  const fresh = [...tmp.firstChild.children];
  const cells = [...tr.children];
  cells.slice(cells.length - 4).forEach((td, i) => td.replaceWith(fresh[i]));
  const how = document.querySelector(`[data-how-box="${key}"]`);
  if (how) how.innerHTML = build_how(cid, size);
  render_checks();
}

// Persist a per-coffee green price / shipping on pricing_green (blank clears it)
async function save_green_row(coffeeId, patch, what) {
  const id = Number(coffeeId);
  const name = state.coffees.find(c => c.id === id)?.name || null;
  const { error } = await supabaseClient.from("pricing_green").upsert(
    { coffee_id: id, coffee: name, ...patch, updated_at: new Date().toISOString() },
    { onConflict: "coffee_id" }
  );
  if (error) alert(`Couldn't save the ${what} for ${name || "this coffee"}: ${error.message}\n\nIt's showing here but isn't saved — try again.`);
}
async function save_green(coffeeId, raw) {
  const id = Number(coffeeId), price = num_or_null(raw);
  if (price == null) delete state.green_override[id]; else state.green_override[id] = price;
  render_results();
  await save_green_row(id, { green_price: price }, "green price");
}
async function save_shipping(coffeeId, raw) {
  const id = Number(coffeeId), ship = num_or_null(raw);
  if (ship == null) delete state.shipping_override[id]; else state.shipping_override[id] = ship;
  render_results();
  await save_green_row(id, { shipping_per_kg: ship }, "shipping cost");
}
// Sizes sold and packaging choice save straight away
async function save_opts(coffeeId) {
  const id = Number(coffeeId);
  const o = opts_for(id);
  state.opts[id] = o;
  render_results();
  const { error } = await supabaseClient.from("pricing_coffee_options").upsert(
    { coffee_id: id, sizes: o.sizes, packaging: o.packaging || null, roastery_margin_pct: o.margin ?? null, updated_at: new Date().toISOString() },
    { onConflict: "coffee_id" });
  if (error) alert("Couldn't save that change: " + error.message + "\n\nIt's showing here but isn't saved — try again.");
}

function attach_green() {
  document.querySelectorAll("[data-green]").forEach(inp => {
    // 'change' fires on blur/enter — focus has already left, so re-render is safe.
    inp.addEventListener("change", () => save_green(inp.dataset.green, inp.value));
  });
  document.querySelectorAll("[data-ship]").forEach(inp => {
    inp.addEventListener("change", () => save_shipping(inp.dataset.ship, inp.value));
  });
  document.querySelectorAll("[data-size-toggle]").forEach(btn => btn.addEventListener("click", () => {
    const [cid, size] = btn.dataset.sizeToggle.split("|");
    const o = { ...opts_for(Number(cid)) };
    o.sizes = o.sizes.includes(size) ? o.sizes.filter(s => s !== size) : SIZES.map(s => s.label).filter(s => s === size || o.sizes.includes(s));
    state.opts[Number(cid)] = o;
    save_opts(cid);
  }));
  // Per-coffee roastery margin: blank = the Settings default
  document.querySelectorAll("[data-margin]").forEach(inp => inp.addEventListener("change", () => {
    const id = Number(inp.dataset.margin);
    let m = num_or_null(inp.value);
    if (m != null && (m < 0 || m >= 100)) { alert("The roastery margin must be between 0 and 99%."); render_results(); return; }
    state.opts[id] = { ...opts_for(id), margin: m };
    save_opts(id);
  }));
  document.querySelectorAll("[data-pkg-choice]").forEach(sel => sel.addEventListener("change", () => {
    const id = Number(sel.dataset.pkgChoice);
    state.opts[id] = { ...opts_for(id), packaging: sel.value || null };
    save_opts(id);
  }));
}

function mark_coffee_dirty(id) {
  state.coffee_dirty[id] = true;
  const btn = document.querySelector(`[data-save-coffee="${id}"]`);
  const status = btn?.parentElement?.querySelector(".coffee-status");
  if (status) { status.textContent = "Unsaved changes"; status.classList.add("dirty"); }
  UnsavedWork.sync();
}

// Set one draft price (field: "retail" = shop sell, "wholesale" = roastery → shop), keeping the other
function set_draft_price(id, size, field, value) {
  const cur = ((state.final[id] = state.final[id] || {})[size] = state.final[id][size] || { retail: null, wholesale: null });
  cur[field] = value;
}
function attach_final() {
  // Typing a price — update the draft and that row's margins in place (keeps focus)
  document.querySelectorAll(".final-input").forEach(inp => {
    inp.addEventListener("input", () => {
      const [cid, size, field] = inp.dataset.final.split("|");
      const id = Number(cid);
      set_draft_price(id, size, field, num_or_null(inp.value));
      mark_coffee_dirty(id);
      refresh_row(id, size);
    });
  });
  document.querySelectorAll("[data-save-coffee]").forEach(btn => {
    btn.addEventListener("click", () => save_coffee(Number(btn.dataset.saveCoffee)));
  });
  document.querySelectorAll("[data-how]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.how[btn.dataset.how] = !state.how[btn.dataset.how];
      render_results();
    });
  });
}

// Persist one coffee's saved prices: retail = shop sell (the price on the bag, also online), wholesale =
// roastery → shop. Every change is logged with its date by the database (pricing-step2.sql).
// Prices for sizes not currently ticked are left as they are, so re-ticking a size brings its prices back.
async function save_coffee(id) {
  if (state.coffee_saving[id]) return;   // already saving — ignore a second tap
  state.coffee_saving[id] = true; render_results();
  const now = new Date().toISOString();
  const draft = state.final[id] || {};
  const rows = [], cleared = [];
  const val = x => (x == null || isNaN(x)) ? null : Math.round(Number(x) * 100) / 100;
  SIZES.forEach(s => {
    if (!(s.label in draft)) return;
    const rt = val(draft[s.label]?.retail), ws = val(draft[s.label]?.wholesale);
    if (rt == null && ws == null) cleared.push(s.label);
    else rows.push({ coffee_id: id, bag_size: s.label, retail: rt, wholesale: ws, updated_at: now });
  });
  let err = null;
  if (rows.length) {
    const res = await supabaseClient.from("pricing_final").upsert(rows, { onConflict: "coffee_id,bag_size" });
    err = res.error;
  }
  if (!err && cleared.length) {
    const res = await supabaseClient.from("pricing_final").delete().eq("coffee_id", id).in("bag_size", cleared);
    err = res.error;
  }
  state.coffee_saving[id] = false;
  if (err) { alert("Couldn't save the prices: " + err.message); render_results(); return; }
  state.coffee_dirty[id] = false;
  cleared.forEach(size => { delete draft[size]; });
  // Mirror what the database logged, so Revenue & Profit uses the new prices from today without a reload
  const today = now.slice(0, 10);
  [...rows.map(r => [r.bag_size, r.retail, r.wholesale]), ...cleared.map(s => [s, null, null])].forEach(([size, retail, wholesale]) => {
    const k = `${id}|${size}`, h = (state.price_history[k] = state.price_history[k] || []);
    const last = h[h.length - 1];
    if (!last || last.retail !== retail || last.wholesale !== wholesale) h.push({ date: today, retail, wholesale });
  });
  render_results();
  render_money();
}

// ── Listeners ───────────────────────────────────────────────────────────────
function attach() {
  document.getElementById("back-btn")?.addEventListener("click", () => window.location.href = "index.html");
  document.getElementById("logout-btn")?.addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
  });

  // Live recompute on settings edits — update the draft and re-render ONLY the results, so the input
  // keeps focus while typing.
  document.querySelectorAll("[data-cfg]").forEach(inp => {
    inp.addEventListener("input", () => {
      const v = num_or_null(inp.value);
      if (v == null) return;
      if (/_pct$/.test(inp.dataset.cfg) && (v < 0 || v >= 100)) return;   // a % must stay below 100
      state.cfg[inp.dataset.cfg] = v;
      mark_dirty();
      render_results();
    });
  });
  document.querySelectorAll("[data-cfg-select]").forEach(sel => {
    sel.addEventListener("change", () => {
      state.cfg[sel.dataset.cfgSelect] = sel.value;
      mark_dirty();
      render_results();
    });
  });
  document.querySelectorAll("[data-pkg]").forEach(inp => {
    inp.addEventListener("input", () => {
      state.pkg[inp.dataset.pkg] = num_or_null(inp.value);
      mark_dirty();
      render_results();
    });
  });
  // Special packaging rows
  document.querySelectorAll("[data-sp]").forEach(inp => {
    const update = () => {
      const [i, field] = inp.dataset.sp.split("|");
      const row = state.special_pkg[Number(i)];
      if (!row) return;
      row[field] = field === "cost" ? num_or_null(inp.value) : inp.value;
      mark_dirty();
      render_results();   // the packaging dropdowns and costs follow the names
    };
    inp.addEventListener(inp.tagName === "SELECT" ? "change" : "input", update);
  });
  document.querySelectorAll("[data-sp-remove]").forEach(btn => btn.addEventListener("click", () => {
    state.special_pkg.splice(Number(btn.dataset.spRemove), 1);
    mark_dirty();
    render();
  }));
  document.getElementById("sp-add")?.addEventListener("click", () => {
    state.special_pkg.push({ name: "", bag_size: "100g", cost: null, notes: "" });
    mark_dirty();
    render();
  });

  document.getElementById("save-btn")?.addEventListener("click", save);
}

function mark_dirty() {
  if (!state.dirty || state.err || state.flash_until) {
    state.dirty = true; state.err = ""; state.flash_until = 0;
    // Refresh just the actions row label without nuking input focus.
    const btn = document.getElementById("save-btn");
    const actions = btn?.parentElement;
    if (actions) {
      actions.querySelector(".dirty")?.remove();
      actions.querySelector(".save-flash")?.remove();
      actions.querySelector(".save-err")?.remove();
      if (!actions.querySelector(".dirty")) {
        const span = document.createElement("span");
        span.className = "dirty"; span.textContent = "Unsaved changes";
        actions.appendChild(span);
      }
    }
  }
  UnsavedWork.sync();
}

// Save the settings card: rates, standard packaging, special packaging
async function save() {
  if (state.saving) return;   // already saving — ignore a second tap
  // Special packaging: every row needs a name and a cost, and a name + size only once
  const sp = state.special_pkg.map(r => ({ ...r, name: (r.name || "").trim() }));
  const bad = sp.find(r => !r.name || r.cost == null);
  if (bad) { state.err = "Each special packaging row needs a name and a cost (or remove the row)."; render(); return; }
  const keys = sp.map(r => `${r.name}|${r.bag_size}`);
  if (new Set(keys).size !== keys.length) { state.err = "The same special packaging name and size is listed twice."; render(); return; }

  state.saving = true; state.err = ""; render();
  const now = new Date().toISOString();
  const errors = [];
  const chk = res => { if (res?.error) errors.push(res.error.message); };

  chk(await supabaseClient.from("pricing_settings").upsert({
    id: 1,
    roast_loss_pct:      state.cfg.roast_loss_pct,
    roastery_margin_pct: state.cfg.roastery_margin_pct,
    rounding_rule:       state.cfg.rounding_rule,
    target_low_pct:      state.cfg.target_low_pct,
    target_high_pct:     state.cfg.target_high_pct,
    updated_at: now,
  }, { onConflict: "id" }));

  // Standard packaging: sizes with a cost are saved; a blanked size is removed (= not set)
  const set_sizes = SIZES.filter(s => state.pkg[s.label] != null);
  const blank_sizes = SIZES.filter(s => state.pkg[s.label] == null).map(s => s.label);
  if (set_sizes.length) chk(await supabaseClient.from("pricing_packaging")
    .upsert(set_sizes.map(s => ({ bag_size: s.label, cost: Number(state.pkg[s.label]), updated_at: now })), { onConflict: "bag_size" }));
  if (blank_sizes.length) chk(await supabaseClient.from("pricing_packaging").delete().in("bag_size", blank_sizes));

  // Special packaging: upsert what's listed, delete rows that were removed or renamed
  if (sp.length) chk(await supabaseClient.from("pricing_special_packaging")
    .upsert(sp.map(r => ({ name: r.name, bag_size: r.bag_size, cost: Number(r.cost), notes: r.notes || null, updated_at: now })), { onConflict: "name,bag_size" }));
  for (const k of state.saved_special_keys.filter(k => !keys.includes(k))) {
    const [name, bag_size] = k.split("|");
    chk(await supabaseClient.from("pricing_special_packaging").delete().eq("name", name).eq("bag_size", bag_size));
  }

  state.saving = false;
  if (errors.length) { state.err = errors[0]; state.dirty = true; render(); return; }
  state.special_pkg = sp;
  state.saved_special_keys = keys;
  state.dirty = false;
  state.flash_until = Date.now() + 2000;
  render();
  setTimeout(() => { if (Date.now() >= state.flash_until) { state.flash_until = 0; render(); } }, 2100);
}
</script>

<script src="session-guard.js"></script>
