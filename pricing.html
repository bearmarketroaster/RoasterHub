  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #fafaf8; min-height: 100vh; color: #1a1a1a; }

    /* Config grid */
    .cfg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }

    .coffee-green .param-sep { color: #ccc; margin: 0 4px; }
    .coffee-green b { color: #1a1a1a; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 9px 8px; background: #f4f2ed; font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; border-bottom: 1px solid #e8e6e1; }
    th.num, td.num { text-align: right; }
    td { padding: 9px 8px; border-bottom: 1px solid #f0eee9; vertical-align: middle; }
    td.size { font-weight: 600; }

    .final-input:focus { outline: none; border-color: #1a1a1a; }
    .sugg-chip { display: block; margin-top: 4px; background: #f0eee9; border: 1px solid #e0ddd6; color: #555; border-radius: 5px; padding: 2px 7px; font-size: 11px; cursor: pointer; }
    .sugg-chip:hover { background: #e8e6e1; }

    .coffee-status { font-size: 12px; color: #999; }

    .bulk-lbl { font-size: 13px; font-weight: 600; color: #1a1a1a; }

    .drill-toggle:hover { color: #1a1a1a; }
    .drilldown { margin-top: 10px; background: #faf9f7; border: 1px solid #eee; border-radius: 8px; padding: 12px 14px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: #444; }
    .dl-head { font-weight: 700; color: #1a1a1a; margin-bottom: 4px; font-family: inherit; }

    .dl-row b { color: #1a1a1a; }

    .money-range { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: #666; }
    .money-range input { margin-left: 6px; padding: 5px 8px; font-size: 13px; }
    .money-stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .money-stat { flex: 1; min-width: 110px; text-align: center; background: #faf9f7; border: 1px solid #eee; border-radius: 10px; padding: 14px 8px; }
    .money-val { font-size: 24px; font-weight: 800; }
    .money-lbl { font-size: 12px; color: #666; margin-top: 2px; }
    .money-split { font-size: 13px; color: #555; background: #faf9f7; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
    .money-table { width: 100%; border-collapse: collapse; }
    .money-table th, .money-table td { padding: 7px 8px; border-bottom: 1px solid #f0eee9; font-size: 13px; }
    .money-table th { color: #666; font-weight: 600; text-align: left; }
    .money-warn { margin-top: 12px; font-size: 12px; color: #d97706; background: #fff8ef; border: 1px solid #f5dca8; border-radius: 8px; padding: 8px 12px; }
    .no-green { color: #d97706; font-style: italic; font-size: 13px; }
    .empty { color: #999; font-style: italic; padding: 20px 0; text-align: center; }
    @media (max-width: 600px) {
      .content { padding: 16px 12px; }
      th, td { padding: 7px 5px; font-size: 12px; }
      .retail-sub { display: none; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

function esc(s) { return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function eur(n) { return "€" + (Number(n)||0).toFixed(2); }
function pct(n) { return (Number(n)||0).toFixed(0) + "%"; }
function round_to(n, step) { return Math.round((Number(n)||0)/step)*step; }
function round2(n) { return Math.round((Number(n)||0) * 100) / 100; }

// Canonical RETAIL bag sizes + their weight in kg. (5kg bar is internal; 100g is rare/none currently.)
const SIZES = [
  { label: "200g",    kg: 0.2 },
  { label: "500g",    kg: 0.5 },
  { label: "1kg",     kg: 1   },
];

const DEFAULTS = {
  target_low_pct: 75, target_high_pct: 84,
};
const ROASTERY_MARGIN_PCT = 15;   // Roastery → shop is fixed: price = Cost ÷ (1 − 15%). 15% margin ≈ 18% markup.
const DEFAULT_LOSS_PCT = 15;      // used when a coffee has no/too-few roasts for a reliable average
const MIN_ROASTS_FOR_AVG = 3;     // need at least this many real roasts before trusting the average

const state = {
  loaded: false,
  cfg: { ...DEFAULTS },        // working draft of pricing_settings (just the retail target band now)
  pkg: {},                     // working draft of packaging: { "200g": 0.349, ... }
  coffees: [],                 // [{ id, name }]
  green_delivery: {},          // { coffeeId: { price, date } }  derived from stock deliveries
  green_override: {},          // { coffeeId: price }            manual entry in this tool
  shipping_override: {},       // { coffeeId: shipping €/kg }     per-coffee, added to green before loss
  roast_loss_stats: {},        // { coffeeId: { avg, n } }        from actual roast data
  final: {},                   // { coffeeId: { "200g": {retail, wholesale}, ... } } chosen prices
  coffee_dirty: {},            // { coffeeId: true } unsaved per-coffee price edits
  coffee_saving: {},           // { coffeeId: true } in-flight save
  drill: {},                   // { coffeeId: true } show calculation drilldown
  dispatches: [],              // for the revenue/profit view
  shop_mappings: [],
  fp_codes: [],
  fillmap: {},                 // fill_id -> coffee name (from roast sessions)
  money_from: "",
  money_to: "",
  dirty: false,
  saving: false,
  flash_until: 0,
  err: "",
};

(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = "login.html"; return; }
  // Admin-only — pricing exposes cost data.
  const { data: role_row } = await supabaseClient.from("user_roles").select("role").eq("user_id", session.user.id).maybeSingle();
  if (role_row?.role !== "admin") { window.location.href = "index.html"; return; }
  await load();
  render();
})();

async function load() {
  // Config
  const { data: settings } = await supabaseClient.from("pricing_settings").select("*").eq("id", 1).maybeSingle();
  if (settings) {
    state.cfg = {
      target_low_pct:      Number(settings.target_low_pct),
      target_high_pct:     Number(settings.target_high_pct),
    };
  }

  // Packaging
  const { data: pkg_rows } = await supabaseClient.from("pricing_packaging").select("*");
  const pkg = {};
  (pkg_rows || []).forEach(r => { pkg[r.bag_size] = Number(r.cost); });
  SIZES.forEach(s => { if (pkg[s.label] == null) pkg[s.label] = 0; });
  state.pkg = pkg;

  // Active coffees
  const { data: coffees } = await supabaseClient.from("coffees").select("id, name, retired_at").is("retired_at", null).order("name");
  state.coffees = (coffees || []).map(c => ({ id: c.id, name: c.name }));

  // Latest green price per coffee. Walk deliveries newest-first (same join
  // direction the rest of the app uses) and take the first delivery line that
  // actually carries a price_per_kg for each coffee — so a coffee still shows a
  // price even if its most recent delivery left the price blank.
  // green_deliveries is one row per coffee per arrival, so no nested join is needed. Newest
  // first, taking the first row that carries a price — a delivery logged before its invoice
  // arrived has a null price, and shouldn't wipe out the last known one.
  const { data: deliveries } = await supabaseClient
    .from("green_deliveries")
    .select("coffee_id, price_per_kg, arrived_on")
    .not("price_per_kg", "is", null)
    .order("arrived_on", { ascending: false });
  const green = {};
  (deliveries || []).forEach(d => {
    if (d.coffee_id == null || green[d.coffee_id]) return;   // already captured a newer price
    green[d.coffee_id] = { price: Number(d.price_per_kg), date: d.arrived_on || null };
  });
  state.green_delivery = green;

  // Per-coffee params entered in this tool: green override + shipping €/kg.
  const { data: overrides } = await supabaseClient.from("pricing_green").select("coffee_id, green_price, shipping_per_kg");
  const ov = {}, ship = {};
  (overrides || []).forEach(r => {
    if (r.coffee_id == null) return;
    if (r.green_price != null) ov[r.coffee_id] = Number(r.green_price);
    if (r.shipping_per_kg != null) ship[r.coffee_id] = Number(r.shipping_per_kg);
  });
  state.green_override = ov;
  state.shipping_override = ship;

  // Chosen per-coffee, per-size prices (what labels will read).
  const { data: finals } = await supabaseClient.from("pricing_final").select("coffee_id, bag_size, retail, wholesale");
  const fin = {};
  (finals || []).forEach(r => {
    if (r.coffee_id == null) return;
    (fin[r.coffee_id] = fin[r.coffee_id] || {})[r.bag_size] = {
      retail:    r.retail    != null ? Number(r.retail)    : null,
      wholesale: r.wholesale != null ? Number(r.wholesale) : null,
    };
  });
  state.final = fin;

  // Revenue/profit view data.
  const { data: disp } = await supabaseClient.from("dispatches").select("*, dispatch_lines(*)");
  state.dispatches = (disp || []).map(d => ({ ...d, lines: d.dispatch_lines || [] }));
  const { data: maps } = await supabaseClient.from("shop_mappings").select("master_name, kind");
  state.shop_mappings = maps || [];
  const { data: fps } = await supabaseClient.from("fp_codes").select("fp_code, coffees(name)");
  state.fp_codes = fps || [];
  const { data: rs } = await supabaseClient.from("roast_sessions").select("fill_id, coffee, coffee_id, roasted_weight, is_test, roast_batches(green_weight)");
  const fm = {}, lossByC = {};
  (rs || []).forEach(r => {
    if (r.fill_id && r.coffee && !fm[r.fill_id]) fm[r.fill_id] = r.coffee;
    if (r.is_test) return;
    const green = (r.roast_batches || []).reduce((a, b) => a + (Number(b.green_weight) || 0), 0);
    const roasted = Number(r.roasted_weight) || 0;
    if (green > 0 && roasted > 0 && roasted < green && r.coffee_id != null) {
      (lossByC[r.coffee_id] = lossByC[r.coffee_id] || []).push((green - roasted) / green * 100);
    }
  });
  state.fillmap = fm;
  const stats = {};
  Object.entries(lossByC).forEach(([cid, arr]) => { stats[cid] = { avg: arr.reduce((a, b) => a + b, 0) / arr.length, n: arr.length }; });
  state.roast_loss_stats = stats;
  if (!state.money_from) {
    const now = new Date();
    state.money_from = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
    state.money_to = now.toISOString().slice(0, 10);
  }

  state.loaded = true;
}

// Effective green price for a coffee: manual override wins, else latest delivery.
function green_for(coffeeId) {
  const ov = state.green_override[coffeeId];
  if (ov != null && !isNaN(ov)) return { price: ov, source: "manual" };
  const d = state.green_delivery[coffeeId];
  if (d) return { price: d.price, source: "delivery", date: d.date };
  return null;
}

// Per-coffee roast loss: average of real roasts rounded UP to a whole %, with a buffer.
// Falls back to the default when there aren't enough roasts yet.
function roast_loss_for(coffeeId) {
  const r = state.roast_loss_stats[coffeeId];
  if (!r || r.n < MIN_ROASTS_FOR_AVG) return { pct: DEFAULT_LOSS_PCT, source: "default", n: r ? r.n : 0, avg: r ? r.avg : null };
  return { pct: Math.ceil(r.avg), source: "avg", n: r.n, avg: r.avg };
}

// ── Pricing maths ───────────────────────────────────────────────────────────
// Returns null if no green price for this coffee.
function compute(coffeeId, kg, bagLabel) {
  const g = green_for(coffeeId);
  if (!g) return null;
  const loss   = roast_loss_for(coffeeId).pct / 100;          // per-coffee, from roast data
  const shipping = Number(state.shipping_override[coffeeId]) || 0; // per-coffee, added to green first
  const low      = state.cfg.target_low_pct / 100;
  const high     = state.cfg.target_high_pct / 100;
  const packaging = Number(state.pkg[bagLabel]) || 0;

  const roasted_cost_per_kg = round2((g.price + shipping) / (1 - loss));   // (green + shipping) ÷ (1 − loss)
  const cogs       = round2(roasted_cost_per_kg * kg + packaging);  // Cost, rounded to 2dp before margin
  const wholesale  = cogs / (1 - ROASTERY_MARGIN_PCT / 100); // roastery→shop: Cost ÷ 0.85 (15% margin ≈ 18% markup)

  // Combined margin = (retail - COGS) / retail = target  ->  retail = COGS / (1 - target)
  const retail_low  = cogs / (1 - low);   // price at the band floor (75%)
  const retail_high = cogs / (1 - high);  // price at the band ceiling (84%)

  return { roasted_cost_per_kg, cogs, wholesale, retail_low, retail_high };
}

// ── Calculation drilldown (sanity check) ─────────────────────────────────────
function build_drilldown(coffee, g) {
  const green = g.price;
  const shipping = Number(state.shipping_override[coffee.id]) || 0;
  const lossInfo = roast_loss_for(coffee.id);
  const lossPct = lossInfo.pct;
  const pre = green + shipping;
  const afterLoss = pre / (1 - lossPct / 100);
  const roasted = round2(afterLoss);
  const m = ROASTERY_MARGIN_PCT;
  const d4 = x => (Number(x) || 0).toFixed(4);
  const loss_note = lossInfo.source === "avg"
    ? `avg of ${lossInfo.n} roasts = ${lossInfo.avg.toFixed(2)}%, rounded up to ${lossPct}%`
    : `default ${lossPct}% (${lossInfo.n ? `only ${lossInfo.n} roast${lossInfo.n>1?"s":""} so far, need ${MIN_ROASTS_FOR_AVG}` : "no roast data yet"})`;

  const size_lines = SIZES.map(s => {
    const base = roasted * s.kg;
    const pkg = Number(state.pkg[s.label]) || 0;
    const cost = round2(base + pkg);
    const shop = cost / (1 - m / 100);
    return `<div class="dl-row"><span class="dl-size">${esc(s.label)}</span>${d4(roasted)} × ${s.kg} = ${d4(base)} + ${d4(pkg)} pkg = <b>${eur(cost)}</b> → ÷ ${(1 - m/100).toFixed(2)} = <b>${eur(shop)}</b> · gross ${eur(shop - cost)}</div>`;
  }).join("");
  const bulk_kg = roasted / (1 - m / 100);

  return `
    <div class="drilldown">
      <div class="dl-head">Roasted cost / kg</div>
      <div class="dl-row">Green ${eur(green)}${shipping ? ` + shipping ${eur(shipping)}` : ""} = ${d4(pre)}</div>
      <div class="dl-row">÷ (1 − ${lossPct}% loss) = ${d4(afterLoss)} &nbsp;<span style="color:#999">${loss_note}</span></div>
      <div class="dl-row">= <b>${eur(roasted)} / kg</b> (rounded to 2dp)</div>
      <div class="dl-head" style="margin-top:10px">Per size &nbsp;<span style="font-weight:400;color:#999">Cost = roasted × size + packaging (rounded); Shop = Cost ÷ ${(1 - m/100).toFixed(2)} (${m}% margin)</span></div>
      ${size_lines}
      <div class="dl-row"><span class="dl-size">Bulk</span>${d4(roasted)} ÷ ${(1 - m/100).toFixed(2)} = <b>${eur(bulk_kg)}</b> / kg · × 5 = <b>${eur(bulk_kg * 5)}</b> / bucket</div>
    </div>`;
}

// ── Revenue / profit ────────────────────────────────────────────────────────
const BAG_KG = {}; SIZES.forEach(s => BAG_KG[s.label] = s.kg);

function roasted_cpk(coffeeId) {
  const g = green_for(coffeeId);
  if (!g) return null;
  return round2((g.price + (Number(state.shipping_override[coffeeId]) || 0)) / (1 - roast_loss_for(coffeeId).pct / 100));
}
function coffee_id_for_name(name) {
  const c = name && state.coffees.find(c => c.name === name);
  return c ? c.id : null;
}
function line_coffee_id(l) {
  let name = null;
  if (l.fp_code) { const f = state.fp_codes.find(x => x.fp_code === l.fp_code); if (f && f.coffees) name = f.coffees.name; }
  if (!name && l.fill_id) name = state.fillmap[l.fill_id] || null;
  return coffee_id_for_name(name);
}

// Value one dispatch line for a channel ("shop" → wholesale, "online" → retail).
// Returns { revenue, cogs } | { unpriced:true } | null (not a sale).
function value_line(l, channel) {
  const bs = l.bag_size;
  if (bs === "30g sample" || bs === "Emptied") return null;     // samples & write-offs aren't sales
  const cid = line_coffee_id(l);
  if (cid == null) return { unpriced: true };
  const rcpk = roasted_cpk(cid);
  const mk = 1 / (1 - ROASTERY_MARGIN_PCT / 100);   // roastery→shop multiplier = ÷0.85
  const is_bulk = l.type === "bulk" || bs === "Batch brew" || bs === "Bar 5kg";
  if (is_bulk) {
    if (rcpk == null) return { unpriced: true };               // need green to derive the bulk rate
    const kg = Number(l.kg) || 0;
    const cost = round2(rcpk * kg);
    return { revenue: cost * mk, cogs: cost, cid };            // bulk → shops at Cost ÷ 0.85
  }
  const bags = Number(l.bags) || 0;
  const bag_cost = rcpk != null ? round2(rcpk * (BAG_KG[bs] || 0) + (Number(state.pkg[bs]) || 0)) : null;
  let price;
  if (channel === "online") {
    price = (state.final[cid] || {})[bs]?.retail;              // online sells at the saved label price
    if (price == null) return { unpriced: true };
  } else {
    if (bag_cost == null) return { unpriced: true };           // shop → fixed wholesale = Cost ÷ 0.85
    price = bag_cost * mk;
  }
  const cogs = bag_cost != null ? bag_cost * bags : 0;
  return { revenue: price * bags, cogs, cid };
}

function compute_money() {
  const kind_of = d => (state.shop_mappings.find(m => m.master_name === d.shop)?.kind) || "shop";
  const acc = { shop: { rev: 0, cogs: 0 }, online: { rev: 0, cogs: 0 } };
  const by_coffee = {};
  let unpriced = 0;
  state.dispatches.forEach(d => {
    if (d.shop === "Samples" || d.shop === "Staff" || d.shop === "Emptied") return;
    const kind = kind_of(d);
    if (kind !== "shop" && kind !== "online") return;          // shops + online only
    if (state.money_from && (d.date || "") < state.money_from) return;
    if (state.money_to   && (d.date || "") > state.money_to)   return;
    (d.lines || []).forEach(l => {
      const v = value_line(l, kind);
      if (!v) return;
      if (v.unpriced) { unpriced++; return; }
      acc[kind].rev += v.revenue; acc[kind].cogs += (v.cogs || 0);
      const nm = state.coffees.find(c => c.id === v.cid)?.name || "—";
      const bc = (by_coffee[nm] = by_coffee[nm] || { rev: 0, cogs: 0 });
      bc.rev += v.revenue; bc.cogs += (v.cogs || 0);
    });
  });
  return { acc, by_coffee, unpriced };
}

function render_money() {
  const el = document.getElementById("money");
  if (!el) return;
  const { acc, by_coffee, unpriced } = compute_money();
  const rev = acc.shop.rev + acc.online.rev;
  const cogs = acc.shop.cogs + acc.online.cogs;
  const profit = rev - cogs;
  const stat = (label, val, color) => `<div class="money-stat"><div class="money-val" style="color:${color}">${eur(val)}</div><div class="money-lbl">${label}</div></div>`;
  const coffee_rows = Object.entries(by_coffee).sort((a, b) => b[1].rev - a[1].rev)
    .map(([nm, v]) => `<tr><td>${esc(nm)}</td><td class="num">${eur(v.rev)}</td><td class="num">${eur(v.cogs)}</td><td class="num">${eur(v.rev - v.cogs)}</td></tr>`).join("");
  el.innerHTML = `
    <div class="card">
      <div class="section-title">💶 Revenue &amp; Profit <span style="font-weight:400;color:#999;font-size:12px">· shops + online only</span></div>
      <div class="money-range">
        <label>From <input type="date" id="money-from" value="${state.money_from}" /></label>
        <label>To <input type="date" id="money-to" value="${state.money_to}" /></label>
      </div>
      <div class="money-stats">
        ${stat("Revenue", rev, "#1a1a1a")}
        ${stat("COGS", cogs, "#999")}
        ${stat("Profit", profit, profit >= 0 ? "#16a34a" : "#dc2626")}
      </div>
      <div class="money-split">🏪 Shops &nbsp;<b>${eur(acc.shop.rev)}</b> rev · <b>${eur(acc.shop.rev - acc.shop.cogs)}</b> profit &nbsp;&nbsp;|&nbsp;&nbsp; 🌐 Online &nbsp;<b>${eur(acc.online.rev)}</b> rev · <b>${eur(acc.online.rev - acc.online.cogs)}</b> profit</div>
      ${coffee_rows ? `<table class="money-table"><thead><tr><th>Coffee</th><th class="num">Revenue</th><th class="num">COGS</th><th class="num">Profit</th></tr></thead><tbody>${coffee_rows}</tbody></table>` : `<div class="empty" style="padding:14px">No sales in this range.</div>`}
      ${unpriced ? `<div class="money-warn">⚠ ${unpriced} line${unpriced > 1 ? "s" : ""} skipped — that coffee/size isn't priced yet. Set prices below so they count.</div>` : ""}
    </div>`;
  document.getElementById("money-from")?.addEventListener("change", e => { state.money_from = e.target.value; render_money(); });
  document.getElementById("money-to")?.addEventListener("change", e => { state.money_to = e.target.value; render_money(); });
}

// ── Render ────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  if (!state.loaded) { app.innerHTML = `<div class="content"><div class="empty">Loading…</div></div>`; return; }
  const c = state.cfg;

  app.innerHTML = `
    <div class="header">
      <div class="header-left">
        <button class="header-back" id="back-btn">← Dashboard</button>
        <div style="width:1px;height:24px;background:#333;margin:0 4px"></div>
        <div>
          <div class="header-title">💶 Pricing</div>
          <div class="header-sub">Bear Mrkt · Suggested prices</div>
        </div>
      </div>
      <button class="btn-logout" id="logout-btn">Log Out</button>
    </div>

    <div class="content">

      <div id="money"></div>

      <div class="card">
        <div class="section-title">Pricing Inputs</div>
        <div class="cfg-grid">
          ${cfg_num("target_low_pct",      "Target band low", c.target_low_pct,      "%")}
          ${cfg_num("target_high_pct",     "Target band high",c.target_high_pct,     "%")}
        </div>
        <div class="cfg-sub">Packaging cost per bag</div>
        <div class="cfg-grid">
          ${SIZES.map(s => cfg_pkg(s.label, state.pkg[s.label])).join("")}
        </div>
        <div class="cfg-actions">
          <button class="btn-save" id="save-btn" ${state.saving?"disabled":""}>${state.saving?"Saving…":"Save inputs"}</button>
          ${state.dirty ? `<span class="dirty">Unsaved changes</span>` : ""}
          ${Date.now() < state.flash_until ? `<span class="save-flash">Saved ✓</span>` : ""}
          ${state.err ? `<span class="save-err">${esc(state.err)}</span>` : ""}
        </div>
        <div class="note">
          Cost per kg = (green + shipping) ÷ (1 − roast loss). <strong>Shipping is per-coffee</strong> (set it on
          each coffee), and <strong>roast loss is per-coffee</strong> — the average of that coffee's real roasts,
          rounded up to a whole % for a buffer (defaults to ${DEFAULT_LOSS_PCT}% until there are ${MIN_ROASTS_FOR_AVG} roasts).
          Roastery → shop = Cost ÷ 0.85 (15% margin ≈ 18% markup); gross profit = Roastery → shop − Cost.
          The band/packaging below set the retail (label) suggestion.
        </div>
      </div>

      <div id="results"></div>

    </div>
  `;

  render_results();
  render_money();
  attach();
}

function cfg_num(key, label, val, suffix, max, optional) {
  const blank = optional && (!val || Number(val) === 0);
  return `
    <div class="cfg-field">
      <label>${label}</label>
      <div class="suffix">
        <input type="number" step="any" ${max!=null?`max="${max}"`:""} ${optional?`placeholder="optional"`:""} data-cfg="${key}" value="${blank?"":val}" />
        <span>${suffix}</span>
      </div>
    </div>`;
}
function cfg_pkg(label, val) {
  return `
    <div class="cfg-field">
      <label>${esc(label)}</label>
      <div class="suffix">
        <input type="number" step="any" data-pkg="${esc(label)}" value="${val}" />
        <span>€</span>
      </div>
    </div>`;
}

function render_results() {
  const el = document.getElementById("results");
  if (!el) return;

  if (!state.coffees.length) {
    el.innerHTML = `<div class="card"><div class="empty">No active coffees found.</div></div>`;
    return;
  }

  el.innerHTML = state.coffees.map(coffee => {
    const g = green_for(coffee.id);
    const input_val = state.green_override[coffee.id] != null
      ? state.green_override[coffee.id]
      : (state.green_delivery[coffee.id]?.price ?? "");
    let src_hint = "";
    if (g && g.source === "delivery") src_hint = `from delivery${g.date?` ${esc(g.date)}`:""}`;
    else if (g && g.source === "manual") src_hint = "manual entry";
    else src_hint = "enter a price to see suggestions";

    const ship_val = state.shipping_override[coffee.id] != null ? state.shipping_override[coffee.id] : "";
    const loss = roast_loss_for(coffee.id);
    const loss_hint = loss.source === "avg"
      ? `avg of ${loss.n} roast${loss.n>1?"s":""} (${loss.avg.toFixed(1)}%), rounded up`
      : `default${loss.n ? ` — only ${loss.n} roast${loss.n>1?"s":""} so far` : " — no roast data yet"}`;

    const head = `
      <div class="coffee-head">
        <div class="coffee-name">${esc(coffee.name)}</div>
        <div class="coffee-green">
          <span class="green-lbl">Green €/kg</span>
          <input type="number" step="0.01" min="0" class="green-input" data-green="${coffee.id}"
                 value="${input_val}" placeholder="0.00" />
          <span class="green-src">${src_hint}</span>
          <span class="param-sep">·</span>
          <span class="green-lbl">Shipping €/kg</span>
          <input type="number" step="0.01" min="0" class="green-input" data-ship="${coffee.id}"
                 value="${ship_val}" placeholder="0.00" />
          <span class="param-sep">·</span>
          <span class="green-lbl">Roast loss</span> <b>${loss.pct}%</b>
          <span class="green-src">${loss_hint}</span>
        </div>
      </div>`;

    if (!g) return `<div class="card">${head}</div>`;

    const saved = state.final[coffee.id] || {};
    const rows = SIZES.map(s => {
      const r = compute(coffee.id, s.kg, s.label);
      const sugg_rt = round_to((r.retail_low + r.retail_high) / 2, 0.5);
      const rt_val = saved[s.label]?.retail != null ? saved[s.label].retail : "";
      return `
        <tr>
          <td class="size">${esc(s.label)}</td>
          <td class="num">${eur(r.cogs)}</td>
          <td class="num"><strong>${eur(r.wholesale)}</strong></td>
          <td class="num">${eur(r.wholesale - r.cogs)}</td>
          <td class="num your-price">
            <div class="your-wrap"><span class="eur-pre">€</span>
              <input type="number" step="0.01" min="0" class="final-input" data-final="${coffee.id}|${esc(s.label)}|retail" value="${rt_val}" placeholder="${sugg_rt.toFixed(2)}" /></div>
            <button type="button" class="sugg-chip" data-fill="${coffee.id}|${esc(s.label)}|retail|${sugg_rt.toFixed(2)}">use €${sugg_rt.toFixed(2)}</button>
            <div class="retail-sub">band ${eur(r.retail_low)} – ${eur(r.retail_high)}</div>
          </td>
        </tr>`;
    }).join("");

    const dirty = !!state.coffee_dirty[coffee.id];
    const saving = !!state.coffee_saving[coffee.id];
    return `
      <div class="card">
        ${head}
        <table>
          <thead>
            <tr>
              <th>Size</th>
              <th class="num">Cost</th>
              <th class="num">Roastery → Shop</th>
              <th class="num">Gross profit</th>
              <th class="num">Shop → Customer (label)</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        ${(() => {
          const br = compute(coffee.id, 1, "1kg");
          const bulk_kg = br ? br.roasted_cost_per_kg / (1 - ROASTERY_MARGIN_PCT/100) : 0;
          return `<div class="bulk-row">
            <span class="bulk-lbl">Bulk €/kg (5kg buckets → shops)</span>
            <span class="bulk-fixed">€${bulk_kg.toFixed(2)}/kg</span>
            <span class="bulk-hint">roasted cost ÷ 0.85 · only billed when buckets are dispatched</span>
          </div>`;
        })()}
        <div class="coffee-actions">
          <button class="btn-save" data-save-coffee="${coffee.id}" ${saving?"disabled":""}>${saving?"Saving…":"Save prices"}</button>
          <span class="coffee-status ${dirty?"dirty":""}">${dirty?"Unsaved changes":""}</span>
          <button type="button" class="drill-toggle" data-drill="${coffee.id}">${state.drill[coffee.id]?"▾ Hide calculation":"▸ Show calculation"}</button>
        </div>
        ${state.drill[coffee.id] ? build_drilldown(coffee, g) : ""}
      </div>`;
  }).join("");

  attach_green();
  attach_final();
}

// Persist a per-coffee manual green price (blank clears it → falls back to delivery).
async function save_green(coffeeId, raw) {
  const id = Number(coffeeId);
  const name = state.coffees.find(c => c.id === id)?.name || null;
  const val = String(raw).trim();
  const price = (val === "" || isNaN(Number(val))) ? null : Number(val);
  if (price == null) delete state.green_override[id]; else state.green_override[id] = price;
  // Upsert (don't delete the row) so a per-coffee shipping value is preserved when green is cleared.
  await supabaseClient.from("pricing_green").upsert(
    { coffee_id: id, coffee: name, green_price: price, updated_at: new Date().toISOString() },
    { onConflict: "coffee_id" }
  );
  render_results();
}

// Persist a per-coffee shipping €/kg (added to green before roast loss). Blank clears it.
async function save_shipping(coffeeId, raw) {
  const id = Number(coffeeId);
  const name = state.coffees.find(c => c.id === id)?.name || null;
  const val = String(raw).trim();
  const ship = (val === "" || isNaN(Number(val))) ? null : Number(val);
  if (ship == null) delete state.shipping_override[id]; else state.shipping_override[id] = ship;
  await supabaseClient.from("pricing_green").upsert(
    { coffee_id: id, coffee: name, shipping_per_kg: ship, updated_at: new Date().toISOString() },
    { onConflict: "coffee_id" }
  );
  render_results();
}

function attach_green() {
  document.querySelectorAll("[data-green]").forEach(inp => {
    // 'change' fires on blur/enter — focus has already left, so re-render is safe.
    inp.addEventListener("change", () => save_green(inp.dataset.green, inp.value));
  });
  document.querySelectorAll("[data-ship]").forEach(inp => {
    inp.addEventListener("change", () => save_shipping(inp.dataset.ship, inp.value));
  });
}

function mark_coffee_dirty(id) {
  state.coffee_dirty[id] = true;
  const btn = document.querySelector(`[data-save-coffee="${id}"]`);
  const status = btn?.parentElement?.querySelector(".coffee-status");
  if (status) { status.textContent = "Unsaved changes"; status.classList.add("dirty"); }
}

function attach_final() {
  // Typing your own price — update draft silently (no re-render, keep focus). Merge so the
  // other field on the same size isn't lost.
  document.querySelectorAll(".final-input").forEach(inp => {
    inp.addEventListener("input", () => {
      const [cid, size, field] = inp.dataset.final.split("|");
      const id = Number(cid);
      const v = inp.value.trim();
      const cur = (state.final[id] = state.final[id] || {});
      cur[size] = { ...(cur[size] || {}), [field]: v === "" ? null : Number(v) };
      mark_coffee_dirty(id);
    });
  });
  // One-tap accept a suggested price.
  document.querySelectorAll(".sugg-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const [cid, size, field, val] = chip.dataset.fill.split("|");
      const id = Number(cid);
      const input = document.querySelector(`.final-input[data-final="${cid}|${size}|${field}"]`);
      if (input) input.value = val;
      const cur = (state.final[id] = state.final[id] || {});
      cur[size] = { ...(cur[size] || {}), [field]: Number(val) };
      mark_coffee_dirty(id);
    });
  });
  document.querySelectorAll("[data-save-coffee]").forEach(btn => {
    btn.addEventListener("click", () => save_coffee(Number(btn.dataset.saveCoffee)));
  });
  document.querySelectorAll("[data-drill]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = Number(btn.dataset.drill);
      state.drill[id] = !state.drill[id];
      render_results();
    });
  });
}

// Persist one coffee's chosen prices: roastery→shop (wholesale) and shop→customer (retail, the label price).
async function save_coffee(id) {
  state.coffee_saving[id] = true; render_results();
  const now = new Date().toISOString();
  const saved = state.final[id] || {};
  const rows = [], cleared = [];
  SIZES.forEach(s => {
    const rt = saved[s.label]?.retail;
    if (rt == null || isNaN(rt)) { if (s.label in saved) cleared.push(s.label); return; }
    rows.push({ coffee_id: id, bag_size: s.label, retail: Number(rt), wholesale: null, updated_at: now });
  });
  let err = null;
  if (rows.length) {
    const res = await supabaseClient.from("pricing_final").upsert(rows, { onConflict: "coffee_id,bag_size" });
    err = res.error;
  }
  if (!err && cleared.length) await supabaseClient.from("pricing_final").delete().eq("coffee_id", id).in("bag_size", cleared);

  state.coffee_saving[id] = false;
  if (err) { state.err = err.message; render(); return; }
  state.coffee_dirty[id] = false;
  const fin = (state.final[id] = {});
  rows.forEach(r => { fin[r.bag_size] = { retail: r.retail }; });
  render_results();
}

// ── Listeners ───────────────────────────────────────────────────────────────
function attach() {
  document.getElementById("back-btn")?.addEventListener("click", () => window.location.href = "index.html");
  document.getElementById("logout-btn")?.addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
  });

  // Live recompute on config edits — update draft + re-render ONLY the results
  // block so the input keeps focus while typing.
  document.querySelectorAll("[data-cfg]").forEach(inp => {
    inp.addEventListener("input", () => {
      let v = Number(inp.value) || 0;
      if (inp.dataset.cfg === "roastery_margin_pct" && v > 18) { v = 18; inp.value = 18; }
      state.cfg[inp.dataset.cfg] = v;
      mark_dirty();
      render_results();
    });
  });
  document.querySelectorAll("[data-pkg]").forEach(inp => {
    inp.addEventListener("input", () => {
      state.pkg[inp.dataset.pkg] = Number(inp.value) || 0;
      mark_dirty();
      render_results();
    });
  });

  document.getElementById("save-btn")?.addEventListener("click", save);
}

function mark_dirty() {
  if (!state.dirty || state.err || state.flash_until) {
    state.dirty = true; state.err = ""; state.flash_until = 0;
    // Refresh just the actions row label without nuking input focus.
    const btn = document.getElementById("save-btn");
    const actions = btn?.parentElement;
    if (actions) {
      actions.querySelector(".dirty")?.remove();
      actions.querySelector(".save-flash")?.remove();
      actions.querySelector(".save-err")?.remove();
      if (!actions.querySelector(".dirty")) {
        const span = document.createElement("span");
        span.className = "dirty"; span.textContent = "Unsaved changes";
        actions.appendChild(span);
      }
    }
  }
}

async function save() {
  state.saving = true; state.err = ""; render();
  const now = new Date().toISOString();

  const { error: e1 } = await supabaseClient.from("pricing_settings").upsert({
    id: 1,
    target_low_pct:      state.cfg.target_low_pct,
    target_high_pct:     state.cfg.target_high_pct,
    updated_at: now,
  }, { onConflict: "id" });

  const pkg_payload = SIZES.map(s => ({ bag_size: s.label, cost: Number(state.pkg[s.label]) || 0, updated_at: now }));
  const { error: e2 } = await supabaseClient.from("pricing_packaging").upsert(pkg_payload, { onConflict: "bag_size" });

  state.saving = false;
  if (e1 || e2) { state.err = (e1 || e2).message; state.dirty = true; render(); return; }
  state.dirty = false;
  state.flash_until = Date.now() + 2000;
  render();
  setTimeout(() => { if (Date.now() >= state.flash_until) { state.flash_until = 0; render(); } }, 2100);
}
</script>
