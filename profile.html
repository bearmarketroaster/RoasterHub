<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RoasterHub — Query Profiler (temporary)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f4f2ed; color:#1a1a1a; margin:0; padding:24px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .hint { color:#666; font-size:13px; margin:0 0 18px; }
  .card { background:#fff; border:1px solid #e8e6e1; border-radius:12px; padding:18px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#666; border-bottom:1px solid #e8e6e1; padding:8px 6px; }
  td { padding:9px 6px; border-bottom:1px solid #f0eee9; font-variant-numeric: tabular-nums; }
  td.n { text-align:right; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; }
  .slow { color:#dc2626; font-weight:700; }
  .warn { background:#fff7ed; border:1px solid #f5d9b8; border-radius:8px; padding:10px 12px; font-size:13px; margin-top:12px; }
  .total { font-size:16px; font-weight:700; margin-top:14px; }
  button { background:#1a1a1a; color:#fff; border:0; border-radius:8px; padding:12px 20px; font-size:15px; font-weight:600; cursor:pointer; }
  #status { font-size:14px; color:#666; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Query Profiler</h1>
  <p class="hint">Temporary diagnostic page — times each query <span class="mono">load_data()</span> runs on the Roastery Trace page. Delete this file when we're done.</p>
  <div class="card">
    <div id="status">Checking session…</div>
    <div id="out"></div>
  </div>
  <div class="card">
    <button id="again">Run again</button>
  </div>
</div>

<script>
const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

// Exactly the nine queries load_data() issues, in the same shape.
const QUERIES = {
  coffees:          () => supabaseClient.from("coffees").select("id, name, retired_at").order("name"),
  fp_codes:         () => supabaseClient.from("fp_codes").select("fp_code, bag_size, retired_at, coffees(name, retired_at)").order("fp_code"),
  fp_assignments:   () => supabaseClient.from("fp_assignments").select("fp_code, coffee_id, bag_size, effective_start, effective_end, coffees(name)"),
  shop_mappings:    () => supabaseClient.from("shop_mappings").select("parsed_name, master_name, shop_qr_id, kind"),
  buckets:          () => supabaseClient.from("buckets").select("*").order("created_at", { ascending: false }),
  roast_sessions:   () => supabaseClient.from("roast_sessions").select("id, coffee, date, container_id, roasted_weight, fill_id").order("date", { ascending: false }),
  containers:       () => supabaseClient.from("containers").select("id, status, status_changed_at, retired_at").is("retired_at", null),
  dispatches:       () => supabaseClient.from("dispatches").select("*, dispatch_lines(*)").order("date", { ascending: false }),
  dispatch_buckets: () => supabaseClient.from("dispatch_buckets").select("bucket_id, dispatch_id, scanned_at").order("scanned_at", { ascending: false }),
};

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

async function run() {
  const status = document.getElementById("status");
  const out = document.getElementById("out");
  out.innerHTML = "";

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    status.innerHTML = 'Not logged in. Open <span class="mono">login.html</span> in this same browser first, then reload this page.';
    return;
  }
  status.textContent = "Running…";

  // Sequential, so each query's own cost is visible (load_data runs them in parallel).
  const rows = [];
  for (const [name, fn] of Object.entries(QUERIES)) {
    const t0 = performance.now();
    let data = null, err = null;
    try { const r = await fn(); data = r.data; err = r.error; } catch (e) { err = e; }
    rows.push({
      name,
      ms: Math.round(performance.now() - t0),
      rows: data ? data.length : null,
      kb: data ? Math.round(JSON.stringify(data).length / 1024) : 0,
      err: err ? (err.message || String(err)) : null,
    });
  }

  // Then the real thing: all nine in one parallel batch.
  const t0 = performance.now();
  await Promise.all(Object.values(QUERIES).map(fn => fn()));
  const parallel_ms = Math.round(performance.now() - t0);

  rows.sort((a, b) => b.ms - a.ms);
  const sequential_ms = rows.reduce((a, r) => a + r.ms, 0);
  const capped = rows.filter(r => r.rows === 1000);

  out.innerHTML = `
    <table>
      <thead><tr><th>Query</th><th class="n">ms</th><th class="n">Rows</th><th class="n">KB</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td class="mono">${esc(r.name)}${r.err ? ` <span class="slow">${esc(r.err)}</span>` : ""}</td>
          <td class="n ${r.ms >= 400 ? "slow" : ""}">${r.ms}</td>
          <td class="n ${r.rows === 1000 ? "slow" : ""}">${r.rows == null ? "—" : r.rows}</td>
          <td class="n">${r.kb}</td>
        </tr>`).join("")}
      </tbody>
    </table>
    <div class="total">Parallel batch (what a save actually waits for): ${parallel_ms} ms</div>
    <div class="hint" style="margin:4px 0 0">Sum if run one-by-one: ${sequential_ms} ms</div>
    ${capped.length ? `<div class="warn"><strong>Row cap hit:</strong> ${capped.map(c => esc(c.name)).join(", ")} returned exactly 1000 rows — Supabase's default limit. These are silently truncating history and need pagination.</div>` : ""}
  `;
  status.textContent = "Done.";
}

document.getElementById("again").addEventListener("click", run);
run();
</script>
</body>
</html>
