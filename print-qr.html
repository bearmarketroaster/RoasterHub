<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print QR Codes — Bear Mrkt</title>
  <link rel="icon" type="image/png" href="bear-icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #fafaf8; min-height: 100vh; color: #1a1a1a; }
    .toolbar { background: #1a1a1a; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; position: sticky; top: 0; z-index: 10; }
    .toolbar-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .toolbar-back { background: none; border: none; color: #ccc; font-size: 13px; cursor: pointer; }
    .toolbar-back:hover { color: #fff; }
    .toolbar-title { font-weight: 700; font-size: 16px; }
    .toolbar-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .toolbar label { font-size: 12px; color: #999; margin-right: 4px; }
    .toolbar select, .toolbar input { background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; font-size: 13px; font-family: inherit; }
    .toolbar select option { background: #1a1a1a; color: #fff; }
    .btn-print { background: #fff; color: #1a1a1a; border: none; border-radius: 6px; padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
    .btn-print:hover { background: #e8e6e1; }
    .size-preset { background: #2a2a2a; color: #ccc; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; transition: all 0.15s; }
    .size-preset:hover { background: #fff; color: #1a1a1a; border-color: #fff; }
    .mode-toggle { display: flex; gap: 0; background: #2a2a2a; border-radius: 6px; padding: 2px; }
    .mode-toggle button { background: transparent; color: #ccc; border: none; padding: 4px 12px; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 4px; transition: all 0.15s; }
    .mode-toggle button.active { background: #fff; color: #1a1a1a; }
    .picker { background: #fff; padding: 16px 24px; border-bottom: 1px solid #e8e6e1; }
    .sheet { padding: 20px; max-width: 1100px; margin: 0 auto; }
    .help-line { text-align: center; color: #666; font-size: 13px; margin-bottom: 14px; }

    /* SHEET MODE — grid of tiles, multiple per A4 page */
    body.mode-sheet .qr-grid { display: grid; gap: var(--gap, 10px); grid-template-columns: repeat(auto-fill, minmax(var(--qr-size, 140px), max-content)); justify-content: center; }
    body.mode-sheet .qr-tile { background: #fff; border: 1px dashed #d4d1ca; padding: 10px; text-align: center; border-radius: 4px; break-inside: avoid; transition: border-color 0.15s, transform 0.1s; cursor: pointer; position: relative; }
    body.mode-sheet .qr-tile:hover { border-color: #1a1a1a; border-style: solid; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    body.mode-sheet .qr-tile .qr-canvas { width: var(--qr-size, 140px); height: var(--qr-size, 140px); margin: 0 auto; }
    body.mode-sheet .qr-tile .qr-canvas img, body.mode-sheet .qr-tile .qr-canvas canvas { width: 100% !important; height: 100% !important; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; image-rendering: pixelated; }
    body.mode-sheet .qr-label { margin-top: 6px; line-height: 1.2; }
    body.mode-sheet .qr-label-primary { font-weight: 700; font-size: var(--qr-label-primary-size, 11pt); color: #1a1a1a; word-break: break-word; }
    body.mode-sheet .qr-label-secondary { font-size: var(--qr-label-secondary-size, 8pt); color: #666; margin-top: 2px; word-break: break-word; }

    /* SINGLE-LABEL MODE — each tile is a preview of a 105×150mm label */
    body.mode-single .qr-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    body.mode-single .qr-tile { background: #fff; border: 1px solid #e8e6e1; border-radius: 6px; padding: 10px; cursor: pointer; transition: all 0.15s; position: relative; }
    body.mode-single .qr-tile:hover { border-color: #1a1a1a; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    /* The label-frame mimics the printed sticker (105×150mm) at a screen-friendly scale */
    body.mode-single .label-frame { aspect-ratio: 105 / 150; background: #fff; border: 1px dashed #d4d1ca; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8% 4%; }
    body.mode-single .label-frame .qr-canvas { width: 75%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
    body.mode-single .label-frame.fp-mode .qr-canvas { width: 90%; }
    body.mode-single .label-frame .qr-canvas img, body.mode-single .label-frame .qr-canvas canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; }
    body.mode-single .label-frame .label-primary { font-weight: 700; font-size: 12px; color: #1a1a1a; text-align: center; margin-top: 6px; word-break: break-word; line-height: 1.15; }
    body.mode-single .label-frame .label-secondary { font-size: 9px; color: #666; text-align: center; margin-top: 2px; word-break: break-word; }
    /* On-screen-only descriptor — never prints */
    body.mode-single .tile-descriptor { font-size: 11px; color: #666; text-align: center; margin-top: 8px; padding-top: 6px; border-top: 1px solid #f0eee9; }
    body.mode-single .tile-descriptor strong { color: #1a1a1a; font-weight: 600; }

    /* A4 21-UP MODE — OnlineLabels EU30015GM / Avery L7160 spec.
       21 labels per sheet (3 cols × 7 rows), 63.5mm × 38.1mm each.
       Top/bottom margin: 15.15mm · Left/right margin: 7.21mm
       Horizontal gap between columns: 2.54mm · No vertical gap.
       Verified: 15.15 + 7×38.1 + 15.15 = 297mm (A4 height)
                  7.21 + 3×63.5 + 2×2.54 + 7.21 = 210mm (A4 width)
       Uses absolute positioning in mm so the layout can't drift or stretch.
       Label N (0..20): row = floor(N/3), col = N%3
       top  = 15.15mm + row × 38.1mm
       left = 7.21mm  + col × 66.04mm  (66.04 = 63.5 label + 2.54 gap) */
    body.mode-a4_21 .a4-sheet {
      width: 210mm;
      height: 297mm;
      background: #fff;
      margin: 20px auto;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }
    body.mode-a4_21 .bag-label {
      position: absolute;
      width: 63.5mm;
      height: 38.1mm;
      background: #fff;
      border: 1px dashed #e8e6e1;     /* dashed border for screen preview only — hidden in print */
      box-sizing: border-box;
      padding: 2mm 2.5mm;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #1a1a1a;
    }
    body.mode-a4_21 .bag-label .bl-name {
      font-weight: 900;
      font-size: 14pt;
      line-height: 1;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      max-width: 31mm;     /* leaves room for the bigger QR top-right */
      word-break: break-word;
    }
    body.mode-a4_21 .bag-label .bl-roast {
      font-weight: 700;
      font-size: 7pt;
      margin-top: 0.5mm;
      letter-spacing: 0.02em;
    }
    body.mode-a4_21 .bag-label .bl-origin {
      position: absolute;
      left: 2.5mm;
      top: 18mm;
      font-size: 6pt;
      line-height: 1.25;
      font-weight: 400;
    }
    body.mode-a4_21 .bag-label .bl-flavours {
      position: absolute;
      left: 2.5mm;
      bottom: 2mm;
      right: 16mm;            /* leaves room for price */
      font-size: 6pt;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    body.mode-a4_21 .bag-label .bl-price {
      position: absolute;
      right: 2.5mm;
      bottom: 1.5mm;
      font-size: 10pt;
      font-weight: 400;
    }
    body.mode-a4_21 .bag-label .bl-qr {
      position: absolute;
      right: 2.5mm;
      top: 2mm;
      width: 26mm;
      height: 26mm;
    }
    body.mode-a4_21 .bag-label .bl-qr img,
    body.mode-a4_21 .bag-label .bl-qr canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      image-rendering: auto;     /* composite rendered at high-res, so smooth scaling keeps the centre image clean */
    }

    .pdf-btn { position: absolute; top: 4px; right: 4px; background: rgba(255,255,255,0.95); border: 1px solid #e8e6e1; border-radius: 4px; padding: 3px 8px; font-size: 11px; font-weight: 600; cursor: pointer; color: #1a1a1a; opacity: 0; transition: opacity 0.15s; }
    .qr-tile:hover .pdf-btn { opacity: 1; }
    .pdf-btn:hover { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    .empty { text-align: center; padding: 60px 20px; color: #999; }

    /* ── PRINT STYLES ────────────────────────────────────────────────────── */
    @media print {
      .toolbar, .picker, .help-line { display: none !important; }
      body { background: #fff; }
      .sheet { padding: 0; max-width: none; }
    }

    /* Single-label print: page is exactly the sticker — 105×150mm portrait.
       We use absolute positioning in mm units so sizes land precisely
       regardless of printer driver quirks (flexbox + aspect-ratio were unreliable). */
    @media print {
      body.mode-single { margin: 0; padding: 0; }
      body.mode-single .qr-grid { display: block; gap: 0; padding: 0; margin: 0; text-align: left; }
      body.mode-single .qr-tile { border: none !important; padding: 0 !important; margin: 0 !important; box-shadow: none !important; width: 104mm !important; page-break-after: always; break-after: page; }
      body.mode-single .qr-tile:last-child { page-break-after: auto; break-after: auto; }

      /* The label-frame becomes a 104×150mm canvas, pinned to the top-left of the page
         (matches the ZD230's 104mm printhead). Left-pinning means that even if the browser
         renders onto an oversized page, the whole label stays inside the printable strip. */
      body.mode-single .label-frame {
        position: relative;
        width: 104mm;
        height: 150mm;
        margin: 0 !important;
        aspect-ratio: auto;
        border: none !important;
        padding: 0 !important;
        display: block;     /* override flex */
        overflow: hidden;
      }

      /* QR: 75mm square, centred horizontally, sitting in the upper portion of the label */
      body.mode-single .label-frame .qr-canvas {
        position: absolute;
        left: 17mm;        /* (104 - 70) / 2 — centred with 17mm clear each side */
        top: 12mm;
        width: 70mm;
        height: 70mm;
        display: block;
      }
      body.mode-single .label-frame.fp-mode .qr-canvas {
        left: 7mm;          /* (104 - 90) / 2 */
        top: 27.5mm;
        width: 90mm;
        height: 90mm;
      }
      /* Force the QR image inside to fill its container */
      body.mode-single .label-frame .qr-canvas img,
      body.mode-single .label-frame .qr-canvas canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        image-rendering: pixelated;
      }

      /* Primary text — large, centred, sits below the QR */
      body.mode-single .label-frame .label-primary {
        position: absolute;
        left: 0;
        right: 0;
        top: 100mm;        /* QR ends at 12 + 75 = 87mm; gap, then text */
        text-align: center;
        font-size: 22pt;
        font-weight: 700;
        color: #1a1a1a;
        line-height: 1.1;
        padding: 0 4mm;
        margin: 0;
      }
      /* Secondary text — smaller, below primary */
      body.mode-single .label-frame .label-secondary {
        position: absolute;
        left: 0;
        right: 0;
        top: 118mm;
        text-align: center;
        font-size: 13pt;
        color: #1a1a1a;
        line-height: 1.1;
        padding: 0 4mm;
        margin: 0;
      }

      body.mode-single .tile-descriptor { display: none !important; }
      body.mode-single .pdf-btn { display: none !important; }
      /* Hide other tiles when printing a single one */
      body.mode-single.print-single .qr-tile:not(.printing-only) { display: none !important; }
    }
    /* The @page rule must be at the top level of the stylesheet (not nested in @media block in some browsers) */
    @page single-label { size: 105mm 150mm; margin: 0; }
    /* Page size is set dynamically per mode via JS (apply_print_page_size).
       Named @page + the `page:` property is unreliable in Chrome and was causing
       single labels to fall back to A4 (clipping the right side). */

    /* Sheet print: A4 default, tiles stack naturally */
    @media print {
      body.mode-sheet .qr-tile { border: none; padding: 4px; }
      body.mode-sheet.print-single .qr-tile:not(.printing-only) { display: none !important; }
      body.mode-sheet .pdf-btn { display: none !important; }
    }

    /* A4 21-up print: page is A4 portrait, sheet sized to fit exactly.
       Hide the screen-only dashed borders on labels. */
    @page a4-21 { size: A4 portrait; margin: 0; }
    @media print {
      body.mode-a4_21 { margin: 0; padding: 0; background: #fff; }
      body.mode-a4_21 .sheet { padding: 0 !important; }
      body.mode-a4_21 .a4-sheet { margin: 0 !important; box-shadow: none !important; page-break-after: always; break-after: page; }
      body.mode-a4_21 .a4-sheet:last-child { page-break-after: auto; break-after: auto; }
      body.mode-a4_21 .bag-label { border: none !important; }
    }
  </style>
</head>
<body class="mode-single">
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="toolbar-back" id="go-back">← Back</button>
      <div class="toolbar-title">🖨️ QR Code Printer</div>
    </div>
    <div class="toolbar-controls">
      <div class="mode-toggle">
        <button data-mode="single" class="active">Single Label</button>
        <button data-mode="sheet">Sheet</button>
        <button data-mode="a4_21">A4 21-up Bag Stickers</button>
      </div>
      <label>Type</label>
      <select id="type-select">
        <option value="bucket">Buckets</option>
        <option value="container">Containers</option>
        <option value="fp">Bag Labels (FP codes)</option>
        <option value="shop">Shops</option>
      </select>
      <div id="size-controls" style="display:none;align-items:center;gap:8px">
        <label>Size (mm)</label>
        <input type="number" id="size-input" value="38" min="10" max="120" step="1" style="width:64px" />
        <div style="display:flex;gap:4px">
          <button class="size-preset" data-size="20">20</button>
          <button class="size-preset" data-size="30">30</button>
          <button class="size-preset" data-size="40">40</button>
          <button class="size-preset" data-size="60">60</button>
          <button class="size-preset" data-size="80">80</button>
        </div>
      </div>
      <div id="a4-21-controls" style="display:none;align-items:center;gap:8px">
        <label>FP Code</label>
        <select id="a4-21-fp-select" style="min-width:240px"></select>
        <label style="display:flex;align-items:center;gap:5px;margin-left:6px;cursor:pointer;color:#ccc">
          <input type="checkbox" id="hide-price-toggle" style="width:auto;margin:0" /> Hide pricing
        </label>
      </div>
      <button class="btn-print" id="print-btn">🖨️ Print All</button>
    </div>
  </div>

  <div class="picker" id="picker"></div>
  <div class="sheet">
    <p class="help-line" id="help-line">💡 Click any QR tile to print just that one · Hover for PDF download · Or "Print All" for the whole batch</p>
    <div id="grid" class="qr-grid"></div>
  </div>

  <script>
    const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) { window.location.href = "login.html"; return; }
      const { data: role_row } = await supabaseClient.from("user_roles").select("role").eq("user_id", session.user.id).maybeSingle();
      const role = role_row?.role;
      if (role !== "admin" && role !== "packer") { window.location.href = "reports.html"; return; }
      init();
    });

    const url_params = new URLSearchParams(window.location.search);
    const init_type  = url_params.get("type") || "bucket";
    const init_ids   = url_params.get("ids") ? url_params.get("ids").split(",") : null;

    const state = {
      mode: "single",       // "single" = ZD230 label / "sheet" = A4 grid / "a4_21" = 21-up A4 bag stickers
      type: init_type,
      size_mm: 38,
      coffee_filter: "all",
      prefix_filter: "all",
      added_since: "",       // bucket print: only show buckets created on/after this date
      print_status: "unprinted", // bucket print: unprinted | printed | all
      picker_touched: false,
      buckets: [],
      containers: [],
      fp_codes: [],
      shops: [],
      fp_label_data: {},     // { [fp_code]: { roast_type, region, process, ..., price } }
      hide_price: false,     // A4 bag labels: omit the price when printing
      selected_ids: new Set(init_ids || []),
      a4_21_fp: null,        // currently selected FP code for A4 21-up mode
    };

    async function init() {
      document.getElementById("type-select").value = state.type;
      document.getElementById("go-back").addEventListener("click", () => {
        window.location.href = "settings.html";
      });
      // Set a plain @page size for the active mode right before printing.
      // (Reliable in Chrome, unlike the named @page rules that broke.)
      function apply_print_page_size() {
        const PAGE = {
          single: "@page { size: 104mm 150mm; margin: 0; }",
          sheet:  "@page { size: A4; margin: 10mm; }",
          a4_21:  "@page { size: A4 portrait; margin: 0; }",
        };
        let st = document.getElementById("dynamic-page-size");
        if (!st) { st = document.createElement("style"); st.id = "dynamic-page-size"; document.head.appendChild(st); }
        st.textContent = PAGE[state.mode] || "@page { size: A4; margin: 10mm; }";
      }
      window.addEventListener("beforeprint", apply_print_page_size);  // covers Ctrl+P, Ctrl+Shift+P, and the button
      apply_print_page_size();
      document.getElementById("print-btn").addEventListener("click", () => { apply_print_page_size(); window.print(); });

      // Mode toggle
      document.querySelectorAll("[data-mode]").forEach(btn => btn.addEventListener("click", () => {
        const mode = btn.dataset.mode;
        if (mode === state.mode) return;
        state.mode = mode;
        document.body.classList.remove("mode-single", "mode-sheet", "mode-a4_21");
        document.body.classList.add(`mode-${mode}`);
        document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
        document.getElementById("size-controls").style.display = mode === "sheet" ? "flex" : "none";
        document.getElementById("a4-21-controls").style.display = mode === "a4_21" ? "flex" : "none";
        // A4 21-up is FP-only — lock the type to FP when entering this mode
        if (mode === "a4_21") {
          state.type = "fp";
          document.getElementById("type-select").value = "fp";
          state.coffee_filter = "all";
        }
        render_picker();
        if (mode === "a4_21") render_a4_21_sheet();
        else render_grid();
      }));

      document.getElementById("type-select").addEventListener("change", e => {
        state.type = e.target.value;
        state.selected_ids = new Set();
        state.coffee_filter = "all";
        state.prefix_filter = "all";
        state.picker_touched = true;
        render_picker(); render_grid();
      });
      const sizeInput = document.getElementById("size-input");
      sizeInput.addEventListener("input", e => {
        const v = Number(e.target.value);
        if (v >= 10 && v <= 120) { state.size_mm = v; render_grid(); }
      });
      document.querySelectorAll(".size-preset").forEach(btn => btn.addEventListener("click", () => {
        const v = Number(btn.dataset.size);
        state.size_mm = v;
        sizeInput.value = v;
        render_grid();
      }));

      const [{ data: buckets }, { data: containers }, { data: fp_codes }, { data: shop_mappings }, { data: fp_label_data }, { data: fp_assignments }] = await Promise.all([
        supabaseClient.from("buckets").select("id, name, retired_at, created_at, label_printed_at").order("created_at", { ascending: false }),
        supabaseClient.from("containers").select("id, name, retired_at").order("id"),
        supabaseClient.from("fp_codes").select("fp_code, bag_size, retired_at, coffees(name, retired_at)").order("fp_code"),
        supabaseClient.from("shop_mappings").select("master_name, shop_qr_id").order("master_name"),
        supabaseClient.from("fp_label_data").select("*"),
        supabaseClient.from("fp_assignments").select("id, fp_code, effective_end").order("fp_code"),
      ]);
      state.buckets = (buckets||[]).filter(b => !b.retired_at).sort((a,b)=>{ const n=x=>{const m=String(x.name||x.id||"").match(/(\d+)\s*$/);return m?+m[1]:Infinity;}; return n(a)-n(b)||String(a.name||a.id).localeCompare(String(b.name||b.id)); });
      state.containers = (containers||[]).filter(c => !c.retired_at);
      // Print/label workflows are forward-only — never need retired FPs or retired coffees.
      // Filter out: retired FP codes, AND any FP whose parent coffee is retired.
      state.fp_codes = (fp_codes||[])
        .filter(f => !f.retired_at)
        .filter(f => !f.coffees?.retired_at)
        .map(f => ({ id: f.fp_code, label: `${f.coffees?.name||""} ${f.bag_size}`, coffee_name: f.coffees?.name||"", bag_size: f.bag_size||"" }));
      // Labels are per-version. A fresh print uses the OPEN version's label, so map
      // each fp_code to the label row whose assignment is the current/open one.
      const open_aid_by_fp = {};
      (fp_assignments||[]).forEach(a => { if (a.effective_end == null) open_aid_by_fp[a.fp_code] = a.id; });
      state.fp_label_data = {};
      (fp_label_data||[]).forEach(r => {
        if (r.assignment_id != null && r.assignment_id === open_aid_by_fp[r.fp_code]) {
          state.fp_label_data[r.fp_code] = r;
        }
      });
      const shop_seen = new Set();
      state.shops = (shop_mappings||[]).filter(s => {
        if (!s.shop_qr_id || shop_seen.has(s.master_name)) return false;
        shop_seen.add(s.master_name);
        return true;
      }).map(s => ({ id: s.shop_qr_id, label: s.master_name, master_name: s.master_name }));

      if (!(init_ids && init_ids.length)) {
        const all = state.type === "bucket"    ? state.buckets.map(b => b.id)
                  : state.type === "container" ? state.containers.map(c => c.id)
                  : state.type === "shop"      ? state.shops.map(s => s.id)
                  : state.fp_codes.map(f => f.id);
        state.selected_ids = new Set(all);
      }

      // Populate the A4 21-up FP picker (grouped by coffee for readability)
      populate_a4_21_fp_select();
      document.getElementById("a4-21-fp-select").addEventListener("change", e => {
        state.a4_21_fp = e.target.value || null;
        render_a4_21_sheet();
      });
      document.getElementById("hide-price-toggle").addEventListener("change", e => {
        state.hide_price = e.target.checked;
        render_a4_21_sheet();
      });

      render_picker();
      render_grid();
    }

    function populate_a4_21_fp_select() {
      const sel = document.getElementById("a4-21-fp-select");
      if (!sel) return;
      // Filter: exclude Bar 5kg (not a retail bag)
      const items = state.fp_codes.filter(f => f.bag_size && f.bag_size.toLowerCase() !== "bar 5kg");
      // Group by coffee
      const by_coffee = {};
      items.forEach(f => {
        const cn = f.coffee_name || "Unknown";
        if (!by_coffee[cn]) by_coffee[cn] = [];
        by_coffee[cn].push(f);
      });
      const opts = ['<option value="">— pick FP code —</option>'];
      Object.keys(by_coffee).sort().forEach(cn => {
        opts.push(`<optgroup label="${esc_attr(cn)}">`);
        by_coffee[cn].forEach(f => {
          opts.push(`<option value="${esc_attr(f.id)}">${esc(f.id)} · ${esc(f.bag_size)}</option>`);
        });
        opts.push("</optgroup>");
      });
      sel.innerHTML = opts.join("");
    }

    function render_picker() {
      const el = document.getElementById("picker");
      const type_label = state.type === "bucket" ? "buckets" : state.type === "container" ? "containers" : state.type === "shop" ? "shops" : "FP codes";
      const all_items = state.type === "bucket"
        ? state.buckets.map(b => ({ id: b.id, label: b.id, name: b.name, created_at: b.created_at, label_printed_at: b.label_printed_at }))
        : state.type === "container"
        ? state.containers.map(c => ({ id: c.id, label: c.id }))
        : state.type === "shop"
        ? state.shops
        : state.fp_codes;
      if (all_items.length === 0) {
        el.innerHTML = `<p style="color:#999;font-size:13px;font-style:italic">No ${type_label} available.</p>`;
        return;
      }

      let coffee_filter_html = "";
      if (state.type === "fp") {
        const coffees = [...new Set(state.fp_codes.map(f => f.coffee_name).filter(Boolean))].sort();
        if (coffees.length > 1) {
          coffee_filter_html = `
            <select id="coffee-filter" style="font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid #e8e6e1;background:#fff;color:#1a1a1a;min-width:200px">
              <option value="all" ${state.coffee_filter==="all"?"selected":""}>All coffees</option>
              ${coffees.map(c => `<option value="${c.replace(/"/g,'&quot;')}" ${state.coffee_filter===c?"selected":""}>${c}</option>`).join("")}
            </select>`;
        }
      }

      let prefix_filter_html = "";
      if (state.type === "bucket") {
        const prefixes = [...new Set(state.buckets.map(b => bucket_prefix(b.name)).filter(Boolean))].sort();
        if (prefixes.length > 1) {
          prefix_filter_html = `
            <select id="prefix-filter" style="font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid #e8e6e1;background:#fff;color:#1a1a1a;min-width:200px">
              <option value="all" ${state.prefix_filter==="all"?"selected":""}>All bucket types</option>
              ${prefixes.map(p => `<option value="${p.replace(/"/g,'&quot;')}" ${state.prefix_filter===p?"selected":""}>${p}</option>`).join("")}
            </select>`;
        }
      }

      let date_filter_html = "";
      if (state.type === "bucket") {
        const newest = state.buckets.reduce((m, b) => (b.created_at && b.created_at > m ? b.created_at : m), "");
        date_filter_html = `
          <label style="font-size:13px;color:#666;display:flex;align-items:center;gap:6px">Added on/after
            <input type="date" id="added-since" value="${state.added_since || ""}" style="font-size:13px;padding:5px 8px;border-radius:6px;border:1px solid #e8e6e1;background:#fff;color:#1a1a1a" />
          </label>
          ${state.added_since ? `<button id="added-clear" style="font-size:12px;background:none;border:none;color:#2563eb;cursor:pointer;text-decoration:underline">clear</button>` : (newest ? `<span style="font-size:12px;color:#999">latest batch: ${esc(newest.slice(0,10))}</span>` : "")}`;
      }

      let print_status_html = "";
      if (state.type === "bucket") {
        const unprinted_n = state.buckets.filter(b => !b.label_printed_at).length;
        print_status_html = `
          <select id="print-status" style="font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid #e8e6e1;background:#fff;color:#1a1a1a">
            <option value="unprinted" ${state.print_status==="unprinted"?"selected":""}>🆕 Unprinted only (${unprinted_n})</option>
            <option value="printed" ${state.print_status==="printed"?"selected":""}>Already printed</option>
            <option value="all" ${state.print_status==="all"?"selected":""}>All</option>
          </select>`;
      }

      let items = all_items;
      if (state.type === "fp" && state.coffee_filter !== "all") items = items.filter(i => i.coffee_name === state.coffee_filter);
      if (state.type === "bucket" && state.prefix_filter !== "all") items = items.filter(i => bucket_prefix(i.name) === state.prefix_filter);
      if (state.type === "bucket" && state.added_since) items = items.filter(i => (i.created_at || "") >= state.added_since);
      if (state.type === "bucket" && state.print_status === "unprinted") items = items.filter(i => !i.label_printed_at);
      if (state.type === "bucket" && state.print_status === "printed") items = items.filter(i => i.label_printed_at);
      const no_filter_active = !(state.type === "fp" && state.coffee_filter !== "all") && !(state.type === "bucket" && (state.prefix_filter !== "all" || state.added_since));
      if (init_ids && init_ids.length && state.type === init_type && no_filter_active && !state.picker_touched) {
        items = items.filter(i => init_ids.includes(i.id));
      }

      state.selected_ids = new Set(items.map(i => i.id));

      el.innerHTML = `
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
          ${coffee_filter_html}
          ${prefix_filter_html}
          ${print_status_html}
          ${date_filter_html}
          <span style="font-size:12px;color:#666">${items.length} ${type_label.slice(0, -1)}${items.length!==1?"s":""} shown</span>
          ${state.type === "bucket" && items.length ? `<button id="mark-printed" style="font-size:13px;font-weight:700;background:#16a34a;color:#fff;border:none;border-radius:6px;padding:6px 12px;cursor:pointer">✓ Mark ${items.length} as printed</button>` : ""}
        </div>`;

      el.querySelector("#coffee-filter")?.addEventListener("change", e => {
        state.coffee_filter = e.target.value;
        state.picker_touched = true;
        render_picker(); render_grid();
      });
      el.querySelector("#prefix-filter")?.addEventListener("change", e => {
        state.prefix_filter = e.target.value;
        state.picker_touched = true;
        render_picker(); render_grid();
      });
      el.querySelector("#added-since")?.addEventListener("change", e => {
        state.added_since = e.target.value;
        state.picker_touched = true;
        render_picker(); render_grid();
      });
      el.querySelector("#added-clear")?.addEventListener("click", () => {
        state.added_since = "";
        state.picker_touched = true;
        render_picker(); render_grid();
      });
      el.querySelector("#print-status")?.addEventListener("change", e => {
        state.print_status = e.target.value;
        state.picker_touched = true;
        render_picker(); render_grid();
      });
      el.querySelector("#mark-printed")?.addEventListener("click", async (e) => {
        const ids = [...state.selected_ids];
        if (!ids.length) return;
        if (!confirm(`Mark ${ids.length} bucket label${ids.length>1?"s":""} as printed? They'll drop off the unprinted list.`)) return;
        const btn = e.target; btn.disabled = true; btn.textContent = "Saving…";
        const now = new Date().toISOString();
        const { error } = await supabaseClient.from("buckets").update({ label_printed_at: now }).in("id", ids);
        if (error) { alert("Couldn't mark printed: " + error.message); btn.disabled = false; return; }
        state.buckets.forEach(b => { if (ids.includes(b.id)) b.label_printed_at = now; });
        render_picker(); render_grid();
      });
    }

    // Render the A4 21-up bag-sticker sheet. Always exactly 21 labels, all the same FP code.
    function render_a4_21_sheet() {
      const grid = document.getElementById("grid");
      if (state.mode !== "a4_21") return;

      const fp_code = state.a4_21_fp;
      if (!fp_code) {
        grid.innerHTML = `<div class="empty">👈 Pick an FP code from the toolbar to generate a full A4 sheet of 21 bag stickers.</div>`;
        return;
      }
      const fp = state.fp_codes.find(f => f.id === fp_code);
      if (!fp) {
        grid.innerHTML = `<div class="empty">FP code not found.</div>`;
        return;
      }
      const label_data = state.fp_label_data[fp_code] || {};

      // Build a single bag-label HTML block (gets repeated 21 times)
      const flavours = [label_data.flavour_1, label_data.flavour_2, label_data.flavour_3].filter(Boolean).join(" · ");
      const origin_lines = [label_data.region, label_data.process, label_data.altitude].filter(Boolean);
      const label_inner = `
          <div class="bl-qr" data-value="${esc_attr(fp_code)}"></div>
          <div class="bl-name">${esc(fp.coffee_name || "")}</div>
          ${label_data.roast_type ? `<div class="bl-roast">${esc(label_data.roast_type)}</div>` : ""}
          ${origin_lines.length ? `<div class="bl-origin">${origin_lines.map(l => esc(l)).join("<br>")}</div>` : ""}
          ${flavours ? `<div class="bl-flavours">${esc(flavours)}</div>` : ""}
          ${label_data.price && !state.hide_price ? `<div class="bl-price">${esc(label_data.price)}</div>` : ""}`;
      // 21 copies (3 cols × 7 rows) — each positioned absolutely in mm.
      // OnlineLabels EU30015GM / Avery L7160 spec:
      // top  = 15.15mm + row × 38.1mm
      // left = 7.21mm  + col × 66.04mm  (66.04 = 63.5 label + 2.54 gap)
      const all_labels = [];
      for (let i = 0; i < 21; i++) {
        const row = Math.floor(i / 3);
        const col = i % 3;
        const top_mm  = 15.15 + row * 38.1;
        const left_mm = 7.21  + col * 66.04;
        all_labels.push(`<div class="bag-label" style="top:${top_mm}mm;left:${left_mm}mm">${label_inner}</div>`);
      }
      grid.innerHTML = `<div class="a4-sheet">${all_labels.join("")}</div>`;

      // One composite QR for this coffee (FP code encoded; origin image dropped in the centre if set),
      // then cloned into all 21 label slots. No image → plain full QR.
      const img_url = label_data.image_path
        ? supabaseClient.storage.from("label-images").getPublicUrl(label_data.image_path).data.publicUrl
        : null;
      composite_qr_dataurl(fp_code, img_url).then(dataurl => {
        grid.querySelectorAll(".bl-qr").forEach(el => { el.innerHTML = `<img src="${dataurl}" alt="QR" />`; });
      });
    }

    // ── Artistic QR: encode `text`, drop `imgUrl` into the centre (rounded, knocked-out). Returns a PNG data URL.
    // Falls back to a plain full QR if there's no image or the image fails to load.
    function _roundRectPath(ctx, x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
    function _drawCover(ctx, img, x, y, w, h) {
      const ir = img.width / img.height, br = w / h;
      let sw, sh, sx, sy;
      if (ir > br) { sh = img.height; sw = sh * br; sx = (img.width - sw) / 2; sy = 0; }
      else { sw = img.width; sh = sw / br; sx = 0; sy = (img.height - sh) / 2; }
      ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    }
    function _loadImg(url) {
      return new Promise((res, rej) => { const im = new Image(); im.crossOrigin = "anonymous"; im.onload = () => res(im); im.onerror = rej; im.src = url; });
    }
    async function composite_qr_dataurl(text, imgUrl) {
      const SZ = 1000, CENTRE = 0.33, PAD = 0.08, RAD = 0.18;
      const holder = document.createElement("div");
      new window.QRCode(holder, { text, width: SZ, height: SZ, colorDark: "#1a1a1a", colorLight: "#ffffff", correctLevel: window.QRCode.CorrectLevel.H });
      const out = document.createElement("canvas"); out.width = SZ; out.height = SZ;
      const ctx = out.getContext("2d");
      const qc = holder.querySelector("canvas");
      if (qc) ctx.drawImage(qc, 0, 0, SZ, SZ);
      else { const im = holder.querySelector("img"); await new Promise(r => { if (im.complete) r(); else im.onload = r; }); ctx.drawImage(im, 0, 0, SZ, SZ); }
      if (imgUrl) {
        try {
          const img = await _loadImg(imgUrl);
          const s = SZ * CENTRE, x = (SZ - s) / 2, y = (SZ - s) / 2, pad = s * PAD, r = s * RAD;
          ctx.save(); _roundRectPath(ctx, x - pad, y - pad, s + pad * 2, s + pad * 2, r + pad); ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.restore();
          ctx.save(); _roundRectPath(ctx, x, y, s, s, r); ctx.clip(); _drawCover(ctx, img, x, y, s, s); ctx.restore();
          ctx.save(); _roundRectPath(ctx, x, y, s, s, r); ctx.lineWidth = Math.max(2, s * 0.012); ctx.strokeStyle = "#1a1a1a"; ctx.stroke(); ctx.restore();
        } catch (e) { console.warn("Centre image failed to load; using plain QR.", e); }
      }
      return out.toDataURL("image/png");
    }

    function render_grid() {
      const grid = document.getElementById("grid");
      const items = state.type === "bucket"
        ? state.buckets.filter(b => state.selected_ids.has(b.id)).map(b => ({ id: b.id, value: b.id, label: b.id, name: b.name }))
        : state.type === "container"
        ? state.containers.filter(c => state.selected_ids.has(c.id)).map(c => ({ id: c.id, value: c.id, label: c.id, name: c.name }))
        : state.type === "shop"
        ? state.shops.filter(s => state.selected_ids.has(s.id)).map(s => ({ id: s.id, value: `${window.location.origin}${window.location.pathname.replace(/[^/]*$/, "")}delivery-confirm.html?scan=${s.id}`, label: s.label, master_name: s.master_name }))
        : state.fp_codes.filter(f => state.selected_ids.has(f.id)).map(f => ({ id: f.id, value: f.id, label: f.label, coffee_name: f.coffee_name, bag_size: f.bag_size }));

      if (items.length === 0) {
        grid.innerHTML = `<div class="empty">Nothing to show. Try changing the filter above.</div>`;
        return;
      }

      // Sheet mode size variables (only used in sheet mode)
      grid.style.setProperty("--qr-size", state.size_mm + "mm");
      grid.style.setProperty("--qr-label-primary-size", Math.max(8, Math.round(state.size_mm / 4)) + "pt");
      grid.style.setProperty("--qr-label-secondary-size", Math.max(6, Math.round(state.size_mm / 6)) + "pt");
      grid.style.setProperty("--gap", Math.max(2, Math.round(state.size_mm / 8)) + "mm");

      grid.innerHTML = items.map((it, idx) => {
        // Per-type descriptor (on-screen + printed sticker, except FP where it's screen-only)
        const tip = state.type === "bucket"
          ? (it.name ? `${it.name} (${it.id})` : it.id)
          : state.type === "container"
          ? (it.name ? `${it.id} — ${it.name}` : it.id)
          : state.type === "shop"
          ? `${it.master_name} (${it.id})`
          : `${it.id} · ${it.coffee_name || ""} ${it.bag_size || ""}`.trim();

        let primary = "", secondary = "";
        if (state.type === "container")     { primary = it.id; secondary = it.name || ""; }
        else if (state.type === "bucket")   { primary = it.name || it.id; secondary = it.name ? it.id : ""; }
        else if (state.type === "shop")     { primary = it.master_name; secondary = ""; }
        else /* fp */                       { primary = it.id; secondary = ""; }   // FP: never printed
        const is_fp = state.type === "fp";

        if (state.mode === "single") {
          // Single-label tile (mimics 105×150mm label) + on-screen descriptor (never prints)
          const sticker_html = is_fp
            ? `<div class="label-frame fp-mode"><div class="qr-canvas" data-value="${esc_attr(it.value)}"></div></div>`
            : `<div class="label-frame">
                 <div class="qr-canvas" data-value="${esc_attr(it.value)}"></div>
                 ${primary ? `<div class="label-primary">${esc(primary)}</div>` : ""}
                 ${secondary ? `<div class="label-secondary">${esc(secondary)}</div>` : ""}
               </div>`;
          return `<div class="qr-tile" title="${esc_attr(tip)}" data-idx="${idx}">
            <button class="pdf-btn" data-pdf="${idx}" title="Download as PDF">📄 PDF</button>
            ${sticker_html}
            <div class="tile-descriptor"><strong>${esc(primary || it.id)}</strong>${secondary ? ` · ${esc(secondary)}` : ""}${is_fp && it.coffee_name ? ` · ${esc(it.coffee_name)} ${esc(it.bag_size || "")}` : ""}</div>
          </div>`;
        } else {
          // Sheet mode (A4 grid) — same as before, with PDF button added
          let label_html = "";
          if (state.type === "container" || state.type === "bucket") {
            label_html = `<div class="qr-label"><div class="qr-label-primary">${esc(primary)}</div>${secondary?`<div class="qr-label-secondary">${esc(secondary)}</div>`:""}</div>`;
          } else if (state.type === "shop") {
            label_html = `<div class="qr-label"><div class="qr-label-primary">${esc(primary)}</div></div>`;
          }
          // FP: no descriptor on the sticker — keep label_html empty
          return `<div class="qr-tile" title="${esc_attr(tip)}" data-idx="${idx}">
            <button class="pdf-btn" data-pdf="${idx}" title="Download as PDF">📄 PDF</button>
            <div class="qr-canvas" data-value="${esc_attr(it.value)}"></div>
            ${label_html}
          </div>`;
        }
      }).join("");

      // Generate QR codes — render at native printer resolution (203 DPI = 8 px/mm)
      grid.querySelectorAll(".qr-canvas").forEach(el => {
        el.innerHTML = "";
        // For single mode, render at the printed sticker size (max ~95mm). For sheet, use the user-chosen size.
        const target_mm = state.mode === "single" ? (state.type === "fp" ? 95 : 75) : state.size_mm;
        const canvas_px = Math.max(160, Math.round(target_mm * 8));
        new window.QRCode(el, {
          text: el.dataset.value,
          width: canvas_px,
          height: canvas_px,
          colorDark: "#1a1a1a",
          colorLight: "#ffffff",
          correctLevel: window.QRCode.CorrectLevel.H,
        });
        setTimeout(() => {
          const canvas = el.querySelector("canvas");
          const img = el.querySelector("img");
          if (canvas) { canvas.style.position = "absolute"; canvas.style.opacity = "0"; canvas.style.pointerEvents = "none"; }
          if (img) img.alt = el.dataset.value;
        }, 0);
      });

      // Cache the rendered items so PDF / click handlers can find them by index
      state.rendered_items = items;

      // Click tile → print just that one.
      // We use the `afterprint` window event (not setTimeout) to clean up state —
      // setTimeout's cleanup could race a subsequent print and leave the page
      // in a half-cleaned state, making print #2 onwards come out blank.
      const cleanup_print_state = () => {
        document.body.classList.remove("print-single");
        document.querySelectorAll(".qr-tile.printing-only").forEach(t => t.classList.remove("printing-only"));
      };
      window.removeEventListener("afterprint", cleanup_print_state);
      window.addEventListener("afterprint", cleanup_print_state);

      grid.querySelectorAll(".qr-tile").forEach(tile => tile.addEventListener("click", e => {
        // Don't trigger print if user clicked the PDF button
        if (e.target.closest(".pdf-btn")) return;
        if (e.button !== 0) return;
        // Defensive: clear any leftover state before the new print
        cleanup_print_state();
        tile.classList.add("printing-only");
        document.body.classList.add("print-single");
        // Give the browser one paint tick to apply classes before opening the dialog
        requestAnimationFrame(() => requestAnimationFrame(() => window.print()));
      }));

      // PDF download per tile
      grid.querySelectorAll("[data-pdf]").forEach(btn => btn.addEventListener("click", e => {
        e.stopPropagation();
        const idx = Number(btn.dataset.pdf);
        download_pdf(idx);
      }));
    }

    function download_pdf(idx) {
      const item = state.rendered_items?.[idx];
      if (!item) return;

      // Find the canvas element for this tile so we get the exact rendered QR
      const tile = document.querySelector(`.qr-tile[data-idx="${idx}"]`);
      const canvas = tile?.querySelector(".qr-canvas canvas");
      if (!canvas) { alert("QR not ready yet — try again in a moment."); return; }

      // Determine PDF size:
      //   Single mode: 105×150mm (label-sized PDF, ready to print on ZD230)
      //   Sheet mode:  square sized to the user's chosen mm (QR-only, no descriptor)
      const { jsPDF } = window.jspdf;
      let pdf, qr_mm, qr_x, qr_y, page_w, page_h;
      if (state.mode === "single") {
        page_w = 105; page_h = 150;
        pdf = new jsPDF({ unit: "mm", format: [page_w, page_h], orientation: "portrait" });
        const is_fp = state.type === "fp";
        qr_mm = is_fp ? 95 : 75;
        qr_x = (page_w - qr_mm) / 2;
        qr_y = is_fp ? (page_h - qr_mm) / 2 : 20;
      } else {
        // Sheet mode: just the QR at the chosen size — no padding, no descriptor
        qr_mm = state.size_mm;
        page_w = qr_mm; page_h = qr_mm;
        pdf = new jsPDF({ unit: "mm", format: [page_w, page_h], orientation: "portrait" });
        qr_x = 0; qr_y = 0;
      }
      // Render the canvas at high resolution into the PDF
      const img_data = canvas.toDataURL("image/png");
      pdf.addImage(img_data, "PNG", qr_x, qr_y, qr_mm, qr_mm, undefined, "NONE");

      // For single mode + non-FP types, also add the descriptor below the QR
      if (state.mode === "single" && state.type !== "fp") {
        let primary = "", secondary = "";
        if (state.type === "container")   { primary = item.id; secondary = item.name || ""; }
        else if (state.type === "bucket") { primary = item.name || item.id; secondary = item.name ? item.id : ""; }
        else if (state.type === "shop")   { primary = item.master_name; secondary = ""; }
        if (primary) {
          pdf.setFont("helvetica", "bold");
          pdf.setFontSize(16);
          pdf.text(primary, page_w / 2, qr_y + qr_mm + 12, { align: "center", maxWidth: page_w - 8 });
        }
        if (secondary) {
          pdf.setFont("helvetica", "normal");
          pdf.setFontSize(10);
          pdf.text(secondary, page_w / 2, qr_y + qr_mm + 20, { align: "center", maxWidth: page_w - 8 });
        }
      }

      const safe_id = String(item.id).replace(/[^a-zA-Z0-9_-]/g, "_");
      pdf.save(`${state.type}-${safe_id}.pdf`);
    }

    function bucket_prefix(name) { return String(name || "").replace(/\s*\d+\s*$/, "").trim(); }
    function esc(s)      { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function esc_attr(s) { return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;"); }
  </script>
</body>
