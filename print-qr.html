<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print QR Codes — Bear Roastery</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f0eb; min-height: 100vh; color: #1a1008; }
    .toolbar { background: #1a1008; color: #e8d5b0; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; position: sticky; top: 0; z-index: 10; }
    .toolbar-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .toolbar-back { background: none; border: none; color: #c8a96e; font-size: 13px; cursor: pointer; }
    .toolbar-back:hover { color: #e8d5b0; }
    .toolbar-title { font-weight: 700; font-size: 16px; }
    .toolbar-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .toolbar label { font-size: 12px; color: #c8a96e; margin-right: 4px; }
    .toolbar select, .toolbar input { background: #2d1e0f; color: #e8d5b0; border: 1px solid #5a3e1b; border-radius: 4px; padding: 4px 8px; font-size: 13px; font-family: inherit; }
    .toolbar select option { background: #1a1008; color: #e8d5b0; }
    .btn-print { background: #c8a96e; color: #1a1008; border: none; border-radius: 6px; padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn-print:hover { background: #d4b88a; }
    .size-preset { background: #2d1e0f; color: #c8a96e; border: 1px solid #5a3e1b; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
    .size-preset:hover { background: #c8a96e; color: #1a1008; }
    .picker { background: #fff; padding: 16px 24px; border-bottom: 1px solid #e0d5c5; }
    .picker h3 { font-size: 14px; margin-bottom: 10px; }
    .pick-item { display: inline-flex; align-items: center; gap: 6px; background: #f5f0eb; border-radius: 4px; padding: 4px 10px; margin: 2px; cursor: pointer; font-size: 12px; user-select: none; border: 1px solid #e0d5c5; }
    .pick-item.selected { background: #1a1008; color: #e8d5b0; border-color: #1a1008; }
    .sheet { padding: 20px; max-width: 1100px; margin: 0 auto; }
    .qr-grid { display: grid; gap: var(--gap, 10px); grid-template-columns: repeat(auto-fill, minmax(var(--qr-size, 140px), max-content)); justify-content: center; }
    .qr-tile { background: #fff; border: 1px dashed #ddd; padding: 10px; text-align: center; border-radius: 4px; break-inside: avoid; transition: border-color 0.15s, transform 0.1s; cursor: pointer; }
    .qr-tile:hover { border-color: #c8a96e; border-style: solid; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .qr-tile.printing-only { /* added during single-tile print */ }
    body.print-single .qr-tile:not(.printing-only) { display: none !important; }
    .qr-tile .qr-canvas { width: var(--qr-size, 140px); height: var(--qr-size, 140px); margin: 0 auto; }
    .qr-tile .qr-canvas img, .qr-tile .qr-canvas canvas { width: 100% !important; height: 100% !important; }
    .empty { text-align: center; padding: 60px 20px; color: #888; }
    @media print {
      p { display: none !important; }
      
      .toolbar, .picker { display: none !important; }
      body { background: #fff; }
      .sheet { padding: 0; max-width: none; }
      .qr-tile { border: none; padding: 4px; }
      @page { margin: 10mm; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="toolbar-back" id="go-back">← Back</button>
      <div class="toolbar-title">🖨️ QR Code Printer</div>
    </div>
    <div class="toolbar-controls">
      <label>Type</label>
      <select id="type-select">
        <option value="bucket">Buckets</option>
        <option value="fp">Bag Labels (FP codes)</option>
      </select>
      <label>Size (mm)</label>
      <input type="number" id="size-input" value="40" min="10" max="120" step="1" style="width:64px" />
      <div class="flex gap-6" style="display:flex;gap:4px">
        <button class="size-preset" data-size="20">20</button>
        <button class="size-preset" data-size="30">30</button>
        <button class="size-preset" data-size="40">40</button>
        <button class="size-preset" data-size="60">60</button>
        <button class="size-preset" data-size="80">80</button>
      </div>
<button class="btn-print" id="print-btn">🖨️ Print All</button>
    </div>
  </div>

  <div class="picker" id="picker"></div>
  <div class="sheet"><p style="text-align:center;color:#888;font-size:13px;margin-bottom:14px">💡 Click a QR to print it · Right-click → "Save image as..." to download as PNG · Or "Print All" for the whole sheet</p><div id="grid" class="qr-grid"></div></div>

  <script>
    const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (!session) { window.location.href = "login.html"; return; }
      init();
    });

    const url_params = new URLSearchParams(window.location.search);
    const init_type  = url_params.get("type") || "bucket";
    const init_ids   = url_params.get("ids") ? url_params.get("ids").split(",") : null;

    const state = {
      type: init_type,
      size_mm: 40,
      coffee_filter: "all",
      buckets: [],
      fp_codes: [],
      selected_ids: new Set(init_ids || []),
    };

    async function init() {
      document.getElementById("type-select").value = state.type;
      document.getElementById("go-back").addEventListener("click", () => window.history.back());
      document.getElementById("print-btn").addEventListener("click", () => window.print());
      document.getElementById("type-select").addEventListener("change", e => {
        state.type = e.target.value;
        state.selected_ids = new Set();
        state.coffee_filter = "all";
        render_picker(); render_grid();
      });
      const sizeInput = document.getElementById("size-input");
      sizeInput.addEventListener("input", e => {
        const v = Number(e.target.value);
        if (v >= 10 && v <= 120) { state.size_mm = v; render_grid(); }
      });
      document.querySelectorAll(".size-preset").forEach(btn => btn.addEventListener("click", () => {
        const v = Number(btn.dataset.size);
        state.size_mm = v;
        sizeInput.value = v;
        render_grid();
      }));


      const [{ data: buckets }, { data: fp_codes }] = await Promise.all([
        supabaseClient.from("buckets").select("id, retired_at").order("created_at", { ascending: false }),
        supabaseClient.from("fp_codes").select("fp_code, bag_size, coffees(name)").order("fp_code"),
      ]);
      state.buckets = (buckets||[]).filter(b => !b.retired_at);
      state.fp_codes = (fp_codes||[]).map(f => ({ id: f.fp_code, label: `${f.coffees?.name||""} ${f.bag_size}`, coffee_name: f.coffees?.name||"", bag_size: f.bag_size||"" }));

      // If specific IDs were passed in the URL and they all match a bucket, auto-select them
      // Otherwise default to all of the chosen type
      if (init_ids && init_ids.length) {
        // already in selected_ids set
      } else {
        const all = state.type === "bucket" ? state.buckets.map(b => b.id) : state.fp_codes.map(f => f.id);
        state.selected_ids = new Set(all);
      }

      render_picker();
      render_grid();
    }

    function render_picker() {
      const el = document.getElementById("picker");
      const all_items = state.type === "bucket"
        ? state.buckets.map(b => ({ id: b.id, label: b.id }))
        : state.fp_codes;
      if (all_items.length === 0) {
        el.innerHTML = `<p style="color:#888;font-size:13px;font-style:italic">No ${state.type === "bucket" ? "buckets" : "FP codes"} available.</p>`;
        return;
      }

      // Coffee filter (FP mode only)
      let coffee_filter_html = "";
      if (state.type === "fp") {
        const coffees = [...new Set(state.fp_codes.map(f => f.coffee_name).filter(Boolean))].sort();
        if (coffees.length > 1) {
          coffee_filter_html = `
            <select id="coffee-filter" style="font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid #ddd;background:#fff;color:#1a1008;min-width:200px">
              <option value="all" ${state.coffee_filter==="all"?"selected":""}>All coffees</option>
              ${coffees.map(c => `<option value="${c.replace(/"/g,'&quot;')}" ${state.coffee_filter===c?"selected":""}>${c}</option>`).join("")}
            </select>`;
        }
      }

      // Apply filter, then show selected items
      const items = state.type === "fp" && state.coffee_filter !== "all"
        ? all_items.filter(i => i.coffee_name === state.coffee_filter)
        : all_items;

      // Auto-select all visible items so they always render — no manual selection needed
      state.selected_ids = new Set(items.map(i => i.id));

      el.innerHTML = `
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
          ${coffee_filter_html}
          <span style="font-size:12px;color:#888">${items.length} ${state.type === "bucket" ? "bucket" : "FP code"}${items.length!==1?"s":""} shown</span>
        </div>`;

      el.querySelector("#coffee-filter")?.addEventListener("change", e => {
        state.coffee_filter = e.target.value;
        render_picker(); render_grid();
      });
    }

    function render_grid() {
      const grid = document.getElementById("grid");
      const items = state.type === "bucket"
        ? state.buckets.filter(b => state.selected_ids.has(b.id)).map(b => ({ id: b.id, value: b.id, label: b.id }))
        : state.fp_codes.filter(f => state.selected_ids.has(f.id)).map(f => ({ id: f.id, value: f.id, label: `${f.id}\n${f.label}` }));

      // Use mm for physical print sizing — browsers translate to pixels accurately
      grid.style.setProperty("--qr-size", state.size_mm + "mm");
      // QR canvas pixel size — make it generous so it stays sharp at any print size
      // Roughly 5 pixels per mm gives 200dpi-quality output
      const px = Math.max(80, Math.round(state.size_mm * 6));
      grid.style.setProperty("--qr-canvas-px", px);
      grid.style.setProperty("--qr-label-size", Math.max(7, Math.round(state.size_mm / 4)) + "pt");
      grid.style.setProperty("--gap", Math.max(2, Math.round(state.size_mm / 8)) + "mm");

      if (items.length === 0) {
        grid.innerHTML = `<div class="empty">Nothing to show. Try changing the filter above.</div>`;
        return;
      }

      grid.innerHTML = items.map(it => {
        // Build a verbose tooltip: code + coffee + size (or just bucket id)
        const tip = state.type === "bucket"
          ? it.id
          : `${it.id} · ${it.coffee_name || ""} ${it.bag_size || ""}`.trim();
        return `<div class="qr-tile" title="${tip.replace(/"/g,'&quot;')}" data-tip="${tip.replace(/"/g,'&quot;')}"><div class="qr-canvas" data-value="${it.value}"></div></div>`;
      }).join("");

      grid.querySelectorAll(".qr-canvas").forEach(el => {
        el.innerHTML = "";
        const canvas_px = Math.max(80, Math.round(state.size_mm * 6));
        new window.QRCode(el, {
          text: el.dataset.value,
          width: canvas_px,
          height: canvas_px,
          colorDark: "#1a1008",
          colorLight: "#ffffff",
          correctLevel: window.QRCode.CorrectLevel.H,
        });
        // qrcodejs renders both a <canvas> and <img>. Hide the canvas so right-click "Save image as"
        // pops up cleanly on the img — and tag the img with a sensible filename.
        setTimeout(() => {
          const canvas = el.querySelector("canvas");
          const img = el.querySelector("img");
          if (canvas) canvas.style.display = "none";
          if (img) {
            img.alt = el.dataset.value;
            img.setAttribute("download", el.dataset.value + ".png");
          }
        }, 0);
      });
      // Click-to-print: left-click prints just that one QR
      // Right-click stays as default browser behaviour (Save image as / Copy image)
      grid.querySelectorAll(".qr-tile").forEach(tile => tile.addEventListener("click", e => {
        if (e.button !== 0) return;  // Only act on left-click
        document.body.classList.add("print-single");
        tile.classList.add("printing-only");
        const cleanup = () => {
          document.body.classList.remove("print-single");
          tile.classList.remove("printing-only");
          window.removeEventListener("afterprint", cleanup);
        };
        window.addEventListener("afterprint", cleanup);
        window.print();
        setTimeout(cleanup, 1500);
      }));
    }
  </script>
</body>
</html>
