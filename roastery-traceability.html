  <style>

    .chart-bar { background: #1a1008; border-radius: 3px 3px 0 0; width: 100%; transition: height 0.3s; }

    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } .grid-4 { grid-template-columns: 1fr 1fr; } .content { padding: 16px; } }

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<body>
<div id="app"></div>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// ROASTERY TRACE — vanilla JS single-page app
// Note: the QR shop-confirm flow is intentionally public —
// shops do not need to log in to confirm a delivery.
// ─────────────────────────────────────────────────────────────────────────────

const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
  const is_shop_scan = window.location.search.includes("scan=");
  // Shop scans are public — no login required
  if (is_shop_scan) { init(); return; }
  if (!session) { window.location.href = "login.html"; return; }
  const { data: role_row } = await supabaseClient.from("user_roles").select("role").eq("user_id", session.user.id).maybeSingle();
  const role = role_row?.role;
  if (role !== "admin" && role !== "packer") { window.location.href = "reports.html"; return; }
  state.user_role = role;  // Stash for UI hiding (e.g. PO upload button for packers)
  init();
});

const TABS = ["Containers","Deliveries"];
const RETAIL_SIZES = [{ val:"100g", label:"100g" },{ val:"200g", label:"200g" },{ val:"500g", label:"500g" },{ val:"1kg", label:"1kg" },{ val:"Bar 5kg", label:"Bar" }];

const state = {
  tab: 0, containers: [], roast_sessions: [], dispatches: [],
  coffees: [], fp_codes: [], shop_mappings: [], base_url: "",
  user_role: null,
  loading: true, saving: false, scan_id: null,
  ui: {
    expanded_qr: null,
    expanded_deliveries: {},
  },
};

function today() { return new Date().toISOString().split("T")[0]; }
function active_fill(c) { return { coffee: c.coffee, remaining: c.remaining||0, fill_number: 1, date: c.roast_sessions?.[0]?.date||"" }; }

// ── HTML5 QR scanner integration ──
let _html5_qr = null;
function start_qr_scanner() {
  if (packing_state.scanner_active) return;
  if (!window.Html5Qrcode) {
    flash_scan("Camera scanner not loaded — use manual entry", "error");
    return;
  }
  const el = document.getElementById("qr-scanner");
  if (!el) return;
  packing_state.scanner_active = true;
  _html5_qr = new window.Html5Qrcode("qr-scanner", { verbose: false });
  _html5_qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 220, height: 220 } },
    decoded => process_scan(decoded),
    () => {} // ignore parse errors (every frame without a code)
  ).catch(err => {
    packing_state.scanner_active = false;
    flash_scan("Camera unavailable — use manual entry", "error");
    console.error("Scanner start failed:", err);
  });
}
function stop_qr_scanner() {
  if (!_html5_qr || !packing_state.scanner_active) {
    packing_state.scanner_active = false;
    return;
  }
  _html5_qr.stop().then(() => _html5_qr.clear()).catch(()=>{}).finally(() => {
    packing_state.scanner_active = false;
    _html5_qr = null;
  });
}

const BAG_SIZE_KG = { "100g":0.1, "200g":0.2, "500g":0.5, "1kg":1, "Bar 5kg":5 };
function calc_kg(bags, bag_size) { return (Number(bags)||0)*(BAG_SIZE_KG[bag_size]||Number(bag_size)||0); }
function to_upper(s) { return (s||"").trim().toUpperCase(); }
function gen_id(prefix) {
  const r = crypto.randomUUID().split("-")[0].toUpperCase();
  return `${prefix}-${today().replace(/-/g,"")}-${r}`;
}
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
const PALETTE = ["#1a1008","#c8a96e","#4a9e6b","#e05c2a","#4a7c4e","#e0a82a","#888","#5a3e1b"];
function color_for(i) { return PALETTE[i%PALETTE.length]; }
async function load_pdf_js() {
  if (window.pdfjsLib) return window.pdfjsLib;
  await new Promise((res,rej) => { const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; s.onload=res; s.onerror=()=>rej(new Error("Could not load PDF reader.")); document.head.appendChild(s); });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  return window.pdfjsLib;
}
async function extract_pdf_text(file) {
  const lib=await load_pdf_js(), buf=await file.arrayBuffer(), pdf=await lib.getDocument({data:buf}).promise;
  let full="";
  for (let p=1;p<=pdf.numPages;p++) { const page=await pdf.getPage(p), tc=await page.getTextContent(); const items=tc.items.slice().sort((a,b)=>{ const dy=Math.round(b.transform[5])-Math.round(a.transform[5]); return dy!==0?dy:a.transform[4]-b.transform[4]; }); full+=items.map(i=>i.str).join("\n")+"\n"; }
  return full;
}
async function render_qr(el, value, size=140) {
  if (!window.QRCode) { await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
  el.innerHTML="";
  new window.QRCode(el,{text:value,width:size,height:size,colorDark:"#1a1008",colorLight:"#fff",correctLevel:window.QRCode.CorrectLevel.M});
}

async function load_data() {
  const { data: settings } = await supabaseClient.from("settings").select("base_url").eq("id",1).single();
  state.base_url = settings?.base_url || "";
  const { data: coffees_data } = await supabaseClient.from("coffees").select("id, name").order("name");
  state.coffees = (coffees_data||[]).map(c => c.name);
  const { data: fp_codes_data } = await supabaseClient.from("fp_codes").select("fp_code, bag_size, coffees(name)").order("fp_code");
  state.fp_codes = (fp_codes_data||[]).map(f => ({ fp_code: f.fp_code, bag_size: f.bag_size, coffee_name: f.coffees?.name||"" }));
  const { data: shop_mappings_data } = await supabaseClient.from("shop_mappings").select("parsed_name, master_name");
  state.shop_mappings = shop_mappings_data || [];
  // Build containers from roast_sessions — group by container_id
  const { data: roast_sessions } = await supabaseClient.from("roast_sessions").select("id, coffee, date, container_id, roasted_weight, fill_id").order("date", { ascending: false });
  state.roast_sessions = roast_sessions || [];

  // Group roast sessions by container_id
  const container_map = {};
  (roast_sessions||[]).forEach(s => {
    if (!s.container_id) return;
    if (!container_map[s.container_id]) container_map[s.container_id] = { id: s.container_id, coffee: s.coffee, fill_id: s.fill_id, roast_sessions: [], total_roasted: 0, packed_kg: 0 };
    container_map[s.container_id].roast_sessions.push(s);
    container_map[s.container_id].total_roasted += Number(s.roasted_weight)||0;
    // Use most recent (first sorted by date desc) coffee + fill_id as the active fill
    if (!container_map[s.container_id]._latest_set) {
      container_map[s.container_id].coffee = s.coffee;
      container_map[s.container_id].fill_id = s.fill_id;
      container_map[s.container_id]._latest_set = true;
    }
  });
  state.containers = Object.values(container_map);

  const { data: dispatches } = await supabaseClient.from("dispatches").select("*, dispatch_lines(*)").order("date",{ascending:false});
  state.dispatches=(dispatches||[]).map(d=>({...d,lines:d.dispatch_lines||[]}));

  // Compute packed_kg per container from dispatch_lines
  state.dispatches.forEach(d => {
    const total = d.lines.reduce((s,l) => s + (Number(l.kg)||0) + d.lines.filter(l=>l.type==="retail").reduce((r,l) => r + calc_kg(l.bags, l.bag_size), 0), 0);
    const c = state.containers.find(c => c.id === d.container_id);
    if (c) c.packed_kg = (c.packed_kg||0) + (Number(d.total_kg)||0);
  });

  // Compute remaining per container
  state.containers.forEach(c => {
    c.remaining = Math.max(0, c.total_roasted - (c.packed_kg||0));
  });
}



async function update_order(order_id, shop_name, po_number, items) {
  state.saving=true; render();
  await supabaseClient.from("orders").update({shop_name,po_number}).eq("id",order_id);
  await supabaseClient.from("order_items").delete().eq("order_id",order_id);
  await supabaseClient.from("order_items").insert(items.map((item,i)=>({id:`${order_id}-I${i+1}-${Date.now()}`,order_id,code:item.code||null,description:item.description,quantity:item.quantity,unit:item.unit||"EACH",unit_cost:item.unit_cost||0,total:item.total||0})));
  state.saving=false; await load_data(); render();
}

async function save_dispatch(container_id, shop, lines, total_kg) {
  state.saving=true; render();
  // Ensure the container row exists (FK requirement) — upsert is a no-op if it already does
  await supabaseClient.from("containers").upsert({ id: container_id }, { onConflict: "id" });
  // Resolve current fill_id for this container (most recent roast session)
  const container = state.containers.find(c => c.id === container_id);
  const fill_id = container?.fill_id || null;
  const dispatch_id=gen_id("DSP");
  const { error: d_err } = await supabaseClient.from("dispatches").insert({id:dispatch_id,container_id,fill_id,date:today(),shop,total_kg,confirmed_at:null});
  if (d_err) { state.saving=false; alert("Failed to save dispatch: "+d_err.message); return null; }
  await supabaseClient.from("dispatch_lines").insert(lines.map((l,i)=>({id:`${dispatch_id}-L${i+1}`,dispatch_id,type:l.type,kg:l.kg,bags:l.bags||null,bag_size:l.bag_size||null})));
  state.saving=false; await load_data(); render();
  return dispatch_id;
}

async function confirm_delivery(dispatch_id) {
  await supabaseClient.from("dispatches").update({confirmed_at:new Date().toISOString()}).eq("id",dispatch_id);
  await load_data(); render();
}

async function init() {
  const params=new URLSearchParams(window.location.search);
  const scan_id=params.get("scan");
  if (scan_id) state.scan_id=scan_id;
  await load_data();
  state.loading=false;
  render();
}

function render() {
  document.getElementById("app").innerHTML=build_app();
  attach_listeners();
  document.querySelectorAll("[data-qr]").forEach(el => render_qr(el,el.dataset.qr,140));
}

function build_app() {
  if (state.scan_id) return build_scan_overlay();
  const header=`<div class="header" style="justify-content:space-between"><div style="display:flex;align-items:center;gap:12px"><button class="btn-back" id="go-dashboard">← Dashboard</button><div style="width:1px;height:28px;background:#333;margin:0 4px"></div><div><div style="font-weight:700;font-size:18px;letter-spacing:1px">☕ Roastery Trace</div><div style="font-size:12px;color:#c8a96e;margin-top:1px">Bear Roastery</div></div></div><button class="btn-logout" id="logout-btn">Log Out</button></div>`;
  if (state.loading) return header+`<div class="loading">Loading…</div>`;
  const badges={Deliveries:state.dispatches.filter(d=>!d.confirmed_at).length};
  return header+`
    <div class="tabs">${TABS.map((t,i)=>`<button class="tab-btn${state.tab===i?" active":""}" data-tab="${i}">${esc(t)}${badges[t]>0?`<span class="tag" style="background:#e05c2a;color:#fff;margin-left:6px">${badges[t]}</span>`:""}</button>`).join("")}</div>
    <div class="content">${[build_containers_tab,build_deliveries_tab][state.tab]()}</div>`;
}

function build_scan_overlay() {
  const cid=state.scan_id, container=state.containers.find(c=>c.id===cid);
  if (state.loading) return `<div class="loading">Loading…</div>`;
  if (!container) return `<div class="overlay"><div class="modal" style="text-align:center"><div style="font-size:40px;margin-bottom:12px">⚠️</div><h2 style="margin-bottom:8px">Container Not Found</h2><p class="hint">No container found with ID <strong>${esc(cid)}</strong>.</p><button class="btn btn-dark mt-16" id="close-scan">Go Back</button></div></div>`;
  const fill=active_fill(container);
  // If we're mid-packing flow, stay in the packing flow regardless of pending dispatches
  if (packing_state.step === "review" || packing_state.step === "done") return build_packing_page(container, fill);
  const pending=state.dispatches.find(d=>d.container_id===cid&&!d.confirmed_at);
  if (pending) return build_shop_confirm_page(container,fill,pending);
  return build_packing_page(container,fill);
}

function build_containers_tab() {
  const { expanded_qr } = state.ui;
  const base_url = state.base_url || "https://your-domain-here/scan";

  // Only show containers with remaining stock
  const active = state.containers.filter(c => c.remaining > 0);
  const empty  = state.containers.filter(c => c.remaining <= 0);

  const containers_html = active.length === 0
    ? `<div class="card empty"><div class="icon">📦</div>No containers with stock remaining.<br/><span class="hint">Log a roast session in Roasts to register a container.</span></div>`
    : active.map(c => {
        const in_transit = state.dispatches.find(d => d.container_id===c.id && !d.confirmed_at);
        const border_color = in_transit ? "#e0a82a" : c.remaining < 10 ? "#e05c2a" : "#4a9e6b";
        const bar_color    = c.remaining < 10 ? "#e05c2a" : "#4a9e6b";
        const qr_open = expanded_qr === c.id;
        const qr_url  = `${base_url}?scan=${c.id}`;
        const pct = c.total_roasted > 0 ? Math.min(100, Math.round((c.remaining / c.total_roasted) * 100)) : 0;
        const roast_ids = [...new Set(c.roast_sessions.flatMap(s => s.roast_ids || [s.id]))].join(", ");
        const latest_session = c.roast_sessions[0];

        const qr_panel = qr_open ? `
          <div style="margin:14px 0;padding:16px;background:#f5f0eb;border-radius:10px;display:flex;gap:20px;align-items:center;flex-wrap:wrap">
            <div style="background:#fff;padding:10px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.1)"><div data-qr="${esc(qr_url)}" style="width:140px;height:140px"></div></div>
            <div style="flex:1;min-width:180px">
              <div style="font-weight:700;color:#1a1008;margin-bottom:6px">Container QR Code</div>
              <div style="font-size:13px;color:#555;margin-bottom:8px">Print once and stick permanently on the container.</div>
              <div class="mono" style="font-size:11px;color:#aaa;word-break:break-all;margin-bottom:10px">${esc(qr_url)}</div>
              <button class="btn btn-dark btn-sm" onclick="window.print()">🖨️ Print QR</button>
            </div>
          </div>` : "";

        const sessions_html = c.roast_sessions.length > 1 ? `
          <details style="margin-top:8px"><summary style="font-size:12px;color:#aaa;cursor:pointer">Roast sessions (${c.roast_sessions.length})</summary>
            <div style="margin-top:6px;display:grid;gap:4px">
              ${c.roast_sessions.map(s => `<div style="background:#f5f0eb;border-radius:6px;padding:6px 10px;font-size:12px;color:#666"><strong>${esc(s.id)}</strong> — ${s.date} — ${Number(s.roasted_weight).toFixed(1)}kg</div>`).join("")}
            </div>
          </details>` : "";

        return `
          <div class="card" style="border-left:4px solid ${border_color};margin-bottom:12px">
            <div class="flex-between flex-wrap">
              <div class="flex-wrap gap-6">
                <span style="font-weight:700;font-size:16px">${esc(c.id)}</span>${c.fill_id ? `<span class="mono" style="background:#f0ebe4;color:#888;padding:2px 8px;border-radius:4px;font-size:11px">${esc(c.fill_id)}</span>` : ""}
                ${in_transit ? `<span class="tag" style="background:#fff3e0;color:#e0a82a;border-radius:4px">⏳ In Transit</span>` : ""}
              </div>
              <div class="flex-wrap gap-6">
                <button class="btn btn-amber btn-sm" data-toggle-qr="${esc(c.id)}">${qr_open ? "Hide QR" : "▦ QR"}</button>
                <button class="btn btn-sm ${in_transit ? "btn-green" : "btn-dark"}" data-scan="${esc(c.id)}">${in_transit ? "📱 Shop Scan" : "📱 Pack"}</button>
              </div>
            </div>
            ${qr_panel}
            <div style="margin-top:10px;font-weight:600;font-size:15px">${esc(c.coffee)}</div>
            <div style="font-size:13px;color:#888;margin-top:2px">Last roast: ${latest_session?.date || "—"} · Total roasted: ${c.total_roasted.toFixed(1)}kg</div>

// Scan-to-pack state
// step: "shop" -> "scan" -> "review" -> "done"
const packing_state = {
  step: "shop",
  shop: "",
  scanned_items: {},   // { fp_code: count }  e.g. { FP0028: 5, FP0030: 2 }
  scanned_buckets: [], // [bucket_id, ...]
  err: "",
  scanner_active: false,
  scanner_msg: "",     // last scan feedback
  scanner_msg_type: "info", // info | success | error
};

function reset_packing_state() {
  packing_state.step = "shop";
  packing_state.shop = "";
  packing_state.scanned_items = {};
  packing_state.scanned_buckets = [];
  packing_state.err = "";
  packing_state.scanner_msg = "";
}

// Compute totals from scanned items + buckets
function packing_total_kg() {
  let total = 0;
  for (const [code, count] of Object.entries(packing_state.scanned_items)) {
    const fp = state.fp_codes.find(f => f.fp_code === code);
    if (fp) total += count * (BAG_SIZE_KG[fp.bag_size] || 0);
  }
  total += packing_state.scanned_buckets.length * 5;
  return total;
}

// Process a scanned QR value
let _last_scan = { value: null, at: 0 };
const SCAN_DEBOUNCE_MS = 1500;

function process_scan(raw_value) {
  const value = (raw_value || "").trim().toUpperCase();
  if (!value) return;
  // Ignore the same QR if scanned again within the debounce window
  const now = Date.now();
  if (_last_scan.value === value && (now - _last_scan.at) < SCAN_DEBOUNCE_MS) return;
  _last_scan = { value, at: now };

  // Bucket QR?
  if (value.startsWith("BKT-")) {
    if (packing_state.scanned_buckets.includes(value)) {
      flash_scan(`${value} already scanned`, "error");
      return;
    }
    packing_state.scanned_buckets.push(value);
    flash_scan(`✓ ${value}`, "success");
    render();
    return;
  }

  // FP code?
  if (/^FP\d+$/.test(value)) {
    const fp = state.fp_codes.find(f => f.fp_code === value);
    if (!fp) {
      flash_scan(`${value} not found in settings`, "error");
      return;
    }
    packing_state.scanned_items[value] = (packing_state.scanned_items[value] || 0) + 1;
    flash_scan(`✓ ${fp.coffee_name} ${fp.bag_size}`, "success");
    render();
    return;
  }

  flash_scan(`Unknown QR: ${value}`, "error");
}

let _flash_timer = null;
function flash_scan(msg, type) {
  packing_state.scanner_msg = msg;
  packing_state.scanner_msg_type = type;
  if (_flash_timer) clearTimeout(_flash_timer);
  _flash_timer = setTimeout(() => {
    packing_state.scanner_msg = "";
    render();
  }, 2000);
}

  const ps = packing_state;

  if (ps.step === "done") {
    const total_kg = packing_total_kg();
    const item_count = Object.values(ps.scanned_items).reduce((s,n)=>s+n, 0);
    return `<div class="overlay"><div class="modal" style="text-align:center">
      <div style="font-size:64px">✅</div>
      <h2 style="margin:12px 0 8px">All done!</h2>

      <p style="color:#888;font-size:13px;margin-top:8px">${item_count} bag${item_count!==1?"s":""}${ps.scanned_buckets.length?` · ${ps.scanned_buckets.length} bucket${ps.scanned_buckets.length!==1?"s":""}`:""}</p>
      <button class="btn btn-dark mt-16" style="padding:12px 32px" id="packing-done">Done</button>

      <h2 style="margin:8px 0 2px">${esc(fill.coffee)}</h2>
      <div class="mono" style="color:#c8a96e;font-size:15px;font-weight:700">${esc(container.id)}</div>
      <div style="color:#4a9e6b;font-size:14px;margin-top:4px">${fill.remaining.toFixed(1)}kg available</div>
    </div>
    <h3 style="font-size:16px;margin-bottom:12px">Which shop is this for?</h3>
    ${shops.length ? `<div style="display:grid;gap:8px;margin-bottom:14px">${shops.map(s => `<button data-pick-shop="${esc(s)}" style="background:#f5f0eb;border:2px solid #e0d5c5;border-radius:10px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;font-weight:700;font-size:15px">${esc(s)}</button>`).join("")}</div>` : ""}
    <div style="background:#fff8ee;border-radius:8px;padding:12px;margin-bottom:14px">
      <label class="lbl" style="font-size:13px">Or type shop name</label>
      <input id="pack-shop-custom" placeholder="e.g. Stillorgan" style="font-size:15px;padding:10px 12px" />
      <button class="btn btn-dark btn-sm mt-8" id="pack-shop-custom-go" style="width:100%">Use this shop →</button>
    </div>
    ${ps.err?`<p class="err" style="text-align:center;margin-bottom:12px">${esc(ps.err)}</p>`:""}
    <button class="btn btn-muted btn-full" id="close-scan">Cancel</button>
  </div></div>`;
}

function build_shop_confirm_page(container, fill, dispatch) {
  const b_line=dispatch.lines.find(l=>l.type==="bulk"), r_lines=dispatch.lines.filter(l=>l.type==="retail");
  return `<div class="overlay"><div class="modal"><div style="text-align:center;margin-bottom:24px"><div style="font-size:40px">☕</div><h2 style="margin:8px 0 2px">Your Coffee is Here</h2><p style="color:#888;font-size:14px;margin:0">Delivery for <strong>${esc(dispatch.shop)}</strong></p></div><div style="background:#f5f0eb;border-radius:12px;padding:18px;margin-bottom:16px"><div style="font-weight:700;font-size:16px;margin-bottom:12px">${esc(fill?.coffee)}</div><div class="grid-2 mb-12">${info_row("Container",container.id)} ${info_row("Roast Date",fill?.date)}${info_row("Dispatch Date",dispatch.date)} ${info_row("Total",`${dispatch.total_kg}kg`)}</div><div style="background:#fff;border-radius:8px;padding:12px"><div style="font-size:12px;color:#888;margin-bottom:8px;font-weight:600">WHAT'S IN THIS DELIVERY</div>${b_line?`<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px"><span>⚖️ Bulk</span><span style="font-weight:600">${b_line.kg}kg</span></div>`:""}${r_lines.map(l=>`<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px"><span>${l.bag_size==="Bar 5kg"?"🪣":"🛍️"} ${RETAIL_SIZES.find(s=>s.val===l.bag_size)?.label}</span><span style="font-weight:600">${l.bags} ${l.bag_size==="Bar 5kg"?"":"bags "}(${l.kg}kg)</span></div>`).join("")}</div></div><button class="btn btn-green" style="width:100%;padding:18px;font-size:18px;border-radius:12px" id="confirm-delivery">✓ Confirm Receipt</button><button class="btn btn-muted btn-full mt-10" id="close-scan">Back</button></div></div>`;
}

function attach_listeners() {
  const app=document.getElementById("app");
  app.querySelector("#go-dashboard")?.addEventListener("click", () => window.location.href="index.html");
  app.querySelectorAll("[data-tab]").forEach(btn => btn.addEventListener("click", () => { state.tab=Number(btn.dataset.tab); render(); }));
  app.querySelector("#logout-btn")?.addEventListener("click", async () => { await supabaseClient.auth.signOut(); window.location.href="login.html"; });
  app.querySelectorAll("[data-toggle-qr]").forEach(btn => btn.addEventListener("click", () => { state.ui.expanded_qr=state.ui.expanded_qr===btn.dataset.toggleQr?null:btn.dataset.toggleQr; render(); }));
  app.querySelectorAll("[data-scan]").forEach(btn => btn.addEventListener("click", () => {
    reset_packing_state();
    state.scan_id = btn.dataset.scan;
    render();
  }));
  app.querySelectorAll("[data-toggle-delivery]").forEach(btn => btn.addEventListener("click", () => { state.ui.expanded_deliveries[btn.dataset.toggleDelivery]=!state.ui.expanded_deliveries[btn.dataset.toggleDelivery]; render(); }));
  app.querySelector("#close-scan")?.addEventListener("click", () => { state.scan_id=null; const url=new URL(window.location); url.searchParams.delete("scan"); window.history.replaceState({},"",url); render(); });
  
  // ── Scan-to-pack flow listeners ──
  // Shop step: pick a shop or type custom
  app.querySelectorAll("[data-pick-shop]").forEach(btn => btn.addEventListener("click", () => {
    packing_state.shop = btn.dataset.pickShop;
    packing_state.err = "";
    packing_state.step = "scan";
    render();
  }));
  app.querySelector("#pack-shop-custom-go")?.addEventListener("click", () => {
    const v = document.getElementById("pack-shop-custom")?.value.trim();
    if (!v) { packing_state.err = "Please enter or pick a shop."; render(); return; }
    packing_state.shop = v;
    packing_state.err = "";
    packing_state.step = "scan";
    render();
  });
  app.querySelector("#pack-shop-custom")?.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); app.querySelector("#pack-shop-custom-go")?.click(); }
  });

  // Scan step: back to shop, manual scan input, remove items
  app.querySelector("#pack-back-shop")?.addEventListener("click", () => {
    if (Object.keys(packing_state.scanned_items).length || packing_state.scanned_buckets.length) {
      if (!confirm("Going back will keep what you've scanned. Continue?")) return;
    }
    stop_qr_scanner();
    packing_state.step = "shop";
    render();
  });
  app.querySelector("#manual-scan-btn")?.addEventListener("click", () => {
    const v = document.getElementById("manual-scan-input")?.value.trim();
    if (!v) return;
    process_scan(v);
    document.getElementById("manual-scan-input").value = "";
  });
  app.querySelector("#manual-scan-input")?.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); app.querySelector("#manual-scan-btn")?.click(); }
  });
  app.querySelectorAll("[data-remove-item]").forEach(btn => btn.addEventListener("click", () => {
    const code = btn.dataset.removeItem;
    if (packing_state.scanned_items[code] > 1) packing_state.scanned_items[code]--;
    else delete packing_state.scanned_items[code];
    render();
  }));
  app.querySelectorAll("[data-remove-bucket]").forEach(btn => btn.addEventListener("click", () => {
    packing_state.scanned_buckets = packing_state.scanned_buckets.filter(b => b !== btn.dataset.removeBucket);
    render();
  }));

  // Start QR scanner if we're on the scan step
  if (packing_state.step === "scan" && state.scan_id && !packing_state.scanner_active) {
    setTimeout(start_qr_scanner, 100);
  }
  // Stop scanner when leaving scan step or closing overlay
  if (packing_state.step !== "scan" && packing_state.scanner_active) {
    stop_qr_scanner();
  }

  app.querySelector("#pack-review")?.addEventListener("click", () => {
    const total_kg = packing_total_kg();
    const fill = active_fill(state.containers.find(c=>c.id===state.scan_id));
    if (total_kg <= 0) { packing_state.err = "Please scan at least one item."; render(); return; }
    if (total_kg > fill.remaining) { packing_state.err = `Only ${fill.remaining.toFixed(1)}kg available — you've scanned ${total_kg.toFixed(1)}kg.`; render(); return; }
    packing_state.err = ""; packing_state.step = "review"; render();
  });
  app.querySelector("#packing-back-edit")?.addEventListener("click", () => { packing_state.step="scan"; render(); });
  app.querySelector("#packing-confirm")?.addEventListener("click", async () => {
    const lines = [];
    for (const [code, count] of Object.entries(packing_state.scanned_items)) {
      const fp = state.fp_codes.find(f => f.fp_code === code);
      if (!fp) continue;
      const kg = count * (BAG_SIZE_KG[fp.bag_size]||0);
      lines.push({ type:"retail", kg, bags: count, bag_size: fp.bag_size });
    }
    if (packing_state.scanned_buckets.length > 0) {
      lines.push({ type:"retail", kg: packing_state.scanned_buckets.length*5, bags: packing_state.scanned_buckets.length, bag_size: "Bar 5kg" });
    }
    const total_kg = packing_total_kg();
    const dispatch_id = await save_dispatch(state.scan_id, packing_state.shop, lines, total_kg);
    if (dispatch_id && packing_state.scanned_buckets.length > 0) {
      await supabaseClient.from("dispatch_buckets").insert(
        packing_state.scanned_buckets.map(b => ({ dispatch_id, bucket_id: b }))
      );
    }
    packing_state.step = "done";
    render();
  });
  app.querySelector("#packing-done")?.addEventListener("click", () => {
    state.scan_id = null;
    reset_packing_state();
    render();
  });
  app.querySelector("#confirm-delivery")?.addEventListener("click", async () => {
    const d=state.dispatches.find(x=>x.container_id===state.scan_id&&!x.confirmed_at);
    if (d) await confirm_delivery(d.id);
    state.scan_id=null; const url=new URL(window.location); url.searchParams.delete("scan"); window.history.replaceState({},"",url); render();
  });
}
</script>
