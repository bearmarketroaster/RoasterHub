<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roastery Trace</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f0eb; min-height: 100vh; color: #1a1008; }
    input, select, button { font-family: inherit; font-size: 14px; }
    button { cursor: pointer; }
    #app { min-height: 100vh; }
    .header { background: #1a1008; color: #e8d5b0; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .header span.logo { font-size: 22px; }
    .header span.title { font-weight: 700; font-size: 18px; letter-spacing: 1px; }
    .tabs { display: flex; border-bottom: 2px solid #c8a96e; background: #fff; overflow-x: auto; }
    .tab-btn { padding: 12px 20px; border: none; background: #fff; color: #555; font-weight: 400; font-size: 14px; white-space: nowrap; transition: background 0.15s; cursor: pointer; }

    .card + .card { margin-top: 12px; }
    input, select, textarea { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px; background: #fff; color: #1a1008; }
    input:focus, select:focus, textarea:focus { outline: 2px solid #c8a96e; border-color: #c8a96e; box-shadow: none; }
    label.lbl { display: block; font-size: 12px; color: #888; margin-bottom: 4px; font-weight: 500; }
    .field { margin-bottom: 0; }
    .btn { color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-size: 14px; font-weight: 600; }
    .btn-dark { background: #1a1008; } .btn-green { background: #4a9e6b; } .btn-dkgreen { background: #4a7c4e; }
    .btn-amber { background: #c8a96e; } .btn-grey { background: #888; } .btn-muted { background: #aaa; }
    .btn-ghost { background: #e8d5b0; color: #5a3e1b; }

    .span-2 { grid-column: 1 / -1; }
    .flex { display: flex; } .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .flex-wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .gap-6{gap:6px} .gap-8{gap:8px} .gap-10{gap:10px} .gap-12{gap:12px}
    .mt-4{margin-top:4px} .mt-8{margin-top:8px} .mt-10{margin-top:10px} .mt-12{margin-top:12px} .mt-16{margin-top:16px}
    .mb-8{margin-bottom:8px} .mb-12{margin-bottom:12px} .mb-16{margin-bottom:16px}
    .stock-track { background: #e0d5c5; border-radius: 4px; height: 8px; }

    .report-bar-fill { border-radius: 3px; height: 6px; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 24px; z-index: 100; }
    .modal { background: #fff; border-radius: 16px; padding: 28px; width: 100%; max-width: 440px; box-shadow: 0 4px 24px rgba(0,0,0,0.15); margin: auto; }
    .collapsible-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .collapsible-arrow { font-size: 16px; color: #c8a96e; font-weight: 700; }
    .chart-wrap { display: flex; align-items: flex-end; gap: 4px; height: 100px; overflow-x: auto; padding-bottom: 4px; }
    .chart-col { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 44px; flex: 1; }
    .chart-bar { background: #1a1008; border-radius: 3px 3px 0 0; width: 100%; transition: height 0.3s; }
    .chart-val { font-size: 10px; color: #888; } .chart-lbl { font-size: 9px; color: #aaa; white-space: nowrap; }
    .mono { font-family: monospace; }
    .btn-logout { background: none; border: 1px solid #c8a96e; color: #c8a96e; border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-logout:hover { background: #c8a96e; color: #1a1008; }
    .btn-back { background: none; border: none; color: #c8a96e; font-size: 13px; cursor: pointer; padding: 4px 0; }
    .btn-back:hover { color: #e8d5b0; }
    .err { color: #e05c2a; font-size: 13px; margin-top: 8px; } .hint { color: #888; font-size: 13px; }
    .loading { text-align: center; padding: 60px 20px; color: #888; font-size: 15px; }
    details summary { font-size: 12px; color: #aaa; cursor: pointer; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } .grid-4 { grid-template-columns: 1fr 1fr; } .content { padding: 16px; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

<body>
<div id="app"></div>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// ROASTERY TRACE — vanilla JS single-page app
// Note: the QR shop-confirm flow is intentionally public —
// shops do not need to log in to confirm a delivery.
// ─────────────────────────────────────────────────────────────────────────────

const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

supabaseClient.auth.getSession().then(({ data: { session } }) => {
  const is_shop_scan = window.location.search.includes("scan=");
  if (!session && !is_shop_scan) window.location.href = "login.html";
  else init();
});

const TABS = ["Containers","Orders","Deliveries","Recall","Reports"];
const RETAIL_SIZES = [{ val:"100g", label:"100g" },{ val:"200g", label:"200g" },{ val:"500g", label:"500g" },{ val:"1kg", label:"1kg" },{ val:"Bar 5kg", label:"Bar" }];

const state = {
  tab: 0, containers: [], roast_sessions: [], orders: [], dispatches: [],
  coffees: [], fp_codes: [], shop_mappings: [], base_url: "",
  loading: true, saving: false, scan_id: null,
  editing_order: null, review_queue: [],
  ui: {
    expanded_qr: null,
    show_upload: false, upload_err: "", parsing: false,
    expanded_orders: {}, expanded_deliveries: {},
    recall_query: "", recall_results: null,
    report_from: today(), report_to: today(), report_view: "shops",
    review_items_open: false,
  },
};

function today() { return new Date().toISOString().split("T")[0]; }
function active_fill(c) { return { coffee: c.coffee, remaining: c.remaining||0, fill_number: 1, date: c.roast_sessions?.[0]?.date||"" }; }
const BAG_SIZE_KG = { "100g":0.1, "200g":0.2, "500g":0.5, "1kg":1, "Bar 5kg":5 };
function calc_kg(bags, bag_size) { return (Number(bags)||0)*(BAG_SIZE_KG[bag_size]||Number(bag_size)||0); }
function to_upper(s) { return (s||"").trim().toUpperCase(); }
function gen_id(prefix) {
  const r = crypto.randomUUID().split("-")[0].toUpperCase();
  return `${prefix}-${today().replace(/-/g,"")}-${r}`;
}
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
const PALETTE = ["#1a1008","#c8a96e","#4a9e6b","#e05c2a","#4a7c4e","#e0a82a","#888","#5a3e1b"];
function color_for(i) { return PALETTE[i%PALETTE.length]; }

function get_coffee_map(coffee_name) {
  const matching_fp = (state.fp_codes||[]).filter(f => f.coffee_name?.trim().toLowerCase()===coffee_name.trim().toLowerCase());
  const fp_sizes = matching_fp.map(f => ({ code: f.fp_code, size: f.bag_size }));
  const fp_codes = matching_fp.map(f => to_upper(f.fp_code)).filter(Boolean);
  const keywords = coffee_name.toLowerCase().split(/\s+/).filter(w => w.length>3);
  return { fp_sizes, fp_codes, keywords };
}
function order_matches_coffee(order, fp_codes, keywords) {
  return order.items.some(item => fp_codes.length>0 ? fp_codes.includes(to_upper(item.code)) : keywords.some(kw => item.description.toLowerCase().includes(kw)));
}
function get_matched_items(order, fp_codes, keywords) {
  return order.items.filter(item => fp_codes.length>0 ? fp_codes.includes(to_upper(item.code)) : keywords.some(kw => item.description.toLowerCase().includes(kw)));
}
function resolve_quantities(matched_items, fp_sizes) {
  let bulk=0;
  const retail = RETAIL_SIZES.map(s => ({ bag_size:s.val, bags:"0" }));
  matched_items.forEach(item => {
    const qty=Number(item.quantity)||0, desc=item.description.toLowerCase();
    const fp=fp_sizes.find(s => to_upper(s.code)===to_upper(item.code));
    if (fp) { const i=retail.findIndex(r=>r.bag_size===fp.size); if(i>=0) retail[i].bags=String(Number(retail[i].bags)+qty); return; }
    if (desc.includes("bar")) { const i=retail.findIndex(r=>r.bag_size==="Bar 5kg"); if(i>=0) retail[i].bags=String(Number(retail[i].bags)+qty); return; }
    const sv=desc.includes("100g")?"100g":desc.includes("200g")?"200g":desc.includes("500g")||desc.includes("500gr")?"500g":desc.includes("1kg")?"1kg":null;
    if (sv) { const i=retail.findIndex(r=>r.bag_size===sv); if(i>=0) retail[i].bags=String(Number(retail[i].bags)+qty); }
  });
  return { bulk, retail };
}

async function load_pdf_js() {
  if (window.pdfjsLib) return window.pdfjsLib;
  await new Promise((res,rej) => { const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; s.onload=res; s.onerror=()=>rej(new Error("Could not load PDF reader.")); document.head.appendChild(s); });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  return window.pdfjsLib;
}
async function extract_pdf_text(file) {
  const lib=await load_pdf_js(), buf=await file.arrayBuffer(), pdf=await lib.getDocument({data:buf}).promise;
  let full="";
  for (let p=1;p<=pdf.numPages;p++) { const page=await pdf.getPage(p), tc=await page.getTextContent(); const items=tc.items.slice().sort((a,b)=>{ const dy=Math.round(b.transform[5])-Math.round(a.transform[5]); return dy!==0?dy:a.transform[4]-b.transform[4]; }); full+=items.map(i=>i.str).join("\n")+"\n"; }
  return full;
}
// resolve_shop_name uses shop_mappings loaded from Supabase
function resolve_shop_name(name) {
  const match = (state.shop_mappings||[]).find(m => m.parsed_name.toLowerCase().trim() === name.toLowerCase().trim());
  return match ? match.master_name : name;
}

// Parse a single PO page's lines into an order object
function parse_bc_po_page(lines) {
  const FP_RE   = /^FP\d{3,}$/i;
  const NUM_RE  = /^\d{1,3}(,\d{3})*(\.\d+)?$/;
  const UNIT_RE = /^(EACH|KGS)$/i;
  const SKIP_RE = /^(Yes|No|ROW|ROI|EU|IE)$/i;

  let shop_name="", po_number="", order_date="", order_total=0;

  for (let i=0; i<lines.length; i++) {
    const l = lines[i];
    if (/^Purchaser$/i.test(l) && lines[i+1] && !shop_name)
      shop_name = lines[i+1].trim();
    if (/^Ship-to Address$/i.test(l) && lines[i+1] && !shop_name)
      shop_name = lines[i+1].trim(); // fallback when Purchaser field is absent
    if (/^PO\d{5,}$/i.test(l) && !po_number)
      po_number = l.trim();
    if (/^Document Date$/i.test(l) && lines[i+1])
      order_date = lines[i+1].trim();
    const tot = l.match(/^Total\s+EUR\s+([\d,]+\.?\d*)$/i);
    if (tot) order_total = parseFloat(tot[1].replace(/,/g,""))||0;
  }

  const items = [];
  let i = 0;
  while (i < lines.length) {
    if (/^Total\s+EUR/i.test(lines[i])) break;
    if (FP_RE.test(lines[i])) {
      const code = lines[i].toUpperCase(); i++;
      const dp = [];
      while (i < lines.length && !NUM_RE.test(lines[i]) && !UNIT_RE.test(lines[i])) {
        if (!SKIP_RE.test(lines[i])) dp.push(lines[i]);
        i++;
      }
      const description = dp.join(" ").trim();
      let quantity=0, unit="EACH", unit_cost=0, total=0;
      if (NUM_RE.test(lines[i]||"")) { quantity=parseFloat(lines[i].replace(/,/g,"")); i++; }
      if (UNIT_RE.test(lines[i]||"")) { unit=lines[i].toUpperCase(); i++; }
      if (NUM_RE.test(lines[i]||"")) { unit_cost=parseFloat(lines[i].replace(/,/g,"")); i++; }
      while (i < lines.length && SKIP_RE.test(lines[i])) i++;
      if (NUM_RE.test(lines[i]||"")) { total=parseFloat(lines[i].replace(/,/g,"")); i++; }
      const fp_match = (state.fp_codes||[]).find(f => f.fp_code.toUpperCase() === code.toUpperCase());
      if (fp_match && quantity > 0) {
        const friendly_desc = `${fp_match.coffee_name} - ${fp_match.bag_size}`;
        items.push({ code, description: friendly_desc, quantity, unit, unit_cost, total });
      }
    } else { i++; }
  }
  return { shop_name: resolve_shop_name(shop_name), po_number, order_date, order_total, items };
}

// Parse a full PDF — one PO per page, returns array of orders
function parse_bc_purchase_order(raw) {
  // Each page starts with the column header line
  const pages = raw.split(/(?=No\.\s+Description\s+Quantity)/)
    .map(p => p.trim()).filter(Boolean);

  const orders = [];
  for (const page_text of pages) {
    const lines = page_text.split("\n").map(l => l.trim()).filter(Boolean);
    const order = parse_bc_po_page(lines);
    if (order.items.length > 0) orders.push(order);
  }

  if (!orders.length) throw new Error("No orders found — PDF layout may have changed.");
  return orders;
}

async function render_qr(el, value, size=140) {
  if (!window.QRCode) { await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
  el.innerHTML="";
  new window.QRCode(el,{text:value,width:size,height:size,colorDark:"#1a1008",colorLight:"#fff",correctLevel:window.QRCode.CorrectLevel.M});
}

async function load_data() {
  const { data: settings } = await supabaseClient.from("settings").select("base_url").eq("id",1).single();
  state.base_url = settings?.base_url || "";
  const { data: coffees_data } = await supabaseClient.from("coffees").select("id, name").order("name");
  state.coffees = (coffees_data||[]).map(c => c.name);
  const { data: fp_codes_data } = await supabaseClient.from("fp_codes").select("fp_code, bag_size, coffees(name)").order("fp_code");
  state.fp_codes = (fp_codes_data||[]).map(f => ({ fp_code: f.fp_code, bag_size: f.bag_size, coffee_name: f.coffees?.name||"" }));
  const { data: shop_mappings_data } = await supabaseClient.from("shop_mappings").select("parsed_name, master_name");
  state.shop_mappings = shop_mappings_data || [];
  // Build containers from roast_sessions — group by container_id
  const { data: roast_sessions } = await supabaseClient.from("roast_sessions").select("id, coffee, date, container_id, roasted_weight").order("date", { ascending: false });
  state.roast_sessions = roast_sessions || [];

  // Group roast sessions by container_id
  const container_map = {};
  (roast_sessions||[]).forEach(s => {
    if (!s.container_id) return;
    if (!container_map[s.container_id]) container_map[s.container_id] = { id: s.container_id, coffee: s.coffee, roast_sessions: [], total_roasted: 0, packed_kg: 0 };
    container_map[s.container_id].roast_sessions.push(s);
    container_map[s.container_id].total_roasted += Number(s.roasted_weight)||0;
    // Use most recent coffee name
    container_map[s.container_id].coffee = s.coffee;
  });
  state.containers = Object.values(container_map);
  const { data: orders } = await supabaseClient.from("orders").select("*, order_items(*)").order("created_at",{ascending:false});
  state.orders=(orders||[]).map(o=>({...o,items:o.order_items||[]}));
  const { data: dispatches } = await supabaseClient.from("dispatches").select("*, dispatch_lines(*)").order("date",{ascending:false});
  state.dispatches=(dispatches||[]).map(d=>({...d,lines:d.dispatch_lines||[]}));

  // Compute packed_kg per container from dispatch_lines
  state.dispatches.forEach(d => {
    const total = d.lines.reduce((s,l) => s + (Number(l.kg)||0) + d.lines.filter(l=>l.type==="retail").reduce((r,l) => r + calc_kg(l.bags, l.bag_size), 0), 0);
    const c = state.containers.find(c => c.id === d.container_id);
    if (c) c.packed_kg = (c.packed_kg||0) + (Number(d.total_kg)||0);
  });

  // Compute remaining per container
  state.containers.forEach(c => {
    c.remaining = Math.max(0, c.total_roasted - (c.packed_kg||0));
  });
}



async function save_order(order) {
  state.saving=true; render();
  const order_id=gen_id("ORD");
  const { error } = await supabaseClient.from("orders").insert({id:order_id,shop_name:order.shop_name,po_number:order.po_number||null,order_date:order.order_date||null,order_total:order.order_total||0,status:"pending"});
  if (error) { state.saving=false; return; }
  await supabaseClient.from("order_items").insert(order.items.map((item,i)=>({id:`${order_id}-I${i+1}`,order_id,code:item.code||null,description:item.description,quantity:item.quantity,unit:item.unit||"EACH",unit_cost:item.unit_cost||0,total:item.total||0})));

  state.saving=false; await load_data(); render();
}

async function update_order(order_id, shop_name, po_number, items) {
  state.saving=true; render();
  await supabaseClient.from("orders").update({shop_name,po_number}).eq("id",order_id);
  await supabaseClient.from("order_items").delete().eq("order_id",order_id);
  await supabaseClient.from("order_items").insert(items.map((item,i)=>({id:`${order_id}-I${i+1}-${Date.now()}`,order_id,code:item.code||null,description:item.description,quantity:item.quantity,unit:item.unit||"EACH",unit_cost:item.unit_cost||0,total:item.total||0})));
  state.editing_order=null; state.saving=false; await load_data(); render();
}

async function update_order_status(order_id, status) {
  await supabaseClient.from("orders").update({status}).eq("id",order_id);
  await load_data(); render();
}

async function save_dispatch(container_id, fill_number, shop, lines, total_kg, order_id) {
  state.saving=true; render();
  // Ensure the container row exists (FK requirement) — upsert is a no-op if it already does
  await supabaseClient.from("containers").upsert({ id: container_id }, { onConflict: "id" });
  const dispatch_id=gen_id("DSP");
  const { error: d_err } = await supabaseClient.from("dispatches").insert({id:dispatch_id,container_id,date:today(),shop,total_kg,confirmed_at:null,order_id:order_id||null});
  if (d_err) { state.saving=false; alert("Failed to save dispatch: "+d_err.message); return; }
  await supabaseClient.from("dispatch_lines").insert(lines.map((l,i)=>({id:`${dispatch_id}-L${i+1}`,dispatch_id,type:l.type,kg:l.kg,bags:l.bags||null,bag_size:l.bag_size||null})));
  state.saving=false; await load_data(); render();
}

async function confirm_delivery(dispatch_id) {
  await supabaseClient.from("dispatches").update({confirmed_at:new Date().toISOString()}).eq("id",dispatch_id);
  await load_data(); render();
}

async function init() {
  const params=new URLSearchParams(window.location.search);
  const scan_id=params.get("scan");
  if (scan_id) state.scan_id=scan_id;
  await load_data();
  state.loading=false;
  render();
}

function render() {
  document.getElementById("app").innerHTML=build_app();
  attach_listeners();
  document.querySelectorAll("[data-qr]").forEach(el => render_qr(el,el.dataset.qr,140));
}

function build_app() {
  if (state.scan_id) return build_scan_overlay();
  const header=`<div class="header" style="justify-content:space-between"><div style="display:flex;align-items:center;gap:12px"><button class="btn-back" id="go-dashboard">← Dashboard</button><div style="width:1px;height:28px;background:#333;margin:0 4px"></div><div><div style="font-weight:700;font-size:18px;letter-spacing:1px">☕ Roastery Trace</div><div style="font-size:12px;color:#c8a96e;margin-top:1px">Bear Roastery</div></div></div><button class="btn-logout" id="logout-btn">Log Out</button></div>`;
  if (state.loading) return header+`<div class="loading">Loading…</div>`;
  const badges={Orders:state.orders.filter(o=>o.status==="pending").length,Deliveries:state.dispatches.filter(d=>!d.confirmed_at).length};
  return header+`
    <div class="tabs">${TABS.map((t,i)=>`<button class="tab-btn${state.tab===i?" active":""}" data-tab="${i}">${esc(t)}${badges[t]>0?`<span class="tag" style="background:#e05c2a;color:#fff;margin-left:6px">${badges[t]}</span>`:""}</button>`).join("")}</div>
    <div class="content">${[build_containers_tab,build_orders_tab,build_deliveries_tab,build_recall_tab,build_reports_tab][state.tab]()}</div>`;
}

function build_scan_overlay() {
  const cid=state.scan_id, container=state.containers.find(c=>c.id===cid);
  if (state.loading) return `<div class="loading">Loading…</div>`;
  if (!container) return `<div class="overlay"><div class="modal" style="text-align:center"><div style="font-size:40px;margin-bottom:12px">⚠️</div><h2 style="margin-bottom:8px">Container Not Found</h2><p class="hint">No container found with ID <strong>${esc(cid)}</strong>.</p><button class="btn btn-dark mt-16" id="close-scan">Go Back</button></div></div>`;
  const fill=active_fill(container);
  // If we're mid-packing flow, stay in the packing flow regardless of pending dispatches
  if (packing_state.step === "review" || packing_state.step === "done") return build_packing_page(container, fill);
  const pending=state.dispatches.find(d=>d.container_id===cid&&!d.confirmed_at);
  if (pending) return build_shop_confirm_page(container,fill,pending);
  return build_packing_page(container,fill);
}

function build_containers_tab() {
  const { expanded_qr } = state.ui;
  const base_url = state.base_url || "https://your-domain-here/scan";

  // Only show containers with remaining stock
  const active = state.containers.filter(c => c.remaining > 0);
  const empty  = state.containers.filter(c => c.remaining <= 0);

  const containers_html = active.length === 0
    ? `<div class="card empty"><div class="icon">📦</div>No containers with stock remaining.<br/><span class="hint">Log a roast session in Roasts to register a container.</span></div>`
    : active.map(c => {
        const in_transit = state.dispatches.find(d => d.container_id===c.id && !d.confirmed_at);
        const border_color = in_transit ? "#e0a82a" : c.remaining < 10 ? "#e05c2a" : "#4a9e6b";
        const bar_color    = c.remaining < 10 ? "#e05c2a" : "#4a9e6b";
        const qr_open = expanded_qr === c.id;
        const qr_url  = `${base_url}?scan=${c.id}`;
        const pct = c.total_roasted > 0 ? Math.min(100, Math.round((c.remaining / c.total_roasted) * 100)) : 0;
        const roast_ids = [...new Set(c.roast_sessions.flatMap(s => s.roast_ids || [s.id]))].join(", ");
        const latest_session = c.roast_sessions[0];

        const qr_panel = qr_open ? `
          <div style="margin:14px 0;padding:16px;background:#f5f0eb;border-radius:10px;display:flex;gap:20px;align-items:center;flex-wrap:wrap">
            <div style="background:#fff;padding:10px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.1)"><div data-qr="${esc(qr_url)}" style="width:140px;height:140px"></div></div>
            <div style="flex:1;min-width:180px">
              <div style="font-weight:700;color:#1a1008;margin-bottom:6px">Container QR Code</div>
              <div style="font-size:13px;color:#555;margin-bottom:8px">Print once and stick permanently on the container.</div>
              <div class="mono" style="font-size:11px;color:#aaa;word-break:break-all;margin-bottom:10px">${esc(qr_url)}</div>
              <button class="btn btn-dark btn-sm" onclick="window.print()">🖨️ Print QR</button>
            </div>
          </div>` : "";

        const sessions_html = c.roast_sessions.length > 1 ? `
          <details style="margin-top:8px"><summary style="font-size:12px;color:#aaa;cursor:pointer">Roast sessions (${c.roast_sessions.length})</summary>
            <div style="margin-top:6px;display:grid;gap:4px">
              ${c.roast_sessions.map(s => `<div style="background:#f5f0eb;border-radius:6px;padding:6px 10px;font-size:12px;color:#666"><strong>${esc(s.id)}</strong> — ${s.date} — ${Number(s.roasted_weight).toFixed(1)}kg</div>`).join("")}
            </div>
          </details>` : "";

        return `
          <div class="card" style="border-left:4px solid ${border_color};margin-bottom:12px">
            <div class="flex-between flex-wrap">
              <div class="flex-wrap gap-6">
                <span style="font-weight:700;font-size:16px">${esc(c.id)}</span>
                ${in_transit ? `<span class="tag" style="background:#fff3e0;color:#e0a82a;border-radius:4px">⏳ In Transit</span>` : ""}
              </div>
              <div class="flex-wrap gap-6">
                <button class="btn btn-amber btn-sm" data-toggle-qr="${esc(c.id)}">${qr_open ? "Hide QR" : "▦ QR"}</button>
                <button class="btn btn-sm ${in_transit ? "btn-green" : "btn-dark"}" data-scan="${esc(c.id)}">${in_transit ? "📱 Shop Scan" : "📱 Pack"}</button>
              </div>
            </div>
            ${qr_panel}
            <div style="margin-top:10px;font-weight:600;font-size:15px">${esc(c.coffee)}</div>
            <div style="font-size:13px;color:#888;margin-top:2px">Last roast: ${latest_session?.date || "—"} · Total roasted: ${c.total_roasted.toFixed(1)}kg</div>
            ${in_transit ? `<div style="margin-top:8px;background:#fff8ee;border-radius:6px;padding:8px 12px;font-size:13px">📦 Packed for <strong>${esc(in_transit.shop)}</strong> — ${in_transit.total_kg}kg on ${in_transit.date}</div>` : ""}
            <div style="margin-top:10px">
              <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
                <span>Remaining: <strong>${c.remaining.toFixed(1)}kg</strong></span>
                <span style="color:${bar_color}">${pct}%</span>
              </div>
              <div class="stock-track"><div class="stock-fill" style="background:${bar_color};width:${pct}%"></div></div>
            </div>
            ${sessions_html}
          </div>`;
      }).join("");

  const empty_html = empty.length > 0 ? `
    <details style="margin-top:16px"><summary style="font-size:13px;color:#aaa;cursor:pointer">Fully packed containers (${empty.length})</summary>
      <div style="margin-top:8px;display:grid;gap:8px">
        ${empty.map(c => `<div class="card" style="border-left:4px solid #ccc;opacity:0.7;padding:12px 16px">
          <div style="font-weight:600">${esc(c.id)}</div>
          <div style="font-size:13px;color:#888">${esc(c.coffee)} · ${c.total_roasted.toFixed(1)}kg roasted · fully packed</div>
        </div>`).join("")}
      </div>
    </details>` : "";

  return `
    <div class="flex-between mb-16">
      <h2 style="margin:0">Storage Containers</h2>
      <span class="hint" style="font-size:13px">${active.length} container${active.length!==1?"s":""} with stock</span>
    </div>
    ${containers_html}
    ${empty_html}`;
}


function build_coffee_select(id, value) {
  if (state.coffees.length>0) return `<select id="${id}"><option value="">— Select coffee —</option>${state.coffees.map(c=>`<option value="${esc(c)}" ${c===value?"selected":""}>${esc(c)}</option>`).join("")}</select>`;

}

function build_orders_tab() {

  const pending=state.orders.filter(o=>o.status==="pending");

  const packed=state.orders.filter(o=>o.status==="packed");
  return `
    <div class="flex-between mb-16"><h2 style="margin:0">Orders</h2><div class="flex gap-8"><button class="btn btn-grey" style="font-size:13px" id="show-manual-order">+ Manual</button><button class="btn btn-dark" id="toggle-upload">+ Upload PO</button></div></div>
    ${upload_panel}
    ${state.orders.length===0&&!show_upload?`<div class="card empty"><div class="icon">📋</div>No orders yet. Upload a PO to get started.</div>`:""}
    ${pending.length>0?`<h3 style="color:#e05c2a;margin-top:0">⏳ Awaiting Review (${pending.length})</h3>${pending.map(o=>build_order_card(o)).join("")}`:""}
    ${confirmed.length>0?`<h3 style="color:#c8a96e;margin-top:${pending.length?24:0}px">✅ Ready to Pack (${confirmed.length})</h3>${confirmed.map(o=>build_order_card(o)).join("")}`:""}
    ${packed.length>0?`<h3 style="color:#4a9e6b;margin-top:${confirmed.length||pending.length?24:0}px">📦 Packed (${packed.length})</h3>${packed.map(o=>build_order_card(o)).join("")}`:""}`;
}

function build_order_card(order) {
  const cfg={pending:{color:"#e0a82a",bg:"#fff3e0",label:"⏳ Awaiting Review"},confirmed:{color:"#c8a96e",bg:"#fff8ee",label:"✅ Ready to Pack"},packed:{color:"#4a9e6b",bg:"#edf7f0",label:"📦 Packed"}}[order.status];

  const items_table=expanded?`<div style="margin-top:8px;background:#f5f0eb;border-radius:8px;overflow:hidden"><div style="display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 12px;padding:8px 12px;background:#e8d5b0;font-size:12px;font-weight:600;color:#5a3e1b"><span>Code</span><span>Item</span><span style="text-align:right">Qty</span><span style="text-align:right">Total</span></div>${order.items.map(item=>`<div style="display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 12px;padding:8px 12px;border-top:1px solid #e0d5c5;font-size:13px"><span class="mono" style="color:#888;font-size:12px">${esc(item.code)}</span><span>${esc(item.description)}</span><span style="text-align:right;color:#555">${item.quantity} ${item.unit}</span><span style="text-align:right;color:#555">€${Number(item.total).toFixed(2)}</span></div>`).join("")}${order.order_total>0?`<div style="padding:8px 12px;border-top:1px solid #e0d5c5;display:flex;justify-content:flex-end;font-size:13px;font-weight:700">Total: €${Number(order.order_total).toFixed(2)}</div>`:""}</div>`:"";
  return `
    <div class="card" style="border-left:4px solid ${cfg.color};margin-bottom:12px">
      <div class="flex-between flex-wrap">
        <div class="flex-wrap gap-10"><span style="font-weight:700;font-size:15px">${esc(order.shop_name)}</span><span class="tag" style="background:${cfg.bg};color:${cfg.color}">${cfg.label}</span></div>
        <div class="flex-wrap gap-6">

          ${order.status==="pending"?`<button class="btn btn-green btn-sm" data-confirm-order="${esc(order.id)}">✓ Confirm</button>`:""}
          ${order.status==="confirmed"?`<button class="btn btn-dkgreen btn-sm" data-complete-order="${esc(order.id)}">✓ Mark Complete</button>`:""}
        </div>
      </div>
      <div class="flex gap-10 mt-8" style="font-size:13px;color:#888;flex-wrap:wrap">
        ${order.po_number?`<span>PO: <strong>${esc(order.po_number)}</strong></span>`:""}
        ${order.order_date?`<span>Date: <strong>${esc(order.order_date)}</strong></span>`:""}
        ${order.order_total>0?`<span>Total: <strong>€${Number(order.order_total).toFixed(2)}</strong></span>`:""}
      </div>
      <div style="margin-top:10px;padding-top:8px;border-top:1px solid #f0ebe4">
        <button style="background:none;border:none;cursor:pointer;font-size:13px;color:#c8a96e;font-weight:600;padding:0;display:flex;align-items:center;gap:6px" data-toggle-order="${esc(order.id)}">
          <span>${expanded?"▾":"▸"}</span>${expanded?"Hide":"Show"} ${order.items.length} line item${order.items.length!==1?"s":""}
        </button>
      </div>
      ${items_table}
    </div>`;
}

  return `

    <div class="card mb-16">
      <div class="collapsible-header" id="toggle-review-items" style="margin-bottom:${open?14:0}px">
        <div><span style="font-weight:700;color:#1a1008;font-size:15px">${esc(header||"Imported Order")}</span><span style="margin-left:8px;font-size:13px;color:#888">(${(parsed.items||[]).length})</span></div>
        <span class="collapsible-arrow">${open?"▾":"▸"}</span>
      </div>
      ${items_html}

    <p id="review-err" class="err" style="display:none;margin-bottom:12px"></p>
    <div class="flex gap-10" style="flex-wrap:wrap">
      <button class="btn btn-dark btn-lg" id="save-review-order" ${state.saving?"disabled":""}>${state.saving?"Saving…":"Save Order"}</button>

function build_deliveries_tab() {
  const with_order=state.dispatches.filter(d=>d.order_id);
  const without_order=state.dispatches.filter(d=>!d.order_id);
  const by_order={};
  with_order.forEach(d=>{ if(!by_order[d.order_id]) by_order[d.order_id]=[]; by_order[d.order_id].push(d); });
  const get_ref=d=>{ const c=state.containers.find(x=>x.id===d.container_id); return {c, fill: c ? { coffee: c.coffee, date: c.roast_sessions?.[0]?.date||"", fill_number: 1 } : null}; };
  const in_transit_orders=state.orders.filter(o=>o.status!=="packed"&&by_order[o.id]);
  const packed_orders=state.orders.filter(o=>o.status==="packed"&&by_order[o.id]);
  if (state.dispatches.length===0) return `<h2>Deliveries</h2><div class="card empty"><div class="icon">🚚</div>No dispatches yet.</div>`;
  return `<h2>Deliveries</h2>
    ${in_transit_orders.length>0?`<h3 style="color:#e0a82a;margin-top:0">⏳ In Transit (${in_transit_orders.length})</h3>${in_transit_orders.map(o=>build_order_delivery_card(o,by_order[o.id]||[],get_ref)).join("")}`:""}
    ${packed_orders.length>0?`<h3 style="color:#4a9e6b;margin-top:${in_transit_orders.length?24:0}px">✓ Delivered (${packed_orders.length})</h3>${packed_orders.map(o=>build_order_delivery_card(o,by_order[o.id]||[],get_ref)).join("")}`:""}
    ${without_order.length>0?`<h3 style="color:#888;margin-top:${in_transit_orders.length||packed_orders.length?24:0}px">📦 Ad-hoc (${without_order.length})</h3>${without_order.map(d=>{ const{c,fill}=get_ref(d); return build_dispatch_card(d,c,fill,!!d.confirmed_at); }).join("")}`:""}`;
}

function build_order_delivery_card(order, dispatches, get_ref) {
  const all_confirmed=dispatches.every(d=>d.confirmed_at), some_confirmed=dispatches.some(d=>d.confirmed_at);
  const border_color=all_confirmed?"#4a9e6b":some_confirmed?"#c8a96e":"#e0a82a";
  const total_kg=dispatches.reduce((s,d)=>s+d.total_kg,0);
  const expanded=state.ui.expanded_deliveries["ord_"+order.id];
  const breakdown_html=expanded?dispatches.map(d=>{ const{c,fill}=get_ref(d); const b_line=d.lines.find(l=>l.type==="bulk"); const r_lines=d.lines.filter(l=>l.type==="retail"); return `<div style="background:#f5f0eb;border-radius:8px;padding:12px"><div class="flex-between flex-wrap mb-8"><span style="font-weight:600;font-size:13px">${esc(fill?.coffee??"—")}</span>${d.confirmed_at?`<span class="tag" style="background:#edf7f0;color:#4a9e6b;font-size:11px">✓ Shop confirmed</span>`:`<span class="tag" style="background:#fff3e0;color:#e0a82a;font-size:11px">⏳ Awaiting confirmation</span>`}</div><div style="font-size:12px;color:#888;margin-bottom:6px">${esc(c?.id??"")} (Fill #${d.fill_number}) · ${d.date}${d.confirmed_at?` · Confirmed ${new Date(d.confirmed_at).toLocaleDateString()}`:""}</div><div style="font-size:13px;color:#555">${b_line?`<span>⚖️ ${b_line.kg}kg bulk &nbsp;</span>`:""}${r_lines.map(l=>`<span>🛍️ ${l.bags} × ${RETAIL_SIZES.find(s=>s.val===l.bag_size)?.label} &nbsp;</span>`).join("")}</div>${!d.confirmed_at?`<button class="btn btn-dark btn-sm mt-8" data-scan="${esc(d.container_id)}">📱 Simulate Shop Scan</button>`:""}</div>`; }).join(""):"";
  return `
    <div class="card" style="border-left:4px solid ${border_color};margin-bottom:12px">
      <div class="flex-between flex-wrap mb-8">
        <div class="flex-wrap gap-10"><span style="font-weight:700;font-size:15px">${esc(order.shop_name)}</span>${all_confirmed?`<span class="tag" style="background:#edf7f0;color:#4a9e6b">✓ Delivered</span>`:some_confirmed?`<span class="tag" style="background:#fff8ee;color:#c8a96e">⚡ Partially Delivered</span>`:`<span class="tag" style="background:#fff3e0;color:#e0a82a">⏳ In Transit</span>`}</div>
      </div>
      <div class="flex gap-10 mb-12" style="font-size:13px;color:#888;flex-wrap:wrap">
        ${order.po_number?`<span>PO: <strong style="color:#1a1008">${esc(order.po_number)}</strong></span>`:""}
        ${order.order_date?`<span>Date: <strong>${esc(order.order_date)}</strong></span>`:""}
        <span>Dispatched: <strong>${total_kg}kg</strong></span>
        <span>${dispatches.length} dispatch${dispatches.length>1?"es":""}</span>
      </div>
      <div style="padding-top:8px;border-top:1px solid #f0ebe4">
        <button style="background:none;border:none;cursor:pointer;font-size:13px;color:#c8a96e;font-weight:600;padding:0;display:flex;align-items:center;gap:6px" data-toggle-delivery="ord_${esc(order.id)}">
          <span>${expanded?"▾":"▸"}</span> ${expanded?"Hide":"Show"} dispatch breakdown
        </button>
      </div>

  const shop_map={};

  const coffee_rows=Object.entries(coffee_map).sort((a,b)=>b[1].total_kg-a[1].total_kg), max_coffee_kg=coffee_rows[0]?.[1].total_kg||1;
  const week_map={};

function attach_listeners() {
  const app=document.getElementById("app");
  app.querySelector("#go-dashboard")?.addEventListener("click", () => window.location.href="index.html");
  app.querySelectorAll("[data-tab]").forEach(btn => btn.addEventListener("click", () => { state.tab=Number(btn.dataset.tab); render(); }));
  app.querySelector("#logout-btn")?.addEventListener("click", async () => { await supabaseClient.auth.signOut(); window.location.href="login.html"; });
  app.querySelectorAll("[data-toggle-qr]").forEach(btn => btn.addEventListener("click", () => { state.ui.expanded_qr=state.ui.expanded_qr===btn.dataset.toggleQr?null:btn.dataset.toggleQr; render(); }));
  app.querySelectorAll("[data-scan]").forEach(btn => btn.addEventListener("click", () => {
    packing_state.step="select"; packing_state.shop=""; packing_state.err="";
    packing_state.retail_lines=RETAIL_SIZES.map(s=>({bag_size:s.val,bags:"0"})); packing_state.selected_order_id=null;
    state.scan_id=btn.dataset.scan; render();
  }));
  app.querySelector("#toggle-upload")?.addEventListener("click", () => { state.ui.show_upload=!state.ui.show_upload; state.ui.upload_err=""; render(); });
  app.querySelector("#cancel-upload")?.addEventListener("click", () => { state.ui.show_upload=false; state.ui.upload_err=""; render(); });
  const choose_pdf=app.querySelector("#choose-pdf"), po_file=app.querySelector("#po-file");
  if (choose_pdf&&po_file) {
    choose_pdf.addEventListener("click", () => po_file.click());
    po_file.addEventListener("change", async e => {
      const files=e.target.files; if(!files?.length) return;
      state.ui.parsing=true; state.ui.upload_err=""; render();
      const results=[],errors=[];
      for (const file of Array.from(files)) {
        try {
          const orders = parse_bc_purchase_order(await extract_pdf_text(file));
          orders.forEach(o => results.push(o));
        } catch(err) { errors.push(`${file.name}: ${err.message}`); }
      }
      state.ui.parsing=false;
      if (results.length) {
        state.review_queue = results.map(r => ({...r, items: r.items.map(i=>({...i}))}));
        state.ui.show_upload=false; state.ui.review_items_open=false;
      }
      if (errors.length) state.ui.upload_err=`Failed: ${errors.join(" · ")}`;
      e.target.value=""; render();
    });
  }
  app.querySelector("#show-manual-order")?.addEventListener("click", () => { document.querySelector(".content").innerHTML=build_manual_order_entry(); attach_manual_order_listeners(); });
  app.querySelector("#toggle-review-items")?.addEventListener("click", () => { state.ui.review_items_open=!state.ui.review_items_open; render(); });
  app.querySelectorAll("[data-remove-review-item]").forEach(btn => btn.addEventListener("click", () => { state.review_queue[0].items.splice(Number(btn.dataset.removeReviewItem),1); render(); }));
  app.querySelectorAll("[data-review-desc]").forEach(inp => inp.addEventListener("input", e => { state.review_queue[0].items[Number(inp.dataset.reviewDesc)].description=e.target.value; }));
  app.querySelectorAll("[data-review-qty]").forEach(inp => inp.addEventListener("input", e => { state.review_queue[0].items[Number(inp.dataset.reviewQty)].quantity=Number(e.target.value)||0; }));
  app.querySelectorAll("[data-review-unit]").forEach(sel => sel.addEventListener("change", e => { state.review_queue[0].items[Number(sel.dataset.reviewUnit)].unit=e.target.value; }));
  app.querySelector("#save-review-order")?.addEventListener("click", async () => {
    const parsed=state.review_queue[0];
    if (!parsed.items.length) { document.getElementById("review-err").textContent="Please include at least one item."; document.getElementById("review-err").style.display="block"; return; }
    await save_order({shop_name: parsed.shop_name || [parsed.company,parsed.location].filter(Boolean).join(" ").trim() || "Unknown", po_number:parsed.po_number||"",order_date:parsed.order_date||"",items:parsed.items,order_total:parsed.order_total||0});
    state.review_queue.shift(); render();
  });
  app.querySelector("#skip-review")?.addEventListener("click", () => { state.review_queue.shift(); render(); });
  app.querySelector("#cancel-review")?.addEventListener("click", () => { state.review_queue=[]; render(); });
  app.querySelectorAll("[data-toggle-order]").forEach(btn => btn.addEventListener("click", () => { state.ui.expanded_orders[btn.dataset.toggleOrder]=!state.ui.expanded_orders[btn.dataset.toggleOrder]; render(); }));
  app.querySelectorAll("[data-edit-order]").forEach(btn => btn.addEventListener("click", () => { state.editing_order=JSON.parse(JSON.stringify(state.orders.find(o=>o.id===btn.dataset.editOrder))); render(); }));
  app.querySelectorAll("[data-confirm-order]").forEach(btn => btn.addEventListener("click", () => update_order_status(btn.dataset.confirmOrder,"confirmed")));
  app.querySelectorAll("[data-complete-order]").forEach(btn => btn.addEventListener("click", () => { if(!confirm("Mark this PO as complete?")) return; update_order_status(btn.dataset.completeOrder,"packed"); }));
  app.querySelector("#save-edit-order")?.addEventListener("click", async () => {
    const shop_name=document.getElementById("edit-shop")?.value.trim(), po_number=document.getElementById("edit-po")?.value.trim();
    if (!shop_name) return;
    const items=state.editing_order.items.map((item,i)=>({...item,description:document.querySelector(`[data-edit-desc="${i}"]`)?.value??item.description,quantity:Number(document.querySelector(`[data-edit-qty="${i}"]`)?.value)||0,unit:document.querySelector(`[data-edit-unit="${i}"]`)?.value??item.unit}));
    await update_order(state.editing_order.id,shop_name,po_number,items);
  });
  app.querySelectorAll("[data-remove-edit-item]").forEach(btn => btn.addEventListener("click", () => { state.editing_order.items.splice(Number(btn.dataset.removeEditItem),1); render(); }));
  app.querySelector("#cancel-edit-order")?.addEventListener("click", () => { state.editing_order=null; render(); });
  app.querySelectorAll("[data-toggle-delivery]").forEach(btn => btn.addEventListener("click", () => { state.ui.expanded_deliveries[btn.dataset.toggleDelivery]=!state.ui.expanded_deliveries[btn.dataset.toggleDelivery]; render(); }));
  const do_recall=app.querySelector("#do-recall"), recall_input=app.querySelector("#recall-input");
  if (do_recall&&recall_input) {
    const do_search=() => {
      const q=recall_input.value.trim().toLowerCase(); state.ui.recall_query=recall_input.value; if(!q) return;
      const matched=state.dispatches.reduce((acc,d)=>{ const c=state.containers.find(x=>x.id===d.container_id); if(!c) return acc; const fill=c.fills.find(f=>f.fill_number===d.fill_number); if(!fill) return acc; if(c.id.toLowerCase().includes(q)||fill.coffee.toLowerCase().includes(q)||(fill.roast_ids||[]).some(r=>r.toLowerCase().includes(q))||d.shop?.toLowerCase().includes(q)) acc.push({d,c,fill}); return acc; },[]);
      state.ui.recall_results={query:recall_input.value,matched}; render();
    };
    do_recall.addEventListener("click",do_search); recall_input.addEventListener("keydown",e=>{ if(e.key==="Enter") do_search(); });
  }
  app.querySelector("#report-from")?.addEventListener("change", e => { state.ui.report_from=e.target.value; render(); });
  app.querySelector("#report-to")?.addEventListener("change", e => { state.ui.report_to=e.target.value; render(); });
  app.querySelectorAll("[data-report-range]").forEach(btn => btn.addEventListener("click", () => { const range=btn.dataset.reportRange,d=new Date(); if(range==="all"){state.ui.report_from=btn.dataset.first||today();}else{d.setDate(d.getDate()-Number(range));state.ui.report_from=d.toISOString().split("T")[0];} state.ui.report_to=today(); render(); }));
  app.querySelectorAll("[data-report-view]").forEach(btn => btn.addEventListener("click", () => { state.ui.report_view=btn.dataset.reportView; render(); }));
  app.querySelector("#close-scan")?.addEventListener("click", () => { state.scan_id=null; const url=new URL(window.location); url.searchParams.delete("scan"); window.history.replaceState({},"",url); render(); });
  app.querySelector("#pack-manual")?.addEventListener("click", () => { packing_state.step="entry"; packing_state.selected_order_id="manual"; packing_state.shop=""; render(); });
  app.querySelectorAll("[data-select-order]").forEach(btn => btn.addEventListener("click", () => {
    const order=state.orders.find(o=>o.id===btn.dataset.selectOrder), container=state.containers.find(c=>c.id===state.scan_id), fill=active_fill(container);
    const {fp_sizes,fp_codes,keywords}=get_coffee_map(fill.coffee), matched=get_matched_items(order,fp_codes,keywords), {bulk,retail}=resolve_quantities(matched,fp_sizes);
    packing_state.selected_order_id=order.id; packing_state.shop=order.shop_name; packing_state.retail_lines=retail; packing_state.step="entry"; packing_state.err=""; render();
  }));
  app.querySelector("#pack-back-select")?.addEventListener("click", () => { packing_state.step="select"; render(); });
  app.querySelector("#pack-shop")?.addEventListener("input", e => { packing_state.shop=e.target.value; });
  app.querySelectorAll("[data-retail-idx]").forEach(inp => inp.addEventListener("input", e => { packing_state.retail_lines[Number(inp.dataset.retailIdx)].bags=e.target.value.replace(/[^0-9]/g,""); }));
  app.querySelector("#pack-review")?.addEventListener("click", () => {
    packing_state.shop=document.getElementById("pack-shop")?.value.trim()||packing_state.shop;
    document.querySelectorAll("[data-retail-idx]").forEach(inp => { packing_state.retail_lines[Number(inp.dataset.retailIdx)].bags=inp.value.replace(/[^0-9]/g,""); });
    const total_kg=packing_state.retail_lines.reduce((s,l)=>s+calc_kg(l.bags,l.bag_size),0);
    const container=state.containers.find(c=>c.id===state.scan_id), fill=active_fill(container);
    if (!packing_state.shop) { packing_state.err="Please enter the shop name."; render(); return; }
    if (total_kg<=0) { packing_state.err="Please enter at least one quantity."; render(); return; }
    if (total_kg>fill.remaining) { packing_state.err=`Only ${fill.remaining}kg available.`; render(); return; }
    packing_state.err=""; packing_state.step="review"; render();
  });
  app.querySelector("#packing-back-edit")?.addEventListener("click", () => { packing_state.step="entry"; render(); });
  app.querySelector("#packing-confirm")?.addEventListener("click", async () => {
    const lines=[];
    packing_state.retail_lines.forEach(l=>{ const kg=calc_kg(l.bags,l.bag_size); if(kg>0) lines.push({type:"retail",kg,bags:Number(l.bags),bag_size:l.bag_size}); });
    const total_kg=lines.reduce((s,l)=>s+l.kg,0), container=state.containers.find(c=>c.id===state.scan_id), fill=active_fill(container);
    const order_id=packing_state.selected_order_id!=="manual"?packing_state.selected_order_id:null;
    await save_dispatch(state.scan_id,fill.fill_number,packing_state.shop,lines,total_kg,order_id);
    packing_state.step="done"; render();
  });
  app.querySelector("#packing-done")?.addEventListener("click", () => { state.scan_id=null; packing_state.step="select"; packing_state.shop=""; packing_state.selected_order_id=null; packing_state.retail_lines=RETAIL_SIZES.map(s=>({bag_size:s.val,bags:"0"})); render(); });
  app.querySelector("#confirm-delivery")?.addEventListener("click", async () => {
    const d=state.dispatches.find(x=>x.container_id===state.scan_id&&!x.confirmed_at);
    if (d) await confirm_delivery(d.id);
    state.scan_id=null; const url=new URL(window.location); url.searchParams.delete("scan"); window.history.replaceState({},"",url); render();
  });
}

function attach_manual_order_listeners() {
  document.getElementById("add-mo-item")?.addEventListener("click", () => {
    const list=document.getElementById("mo-items"), count=list.querySelectorAll(".mo-item").length+1;
    const div=document.createElement("div"); div.className="mo-item"; div.style.cssText="background:#f5f0eb;border-radius:8px;padding:12px;margin-bottom:10px";
    div.innerHTML=`<div class="flex-between mb-8"><span style="font-weight:600;font-size:13px;color:#888">Item ${count}</span><button class="remove-mo-item" style="background:none;border:none;color:#e05c2a;cursor:pointer;font-size:18px">✕</button></div><div class="grid-2"><div><label class="lbl">Description *</label><input class="mo-desc" placeholder="e.g. House Roast 1kg" /></div><div><label class="lbl">Product Code</label><input class="mo-code" placeholder="e.g. FP0030" /></div><div><label class="lbl">Quantity *</label><input type="number" class="mo-qty" placeholder="0" /></div><div><label class="lbl">Unit</label><select class="mo-unit"><option>EACH</option><option>KGS</option></select></div></div>`;
    div.querySelector(".remove-mo-item").addEventListener("click", () => div.remove());
    list.appendChild(div);
  });
  document.querySelectorAll(".remove-mo-item").forEach(btn => btn.addEventListener("click", () => btn.closest(".mo-item").remove()));
  document.getElementById("save-manual-order")?.addEventListener("click", async () => {
    const shop_name=document.getElementById("mo-shop")?.value.trim(), po_number=document.getElementById("mo-po")?.value.trim(), order_date=document.getElementById("mo-date")?.value.trim(), err_el=document.getElementById("mo-err");
    if (!shop_name) { err_el.textContent="Please enter a shop name."; err_el.style.display="block"; return; }
    const items=[];
    document.querySelectorAll(".mo-item").forEach(row=>{ const desc=row.querySelector(".mo-desc")?.value.trim(),qty=Number(row.querySelector(".mo-qty")?.value)||0,code=row.querySelector(".mo-code")?.value.trim(),unit=row.querySelector(".mo-unit")?.value; if(desc&&qty>0) items.push({code,description:desc,quantity:qty,unit,unit_cost:0,total:0}); });
    if (!items.length) { err_el.textContent="Add at least one item with a description and quantity."; err_el.style.display="block"; return; }
    await save_order({shop_name,po_number,order_date,items,order_total:0});
  });
  document.getElementById("cancel-manual-order")?.addEventListener("click", () => render());
}
</script>
