<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock — Bear Roastery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f0eb; min-height: 100vh; color: #1a1008; }
    input, select, button { font-family: inherit; font-size: 14px; }
    button { cursor: pointer; }
    .header { background: #1a1008; color: #e8d5b0; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-back { background: none; border: none; color: #c8a96e; font-size: 13px; cursor: pointer; padding: 4px 0; }
    .header-back:hover { color: #e8d5b0; }
    .header-title { font-weight: 700; font-size: 18px; }
    .header-sub { font-size: 12px; color: #c8a96e; margin-top: 1px; }
    .btn-logout { background: none; border: 1px solid #c8a96e; color: #c8a96e; border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-logout:hover { background: #c8a96e; color: #1a1008; }
    .content { padding: 24px; max-width: 900px; margin: 0 auto; }
    .tabs { display: flex; border-bottom: 2px solid #c8a96e; background: #fff; overflow-x: auto; }
    .tab-btn { padding: 12px 20px; border: none; background: #fff; color: #555; font-weight: 400; font-size: 14px; white-space: nowrap; cursor: pointer; }
    .tab-btn.active { background: #1a1008; color: #e8d5b0; font-weight: 700; }
    .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 12px; }
    label.lbl { display: block; font-size: 12px; color: #888; margin-bottom: 4px; font-weight: 500; }
    input, select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px; }
    input:focus, select:focus { outline: 2px solid #c8a96e; border-color: #c8a96e; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .btn { color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-size: 14px; font-weight: 600; }
    .btn-dark { background: #1a1008; }
    .btn-ghost { background: #f5f0eb; color: #5a3e1b; border: 1px solid #e0d5c5; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-lg { padding: 12px 24px; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .tag { border-radius: 10px; padding: 2px 8px; font-size: 12px; font-weight: 600; display: inline-block; }
    .stock-track { background: #e0d5c5; border-radius: 4px; height: 10px; }
    .stock-fill { border-radius: 4px; height: 10px; transition: width 0.3s; }
    .stock-card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 10px; }
    .delivery-item { background: #f5f0eb; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .adj-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0ebe4; font-size: 13px; }
    .adj-row:last-child { border-bottom: none; }
    .mono { font-family: monospace; }
    .err { color: #e05c2a; font-size: 13px; margin-top: 8px; }
    .hint { color: #888; font-size: 13px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .flex-wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .mt-4 { margin-top: 4px; } .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
    .mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; }
    h2 { color: #1a1008; } h3 { color: #1a1008; margin-bottom: 12px; }
    .section-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #c8a96e; margin-bottom: 12px; }
    .empty { text-align: center; color: #aaa; padding: 40px 20px; }
    .empty .icon { font-size: 36px; margin-bottom: 8px; }
    .low-stock { background: #fff0ee; border: 1px solid #e05c2a; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; color: #e05c2a; }
    .loading { text-align: center; padding: 60px 20px; color: #888; font-size: 15px; }
    @media (max-width: 600px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .content { padding: 16px; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
<div id="app"></div>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// BEAR ROASTERY — Stock Management (Green Coffee)
// ─────────────────────────────────────────────────────────────────────────────

const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if (!session) window.location.href = "login.html";
  else init();
});

const LOW_STOCK_KG = 20;

const state = {
  tab: 0,
  supplier_templates: [],
  coffees: [],
  stock_items: [],
  deliveries: [],
  adjustments: [],
  loading: true,
  saving: false,
  ui: {
    show_delivery_form: false,
    show_adj_form: false,
    delivery_err: "",
    adj_err: "",
    invoice_uploading: false,
    invoice_err: "",
    delivery: new_delivery(),
    pending_invoice_file: null,   // File object staged for upload after delivery saves
    adj: { coffee: "", change_kg: "", reason: "roast", note: "" },
  },
};

function today() { return new Date().toISOString().split("T")[0]; }
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function gen_id(prefix, list) { return `${prefix}-${today().replace(/-/g,"")}-${String(list.length+1).padStart(3,"0")}`; }

function new_delivery() {
  return { date: today(), supplier: "", invoice_ref: "", due_date: "", items: [new_delivery_item()] };
}
function new_delivery_item() {
  return { coffee:"", green_name:"", origin:"", lot_number:"", bags:"", weight_kg:"", price_per_kg:"" };
}

async function load_data() {
  const { data: coffees_data } = await supabaseClient.from("coffees").select("id, name").order("name");
  state.coffees = (coffees_data || []).map(c => c.name);

  const { data: stock_items } = await supabaseClient.from("stock_items").select("*").order("coffee");
  state.stock_items = stock_items || [];

  const { data: deliveries } = await supabaseClient.from("stock_deliveries").select("*, stock_delivery_items(*)").order("date", { ascending: false });
  state.deliveries = (deliveries||[]).map(d => ({ ...d, items: d.stock_delivery_items||[] }));

  const { data: adjustments } = await supabaseClient.from("stock_adjustments").select("*").order("date", { ascending: false });
  state.adjustments = adjustments || [];

  const { data: supplier_templates } = await supabaseClient.from("supplier_templates").select("supplier_name, template").order("supplier_name");
  state.supplier_templates = supplier_templates || [];
}

async function save_delivery() {
  state.saving = true; render();
  const d = state.ui.delivery;
  const valid_items = d.items.filter(i => i.coffee && Number(i.weight_kg) > 0);
  if (!d.date) { state.ui.delivery_err="Please enter a delivery date."; state.saving=false; render(); return; }
  if (!valid_items.length) { state.ui.delivery_err="Please add at least one item with a coffee and weight."; state.saving=false; render(); return; }
  const delivery_id = gen_id("DEL", state.deliveries);

  // Upload invoice PDF if one was staged
  let invoice_path = null;
  if (state.ui.pending_invoice_file) {
    const file = state.ui.pending_invoice_file;
    const path = `${delivery_id}/${file.name}`;
    const { error: up_err } = await supabaseClient.storage.from("invoices").upload(path, file);
    if (up_err) { state.ui.delivery_err="Failed to upload invoice PDF: "+up_err.message; state.saving=false; render(); return; }
    invoice_path = path;
  }

  const { error: del_err } = await supabaseClient.from("stock_deliveries").insert({
    id: delivery_id, date: d.date, supplier: d.supplier||null,
    invoice_ref: d.invoice_ref||null, invoice_path,
  });
  if (del_err) { state.ui.delivery_err="Failed to save delivery."; state.saving=false; render(); return; }

  await supabaseClient.from("stock_delivery_items").insert(valid_items.map((item,i) => ({
    id: `${delivery_id}-I${i+1}`, delivery_id,
    coffee: item.coffee,
    green_name: item.green_name||null,
    origin: item.origin||null,
    lot_number: item.lot_number||null,
    bags: Number(item.bags)||null,
    weight_kg: Number(item.weight_kg),
    price_per_kg: Number(item.price_per_kg)||null,
  })));

  for (const item of valid_items) {
    const existing = state.stock_items.find(s => s.coffee===item.coffee);
    if (existing) {
      await supabaseClient.from("stock_items").update({ current_kg: existing.current_kg+Number(item.weight_kg), origin: item.origin||existing.origin }).eq("id", existing.id);
    } else {
      await supabaseClient.from("stock_items").insert({ id: gen_id("STK",state.stock_items), coffee: item.coffee, origin: item.origin||null, current_kg: Number(item.weight_kg), low_stock_threshold: LOW_STOCK_KG });
    }
    await supabaseClient.from("stock_adjustments").insert({ id: gen_id("ADJ",state.adjustments), date: d.date, coffee: item.coffee, change_kg: Number(item.weight_kg), reason: "delivery", note: `Delivery ${delivery_id}${d.invoice_ref?" · "+d.invoice_ref:""}`, auto: true });
  }
  state.saving=false; state.ui.show_delivery_form=false; state.ui.delivery_err="";
  state.ui.delivery=new_delivery(); state.ui.pending_invoice_file=null;
  await load_data(); render();
}

async function download_invoice(invoice_path) {
  const { data, error } = await supabaseClient.storage.from("invoices").download(invoice_path);
  if (error) { alert("Failed to download invoice: "+error.message); return; }
  const url = URL.createObjectURL(data);
  const a = document.createElement("a");
  a.href = url;
  a.download = invoice_path.split("/").pop();
  a.click();
  URL.revokeObjectURL(url);
}

async function save_adjustment() {
  state.saving = true; render();
  const coffee = document.getElementById("adj-coffee")?.value;
  const change_kg = Number(document.getElementById("adj-kg")?.value);
  const reason = document.getElementById("adj-reason")?.value;
  const note = document.getElementById("adj-note")?.value.trim();
  if (!coffee) { state.ui.adj_err="Please select a coffee."; state.saving=false; render(); return; }
  if (!change_kg) { state.ui.adj_err="Please enter a non-zero kg value."; state.saving=false; render(); return; }
  const { error } = await supabaseClient.from("stock_adjustments").insert({ id: gen_id("ADJ",state.adjustments), date: today(), coffee, change_kg, reason, note: note||null, auto: false });
  if (error) { state.ui.adj_err="Failed to save adjustment."; state.saving=false; render(); return; }
  const existing = state.stock_items.find(s => s.coffee===coffee);
  if (existing) {
    await supabaseClient.from("stock_items").update({ current_kg: Math.max(0, existing.current_kg+change_kg) }).eq("id", existing.id);
  } else {
    await supabaseClient.from("stock_items").insert({ id: gen_id("STK",state.stock_items), coffee, current_kg: Math.max(0,change_kg), low_stock_threshold: LOW_STOCK_KG });
  }
  state.saving=false; state.ui.adj={ coffee:"", change_kg:"", reason:"roast", note:"" }; state.ui.show_adj_form=false; state.ui.adj_err="";
  await load_data(); render();
}

async function set_threshold(coffee, value) {
  const item = state.stock_items.find(s => s.coffee===coffee);
  if (!item) return;
  await supabaseClient.from("stock_items").update({ low_stock_threshold: value }).eq("id", item.id);
  await load_data(); render();
}

async function init() { await load_data(); state.loading=false; render(); }

function render() { document.getElementById("app").innerHTML=build_app(); attach_listeners(); }

function build_app() {
  const header = `
    <div class="header">
      <div class="header-left">
        <button class="header-back" id="go-dashboard">← Dashboard</button>
        <div style="width:1px;height:28px;background:#333;margin:0 4px"></div>
        <div><div class="header-title">📦 Stock</div><div class="header-sub">Bear Roastery</div></div>
      </div>
      <button class="btn-logout" id="logout-btn">Log Out</button>
    </div>`;
  if (state.loading) return header + `<div class="loading">Loading stock…</div>`;
  const low_stock_items = state.stock_items.filter(s => s.current_kg < (s.low_stock_threshold||LOW_STOCK_KG) && s.current_kg > 0);
  const out_of_stock = state.stock_items.filter(s => s.current_kg===0 && s.coffee);
  const tabs = ["🌱 Green Stock","📦 Deliveries","⚖️ Adjustments"];
  return header + `
    <div class="tabs">${tabs.map((t,i) => `<button class="tab-btn${state.tab===i?" active":""}" data-tab="${i}">${t}</button>`).join("")}</div>
    <div class="content">
      ${low_stock_items.length>0||out_of_stock.length>0?`<div class="low-stock">⚠️ Low stock: ${[...out_of_stock.map(s=>`<strong>${esc(s.coffee)}</strong> — out of stock`),...low_stock_items.map(s=>`<strong>${esc(s.coffee)}</strong> — ${s.current_kg.toFixed(1)}kg remaining`)].join(" · ")}</div>`:""}
      ${state.tab===0?build_green_stock():state.tab===1?build_deliveries():state.tab===2?build_adjustments():""}
    </div>`;
}

async function load_pdf_js() {
  if (window.pdfjsLib) return window.pdfjsLib;
  await new Promise((res,rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = res; s.onerror = () => rej(new Error("Could not load PDF reader."));
    document.head.appendChild(s);
  });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  return window.pdfjsLib;
}  
  
function format_date(raw) {
  if (!raw) return today();
  const clean = raw.trim();
  const months = { january:"01",february:"02",march:"03",april:"04",may:"05",june:"06",july:"07",august:"08",september:"09",october:"10",november:"11",december:"12" };
  // dd Month yyyy e.g. 07 April 2026
  const long_match = clean.match(/^(\d{1,2})\s+([a-zA-Z]+)\s+(\d{4})$/);
  if (long_match) {
    const d = long_match[1].padStart(2,"0");
    const m = months[long_match[2].toLowerCase()] || "01";
    const y = long_match[3];
    return `${y}-${m}-${d}`;
  }
  // dd/MM/yyyy
  const slash_match = clean.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (slash_match) return `${slash_match[3]}-${slash_match[2].padStart(2,"0")}-${slash_match[1].padStart(2,"0")}`;
  // Already yyyy-MM-dd
  if (/^\d{4}-\d{2}-\d{2}$/.test(clean)) return clean;
  return today();
}

async function parse_delivery_note(file, supplier_name) {
  const { data: template_row } = await supabaseClient
    .from("supplier_templates")
    .select("template")
    .eq("supplier_name", supplier_name)
    .single();

  if (!template_row?.template) throw new Error("No template found for this supplier. Please set one up in Settings.");

  const lib = await load_pdf_js();
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data: buf }).promise;
  let full = "";
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const tc   = await page.getTextContent();
    const items = tc.items.slice().sort((a,b) => {
      const dy = Math.round(b.transform[5]) - Math.round(a.transform[5]);
      return dy !== 0 ? dy : a.transform[4] - b.transform[4];
    });
    full += items.map(i => i.str).join("\n") + "\n";
  }

  console.log("RAW PDF TEXT:", full);

  const t = template_row.template;
  const lines = full.split("\n").map(l => l.trim()).filter(Boolean);

  const extract_after = (keyword) => {
    if (!keyword) return "";
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].includes(keyword)) {
        const same = lines[i].replace(keyword, "").trim();
        if (same) return same;
        if (lines[i+1]) return lines[i+1].trim();
      }
    }
    return "";
  };

  const invoice_ref  = extract_after(t.invoice_number_keyword);
  const invoice_date = format_date(extract_after(t.invoice_date_keyword));
  const due_date     = format_date(extract_after(t.due_date_keyword));
  const items_out    = [];

  const desc_idx = t.description_column
    ? lines.findIndex(l => l.includes(t.description_column))
    : -1;

  if (desc_idx >= 0) {
    const NUM_RE     = /^\d{1,3}(,\d{3})*(\.\d+)?$/;
    const ICO_RE     = /^[A-Z0-9]{3,}\/[A-Z0-9\/\-]+$/i;
    const SKIP_RE    = /^(Price per kg|Net weight|Description|Marks|No bags|Contract|Ref no|Value|DELIVERY)/i;
    let current = null;

    for (let i = desc_idx + 1; i < lines.length; i++) {
      const l = lines[i];

      // Stop at footer
      if (/^(Total bags|Total net|VAT|TOTAL|Terms|Warehouse|Company|BANK)/i.test(l)) break;

      // Skip column header repeats
      if (SKIP_RE.test(l)) continue;

      // Description line — contains letters and commas, not purely numeric
      if (l.length > 5 && !NUM_RE.test(l) && !ICO_RE.test(l) && l.includes(",") && !/^\d/.test(l)) {
        if (current) items_out.push(current);
        const mapping = (t.coffee_mappings||[]).find(m =>
          m.supplier_description && l.toLowerCase().includes(m.supplier_description.toLowerCase().split(",")[0])
        );
        current = {
          coffee:               mapping?.our_name || "",
          origin:               "",
          lot_number:           "",
          bags:                 "",
          weight_kg:            "",
          price_per_kg:         "",
          total_value:          "",
          supplier_description: l,
        };
      } else if (current) {
        // ICO / Marks — alphanumeric with slashes e.g. 002/4600/0524
        if (ICO_RE.test(l) && !current.lot_number) {
          current.lot_number = l;
        }
        // Numeric values — assign in order: bags, weight, price, value
        else if (NUM_RE.test(l)) {
          const val = parseFloat(l.replace(/,/g,""));
          if      (!current.bags)         current.bags         = String(val);
          else if (!current.weight_kg)    current.weight_kg    = String(val);
          else if (!current.price_per_kg) current.price_per_kg = String(val);
          else if (!current.total_value)  current.total_value  = String(val);
        }
      }
    }
    if (current) items_out.push(current);
  }

  return {
    date:        invoice_date,
    due_date,
    supplier:    supplier_name,
    invoice_ref,
    items: items_out.length > 0 ? items_out : [{ coffee:"", origin:"", lot_number:"", bags:"", weight_kg:"", price_per_kg:"" }],
  };
}
  
function build_green_stock() {
  const total_kg = state.stock_items.reduce((s,i) => s+i.current_kg, 0);
  const stats_html = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px">
      ${[{icon:"🌱",label:"Total Green Stock",value:`${total_kg.toFixed(1)}kg`},{icon:"📦",label:"Coffee Lines",value:state.stock_items.filter(s=>s.current_kg>0).length},{icon:"📋",label:"Deliveries Logged",value:state.deliveries.length}]
        .map(({icon,label,value}) => `<div class="card" style="text-align:center;padding:14px 10px;margin-bottom:0"><div style="font-size:22px;margin-bottom:4px">${icon}</div><div style="font-size:20px;font-weight:700">${value}</div><div style="font-size:11px;color:#888;margin-top:2px">${label}</div></div>`).join("")}
    </div>`;
  if (state.stock_items.length===0) return `${stats_html}<div class="card empty"><div class="icon">🌱</div>No green coffee in stock yet.<br/>Log a delivery in the <strong>Deliveries</strong> tab to get started.</div>`;
  const sorted = [...state.stock_items].sort((a,b) => a.current_kg-b.current_kg);
  return `${stats_html}<div class="section-label">Current Green Stock</div>${sorted.map(item => {
    const last_delivery_item = state.deliveries.flatMap(d=>d.items).find(i=>i.coffee===item.coffee);
    const threshold = item.low_stock_threshold||LOW_STOCK_KG;
    const pct = Math.min(100, Math.round((item.current_kg/Math.max(item.current_kg,threshold*3))*100));
    const bar_color = item.current_kg===0?"#e05c2a":item.current_kg<threshold?"#e05c2a":item.current_kg<threshold*2?"#e0a82a":"#4a9e6b";
    const status = item.current_kg===0?{bg:"#fff0ee",color:"#e05c2a",label:"Out of Stock"}:item.current_kg<threshold?{bg:"#fff0ee",color:"#e05c2a",label:"Low Stock"}:item.current_kg<threshold*2?{bg:"#fff8ee",color:"#e0a82a",label:"Running Low"}:{bg:"#edf7f0",color:"#4a9e6b",label:"In Stock"};
    return `
      <div class="stock-card" style="border-left:4px solid ${bar_color}">
        <div class="flex-between mb-8">
          <div class="flex-wrap">
            <span style="font-weight:700;font-size:15px">${esc(item.coffee)}</span>
            <span class="tag" style="background:${status.bg};color:${status.color}">${status.label}</span>
          </div>
          <span style="font-size:22px;font-weight:700">${item.current_kg.toFixed(1)}kg</span>
        </div>
        ${last_delivery_item?.origin?`<div class="hint mt-4">Origin: <strong>${esc(last_delivery_item.origin)}</strong></div>`:""}
        ${last_delivery_item?.lot_number?`<div class="hint mt-4">Lot: <span class="mono" style="background:#f0ebe4;padding:1px 6px;border-radius:3px">${esc(last_delivery_item.lot_number)}</span></div>`:""}
        <div style="margin-top:12px">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px">
            <span>${item.current_kg.toFixed(1)}kg remaining</span><span>Low stock alert at ${threshold}kg</span>
          </div>
          <div class="stock-track"><div class="stock-fill" style="background:${bar_color};width:${pct}%"></div></div>
        </div>
        <div style="margin-top:10px;display:flex;gap:8px">
          <button class="btn btn-ghost btn-sm" data-adj-coffee="${esc(item.coffee)}">± Adjust</button>
          <button class="btn btn-ghost btn-sm" data-set-threshold="${esc(item.coffee)}" data-threshold="${threshold}">Set Alert Level</button>
        </div>
      </div>`;
  }).join("")}`;
}

function build_deliveries() {
  const { show_delivery_form, delivery, delivery_err, invoice_uploading, invoice_err } = state.ui;
  const pending_file = state.ui.pending_invoice_file;

  const form_html = show_delivery_form ? `
    <div class="card mb-16">
      <h3>Log Delivery</h3>
      <div class="grid-3 mb-12">
        <div><label class="lbl">Delivery Date *</label><input type="date" id="del-date" value="${delivery.date}" /></div>
        <div><label class="lbl">Supplier</label><input id="del-supplier" value="${esc(delivery.supplier)}" placeholder="e.g. D.R. Wakefield" /></div>
        <div><label class="lbl">Invoice / Ref No.</label><input id="del-invoice" value="${esc(delivery.invoice_ref)}" placeholder="e.g. INV-2026-042" /></div>
        <div><label class="lbl">Due Date</label><input type="date" id="del-due-date" value="${esc(delivery.due_date||"")}" /></div>
      </div>

      <div class="section-label" style="margin-bottom:8px">Attach Invoice PDF (optional)</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;background:#f5f0eb;border-radius:8px;padding:10px 14px">
        <input type="file" id="del-invoice-pdf" accept=".pdf" style="display:none" />
        <button class="btn btn-ghost btn-sm" id="choose-del-invoice-pdf">📎 Attach PDF</button>
        ${pending_file
          ? `<span style="font-size:13px;color:#4a9e6b;font-weight:600">✓ ${esc(pending_file.name)}</span>
             <button id="clear-invoice-pdf" style="background:none;border:none;color:#e05c2a;cursor:pointer;font-size:14px">✕</button>`
          : `<span class="hint" style="font-size:13px">No file attached</span>`}
        ${invoice_err ? `<span style="color:#e05c2a;font-size:12px">${esc(invoice_err)}</span>` : ""}
      </div>

      <div class="section-label" style="margin-bottom:8px">Line Items</div>
      <div id="delivery-items">${delivery.items.map((item,i) => build_delivery_item_row(item,i)).join("")}</div>
      <button class="btn btn-ghost btn-sm mt-8" id="add-delivery-item">+ Add Item</button>
      ${delivery_err?`<p class="err mt-8">${esc(delivery_err)}</p>`:""}
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-dark btn-lg" id="save-delivery" ${state.saving?"disabled":""}>${state.saving?"Saving…":"Save Delivery"}</button>
        <button class="btn btn-ghost btn-lg" id="cancel-delivery">Cancel</button>
      </div>
    </div>` : "";

  const delivery_list = state.deliveries.map(d => {
    const total_kg    = d.items.reduce((s,i) => s+(Number(i.weight_kg)||0), 0);
    const total_value = d.items.reduce((s,i) => s+(Number(i.weight_kg)||0)*(Number(i.price_per_kg)||0), 0);
    return `
      <div class="card" style="border-left:4px solid #c8a96e">
        <div class="flex-between mb-8">
          <div class="flex-wrap">
            <span style="font-weight:700;font-size:15px">${esc(d.supplier||"Delivery")}</span>
            <span class="tag" style="background:#fff8ee;color:#c8a96e">${d.date}</span>
            ${d.invoice_ref?`<span class="mono hint">${esc(d.invoice_ref)}</span>`:""}
            ${d.invoice_path?`<button class="btn btn-ghost btn-sm" style="font-size:11px" data-download-invoice="${esc(d.invoice_path)}">📄 Download Invoice</button>`:""}
          </div>
          <div style="text-align:right">
            <div style="font-weight:700;font-size:16px">${total_kg.toFixed(1)}kg</div>
            ${total_value>0?`<div class="hint" style="font-size:12px">€${total_value.toFixed(2)}</div>`:""}
          </div>
        </div>
        <div style="display:grid;gap:6px">
          ${d.items.map(item=>`
            <div style="display:flex;justify-content:space-between;align-items:center;background:#f5f0eb;border-radius:6px;padding:8px 12px;font-size:13px">
              <div>
                <div style="font-weight:600">${esc(item.coffee)}</div>
                ${item.green_name?`<div style="font-size:12px;color:#888;margin-top:1px">🌱 ${esc(item.green_name)}</div>`:""}
                ${item.origin?`<span class="hint"> · ${esc(item.origin)}</span>`:""}
                ${item.lot_number?`<span class="hint"> · Lot <span class="mono">${esc(item.lot_number)}</span></span>`:""}
              </div>
              <div style="text-align:right;white-space:nowrap">
                <span style="font-weight:600">${Number(item.weight_kg).toFixed(1)}kg</span>
                ${item.bags?`<span class="hint"> · ${item.bags} bags</span>`:""}
                ${item.price_per_kg?`<span class="hint"> · €${Number(item.price_per_kg).toFixed(2)}/kg</span>`:""}
              </div>
            </div>`).join("")}
        </div>
      </div>`;
  }).join("");

  return `
    <div class="flex-between mb-16">
      <h2>Deliveries</h2>
      <button class="btn btn-dark" id="toggle-delivery-form">+ Log Delivery</button>
    </div>
    ${form_html}
    ${state.deliveries.length===0&&!show_delivery_form
      ? `<div class="card empty"><div class="icon">📦</div>No deliveries logged yet.</div>`
      : delivery_list}`;
}
function build_delivery_item_row(item, i) {
  return `
    <div class="delivery-item" data-item-idx="${i}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-weight:600;font-size:13px;color:#888">Item ${i+1}</span>
        ${i>0?`<button style="background:none;border:none;color:#e05c2a;cursor:pointer;font-size:18px" data-remove-item="${i}">✕</button>`:""}
      </div>
      <div class="grid-2" style="gap:10px">
        <div><label class="lbl">Master Coffee Name *</label>
          <select class="item-coffee" data-idx="${i}">
            <option value="">— Select —</option>
            ${state.coffees.map(c=>`<option value="${esc(c)}" ${item.coffee===c?"selected":""}>${esc(c)}</option>`).join("")}
          </select>
        </div>
        <div><label class="lbl">Green Name</label><input class="item-green-name" data-idx="${i}" value="${esc(item.green_name||"")}" placeholder="e.g. Ethiopia Yirgacheffe Kochere Gr.1" /></div>
        <div><label class="lbl">Origin / Country</label><input class="item-origin" data-idx="${i}" value="${esc(item.origin)}" placeholder="e.g. Ethiopia" /></div>
        <div><label class="lbl">ICO / Lot No.</label><input class="item-lot" data-idx="${i}" value="${esc(item.lot_number)}" placeholder="e.g. 002/4600/0524" /></div>
        <div><label class="lbl">No. of Bags</label><input type="number" class="item-bags" data-idx="${i}" value="${item.bags}" placeholder="0" /></div>
        <div><label class="lbl">Total Weight (kg) *</label><input type="number" class="item-weight" data-idx="${i}" value="${item.weight_kg}" placeholder="0.0" step="0.1" /></div>
        <div><label class="lbl">Price per kg (€)</label><input type="number" class="item-price" data-idx="${i}" value="${item.price_per_kg}" placeholder="0.00" step="0.01" /></div>
      </div>
    </div>`;
}

function build_adjustments() {
  const { show_adj_form, adj, adj_err } = state.ui;
  const form_html = show_adj_form ? `
    <div class="card mb-16">
      <h3>Manual Adjustment</h3>
      <p class="hint mb-12">Use this to correct stock levels — spills, sampling, write-offs, or counting corrections.</p>
      <div class="grid-2">
        <div><label class="lbl">Coffee *</label>
          <select id="adj-coffee">
            <option value="">— Select coffee —</option>
            ${state.coffees.map(c=>`<option value="${esc(c)}" ${adj.coffee===c?"selected":""}>${esc(c)}</option>`).join("")}
          </select>
        </div>
        <div><label class="lbl">Reason</label>
          <select id="adj-reason">
            <option value="roast" ${adj.reason==="roast"?"selected":""}>Roast (manual)</option>
            <option value="spill" ${adj.reason==="spill"?"selected":""}>Spill / Loss</option>
            <option value="sample" ${adj.reason==="sample"?"selected":""}>Sample</option>
            <option value="correction" ${adj.reason==="correction"?"selected":""}>Stock Correction</option>
            <option value="other" ${adj.reason==="other"?"selected":""}>Other</option>
          </select>
        </div>
        <div><label class="lbl">Change (kg) — use negative to deduct *</label><input type="number" id="adj-kg" value="${adj.change_kg}" placeholder="e.g. -2.5 or +10" step="0.1" /></div>
        <div><label class="lbl">Note</label><input id="adj-note" value="${esc(adj.note)}" placeholder="Optional note" /></div>
      </div>
      ${adj_err?`<p class="err mt-8">${esc(adj_err)}</p>`:""}
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-dark btn-lg" id="save-adj" ${state.saving?"disabled":""}>${state.saving?"Saving…":"Save Adjustment"}</button>
        <button class="btn btn-ghost btn-lg" id="cancel-adj">Cancel</button>
      </div>
    </div>` : "";
  const reason_labels = { roast:"🔥 Roast", spill:"💧 Spill", sample:"🧪 Sample", correction:"🔧 Correction", delivery:"📦 Delivery", other:"📝 Other" };
  const adj_list = state.adjustments.map(a => {
    const is_pos = a.change_kg>0;
    return `
      <div class="adj-row">
        <span class="tag" style="background:${is_pos?"#edf7f0":"#fff0ee"};color:${is_pos?"#4a9e6b":"#e05c2a"};min-width:70px;text-align:center">${is_pos?"+":""}${Number(a.change_kg).toFixed(1)}kg</span>
        <span style="flex:1;font-weight:500">${esc(a.coffee)}</span>
        <span class="hint">${reason_labels[a.reason]||a.reason}</span>
        ${a.note?`<span class="hint" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.note)}</span>`:""}
        <span class="hint" style="white-space:nowrap">${a.date}</span>
        ${a.auto?`<span class="tag" style="background:#f5f0eb;color:#aaa;font-size:10px">auto</span>`:""}
      </div>`;
  }).join("");
  return `
    <div class="flex-between mb-16">
      <h2>Adjustments</h2>
      <button class="btn btn-dark" id="toggle-adj-form">± New Adjustment</button>
    </div>
    ${form_html}
    ${state.adjustments.length===0&&!show_adj_form?`<div class="card empty"><div class="icon">⚖️</div>No adjustments yet.</div>`:`<div class="card">${adj_list||`<div class="hint" style="padding:8px 0">No adjustments yet.</div>`}</div>`}`;
}

function attach_listeners() {
  const app = document.getElementById("app");
  app.querySelector("#go-dashboard")?.addEventListener("click", () => window.location.href="index.html");
  app.querySelector("#logout-btn")?.addEventListener("click", async () => { await supabaseClient.auth.signOut(); window.location.href="login.html"; });
  app.querySelectorAll("[data-tab]").forEach(btn => btn.addEventListener("click", () => { state.tab=Number(btn.dataset.tab); render(); }));
  app.querySelectorAll("[data-adj-coffee]").forEach(btn => btn.addEventListener("click", () => { state.ui.adj.coffee=btn.dataset.adjCoffee; state.ui.show_adj_form=true; state.tab=2; render(); }));
  app.querySelectorAll("[data-set-threshold]").forEach(btn => btn.addEventListener("click", () => {
    const coffee=btn.dataset.setThreshold, current=Number(btn.dataset.threshold)||LOW_STOCK_KG;
    const val=prompt(`Low stock alert threshold for ${coffee} (kg):`, current);
    if (val!==null&&Number(val)>0) set_threshold(coffee, Number(val));
  }));
  app.querySelector("#toggle-delivery-form")?.addEventListener("click", () => {
    state.ui.show_delivery_form=!state.ui.show_delivery_form;
    state.ui.delivery=new_delivery();
    state.ui.delivery_err="";
    state.ui.pending_invoice_file=null;
    render();
  });
  app.querySelector("#cancel-delivery")?.addEventListener("click", () => {
    state.ui.show_delivery_form=false;
    state.ui.delivery_err="";
    state.ui.pending_invoice_file=null;
    render();
  });

  // Invoice PDF attach
  app.querySelector("#choose-del-invoice-pdf")?.addEventListener("click", () => {
    document.getElementById("del-invoice-pdf")?.click();
  });
  app.querySelector("#del-invoice-pdf")?.addEventListener("change", e => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.type !== "application/pdf") { state.ui.invoice_err="Please select a PDF file."; render(); return; }
    state.ui.pending_invoice_file = file;
    state.ui.invoice_err = "";
    render();
  });
  app.querySelector("#clear-invoice-pdf")?.addEventListener("click", () => {
    state.ui.pending_invoice_file = null;
    render();
  });

  // Download invoice
  app.querySelectorAll("[data-download-invoice]").forEach(btn => btn.addEventListener("click", () => {
    download_invoice(btn.dataset.downloadInvoice);
  }));

  app.querySelector("#add-delivery-item")?.addEventListener("click", () => {
    state.ui.delivery.items.push(new_delivery_item()); render();
  });
  app.querySelectorAll("[data-remove-item]").forEach(btn => btn.addEventListener("click", () => {
    state.ui.delivery.items.splice(Number(btn.dataset.removeItem),1); render();
  }));
  const sync = (sel, field) => app.querySelectorAll(sel).forEach(el => {
    el.addEventListener("input",  e => { state.ui.delivery.items[Number(el.dataset.idx)][field]=e.target.value; });
    el.addEventListener("change", e => { state.ui.delivery.items[Number(el.dataset.idx)][field]=e.target.value; });
  });
  sync(".item-coffee","coffee"); sync(".item-green-name","green_name"); sync(".item-origin","origin");
  sync(".item-lot","lot_number"); sync(".item-bags","bags"); sync(".item-weight","weight_kg"); sync(".item-price","price_per_kg");

  app.querySelector("#save-delivery")?.addEventListener("click", () => {
    app.querySelectorAll(".item-coffee").forEach(el     => { state.ui.delivery.items[Number(el.dataset.idx)].coffee=el.value; });
    app.querySelectorAll(".item-green-name").forEach(el => { state.ui.delivery.items[Number(el.dataset.idx)].green_name=el.value; });
    app.querySelectorAll(".item-origin").forEach(el     => { state.ui.delivery.items[Number(el.dataset.idx)].origin=el.value; });
    app.querySelectorAll(".item-lot").forEach(el        => { state.ui.delivery.items[Number(el.dataset.idx)].lot_number=el.value; });
    app.querySelectorAll(".item-bags").forEach(el       => { state.ui.delivery.items[Number(el.dataset.idx)].bags=el.value; });
    app.querySelectorAll(".item-weight").forEach(el     => { state.ui.delivery.items[Number(el.dataset.idx)].weight_kg=el.value; });
    app.querySelectorAll(".item-price").forEach(el      => { state.ui.delivery.items[Number(el.dataset.idx)].price_per_kg=el.value; });
    state.ui.delivery.date=document.getElementById("del-date")?.value||state.ui.delivery.date;
    state.ui.delivery.supplier=document.getElementById("del-supplier")?.value||state.ui.delivery.supplier;
    state.ui.delivery.invoice_ref=document.getElementById("del-invoice")?.value||state.ui.delivery.invoice_ref;
    state.ui.delivery.due_date=document.getElementById("del-due-date")?.value||state.ui.delivery.due_date;
    save_delivery();
  });

  app.querySelector("#toggle-adj-form")?.addEventListener("click", () => { state.ui.show_adj_form=!state.ui.show_adj_form; state.ui.adj_err=""; render(); });
  app.querySelector("#cancel-adj")?.addEventListener("click", () => { state.ui.show_adj_form=false; state.ui.adj_err=""; render(); });
  app.querySelector("#save-adj")?.addEventListener("click", () => save_adjustment());
}
</script>
</body>
</html>
