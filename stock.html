<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock — Bear Roastery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f0eb; min-height: 100vh; color: #1a1008; }
    input, select, button { font-family: inherit; font-size: 14px; }
    button { cursor: pointer; }

    /* ── Header ── */
    .header {
      background: #1a1008; color: #e8d5b0;
      padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
    }
    .header-left  { display: flex; align-items: center; gap: 12px; }
    .header-back  { background: none; border: none; color: #c8a96e; font-size: 13px; cursor: pointer; padding: 4px 0; }
    .header-back:hover { color: #e8d5b0; }
    .header-title { font-weight: 700; font-size: 18px; }
    .header-sub   { font-size: 12px; color: #c8a96e; margin-top: 1px; }

    .btn-logout {
      background: none; border: 1px solid #c8a96e; color: #c8a96e;
      border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-logout:hover { background: #c8a96e; color: #1a1008; }

    /* ── Layout ── */
    .content { padding: 24px; max-width: 900px; margin: 0 auto; }

    /* ── Tabs ── */
    .tabs { display: flex; border-bottom: 2px solid #c8a96e; background: #fff; overflow-x: auto; }
    .tab-btn { padding: 12px 20px; border: none; background: #fff; color: #555; font-weight: 400; font-size: 14px; white-space: nowrap; cursor: pointer; }
    .tab-btn.active { background: #1a1008; color: #e8d5b0; font-weight: 700; }

    /* ── Cards ── */
    .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 12px; }

    /* ── Form elements ── */
    label.lbl { display: block; font-size: 12px; color: #888; margin-bottom: 4px; font-weight: 500; }
    input, select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px; }
    input:focus, select:focus { outline: 2px solid #c8a96e; border-color: #c8a96e; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .span-2 { grid-column: 1 / -1; }

    /* ── Buttons ── */
    .btn { color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-size: 14px; font-weight: 600; }
    .btn-dark  { background: #1a1008; }
    .btn-green { background: #4a9e6b; }
    .btn-amber { background: #c8a96e; }
    .btn-grey  { background: #888; }
    .btn-red   { background: #e05c2a; }
    .btn-ghost { background: #f5f0eb; color: #5a3e1b; border: 1px solid #e0d5c5; }
    .btn-sm    { padding: 4px 10px; font-size: 12px; }
    .btn-lg    { padding: 12px 24px; }

    /* ── Tags ── */
    .tag { border-radius: 10px; padding: 2px 8px; font-size: 12px; font-weight: 600; display: inline-block; }

    /* ── Stock bar ── */
    .stock-track { background: #e0d5c5; border-radius: 4px; height: 10px; }
    .stock-fill  { border-radius: 4px; height: 10px; transition: width 0.3s; }

    /* ── Stock item card ── */
    .stock-card {
      background: #fff; border-radius: 8px; padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 10px;
    }

    /* ── Delivery item rows ── */
    .delivery-item {
      background: #f5f0eb; border-radius: 8px; padding: 12px; margin-bottom: 10px;
    }

    /* ── Adjustment row ── */
    .adj-row {
      display: flex; align-items: center; gap: 10px; padding: 8px 0;
      border-bottom: 1px solid #f0ebe4; font-size: 13px;
    }
    .adj-row:last-child { border-bottom: none; }

    /* ── Misc ── */
    .mono  { font-family: monospace; }
    .err   { color: #e05c2a; font-size: 13px; margin-top: 8px; }
    .hint  { color: #888; font-size: 13px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .flex-wrap    { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .gap-8  { gap: 8px; }
    .mt-4   { margin-top: 4px; }
    .mt-8   { margin-top: 8px; }
    .mt-12  { margin-top: 12px; }
    .mt-16  { margin-top: 16px; }
    .mb-8   { margin-bottom: 8px; }
    .mb-12  { margin-bottom: 12px; }
    .mb-16  { margin-bottom: 16px; }
    h2 { color: #1a1008; }
    h3 { color: #1a1008; margin-bottom: 12px; }
    .section-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #c8a96e; margin-bottom: 12px; }
    .empty { text-align: center; color: #aaa; padding: 40px 20px; }
    .empty .icon { font-size: 36px; margin-bottom: 8px; }

    /* ── Low stock warning ── */
    .low-stock { background: #fff0ee; border: 1px solid #e05c2a; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; color: #e05c2a; }

    @media (max-width: 600px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .content { padding: 16px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
<div id="app"></div>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// BEAR ROASTERY — Stock Management (Green Coffee)
//
// Tracks green coffee stock:
//   - Log deliveries (weight, bags, price per kg, lot/invoice, origin)
//   - Stock depletes automatically when roast sessions are read from localStorage
//   - Manual adjustments (spills, write-offs, corrections)
//   - Low stock warnings per coffee
// ─────────────────────────────────────────────────────────────────────────────

// ── AUTH ──────────────────────────────────────────────────────────────────────
const supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
supabase.auth.getSession().then(({ data: { session } }) => {
  if (!session) window.location.href = "login.html";
});

// ── CONSTANTS ─────────────────────────────────────────────────────────────────

// Matches coffee names used in the Roasts module
const COFFEES = [
  "House Roast Dark Horse",
  "Sugar Cane Arcadia (Decaf) BAR",
  "Ethiopia Bezzabesh",
  "Rwanda Kigali",
  "Hermosa",
  "Batch Brew",
];

// Low stock threshold in kg — warn when any coffee drops below this
const LOW_STOCK_KG = 20;

// ── STATE ─────────────────────────────────────────────────────────────────────
const state = {
  tab: 0,             // 0 = Green Stock, 1 = Deliveries, 2 = Adjustments

  // Each stock item: { id, coffee, origin, currentKg, lowStockThreshold }
  stockItems: [],

  // Each delivery: { id, date, supplier, invoiceRef, items: [{ coffee, origin, lotNumber, bags, weightKg, pricePerKg }] }
  deliveries: [],

  // Each manual adjustment: { id, date, coffee, changeKg, reason, note }
  adjustments: [],

  ui: {
    showDeliveryForm: false,
    showAdjForm:      false,
    deliveryErr:      "",
    adjErr:           "",
    // Delivery form state
    delivery: newDelivery(),
    // Adjustment form state
    adj: { coffee:"", changeKg:"", reason:"roast", note:"" },
  },
};

// ── HELPERS ───────────────────────────────────────────────────────────────────
function today()  { return new Date().toISOString().split("T")[0]; }
function esc(s)   { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function genId(prefix, list) { return `${prefix}-${today().replace(/-/g,"")}-${String(list.length+1).padStart(3,"0")}`; }

function newDelivery() {
  return {
    date: today(), supplier: "", invoiceRef: "",
    items: [{ coffee:"", origin:"", lotNumber:"", bags:"", weightKg:"", pricePerKg:"" }],
  };
}

// Get or create a stock item for a given coffee name
function getOrCreateStock(coffee) {
  let item = state.stockItems.find(s => s.coffee === coffee);
  if (!item) {
    item = { id: genId("STK", state.stockItems), coffee, origin:"", currentKg: 0, lowStockThreshold: LOW_STOCK_KG };
    state.stockItems.push(item);
  }
  return item;
}

// Read roast sessions from localStorage (written by Roasts module)
// and deduct any green usage not yet accounted for
function syncRoastDeductions() {
  try {
    const raw = localStorage.getItem("roast_deductions_applied") || "[]";
    const applied = JSON.parse(raw); // array of roast session IDs already deducted
    const sessionsRaw = localStorage.getItem("roast_sessions");
    if (!sessionsRaw) return;
    const sessions = JSON.parse(sessionsRaw);
    sessions.forEach(session => {
      if (applied.includes(session.id)) return; // already deducted
      session.batches.forEach(batch => {
        const kg = Number(batch.greenWeight) || 0;
        if (!kg || !session.coffee) return;
        const stock = getOrCreateStock(session.coffee);
        stock.currentKg = Math.max(0, stock.currentKg - kg);
        // Log as an auto adjustment for transparency
        state.adjustments.push({
          id:       genId("ADJ", state.adjustments),
          date:     session.date,
          coffee:   session.coffee,
          changeKg: -kg,
          reason:   "roast",
          note:     `Auto-deducted from roast session ${session.id}`,
          auto:     true,
        });
      });
      applied.push(session.id);
    });
    localStorage.setItem("roast_deductions_applied", JSON.stringify(applied));
  } catch (e) {
    console.warn("Could not sync roast deductions:", e);
  }
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  document.getElementById("app").innerHTML = buildApp();
  attachListeners();
}

function buildApp() {
  // Sync any new roast sessions from localStorage on each render
  syncRoastDeductions();

  const lowStockItems = state.stockItems.filter(s => s.currentKg < (s.lowStockThreshold || LOW_STOCK_KG) && s.currentKg > 0);
  const outOfStock    = state.stockItems.filter(s => s.currentKg === 0 && s.coffee);

  const tabs = ["🌱 Green Stock", "📦 Deliveries", "⚖️ Adjustments"];

  return `
    <div class="header">
      <div class="header-left">
        <button class="header-back" id="go-dashboard">← Dashboard</button>
        <div style="width:1px;height:28px;background:#333;margin:0 4px"></div>
        <div>
          <div class="header-title">📦 Stock</div>
          <div class="header-sub">Bear Roastery</div>
        </div>
      </div>
      <button class="btn-logout" id="logout-btn">Log Out</button>
    </div>
    <div class="tabs">
      ${tabs.map((t,i) => `<button class="tab-btn${state.tab===i?" active":""}" data-tab="${i}">${t}</button>`).join("")}
    </div>
    <div class="content">
      ${lowStockItems.length > 0 || outOfStock.length > 0 ? `
        <div class="low-stock">
          ⚠️ Low stock:
          ${[...outOfStock.map(s=>`<strong>${esc(s.coffee)}</strong> — out of stock`),
             ...lowStockItems.map(s=>`<strong>${esc(s.coffee)}</strong> — ${s.currentKg.toFixed(1)}kg remaining`)
            ].join(" · ")}
        </div>` : ""}
      ${ state.tab === 0 ? buildGreenStock()  :
         state.tab === 1 ? buildDeliveries()  :
         state.tab === 2 ? buildAdjustments() : "" }
    </div>`;
}

// ── GREEN STOCK TAB ───────────────────────────────────────────────────────────
function buildGreenStock() {
  // Summary stats
  const totalKg    = state.stockItems.reduce((s,i) => s+i.currentKg, 0);
  const totalValue = state.deliveries.reduce((s,d) =>
    s + d.items.reduce((ds,item) => ds + (Number(item.weightKg)||0) * (Number(item.pricePerKg)||0), 0), 0);

  const statsHtml = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px">
      ${[
        { icon:"🌱", label:"Total Green Stock", value:`${totalKg.toFixed(1)}kg` },
        { icon:"📦", label:"Coffee Lines",      value: state.stockItems.filter(s=>s.currentKg>0).length },
        { icon:"📋", label:"Deliveries Logged", value: state.deliveries.length },
      ].map(({icon,label,value}) => `
        <div class="card" style="text-align:center;padding:14px 10px;margin-bottom:0">
          <div style="font-size:22px;margin-bottom:4px">${icon}</div>
          <div style="font-size:20px;font-weight:700">${value}</div>
          <div style="font-size:11px;color:#888;margin-top:2px">${label}</div>
        </div>`).join("")}
    </div>`;

  if (state.stockItems.length === 0) return `
    ${statsHtml}
    <div class="card empty">
      <div class="icon">🌱</div>
      No green coffee in stock yet.<br/>Log a delivery in the <strong>Deliveries</strong> tab to get started.
    </div>`;

  // Sort: lowest stock first as a gentle nudge to reorder
  const sorted = [...state.stockItems].sort((a,b) => a.currentKg - b.currentKg);

  return `
    ${statsHtml}
    <div class="section-label">Current Green Stock</div>
    ${sorted.map(item => {
      // Find the most recent delivery for this coffee to show origin + lot
      const lastDeliveryItem = [...state.deliveries]
        .reverse()
        .flatMap(d => d.items)
        .find(i => i.coffee === item.coffee);

      const threshold = item.lowStockThreshold || LOW_STOCK_KG;
      const pct       = Math.min(100, Math.round((item.currentKg / Math.max(item.currentKg, threshold * 3)) * 100));
      const barColor  = item.currentKg === 0 ? "#e05c2a" : item.currentKg < threshold ? "#e05c2a" : item.currentKg < threshold * 2 ? "#e0a82a" : "#4a9e6b";
      const status    = item.currentKg === 0 ? { bg:"#fff0ee", color:"#e05c2a", label:"Out of Stock" }
                      : item.currentKg < threshold ? { bg:"#fff0ee", color:"#e05c2a", label:"Low Stock" }
                      : item.currentKg < threshold * 2 ? { bg:"#fff8ee", color:"#e0a82a", label:"Running Low" }
                      : { bg:"#edf7f0", color:"#4a9e6b", label:"In Stock" };

      return `
        <div class="stock-card" style="border-left:4px solid ${barColor}">
          <div class="flex-between mb-8">
            <div class="flex-wrap">
              <span style="font-weight:700;font-size:15px">${esc(item.coffee)}</span>
              <span class="tag" style="background:${status.bg};color:${status.color}">${status.label}</span>
            </div>
            <span style="font-size:22px;font-weight:700">${item.currentKg.toFixed(1)}kg</span>
          </div>
          ${lastDeliveryItem?.origin   ? `<div class="hint mt-4">Origin: <strong>${esc(lastDeliveryItem.origin)}</strong></div>` : ""}
          ${lastDeliveryItem?.lotNumber? `<div class="hint mt-4">Lot: <span class="mono" style="background:#f0ebe4;padding:1px 6px;border-radius:3px">${esc(lastDeliveryItem.lotNumber)}</span></div>` : ""}
          <div style="margin-top:12px">
            <div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px">
              <span>${item.currentKg.toFixed(1)}kg remaining</span>
              <span>Low stock alert at ${threshold}kg</span>
            </div>
            <div class="stock-track">
              <div class="stock-fill" style="background:${barColor};width:${pct}%"></div>
            </div>
          </div>
          <div style="margin-top:10px;display:flex;gap:8px">
            <button class="btn btn-ghost btn-sm" data-adj-coffee="${esc(item.coffee)}">± Adjust</button>
            <button class="btn btn-ghost btn-sm" data-set-threshold="${esc(item.coffee)}">Set Alert Level</button>
          </div>
        </div>`;
    }).join("")}`;
}

// ── DELIVERIES TAB ────────────────────────────────────────────────────────────
function buildDeliveries() {
  const { showDeliveryForm, delivery, deliveryErr } = state.ui;

  const formHtml = showDeliveryForm ? `
    <div class="card mb-16">
      <h3>Log Delivery</h3>
      <div class="grid-3 mb-12">
        <div><label class="lbl">Delivery Date *</label><input type="date" id="del-date" value="${delivery.date}" /></div>
        <div><label class="lbl">Supplier</label><input id="del-supplier" value="${esc(delivery.supplier)}" placeholder="e.g. Falcon Coffees" /></div>
        <div><label class="lbl">Invoice / Ref No.</label><input id="del-invoice" value="${esc(delivery.invoiceRef)}" placeholder="e.g. INV-2026-042" /></div>
      </div>

      <div class="section-label" style="margin-bottom:8px">Line Items</div>
      <div id="delivery-items">
        ${delivery.items.map((item, i) => buildDeliveryItemRow(item, i)).join("")}
      </div>
      <button class="btn btn-ghost btn-sm mt-8" id="add-delivery-item">+ Add Item</button>

      ${deliveryErr ? `<p class="err mt-8">${esc(deliveryErr)}</p>` : ""}
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-dark btn-lg" id="save-delivery">Save Delivery</button>
        <button class="btn btn-ghost btn-lg" id="cancel-delivery">Cancel</button>
      </div>
    </div>` : "";

  const deliveryList = [...state.deliveries].reverse().map(d => {
    const totalKg    = d.items.reduce((s,i) => s+(Number(i.weightKg)||0), 0);
    const totalValue = d.items.reduce((s,i) => s+(Number(i.weightKg)||0)*(Number(i.pricePerKg)||0), 0);
    return `
      <div class="card" style="border-left:4px solid #c8a96e">
        <div class="flex-between mb-8">
          <div class="flex-wrap">
            <span style="font-weight:700;font-size:15px">${esc(d.supplier||"Delivery")}</span>
            <span class="tag" style="background:#fff8ee;color:#c8a96e">${d.date}</span>
            ${d.invoiceRef ? `<span class="mono hint">${esc(d.invoiceRef)}</span>` : ""}
          </div>
          <div style="text-align:right">
            <div style="font-weight:700;font-size:16px">${totalKg.toFixed(1)}kg</div>
            ${totalValue>0?`<div class="hint" style="font-size:12px">€${totalValue.toFixed(2)}</div>`:""}
          </div>
        </div>
        <div style="display:grid;gap:6px">
          ${d.items.map(item => `
            <div style="display:flex;justify-content:space-between;align-items:center;background:#f5f0eb;border-radius:6px;padding:8px 12px;font-size:13px">
              <div>
                <span style="font-weight:600">${esc(item.coffee)}</span>
                ${item.origin    ? `<span class="hint"> · ${esc(item.origin)}</span>` : ""}
                ${item.lotNumber ? `<span class="hint"> · Lot <span class="mono">${esc(item.lotNumber)}</span></span>` : ""}
              </div>
              <div style="text-align:right;white-space:nowrap">
                <span style="font-weight:600">${Number(item.weightKg).toFixed(1)}kg</span>
                ${item.bags      ? `<span class="hint"> · ${item.bags} bags</span>` : ""}
                ${item.pricePerKg? `<span class="hint"> · €${Number(item.pricePerKg).toFixed(2)}/kg</span>` : ""}
              </div>
            </div>`).join("")}
        </div>
      </div>`;
  }).join("");

  return `
    <div class="flex-between mb-16">
      <h2>Deliveries</h2>
      <button class="btn btn-dark" id="toggle-delivery-form">+ Log Delivery</button>
    </div>
    ${formHtml}
    ${state.deliveries.length === 0 && !showDeliveryForm
      ? `<div class="card empty"><div class="icon">📦</div>No deliveries logged yet.</div>`
      : deliveryList}`;
}

function buildDeliveryItemRow(item, i) {
  return `
    <div class="delivery-item" data-item-idx="${i}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-weight:600;font-size:13px;color:#888">Item ${i+1}</span>
        ${i > 0 ? `<button style="background:none;border:none;color:#e05c2a;cursor:pointer;font-size:18px" data-remove-item="${i}">✕</button>` : ""}
      </div>
      <div class="grid-2" style="gap:10px">
        <div>
          <label class="lbl">Coffee *</label>
          <select class="item-coffee" data-idx="${i}">
            <option value="">— Select —</option>
            ${COFFEES.map(c=>`<option value="${esc(c)}" ${item.coffee===c?"selected":""}>${esc(c)}</option>`).join("")}
          </select>
        </div>
        <div><label class="lbl">Origin / Country</label><input class="item-origin" data-idx="${i}" value="${esc(item.origin)}" placeholder="e.g. Ethiopia" /></div>
        <div><label class="lbl">Lot / Invoice No.</label><input class="item-lot" data-idx="${i}" value="${esc(item.lotNumber)}" placeholder="e.g. ETH-2026-01" /></div>
        <div><label class="lbl">No. of Bags</label><input type="number" class="item-bags" data-idx="${i}" value="${item.bags}" placeholder="0" /></div>
        <div><label class="lbl">Total Weight (kg) *</label><input type="number" class="item-weight" data-idx="${i}" value="${item.weightKg}" placeholder="0.0" step="0.1" /></div>
        <div><label class="lbl">Price per kg (€)</label><input type="number" class="item-price" data-idx="${i}" value="${item.pricePerKg}" placeholder="0.00" step="0.01" /></div>
      </div>
    </div>`;
}

// ── ADJUSTMENTS TAB ───────────────────────────────────────────────────────────
function buildAdjustments() {
  const { showAdjForm, adj, adjErr } = state.ui;

  const formHtml = showAdjForm ? `
    <div class="card mb-16">
      <h3>Manual Adjustment</h3>
      <p class="hint mb-12">Use this to correct stock levels — spills, sampling, write-offs, or counting corrections.</p>
      <div class="grid-2">
        <div>
          <label class="lbl">Coffee *</label>
          <select id="adj-coffee">
            <option value="">— Select coffee —</option>
            ${COFFEES.map(c=>`<option value="${esc(c)}" ${adj.coffee===c?"selected":""}>${esc(c)}</option>`).join("")}
          </select>
        </div>
        <div>
          <label class="lbl">Reason</label>
          <select id="adj-reason">
            <option value="roast"      ${adj.reason==="roast"?"selected":""}>Roast (manual)</option>
            <option value="spill"      ${adj.reason==="spill"?"selected":""}>Spill / Loss</option>
            <option value="sample"     ${adj.reason==="sample"?"selected":""}>Sample</option>
            <option value="correction" ${adj.reason==="correction"?"selected":""}>Stock Correction</option>
            <option value="other"      ${adj.reason==="other"?"selected":""}>Other</option>
          </select>
        </div>
        <div>
          <label class="lbl">Change (kg) — use negative to deduct *</label>
          <input type="number" id="adj-kg" value="${adj.changeKg}" placeholder="e.g. -2.5 or +10" step="0.1" />
        </div>
        <div>
          <label class="lbl">Note</label>
          <input id="adj-note" value="${esc(adj.note)}" placeholder="Optional note" />
        </div>
      </div>
      ${adjErr ? `<p class="err mt-8">${esc(adjErr)}</p>` : ""}
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-dark btn-lg" id="save-adj">Save Adjustment</button>
        <button class="btn btn-ghost btn-lg" id="cancel-adj">Cancel</button>
      </div>
    </div>` : "";

  // All adjustments including auto-deductions from roasts
  const allAdj = [...state.adjustments].reverse();
  const reasonLabels = { roast:"🔥 Roast", spill:"💧 Spill", sample:"🧪 Sample", correction:"🔧 Correction", other:"📝 Other" };

  const adjList = allAdj.map(a => {
    const isPos = a.changeKg > 0;
    return `
      <div class="adj-row">
        <span class="tag" style="background:${isPos?"#edf7f0":"#fff0ee"};color:${isPos?"#4a9e6b":"#e05c2a"};min-width:70px;text-align:center">
          ${isPos?"+":""}${Number(a.changeKg).toFixed(1)}kg
        </span>
        <span style="flex:1;font-weight:500">${esc(a.coffee)}</span>
        <span class="hint">${reasonLabels[a.reason]||a.reason}</span>
        ${a.note ? `<span class="hint" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.note)}</span>` : ""}
        <span class="hint" style="white-space:nowrap">${a.date}</span>
        ${a.auto ? `<span class="tag" style="background:#f5f0eb;color:#aaa;font-size:10px">auto</span>` : ""}
      </div>`;
  }).join("");

  return `
    <div class="flex-between mb-16">
      <h2>Adjustments</h2>
      <button class="btn btn-dark" id="toggle-adj-form">± New Adjustment</button>
    </div>
    ${formHtml}
    ${state.adjustments.length === 0 && !showAdjForm
      ? `<div class="card empty"><div class="icon">⚖️</div>No adjustments yet.</div>`
      : `<div class="card">${adjList || `<div class="hint" style="padding:8px 0">No adjustments yet.</div>`}</div>`}`;
}

// ── LISTENERS ─────────────────────────────────────────────────────────────────
function attachListeners() {
  const app = document.getElementById("app");

  // Navigation
  app.querySelector("#go-dashboard")?.addEventListener("click", () => window.location.href="index.html");
  app.querySelector("#logout-btn")?.addEventListener("click", async () => {
    await supabase.auth.signOut();
    window.location.href = "login.html";
  });

  // Tabs
  app.querySelectorAll("[data-tab]").forEach(btn => btn.addEventListener("click", () => {
    state.tab = Number(btn.dataset.tab); render();
  }));

  // ── Green stock actions
  // Quick adjust button — pre-fills the adjustment form with the coffee
  app.querySelectorAll("[data-adj-coffee]").forEach(btn => btn.addEventListener("click", () => {
    state.ui.adj.coffee = btn.dataset.adjCoffee;
    state.ui.showAdjForm = true;
    state.tab = 2; render();
  }));

  // Set alert threshold
  app.querySelectorAll("[data-set-threshold]").forEach(btn => btn.addEventListener("click", () => {
    const coffee = btn.dataset.setThreshold;
    const item   = state.stockItems.find(s => s.coffee===coffee);
    if (!item) return;
    const val = prompt(`Low stock alert threshold for ${coffee} (kg):`, item.lowStockThreshold || LOW_STOCK_KG);
    if (val !== null && Number(val) > 0) { item.lowStockThreshold = Number(val); render(); }
  }));

  // ── Delivery form
  app.querySelector("#toggle-delivery-form")?.addEventListener("click", () => {
    state.ui.showDeliveryForm = !state.ui.showDeliveryForm;
    state.ui.delivery = newDelivery();
    state.ui.deliveryErr = "";
    render();
  });

  app.querySelector("#cancel-delivery")?.addEventListener("click", () => {
    state.ui.showDeliveryForm = false; state.ui.deliveryErr = ""; render();
  });

  app.querySelector("#add-delivery-item")?.addEventListener("click", () => {
    state.ui.delivery.items.push({ coffee:"", origin:"", lotNumber:"", bags:"", weightKg:"", pricePerKg:"" });
    render();
  });

  // Remove delivery item row
  app.querySelectorAll("[data-remove-item]").forEach(btn => btn.addEventListener("click", () => {
    state.ui.delivery.items.splice(Number(btn.dataset.removeItem), 1); render();
  }));

  // Live sync delivery item fields
  const syncItemField = (selector, field) => {
    app.querySelectorAll(selector).forEach(el => el.addEventListener("input", e => {
      state.ui.delivery.items[Number(el.dataset.idx)][field] = e.target.value;
    }));
    app.querySelectorAll(selector).forEach(el => el.addEventListener("change", e => {
      state.ui.delivery.items[Number(el.dataset.idx)][field] = e.target.value;
    }));
  };
  syncItemField(".item-coffee",  "coffee");
  syncItemField(".item-origin",  "origin");
  syncItemField(".item-lot",     "lotNumber");
  syncItemField(".item-bags",    "bags");
  syncItemField(".item-weight",  "weightKg");
  syncItemField(".item-price",   "pricePerKg");

  app.querySelector("#save-delivery")?.addEventListener("click", () => {
    // Read all current field values from DOM
    app.querySelectorAll(".item-coffee").forEach(el  => { state.ui.delivery.items[Number(el.dataset.idx)].coffee     = el.value; });
    app.querySelectorAll(".item-origin").forEach(el  => { state.ui.delivery.items[Number(el.dataset.idx)].origin     = el.value; });
    app.querySelectorAll(".item-lot").forEach(el     => { state.ui.delivery.items[Number(el.dataset.idx)].lotNumber  = el.value; });
    app.querySelectorAll(".item-bags").forEach(el    => { state.ui.delivery.items[Number(el.dataset.idx)].bags       = el.value; });
    app.querySelectorAll(".item-weight").forEach(el  => { state.ui.delivery.items[Number(el.dataset.idx)].weightKg  = el.value; });
    app.querySelectorAll(".item-price").forEach(el   => { state.ui.delivery.items[Number(el.dataset.idx)].pricePerKg= el.value; });

    const del    = state.ui.delivery;
    const errEl  = () => state.ui.deliveryErr;
    const validItems = del.items.filter(i => i.coffee && Number(i.weightKg) > 0);

    if (!del.date)          { state.ui.deliveryErr="Please enter a delivery date."; render(); return; }
    if (!validItems.length) { state.ui.deliveryErr="Please add at least one item with a coffee and weight."; render(); return; }

    // Save delivery
    const saved = {
      id:         genId("DEL", state.deliveries),
      date:       document.getElementById("del-date")?.value || del.date,
      supplier:   document.getElementById("del-supplier")?.value.trim() || del.supplier,
      invoiceRef: document.getElementById("del-invoice")?.value.trim()  || del.invoiceRef,
      items:      validItems.map(i => ({ ...i })),
    };
    state.deliveries.push(saved);

    // Add weight to stock for each item
    validItems.forEach(item => {
      const stock = getOrCreateStock(item.coffee);
      stock.currentKg += Number(item.weightKg) || 0;
      if (item.origin) stock.origin = item.origin;
      // Log as a positive adjustment for a full audit trail
      state.adjustments.push({
        id:       genId("ADJ", state.adjustments),
        date:     saved.date,
        coffee:   item.coffee,
        changeKg: Number(item.weightKg),
        reason:   "delivery",
        note:     `Delivery ${saved.id}${saved.invoiceRef?" · "+saved.invoiceRef:""}`,
        auto:     true,
      });
    });

    state.ui.showDeliveryForm = false; state.ui.deliveryErr = ""; render();
  });

  // ── Adjustment form
  app.querySelector("#toggle-adj-form")?.addEventListener("click", () => {
    state.ui.showAdjForm = !state.ui.showAdjForm; state.ui.adjErr = ""; render();
  });

  app.querySelector("#cancel-adj")?.addEventListener("click", () => {
    state.ui.showAdjForm = false; state.ui.adjErr = ""; render();
  });

  app.querySelector("#save-adj")?.addEventListener("click", () => {
    const coffee = document.getElementById("adj-coffee")?.value;
    const kg     = Number(document.getElementById("adj-kg")?.value);
    const reason = document.getElementById("adj-reason")?.value;
    const note   = document.getElementById("adj-note")?.value.trim();
    if (!coffee)  { state.ui.adjErr="Please select a coffee."; render(); return; }
    if (!kg)      { state.ui.adjErr="Please enter a non-zero kg value."; render(); return; }

    // Apply the adjustment to the stock item
    const stock = getOrCreateStock(coffee);
    stock.currentKg = Math.max(0, stock.currentKg + kg);

    state.adjustments.push({
      id: genId("ADJ", state.adjustments),
      date: today(), coffee, changeKg: kg, reason, note, auto: false,
    });

    state.ui.adj = { coffee:"", changeKg:"", reason:"roast", note:"" };
    state.ui.showAdjForm = false; state.ui.adjErr = ""; render();
  });
}

// ── INIT ──────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
