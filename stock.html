  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

<body>
<div id="app"></div>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// BEAR MRKT — Stock Management (Green Coffee)
// ─────────────────────────────────────────────────────────────────────────────

const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
  if (!session) { window.location.href = "login.html"; return; }
  const { data: role_row } = await supabaseClient.from("user_roles").select("role").eq("user_id", session.user.id).maybeSingle();
  if (role_row?.role !== "admin") { window.location.href = "reports.html"; return; }
  init();
});

const LOW_STOCK_KG = 20;

const state = {
  tab: 0,
  coffees: [],
  coffees_obj: [],        // [{id, name}] for the contract green-coffee picker
  stock_items: [],
  deliveries: [],
  adjustments: [],
  contracts: [],          // green_contracts rows
  contract_delivered: {}, // { [contract_id]: bags drawn down }
  containers: [],         // active containers for staff takeaway picker
  staff_dispatches: [],   // recent staff takeaway log
  loading: true,
  saving: false,
  ui: {
    show_delivery_form: false,
    show_adj_form: false,
    show_contract_form: false,
    show_quick_stock: false,
    quick_err: "",
    quick_ok: "",
    quick_saving: false,
    delivery_err: "",
    adj_err: "",
    contract_err: "",
    invoice_err: "",
    contract_file_err: "",
    delivery: new_delivery(),
    contract: new_contract(),
    pending_invoice_file: null,   // File object staged for upload after delivery saves
    pending_contract_file: null,  // File staged for upload after contract saves
    adj: { coffee: "", change_kg: "", reason: "", note: "" },   // no default: the kind must be chosen
    // Attaching an invoice to an arrival that was logged before the invoice arrived.
    // Only invoice_ref, the PDF and per-line price_per_kg are editable — the physical
    // facts of a delivery are recorded on the day and not revised.
    invoice_edit: null,        // { arrival_id, invoice_ref, prices: { line_id: value }, file, err, saving }
    staff: { coffee: "", container_id: "", bag_size: "200g", err: "", saving: false },
  },
};

function today() { return new Date().toISOString().split("T")[0]; }
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function gen_id(prefix) {
  const r = crypto.randomUUID().split("-")[0].toUpperCase();
  return `${prefix}-${today().replace(/-/g,"")}-${r}`;
}

function new_delivery() {
  return { date: today(), supplier: "", invoice_ref: "", due_date: "", items: [new_delivery_item()] };
}
function new_delivery_item() {
  return { coffee:"", green_name:"", origin:"", lot_number:"", ico_number:"", bags:"", weight_kg:"", price_per_kg:"", contract_id:"" };
}
function new_contract() {
  return { supplier:"", coffee_id:"", bag_count:"", low_bag_threshold:"100" };
}
function coffee_name_by_id(id) { const c = state.coffees_obj.find(x => x.id === id); return c ? c.name : "—"; }
function coffee_id_by_name(name) { const c = state.coffees_obj.find(x => x.name === name); return c ? c.id : null; }
function contract_remaining(c) { return Number(c.bag_count||0) - Number(state.contract_delivered[c.id]||0); }

async function load_data() {
  const { data: coffees_data } = await supabaseClient.from("coffees").select("id, name").order("name");
  state.coffees = (coffees_data || []).map(c => c.name);
  state.coffees_obj = coffees_data || [];

  // Green now lives in green_deliveries + green_movements, with the balance DERIVED by
  // v_green_stock rather than stored. See sql/green_schema.sql. These are mapped into the
  // same shapes the page already renders, so only the data source changed, not the UI.
  const [{ data: gstock }, { data: arrivals }, { data: movements }] = await Promise.all([
    supabaseClient.from("v_green_stock").select("*").order("coffee"),
    supabaseClient.from("v_green_arrivals").select("*").order("arrived_on", { ascending: false }),
    supabaseClient.from("v_green_movements").select("*").order("occurred_on", { ascending: false }).limit(500),
  ]);

  state.stock_items = (gstock || []).filter(r => !r.retired_at).map(r => ({
    id: `GS-${r.coffee_id}`,                       // synthetic; nothing writes back via this
    coffee: r.coffee,
    coffee_id: r.coffee_id,
    origin: null,
    current_kg: Number(r.on_hand_kg) || 0,
    low_stock_threshold: Number(r.low_stock_threshold) || LOW_STOCK_KG,
    is_negative: !!r.is_negative,                  // a negative balance means something wasn't logged
    last_intake_on: r.last_intake_on,
  }));

  state.deliveries = (arrivals || []).map(a => ({
    id: a.arrival_id,
    date: a.arrived_on,
    supplier: a.supplier,
    invoice_ref: a.invoice_ref,
    invoice_path: a.invoice_path,
    awaiting_invoice: !!a.awaiting_invoice,
    items: (a.lines || []).map(l => ({
      id: l.id, coffee: l.coffee, coffee_id: l.coffee_id, origin: l.origin, green_name: l.green_name,
      lot_number: l.lot_number, ico_number: l.ico_number, bags: l.bags,
      weight_kg: l.weight_kg, price_per_kg: l.price_per_kg, contract_id: l.contract_id,
    })),
  }));

  state.adjustments = (movements || []).map(m => ({
    id: m.id, date: m.occurred_on, coffee: m.coffee, coffee_id: m.coffee_id,
    change_kg: Number(m.change_kg) || 0, reason: m.kind, note: m.note,
    auto: !m.is_editable, is_editable: !!m.is_editable,
  }));

  // Green contracts + live drawdown (bags delivered against each contract).
  const { data: contracts } = await supabaseClient.from("green_contracts").select("*").order("created_at", { ascending: false });
  state.contracts = contracts || [];
  const drawn = {};
  state.deliveries.forEach(d => (d.items||[]).forEach(it => {
    if (it.contract_id) drawn[it.contract_id] = (drawn[it.contract_id]||0) + (Number(it.bags)||0);
  }));
  state.contract_delivered = drawn;

  // Drum state comes from v_container_state — see sql/v_container_state.sql. That is the single definition
  // of "remaining", shared with roastery-traceability.html, roaster.html and reports-packing.html, so the
  // staff picker can no longer disagree with the packing screen about how much is in a drum.
  //
  // This replaced four queries (containers, roast_sessions, dispatches, buckets) and a local formula that
  // had four defects: it counted only the NEWEST roast session's weight rather than the whole fill (a
  // topped-up drum read low); it counted dispatch lines with a NULL fill_id against the drum; its
  // dispatches fetch had no ORDER BY and no pagination, so it received an arbitrary 1000 of 1000+ rows
  // and silently missed lines (reading high, differently on each load); and it matched buckets on fill_id
  // without checking the container.
  //
  // Bounded by the number of physical drums, so a single unpaginated read is safe here — unlike the
  // dispatches table this used to scan.
  const { data: container_state } = await supabaseClient.from("v_container_state")
    .select("id, coffee, fill_id, status, fill_start_date, remaining")
    .in("status", ["active", "waiting"])
    .order("id", { ascending: true });
  const to_kg = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
  state.containers = (container_state || [])
    .map(c => ({ ...c, remaining: to_kg(c.remaining) }))
    .filter(c => c.remaining > 0);

  // Load recent staff takeaways for display in the staff tab
  const { data: staff_disps } = await supabaseClient.from("dispatches").select("id, shop, date, total_kg, container_id, fill_id, dispatch_lines(*)").eq("shop", "Staff").order("date", { ascending: false }).limit(50);
  state.staff_dispatches = (staff_disps || []).map(d => ({ ...d, lines: d.dispatch_lines || [] }));
}

async function save_delivery() {
  state.saving = true; render();
  const d = state.ui.delivery;
  const valid_items = d.items.filter(i => i.coffee && Number(i.weight_kg) > 0);
  if (!d.date) { state.ui.delivery_err="Please enter a delivery date."; state.saving=false; render(); return; }
  if (!valid_items.length) { state.ui.delivery_err="Please add at least one item with a coffee and weight."; state.saving=false; render(); return; }
  const delivery_id = gen_id("DEL");

  // Upload invoice PDF if one was staged
  let invoice_path = null;
  if (state.ui.pending_invoice_file) {
    const file = state.ui.pending_invoice_file;
    const safe_name = file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
    const path = `${delivery_id}/${safe_name}`;
    const { error: up_err } = await supabaseClient.storage.from("invoices").upload(path, file);
    if (up_err) { state.ui.delivery_err="Failed to upload invoice PDF: "+up_err.message; state.saving=false; render(); return; }
    invoice_path = path;
  }

  // One green_deliveries row per coffee, sharing an arrival_id so a multi-coffee delivery
  // stays one arrival. Invoice fields are nullable — log the arrival now, attach the invoice
  // when the supplier sends it. Deliveries with none show in Awaiting Invoice.
  const arrival_id = `ARR-${delivery_id}`;
  const delivery_rows = valid_items.map((item, i) => ({
    id: `${delivery_id}-I${i+1}`,
    arrival_id,
    coffee_id: coffee_id_by_name(item.coffee),
    supplier: d.supplier || null,
    origin: item.origin || null,
    green_name: item.green_name || null,
    lot_number: item.lot_number || null,
    ico_number: item.ico_number || null,
    bags: Number(item.bags) || null,
    weight_kg: Number(item.weight_kg),
    arrived_on: d.date,
    contract_id: item.contract_id || null,
    invoice_ref: d.invoice_ref || null,
    invoice_path,
    price_per_kg: Number(item.price_per_kg) || null,
  }));
  const { error: del_err } = await supabaseClient.from("green_deliveries").insert(delivery_rows);
  if (del_err) { state.ui.delivery_err="Failed to save delivery: "+del_err.message; state.saving=false; render(); return; }

  // The intake movements. One batch insert — no stored balance to update afterwards.
  const { error: mv_err } = await supabaseClient.from("green_movements").insert(delivery_rows.map(r => ({
    id: `GM-IN-${r.id}`,
    coffee_id: r.coffee_id,
    delivery_id: r.id,
    occurred_on: r.arrived_on,
    change_kg: r.weight_kg,
    kind: "intake",
    note: `Delivery ${arrival_id}${d.invoice_ref ? " · invoice " + d.invoice_ref : " · invoice pending"}`,
  })));
  if (mv_err) {
    // The delivery rows exist but the stock didn't move — say so rather than silently under-counting.
    state.ui.delivery_err = "Delivery saved but the stock movement failed: " + mv_err.message;
    state.saving=false; render(); return;
  }
  state.saving=false; state.ui.show_delivery_form=false; state.ui.delivery_err="";
  state.ui.delivery=new_delivery(); state.ui.pending_invoice_file=null;
  await load_data(); render();
}

// Attach or update invoice detail on an arrival. Only invoice_ref, the PDF and per-line
// price_per_kg are touched — the physical facts of the delivery stay as recorded on the day.
// Applies the ref and PDF across every line of the arrival, since one invoice covers all of it.
async function save_invoice_detail() {
  const e = state.ui.invoice_edit;
  if (!e) return;
  const arrival = state.deliveries.find(d => d.id === e.arrival_id);
  if (!arrival) { e.err = "That delivery is no longer loaded — reload and try again."; render(); return; }

  const ref = (document.getElementById("inv-ref")?.value || "").trim();
  if (!ref) { e.err = "Enter the invoice reference."; render(); return; }

  e.saving = true; e.err = ""; render();

  // Upload the PDF first: if it fails, nothing has been changed yet.
  let invoice_path = arrival.invoice_path || null;
  const file = document.getElementById("inv-file")?.files?.[0] || null;
  if (file) {
    const safe = file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
    const path = `${e.arrival_id}/${safe}`;
    const { error: up_err } = await supabaseClient.storage.from("invoices").upload(path, file, { upsert: true });
    if (up_err) { e.saving = false; e.err = "Failed to upload the PDF: " + up_err.message; render(); return; }
    invoice_path = path;
  }

  // Ref + PDF across the whole arrival.
  const { error: ref_err } = await supabaseClient.from("green_deliveries")
    .update({ invoice_ref: ref, invoice_path })
    .eq("arrival_id", e.arrival_id);
  if (ref_err) { e.saving = false; e.err = "Failed to save: " + ref_err.message; render(); return; }

  // Prices are per coffee, so one update per changed line.
  for (const item of arrival.items) {
    const raw = e.prices[item.id];
    if (raw === undefined || raw === "") continue;
    const price = Number(raw);
    if (!Number.isFinite(price) || price < 0) continue;
    if (Number(item.price_per_kg ?? -1) === price) continue;      // unchanged
    const { error: p_err } = await supabaseClient.from("green_deliveries")
      .update({ price_per_kg: price }).eq("id", item.id);
    if (p_err) { e.saving = false; e.err = "Failed to save a price: " + p_err.message; render(); return; }
  }

  state.ui.invoice_edit = null;
  await load_data(); render();
}

async function download_invoice(invoice_path) {
  const { data, error } = await supabaseClient.storage.from("invoices").download(invoice_path);
  if (error) { alert("Failed to download invoice: "+error.message); return; }
  const url = URL.createObjectURL(data);
  const a = document.createElement("a");
  a.href = url;
  a.download = invoice_path.split("/").pop();
  a.click();
  URL.revokeObjectURL(url);
}

async function save_adjustment() {
  state.saving = true;
  const coffee = state.ui.adj.coffee;
  const raw = String(state.ui.adj.change_kg || "").trim();
  const change_kg = parseFloat(raw);
  const reason = state.ui.adj.reason;
  const note = (state.ui.adj.note || "").trim();
  if (!coffee) { state.ui.adj_err="Please select a coffee."; state.saving=false; render(); return; }
  if (!raw || isNaN(change_kg) || change_kg === 0) { state.ui.adj_err="Please enter a non-zero kg value (use - for deductions)."; state.saving=false; render(); return; }
  // Validate deductions don't exceed available stock
  if (change_kg < 0) {
    const existing_check = state.stock_items.find(s => s.coffee_id === coffee_id_by_name(coffee));
    const available = existing_check?.current_kg || 0;
    if (Math.abs(change_kg) > available) {
      state.ui.adj_err = `Cannot deduct ${Math.abs(change_kg).toFixed(1)}kg of ${coffee} — only ${available.toFixed(1)}kg available.`;
      state.saving=false; render(); return;
    }
  }
  if (!reason) { state.ui.adj_err="Please choose what kind of movement this is."; state.saving=false; render(); return; }
  // Direction has to match the kind — green_movements_direction rejects a positive spill or a
  // negative intake. Catching it here gives a useful message instead of a constraint error.
  if ((reason === "spill" || reason === "sample") && change_kg > 0) {
    state.ui.adj_err = `A ${reason} takes stock out — enter a negative value, or use Stock Correction to add.`;
    state.saving=false; render(); return;
  }
  const adj_cid = coffee_id_by_name(coffee);
  // One row. The balance is the sum of green_movements, so there is nothing else to update.
  const { error } = await supabaseClient.from("green_movements").insert({
    id: gen_id("GM"), coffee_id: adj_cid, occurred_on: today(),
    change_kg, kind: reason, note: note || null,
  });
  if (error) { state.ui.adj_err="Failed to save adjustment: "+error.message; state.saving=false; render(); return; }
  state.saving=false; state.ui.adj={ coffee:"", change_kg:"", reason:"", note:"" }; state.ui.show_adj_form=false; state.ui.adj_err="";
  await load_data(); render();
}

async function set_threshold(coffee, value) {
  const item = state.stock_items.find(s => s.coffee===coffee);
  if (!item) return;
  await supabaseClient.from("green_coffee_settings")
    .upsert({ coffee_id: item.coffee_id, low_stock_threshold: value, updated_at: new Date().toISOString() },
            { onConflict: "coffee_id" });
  await load_data(); render();
}

const BAG_SIZE_KG = { "100g": 0.1, "200g": 0.2, "250g": 0.25, "500g": 0.5, "1kg": 1, "Bar 5kg": 5 };

async function ensure_staff_destination() {
  // Make sure the "Staff" shop_mapping exists. Create on first use.
  const { data: existing } = await supabaseClient.from("shop_mappings").select("id").eq("master_name", "Staff").maybeSingle();
  if (existing) return;
  await supabaseClient.from("shop_mappings").insert({ parsed_name: "Staff", master_name: "Staff", kind: "staff", shop_qr_id: null });
}

async function save_staff_takeaway() {
  const s = state.ui.staff;
  s.err = "";
  const container = state.containers.find(c => c.id === s.container_id);
  if (!s.coffee) { s.err = "Please select a coffee."; render(); return; }
  if (!container) { s.err = "Please select a container."; render(); return; }
  if (container.coffee !== s.coffee) { s.err = "Container doesn't match the selected coffee."; render(); return; }
  const bag_kg = BAG_SIZE_KG[s.bag_size] || 0;
  if (!bag_kg) { s.err = "Invalid bag size."; render(); return; }
  if (Math.round(container.remaining * 1000) / 1000 < bag_kg) { s.err = `Container only has ${container.remaining.toFixed(1)}kg remaining — not enough for a ${s.bag_size} bag.`; render(); return; }

  s.saving = true; render();

  await ensure_staff_destination();

  // Find the FP code for this coffee + bag size (so dispatch_line.fp_code is set)
  // Not strictly required — if no FP exists, we leave fp_code null
  const { data: fp_row } = await supabaseClient.from("fp_codes").select("fp_code, coffees(name)").eq("bag_size", s.bag_size);
  const fp_code = (fp_row || []).find(f => f.coffees?.name === s.coffee)?.fp_code || null;

  // Create the dispatch (auto-confirmed since kind=staff)
  const dispatch_id = gen_id("DISP");
  const now_iso = new Date().toISOString();
  const { error: disp_err } = await supabaseClient.from("dispatches").insert({
    id: dispatch_id,
    shop: "Staff",
    date: today(),
    container_id: container.id,
    fill_id: container.fill_id,
    total_kg: bag_kg,
    confirmed_at: now_iso,
  });
  if (disp_err) { s.err = "Failed to save: " + disp_err.message; s.saving = false; render(); return; }

  // Create the dispatch_line (no `coffee` column exists; `type` is required)
  const { error: line_err } = await supabaseClient.from("dispatch_lines").insert({
    id: gen_id("LINE"),
    dispatch_id,
    type: "retail",
    container_id: container.id,
    fill_id: container.fill_id,
    bag_size: s.bag_size,
    bags: 1,
    kg: bag_kg,
    fp_code,
  });
  if (line_err) { s.err = "Failed to save takeaway line: " + line_err.message; s.saving = false; render(); return; }

  // Reset form, reload
  state.ui.staff = { coffee: "", container_id: "", bag_size: "200g", err: "", saving: false };
  await load_data();
  render();
}

async function init() { await load_data(); state.loading=false; render(); }

async function save_quick_stock() {
  const app = document.getElementById("app");
  const inputs = [...app.querySelectorAll(".qs-input")];
  const changes = [];
  for (const inp of inputs) {
    const cid = Number(inp.dataset.qsId);
    const target = Number(inp.value);
    if (inp.value.trim() === "" || isNaN(target) || target < 0) {
      state.ui.quick_ok = "";
      state.ui.quick_err = `Enter a valid amount (0 or more) for ${coffee_name_by_id(cid)}.`;
      render(); return;
    }
    const existing = state.stock_items.find(s => s.coffee_id === cid);
    const current = existing ? Number(existing.current_kg) : 0;
    const delta = Number((target - current).toFixed(3));
    if (delta !== 0) changes.push({ cid, target, delta, existing });
  }
  if (changes.length === 0) { state.ui.quick_err = ""; state.ui.quick_ok = "Nothing changed."; render(); return; }

  state.ui.quick_saving = true; state.ui.quick_err = ""; state.ui.quick_ok = ""; render();

  // One correction movement per changed coffee, carrying the delta. There is no stock level to
  // set afterwards — writing the delta IS setting the level, because the balance is the sum.
  // The counted figure goes in the note so a variance can be traced back later.
  const { error: qc_err } = await supabaseClient.from("green_movements").insert(changes.map(ch => ({
    id: gen_id("GM"), coffee_id: ch.cid, occurred_on: today(),
    change_kg: ch.delta, kind: "correction",
    note: `Quick stock set to ${ch.target}kg (was ${Number(ch.existing ? ch.existing.current_kg : 0).toFixed(2)}kg)`,
  })));
  if (qc_err) {
    state.ui.quick_saving = false;
    state.ui.quick_err = "Failed to save: " + qc_err.message;
    render(); return;
  }

  state.ui.quick_saving = false;
  state.ui.quick_ok = `Saved ${changes.length} change${changes.length>1?"s":""}.`;
  await load_data(); render();
}

function render() { document.getElementById("app").innerHTML=build_app(); attach_listeners(); }

function build_app() {
  const header = `

      </div>
      <button class="btn-logout" id="logout-btn">Log Out</button>

  if (state.loading) return header + `<div class="loading">Loading stock…</div>`;
  const low_stock_items = state.stock_items.filter(s => s.current_kg < (s.low_stock_threshold||LOW_STOCK_KG) && s.current_kg > 0);
  const out_of_stock = state.stock_items.filter(s => s.current_kg===0 && s.coffee);
  const tabs = ["🌱 Green Stock","📦 Deliveries","⚖️ Adjustments","👤 Staff Takeaway","📑 Contracts"];
  return header + `
    <div class="tabs">${tabs.map((t,i) => `<button class="tab-btn${state.tab===i?" active":""}" data-tab="${i}">${t}</button>`).join("")}</div>
    <div class="content">

      ${state.tab===0?build_green_stock():state.tab===1?build_deliveries():state.tab===2?build_adjustments():state.tab===3?build_staff():state.tab===4?build_contracts():""}
    </div>`;
}

function build_green_stock() {
  const total_kg = state.stock_items.reduce((s,i) => s+i.current_kg, 0);

        .map(({icon,label,value}) => `<div class="card" style="text-align:center;padding:14px 10px;margin-bottom:0"><div style="font-size:22px;margin-bottom:4px">${icon}</div><div style="font-size:20px;font-weight:700">${value}</div><div style="font-size:11px;color:#666;margin-top:2px">${label}</div></div>`).join("")}

  if (state.stock_items.length===0) return `${stats_html}${build_quick_stock()}<div class="card empty"><div class="icon">🌱</div>No green coffee in stock yet.<br/>Use <strong>Quick Count / Adjust</strong> above, or log a delivery in the <strong>Deliveries</strong> tab.</div>`;
  const sorted = [...state.stock_items].sort((a,b) => a.current_kg-b.current_kg);
  return `${stats_html}${build_quick_stock()}<div class="section-label">Current Green Stock</div>${sorted.map(item => {
    const last_delivery_item = state.deliveries.flatMap(d=>d.items).find(i=>i.coffee===item.coffee);
    const threshold = item.low_stock_threshold||LOW_STOCK_KG;
    const pct = Math.min(100, Math.round((item.current_kg/Math.max(item.current_kg,threshold*3))*100));
    const bar_color = item.current_kg===0?"#dc2626":item.current_kg<threshold?"#dc2626":item.current_kg<threshold*2?"#d97706":"#16a34a";
    const status = item.current_kg===0?{bg:"#fdecea",color:"#dc2626",label:"Out of Stock"}:item.current_kg<threshold?{bg:"#fdecea",color:"#dc2626",label:"Low Stock"}:item.current_kg<threshold*2?{bg:"#fff7ed",color:"#d97706",label:"Running Low"}:{bg:"#e7f5ec",color:"#16a34a",label:"In Stock"};
    return `
      <div class="stock-card" style="border-left:4px solid ${bar_color}">
        <div class="flex-between mb-8">
          <div class="flex-wrap">
            <span style="font-weight:700;font-size:15px">${esc(item.coffee)}</span>
            <span class="tag" style="background:${status.bg};color:${status.color}">${status.label}</span>
          </div>
          <span style="font-size:22px;font-weight:700">${item.current_kg.toFixed(1)}kg</span>
        </div>
        ${last_delivery_item?.origin?`<div class="hint mt-4">Origin: <strong>${esc(last_delivery_item.origin)}</strong></div>`:""}
        ${last_delivery_item?.lot_number?`<div class="hint mt-4">Lot: <span class="mono" style="background:#f0eee9;padding:1px 6px;border-radius:3px">${esc(last_delivery_item.lot_number)}</span></div>`:""}
        <div style="margin-top:12px">

            <span>${item.current_kg.toFixed(1)}kg remaining</span><span>Low stock alert at ${threshold}kg</span>
          </div>
          <div class="stock-track"><div class="stock-fill" style="background:${bar_color};width:${pct}%"></div></div>
        </div>
        <div style="margin-top:10px;display:flex;gap:8px">
          <button class="btn btn-ghost btn-sm" data-adj-coffee="${esc(item.coffee)}">± Adjust</button>

        </div>
      </div>`;
  }).join("")}`;
}

async function save_contract() {
  state.saving = true; render();
  const c = state.ui.contract;
  if (!c.supplier || !c.coffee_id || !(Number(c.bag_count) > 0)) {
    state.ui.contract_err = "Supplier, green coffee, and a bag count are required.";
    state.saving = false; render(); return;
  }
  const id = gen_id("CON");
  let contract_path = null;
  if (state.ui.pending_contract_file) {
    const file = state.ui.pending_contract_file;
    const safe_name = file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
    const path = `contracts/${id}/${safe_name}`;
    const { error: up_err } = await supabaseClient.storage.from("invoices").upload(path, file);
    if (up_err) { state.ui.contract_err = "Failed to upload contract PDF: " + up_err.message; state.saving = false; render(); return; }
    contract_path = path;
  }
  const { error } = await supabaseClient.from("green_contracts").insert({
    id, supplier: c.supplier, coffee_id: Number(c.coffee_id),
    bag_count: Number(c.bag_count),
    low_bag_threshold: Number(c.low_bag_threshold) || 100,
    contract_path,
  });
  if (error) { state.ui.contract_err = "Failed to save contract: " + error.message; state.saving = false; render(); return; }
  state.saving = false;
  state.ui.show_contract_form = false; state.ui.contract = new_contract();
  state.ui.contract_err = ""; state.ui.pending_contract_file = null;
  await load_data(); render();
}

function build_staff() {
  const s = state.ui.staff;
  // Coffees available = those that have an active container with stock
  const coffees_with_stock = [...new Set(state.containers.map(c => c.coffee).filter(Boolean))].sort();
  // Containers matching the selected coffee, oldest fill first (FIFO).
  // This used to sort on fill_id, but fill_id is CONTAINER-YYYYMMDD-slug — so it ordered by drum name
  // first and the date never got a look in: L01 filled today sorted ahead of XL04 filled last week.
  // fill_start_date is the actual age of the fill, and top-up roasts don't reset it.
  const FAR = "9999-12-31";
  const matching_containers = state.containers
    .filter(c => c.coffee === s.coffee)
    .sort((a, b) => (a.fill_start_date || FAR).localeCompare(b.fill_start_date || FAR)
                 || (a.id || "").localeCompare(b.id || ""));
  // Auto-select the oldest container if one isn't picked yet
  if (!s.container_id && matching_containers.length > 0) {
    s.container_id = matching_containers[0].id;
  }
  const selected_container = matching_containers.find(c => c.id === s.container_id);
  const bag_kg = BAG_SIZE_KG[s.bag_size] || 0;
  const can_save = !!(s.coffee && selected_container && selected_container.remaining >= bag_kg);

  // Recent log
  const recent_log = state.staff_dispatches.slice(0, 30);
  const total_kg = state.staff_dispatches.reduce((sum, d) => sum + (Number(d.total_kg) || 0), 0);
  const total_bags = state.staff_dispatches.reduce((sum, d) => sum + (d.lines || []).reduce((ss, l) => ss + (Number(l.bags) || 0), 0), 0);

  return `
    <div class="flex-between mb-16">
      <div>
        <h2 style="margin:0">Staff Takeaway</h2>
        <p class="hint" style="margin-top:4px;font-size:13px">Log roasted coffee staff have taken home. Deducts from container stock so traceability stays accurate.</p>
      </div>
    </div>

    <div class="card mb-16">
      <div class="section-label">Log a takeaway</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:flex-end">
        <div>
          <label class="lbl">Coffee *</label>
          <select id="staff-coffee">
            <option value="">— Select coffee —</option>
            ${coffees_with_stock.map(c => `<option value="${esc(c)}" ${s.coffee===c?"selected":""}>${esc(c)}</option>`).join("")}
          </select>
          ${coffees_with_stock.length === 0 ? '<p class="hint" style="font-size:11px;margin-top:4px;color:#dc2626">No coffees with stock available.</p>' : ""}
        </div>
        <div>
          <label class="lbl">Container ${matching_containers.length > 1 ? "(oldest first)" : ""}</label>
          <select id="staff-container" ${!s.coffee || matching_containers.length===0 ? "disabled" : ""}>
            ${matching_containers.length === 0
              ? `<option value="">${s.coffee ? "No containers available" : "Pick a coffee first"}</option>`
              : matching_containers.map(c => `<option value="${esc(c.id)}" ${s.container_id===c.id?"selected":""}>${esc(c.name?`${c.id} — ${c.name}`:c.id)} · ${c.remaining.toFixed(1)}kg</option>`).join("")}
          </select>
        </div>
        <div>
          <label class="lbl">Bag Size *</label>
          <select id="staff-bag-size">
            <option value="200g" ${s.bag_size==="200g"?"selected":""}>200g</option>
            <option value="500g" ${s.bag_size==="500g"?"selected":""}>500g</option>
          </select>
        </div>
        <div>
          <button class="btn btn-dark" id="save-staff" ${!can_save || s.saving ? "disabled" : ""}>${s.saving?"Saving…":"+ Log Takeaway"}</button>
        </div>
      </div>
      ${s.err ? `<p class="err">${esc(s.err)}</p>` : ""}
    </div>

    <div class="card mb-16">
      <div class="section-label">Summary</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">
        <div style="background:#f4f2ed;border-radius:8px;padding:12px 14px">
          <div style="font-size:11px;color:#666;letter-spacing:1px;text-transform:uppercase;font-weight:600">Total Bags</div>
          <div style="font-size:22px;font-weight:700;color:#1a1a1a;margin-top:4px">${total_bags}</div>
        </div>
        <div style="background:#f4f2ed;border-radius:8px;padding:12px 14px">
          <div style="font-size:11px;color:#666;letter-spacing:1px;text-transform:uppercase;font-weight:600">Total kg</div>
          <div style="font-size:22px;font-weight:700;color:#1a1a1a;margin-top:4px">${total_kg.toFixed(2)}kg</div>
        </div>
        <div style="background:#f4f2ed;border-radius:8px;padding:12px 14px">
          <div style="font-size:11px;color:#666;letter-spacing:1px;text-transform:uppercase;font-weight:600">Entries</div>
          <div style="font-size:22px;font-weight:700;color:#1a1a1a;margin-top:4px">${state.staff_dispatches.length}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Recent Takeaways ${recent_log.length < state.staff_dispatches.length ? `<span class="hint" style="font-weight:400;font-size:12px">(latest 30 of ${state.staff_dispatches.length})</span>` : ""}</div>
      ${recent_log.length === 0
        ? '<p class="hint" style="padding:8px 0">No staff takeaways logged yet.</p>'
        : recent_log.map(d => {
          const line = (d.lines || [])[0] || {};
          return `<div style="display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid #f0eee9;font-size:13px">
            <span class="tag" style="background:#f4f2ed;color:#666;min-width:70px;text-align:center;font-weight:600">${esc(line.bag_size || "?")}</span>
            <span style="font-weight:500">${esc(line.coffee || d.shop)}</span>
            <span style="color:#666;font-family:monospace;font-size:12px">${esc(d.container_id || "—")}</span>
            <span style="color:#666">${d.date}</span>
          </div>`;
        }).join("")}
    </div>`;
}

  app.querySelector("#save-contract")?.addEventListener("click", () => {
    state.ui.contract.supplier=document.getElementById("con-supplier")?.value||state.ui.contract.supplier;
    state.ui.contract.coffee_id=document.getElementById("con-coffee")?.value||state.ui.contract.coffee_id;
    state.ui.contract.bag_count=document.getElementById("con-bags")?.value||state.ui.contract.bag_count;
    state.ui.contract.low_bag_threshold=document.getElementById("con-threshold")?.value||state.ui.contract.low_bag_threshold;
    save_contract();
  });

  app.querySelector("#toggle-adj-form")?.addEventListener("click", () => { state.ui.show_adj_form=!state.ui.show_adj_form; state.ui.adj_err=""; render(); });
  app.querySelector("#cancel-adj")?.addEventListener("click", () => { state.ui.show_adj_form=false; state.ui.adj_err=""; render(); });
  app.querySelector("#adj-coffee")?.addEventListener("change", e => { state.ui.adj.coffee = e.target.value; });
  app.querySelector("#adj-reason")?.addEventListener("change", e => { state.ui.adj.reason = e.target.value; });
  app.querySelector("#adj-kg")?.addEventListener("input", e => { state.ui.adj.change_kg = e.target.value; });
  app.querySelector("#adj-note")?.addEventListener("input", e => { state.ui.adj.note = e.target.value; });
  app.querySelector("#save-adj")?.addEventListener("click", () => {
    // Read from DOM in case the user typed without firing change/input (autofill, paste etc)
    state.ui.adj.coffee    = document.getElementById("adj-coffee")?.value    || state.ui.adj.coffee;
    state.ui.adj.reason    = document.getElementById("adj-reason")?.value    || state.ui.adj.reason;
    state.ui.adj.change_kg = document.getElementById("adj-kg")?.value         ?? state.ui.adj.change_kg;
    state.ui.adj.note      = document.getElementById("adj-note")?.value      ?? state.ui.adj.note;
    save_adjustment();
  });

  // Staff Takeaway
  app.querySelector("#staff-coffee")?.addEventListener("change", e => {
    state.ui.staff.coffee = e.target.value;
    state.ui.staff.container_id = "";  // reset so it auto-picks oldest matching
    state.ui.staff.err = "";
    render();
  });
  app.querySelector("#staff-container")?.addEventListener("change", e => { state.ui.staff.container_id = e.target.value; render(); });
  app.querySelector("#staff-bag-size")?.addEventListener("change", e => { state.ui.staff.bag_size = e.target.value; render(); });
  app.querySelector("#save-staff")?.addEventListener("click", () => save_staff_takeaway());
}
</script>
</body>
</html>
