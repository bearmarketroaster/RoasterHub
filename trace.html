<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trace a Coffee — Bear Mrkt</title>
  <link rel="icon" type="image/png" href="bear-icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #fafaf8; min-height: 100vh; color: #1a1a1a; }
    .header { background: #1a1a1a; color: #fff; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-back { background: none; border: none; color: #ccc; font-size: 13px; cursor: pointer; padding: 4px 0; }
    .header-back:hover { color: #fff; }
    .header-logo { font-size: 28px; }
    .header-title { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
    .header-sub   { font-size: 12px; color: #999; margin-top: 2px; letter-spacing: 1px; text-transform: uppercase; }
    .btn-auth { background: none; border: 1px solid #666; color: #ccc; border-radius: 6px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-auth:hover { background: #fff; color: #1a1a1a; border-color: #fff; }
    .main { padding: 28px 32px; max-width: 1000px; margin: 0 auto; }
    .controls { background: #fff; border: 1px solid #e8e6e1; border-radius: 12px; padding: 16px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
    .controls label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: #666; margin-bottom: 5px; }
    .controls input, .controls select { padding: 8px 10px; border: 1px solid #e8e6e1; border-radius: 6px; font-size: 14px; font-family: inherit; background: #fff; min-width: 170px; }
    .btn { background: #1a1a1a; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-light { background: #fff; color: #1a1a1a; border: 1px solid #d8d4cc; }
    .doc { background: #fff; border: 1px solid #e8e6e1; border-radius: 12px; padding: 24px; }
    .doc-title { font-size: 21px; font-weight: 800; }
    .doc-sub { font-size: 13px; color: #666; margin-top: 4px; }
    .roast { border: 1px solid #e8e6e1; border-radius: 10px; margin-top: 18px; overflow: hidden; break-inside: avoid; }
    .roast-head { background: #f4f2ed; padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
    .roast-name { font-size: 16px; font-weight: 800; }
    .why { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #e7f5ec; color: #16a34a; margin-left: 6px; }
    .sec { padding: 12px 14px; border-top: 1px solid #f0eee9; }
    .sec-title { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #666; margin-bottom: 8px; }
    .kv { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; }
    .kv b { font-weight: 800; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 7px 8px; background: #faf9f7; font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; }
    td { padding: 7px 8px; border-top: 1px solid #f0eee9; vertical-align: top; }
    td.num, th.num { text-align: right; }
    .mono { font-family: ui-monospace, monospace; font-size: 12px; }
    .muted { color: #999; }
    .hl { background: #fff8e6; }
    .simple { border: 1px solid #e8e6e1; border-radius: 10px; padding: 16px 18px; margin-top: 18px; break-inside: avoid; }
    .simple-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; }
    .simple-row { font-size: 15px; line-height: 1.7; }
    details.more { margin: 6px 0 0 4px; }
    details.more > summary { cursor: pointer; font-size: 13px; color: #666; font-weight: 600; }
    details.more > .roast { margin-top: 8px; }
    tr.cont td { border-top: 1px dashed #f0eee9; }
    td.nw { white-space: nowrap; }
    .type { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; white-space: nowrap; background: #f0eee9; color: #444; }
    .type-bags { background: #eef2ff; color: #3730a3; }
    .type-bucket { background: #e0f2fe; color: #075985; }
    .type-batch-brew { background: #fef3c7; color: #92400e; }
    .type-samples { background: #f3e8ff; color: #6b21a8; }
    .type-write-off { background: #fee2e2; color: #991b1b; }
    .est { font-size: 11px; color: #999; font-style: italic; margin-top: 6px; }
    .tag { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 10px; white-space: nowrap; }
    .tag-ok { background: #e7f5ec; color: #16a34a; }
    .tag-wait { background: #fff7ed; color: #d97706; }
    .empty { padding: 26px; text-align: center; color: #888; font-size: 14px; }
    .near { margin-top: 10px; font-size: 13px; color: #555; }
    .seg { display: inline-flex; border: 1px solid #d8d4cc; border-radius: 8px; overflow: hidden; }
    .seg button { background: #fff; border: none; padding: 8px 14px; font-size: 13px; font-weight: 600; color: #666; cursor: pointer; }
    .seg button + button { border-left: 1px solid #d8d4cc; }
    .seg button.on { background: #1a1a1a; color: #fff; }
    .near button { margin: 4px 6px 0 0; background: #f4f2ed; border: 1px solid #e0ddd6; border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer; }
    @media (max-width: 600px) { .header { padding: 16px 20px; flex-wrap: wrap; row-gap: 10px; } .main { padding: 18px 12px; } .doc { padding: 14px; } input, select { font-size: 16px !important; } }
    @page { size: A4; margin: 12mm; }
    @media print {
      body { background: #fff; }
      .header, .controls { display: none !important; }
      details.more:not([open]) { display: none; }   /* print the plain summary; details only if opened */
      .main { padding: 0; max-width: none; }
      .doc { border: none; padding: 0; }
      .hl, .type { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <button class="header-back" id="go-reports">← Reports</button>
      <div style="width:1px;height:28px;background:#333;margin:0 4px"></div>
      <div class="header-logo">🔎</div>
      <div><div class="header-title">Trace a Coffee</div><div class="header-sub">Bear Mrkt · date + coffee + where it went</div></div>
    </div>
    <button class="btn-auth" id="auth-btn">Log Out</button>
  </div>
  <div class="main" id="main"><div class="empty">Loading…</div></div>

<script>
const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

// ─────────────────────────────────────────────────────────────────────────────
// Trace: given a DATE + COFFEE + LOCATION (e.g. 24/09/26, Holy Roast, Sandyford), find the roast(s) and show
// the drum(s), the Cropster roasts, the green ICO / lot used, and every place that roast was dispatched to.
// The date may be the roast date (often on the bag) or the delivery date, so both are matched:
//   • roasts of that coffee ON that date, and
//   • roasts behind that coffee's deliveries to that location ON that date.
// A "roast" here is one fill (one drum's roast, or a combined roast across drums).
// Green lot: the app records which COFFEE a roast used, not which sack — so the ICO / lot is worked out
// first-in-first-out from the coffee's deliveries and stock movements (oldest green used first).
// ─────────────────────────────────────────────────────────────────────────────

function esc(s) { return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function kg(n) { return (Math.round((Number(n)||0) * 100) / 100).toFixed(2).replace(/\.?0+$/, "") + "kg"; }
function nice_date(iso) {
  if (!iso) return "—";
  const d = new Date(String(iso).slice(0, 10) + "T12:00:00");
  return d.toLocaleDateString("en-IE", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}
function short_date(iso) {
  if (!iso) return "—";
  return new Date(String(iso).slice(0, 10) + "T12:00:00").toLocaleDateString("en-IE", { day: "numeric", month: "short", year: "2-digit" });
}
function local_iso(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function add_days(iso, n) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return local_iso(d); }

const params = new URLSearchParams(location.search);
const state = {
  loaded: false,
  coffees: [],          // [{ id, name, retired_at }]
  shops: [],            // [master_name]
  mode: params.get("cropster") ? "cropster" : "date",   // "date" = date + coffee + location · "cropster" = backtrace
  q: { date: params.get("date") || "", coffee_id: params.get("coffee") || "", shop: params.get("shop") || "",
       cropster: params.get("cropster") || "",
       type: params.get("type") || "", size: params.get("size") || "",     // optional filter: what was sent
       on: params.get("on") === "delivery" ? "delivery" : "roast" },        // the date is a roast date or a delivery date
  busy: false,
  result: null,         // built by run_trace()
  err: "",
};

document.getElementById("go-reports").addEventListener("click", () => window.location.href = "reports.html");
document.getElementById("auth-btn").addEventListener("click", async () => {
  await supabaseClient.auth.signOut(); window.location.href = "login.html";
});

async function fetch_all(build) {
  const PAGE = 1000, out = [];
  for (let i = 0; i < 100; i++) {
    const { data, error } = await build().range(i * PAGE, i * PAGE + PAGE - 1);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < PAGE) break;
  }
  return out;
}

(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = "login.html?next=" + encodeURIComponent(location.pathname.split("/").pop() + location.search); return; }
  const [{ data: coffees }, { data: maps }] = await Promise.all([
    supabaseClient.from("coffees").select("id, name, retired_at").order("name"),
    supabaseClient.from("shop_mappings").select("master_name, kind"),
  ]);
  state.coffees = coffees || [];
  state.shops = [...new Set((maps || []).map(m => m.master_name).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  state.loaded = true;
  render();
  if (state.mode === "cropster" && state.q.cropster) run_cropster();
  else if (state.q.date && state.q.coffee_id && state.q.shop) run_trace();
})();

// ── The trace ───────────────────────────────────────────────────────────────
async function run_trace() {
  const { date, shop } = state.q;
  const on = state.q.on === "delivery" ? "delivery" : "roast";   // which date it is: roast date OR delivery date
  const coffee_id = Number(state.q.coffee_id);
  if (!date || !coffee_id || !shop) { state.err = "Pick a date, a coffee and where it went."; render(); return; }
  state.busy = true; state.err = ""; state.result = null; render();
  history.replaceState(null, "", `?on=${on}&date=${date}&coffee=${coffee_id}&shop=${encodeURIComponent(shop)}${filter_qs()}`);
  try {
    // Every roast of this coffee (with its Cropster batches), its green deliveries and green movements, and —
    // for a delivery date — that location's deliveries in the fortnight either side (the day itself + nearby days
    // to suggest if nothing matches)
    const [sessions, deliveries, movements, qc, shop_disp] = await Promise.all([
      ...coffee_data(coffee_id),
      qc_data(coffee_id),
      on === "delivery"
        ? fetch_all(() => supabaseClient.from("dispatches")
            .select("id, date, shop, dispatch_lines(fill_id, bag_size, type, bags)").eq("shop", shop)
            .gte("date", add_days(date, -14)).lte("date", add_days(date, 14)).order("date").order("id"))
        : Promise.resolve([]),
    ]);
    const fills_of_coffee = new Set(sessions.map(s => s.fill_id).filter(Boolean));
    // The deliveries of this coffee (of the type, if filtered) to the location, by date
    const coffee_lines = d => (d.dispatch_lines || []).filter(l => line_matches(l) && l.fill_id && fills_of_coffee.has(l.fill_id));
    const fills = on === "roast"
      ? [...new Set(sessions.filter(s => s.date === date && s.fill_id).map(s => s.fill_id))]
      : [...new Set(shop_disp.filter(d => d.date === date).flatMap(d => coffee_lines(d).map(l => l.fill_id)))];
    // Only that location's deliveries are listed (a clean report) — for a delivery date, only that day's
    const roasts = (await trace_fills(fills, { sessions, deliveries, movements, qc }, () => []))
      .map(x => ({ ...x, dispatches: x.dispatches.filter(d => d.shop === shop && (on === "roast" || d.date === date)) }))
      .filter(x => x.dispatches.length);

    // Nothing matched: offer nearby dates of the same kind
    const dates = on === "roast"
      ? [...new Set(sessions.map(s => s.date))]
      : [...new Set(shop_disp.filter(d => coffee_lines(d).length).map(d => d.date))];
    const near = roasts.length ? [] : dates
      .filter(d => d !== date && d >= add_days(date, -14) && d <= add_days(date, 14))
      .sort((a, b) => Math.abs(new Date(a) - new Date(date)) - Math.abs(new Date(b) - new Date(date))).slice(0, 6);

    state.result = { mode: "date", on, date, coffee_id, shop, roasts, near, filter: filter_label() };
  } catch (e) {
    state.err = "Couldn't run the trace: " + (e.message || e);
  }
  state.busy = false;
  render();
}

// Backtrace from a Cropster roast id: the roast it belongs to (its drum, or every drum of a combined roast),
// and everywhere that roast went.
async function run_cropster() {
  const cid = String(state.q.cropster || "").trim();
  if (!cid) { state.err = "Type a Cropster id."; render(); return; }
  state.busy = true; state.err = ""; state.result = null; render();
  history.replaceState(null, "", `?cropster=${encodeURIComponent(cid)}${filter_qs()}`);
  try {
    const hits = await fetch_all(() => supabaseClient.from("roast_batches")
      .select("id, roast_session_id, cropster_id, roast_sessions(id, coffee_id, fill_id)").eq("cropster_id", cid).order("id"));
    const roasts = [];
    const by_coffee = {};
    hits.forEach(h => { const s = h.roast_sessions; if (s && s.fill_id && s.coffee_id != null) (by_coffee[s.coffee_id] ||= new Set()).add(s.fill_id); });
    for (const [coffee_id, fills] of Object.entries(by_coffee)) {
      const [sessions, deliveries, movements, qc] = await Promise.all([...coffee_data(Number(coffee_id)), qc_data(Number(coffee_id))]);
      (await trace_fills([...fills], { sessions, deliveries, movements, qc }, () => [`Cropster ${cid}`]))
        .forEach(r => roasts.push({ ...r, coffee_id: Number(coffee_id) }));
    }
    state.result = { mode: "cropster", cropster: cid, roasts, unlinked: hits.length && !roasts.length, filter: filter_label() };
  } catch (e) {
    state.err = "Couldn't run the trace: " + (e.message || e);
  }
  state.busy = false;
  render();
}

// One coffee's roasts (with Cropster batches), green deliveries and green movements
function coffee_data(coffee_id) {
  return [
    fetch_all(() => supabaseClient.from("roast_sessions")
      .select("id, date, container_id, fill_id, roasted_weight, is_test, saved_at, green_delivery_id, roast_batches(batch_number, cropster_id, green_weight)")
      .eq("coffee_id", coffee_id).order("date").order("id")),
    fetch_all(() => supabaseClient.from("green_deliveries")
      .select("id, arrived_on, supplier, origin, green_name, lot_number, ico_number, bags, weight_kg, contract_id")
      .eq("coffee_id", coffee_id).order("arrived_on").order("id"))
      .then(async ds => {
        // The contract each delivery was logged against (when it was logged ≈ when the green was ordered)
        const ids = [...new Set(ds.map(d => d.contract_id).filter(Boolean))];
        if (!ids.length) return ds;
        const { data: cs } = await supabaseClient.from("green_contracts").select("id, supplier, created_at").in("id", ids);
        const by = Object.fromEntries((cs || []).map(c => [c.id, c]));
        return ds.map(d => ({ ...d, contract: by[d.contract_id] || null }));
      }),
    fetch_all(() => supabaseClient.from("green_movements")
      .select("id, occurred_on, change_kg, kind, delivery_id, roast_session_id")
      .eq("coffee_id", coffee_id).order("occurred_on").order("id")),
  ];
}

// One coffee's QC spot checks: green (moisture, density, water activity) and roast colour (Agtron)
async function qc_data(coffee_id) {
  const [green, colour] = await Promise.all([
    fetch_all(() => supabaseClient.from("green_qc_entries")
      .select("id, measured_at, created_at, density_1, density_2, density_3, moisture_1, moisture_2, moisture_3, water_activity_1, water_activity_2, water_activity_3")
      .eq("coffee_id", coffee_id).order("measured_at").order("id")),
    fetch_all(() => supabaseClient.from("qc_agtron_entries")
      .select("id, measured_at, created_at, whole_bean_1, whole_bean_2, whole_bean_3, ground_1, ground_2, ground_3")
      .eq("coffee_id", coffee_id).order("measured_at").order("id")),
  ]);
  return { green, colour };
}

// The full card data for a set of roasts (fills) of one coffee: drums, Cropster roasts, green lots, deliveries
async function trace_fills(fills, { sessions, deliveries, movements, qc }, why) {
    // Where those roasts went: every dispatch line packed from them, with its dispatch
    let lines = [];
    for (let i = 0; i < fills.length; i += 50) {
      lines.push(...await fetch_all(() => supabaseClient.from("dispatch_lines")
        .select("id, fill_id, container_id, type, bag_size, bags, kg, fp_code, dispatch_id, dispatches(id, shop, date, confirmed_at)")
        .in("fill_id", fills.slice(i, i + 50)).order("id")));
    }
    lines = lines.filter(line_matches);   // the Type / Size filter, if one is set
    const dispatch_ids = [...new Set(lines.map(l => l.dispatch_id))];
    let dbuckets = [];
    for (let i = 0; i < dispatch_ids.length; i += 100) {
      const chunk = dispatch_ids.slice(i, i + 100);
      dbuckets.push(...await fetch_all(() => supabaseClient.from("dispatch_buckets").select("id, dispatch_id, bucket_id").in("dispatch_id", chunk).order("id")));
    }
    const bucket_ids = [...new Set(dbuckets.map(b => b.bucket_id))];
    const bucket_names = {};
    if (bucket_ids.length) {
      const { data: bk } = await supabaseClient.from("buckets").select("id, name").in("id", bucket_ids);
      (bk || []).forEach(b => { bucket_names[b.id] = b.name || b.id; });
    }
    const combined = {};
    if (fills.length) {
      const { data: cb } = await supabaseClient.from("combined_batches").select("fill_id, name").in("fill_id", fills);
      (cb || []).forEach(c => { combined[c.fill_id] = c.name; });
    }

    const lots = fifo_lots(deliveries, movements);
    // Each delivery is "the" green until the next delivery of the coffee arrives — the window its green
    // QC readings are matched in
    const by_date = [...deliveries].sort((a, b) => (a.arrived_on || "").localeCompare(b.arrived_on || ""));
    const until = Object.fromEntries(by_date.map(d => [d.id, by_date.find(n => n.arrived_on > d.arrived_on)?.arrived_on || null]));
    Object.values(lots.lots).forEach(l => { if (l.delivery_id) l.until = until[l.delivery_id]; });
    const del = Object.fromEntries(deliveries.map(d => [d.id, d]));
    // The green this roast used: the delivery recorded on it when it was logged, else the first-in-first-out estimate
    const session_lots = s => {
      const d = s.green_delivery_id && del[s.green_delivery_id];
      if (!d) return lots.by_session[s.id] || [];
      const key = `D:${d.id}`;
      lots.lots[key] = lots.lots[key] || { ...delivery_lot(d, key), until: until[d.id] };
      return [{ lot_key: key, kg: (s.roast_batches || []).reduce((t, b) => t + (Number(b.green_weight) || 0), 0) }];
    };
    return fills.map(fill => {
      const ss = sessions.filter(s => s.fill_id === fill);
      const ls = lines.filter(l => l.fill_id === fill);
      const by_disp = {};
      ls.forEach(l => {
        const d = l.dispatches || { id: l.dispatch_id };
        const e = (by_disp[d.id] = by_disp[d.id] || { ...d, lines: [] });
        e.lines.push(l);
      });
      const dispatches = Object.values(by_disp).map(d => ({
        ...d, buckets: dbuckets.filter(b => b.dispatch_id === d.id).map(b => bucket_names[b.bucket_id] || b.bucket_id),
      })).sort((a, b) => (a.date || "").localeCompare(b.date || "") || String(a.id).localeCompare(String(b.id)));
      // Green lots behind this roast (FIFO), merged across its roasts
      const lot_kg = {};
      ss.forEach(s => session_lots(s).forEach(a => { lot_kg[a.lot_key] = (lot_kg[a.lot_key] || 0) + a.kg; }));
      return {
        fill, name: combined[fill] || null, qc,
        why: why(fill),
        sessions: ss,
        drums: [...new Set(ss.map(s => s.container_id).filter(Boolean))],
        dispatches,
        lots: Object.entries(lot_kg).map(([k, v]) => ({ ...lots.lots[k], kg: v })).sort((a, b) => (a.date || "").localeCompare(b.date || "")),
        green_unallocated: ss.some(s => !session_lots(s).length),
      };
    }).sort((a, b) => (a.sessions[0]?.date || "").localeCompare(b.sessions[0]?.date || ""));
}

// First-in-first-out green: which delivery (ICO / lot) each roast's green most likely came from.
// Stock arrives as intakes (a delivery) or openings / upward corrections (no lot recorded); every outflow
// (roast, sample, spill, downward correction) takes the oldest green still in stock.
function fifo_lots(deliveries, movements) {
  const lots = {}, queue = [], by_session = {};
  const del = Object.fromEntries(deliveries.map(d => [d.id, d]));
  const evs = movements.map(m => ({ ...m, change_kg: Number(m.change_kg) || 0 }))
    .sort((a, b) => (a.occurred_on || "").localeCompare(b.occurred_on || "") || (b.change_kg > 0) - (a.change_kg > 0) || String(a.id).localeCompare(String(b.id)));
  for (const m of evs) {
    if (m.change_kg > 0) {
      const d = m.delivery_id ? del[m.delivery_id] : null;
      const key = d ? `D:${d.id}` : `X:${m.id}`;
      lots[key] = d ? delivery_lot(d, key) : { key, date: m.occurred_on, unknown: true, kind: m.kind };
      queue.push({ key, left: m.change_kg });
    } else {
      let need = -m.change_kg;
      while (need > 1e-9 && queue.length) {
        const q = queue[0], take = Math.min(q.left, need);
        if (m.roast_session_id) (by_session[m.roast_session_id] ||= []).push({ lot_key: q.key, kg: take });
        q.left -= take; need -= take;
        if (q.left <= 1e-9) queue.shift();
      }
    }
  }
  return { lots, by_session };
}

function delivery_lot(d, key) {
  return { key, delivery_id: d.id, date: d.arrived_on, supplier: d.supplier, ico: d.ico_number, lot: d.lot_number,
           green_name: d.green_name, origin: d.origin,
           contract_logged: d.contract?.created_at || null, contract_supplier: d.contract?.supplier || null };
}

// ── QC spot checks ──────────────────────────────────────────────────────────
// The average of a reading's (up to) three measurements, or null when none were taken
function qc_avg(r, m) {
  const v = [1, 2, 3].map(i => r[`${m}_${i}`]).filter(x => x !== null && x !== undefined && x !== "").map(Number).filter(Number.isFinite);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
const newest_first = (a, b) => (b.measured_at || "").localeCompare(a.measured_at || "") || (b.created_at || "").localeCompare(a.created_at || "");

// Green QC for a delivery: the newest check of the coffee taken while that delivery was its green
// (from its arrival until the next delivery arrived). Nothing → not tested; another delivery's numbers aren't borrowed.
function green_qc_html(lot, qc) {
  const r = (qc?.green || []).filter(g => g.measured_at >= lot.date && (!lot.until || g.measured_at < lot.until)).sort(newest_first)[0];
  if (!r) return `<span class="muted">not tested</span>`;
  const parts = [
    ["moisture", v => `${v.toFixed(1)}%`], ["density", v => `${Math.round(v)} g/L`], ["water_activity", v => `${v.toFixed(2)} aw`],
  ].map(([m, f]) => { const v = qc_avg(r, m); return v === null ? null : `${m.replace("_", " ")} <b>${f(v)}</b>`; }).filter(Boolean);
  return parts.length ? `${parts.join(" · ")} <span class="muted">(checked ${esc(nice_date(r.measured_at))})</span>` : `<span class="muted">not tested</span>`;
}

// Roast colour: the coffee's spot check closest to the roast date (within a month either side). Checks are
// weekly spot checks, not per batch, so it's labelled with its date.
function colour_html(roast_date, coffee, qc) {
  const day = iso => new Date(iso + "T12:00:00").getTime();
  const gap = r => Math.abs(day(r.measured_at) - day(roast_date));
  const r = (qc?.colour || []).filter(c => c.measured_at && gap(c) <= 31 * 86400000)
    .sort((a, b) => gap(a) - gap(b) || newest_first(a, b))[0];
  if (!r) return `<span class="muted">no spot check within a month of roasting</span>`;
  const wb = qc_avg(r, "whole_bean"), gr = qc_avg(r, "ground");
  const nums = [wb !== null ? `<b>${wb.toFixed(1)}</b> whole bean` : null, gr !== null ? `<b>${gr.toFixed(1)}</b> ground` : null].filter(Boolean);
  if (!nums.length) return `<span class="muted">no spot check within a month of roasting</span>`;
  return `${nums.join(" / ")} <span class="muted">(spot check of ${esc(coffee)}, ${esc(nice_date(r.measured_at))})</span>`;
}

// ── Render ──────────────────────────────────────────────────────────────────
function render() {
  const main = document.getElementById("main");
  if (!state.loaded) return;
  const q = state.q;
  const coffee_opts = state.coffees.map(c => `<option value="${c.id}" ${String(q.coffee_id) === String(c.id) ? "selected" : ""}>${esc(c.name)}${c.retired_at ? " (retired)" : ""}</option>`).join("");
  const shop_opts = state.shops.map(s => `<option ${q.shop === s ? "selected" : ""}>${esc(s)}</option>`).join("");
  const by_date = state.mode === "date";
  const go = by_date ? run_trace : run_cropster;
  main.innerHTML = `
    <div class="controls">
      <div><label>Trace by</label>
        <div class="seg"><button data-mode="date" class="${by_date ? "on" : ""}">Date + coffee + location</button><button data-mode="cropster" class="${!by_date ? "on" : ""}">Cropster id</button></div></div>
      ${by_date ? `
        <div><label>The date is the</label>
          <div class="seg"><button data-on="roast" class="${q.on !== "delivery" ? "on" : ""}">Roast date</button><button data-on="delivery" class="${q.on === "delivery" ? "on" : ""}">Delivery date</button></div></div>
        <div><label>${q.on === "delivery" ? "Delivery date" : "Roast date"}</label><input type="date" id="q-date" value="${esc(q.date)}" /></div>
        <div><label>Coffee</label><select id="q-coffee"><option value="">— pick —</option>${coffee_opts}</select></div>
        <div><label>Where it went</label><select id="q-shop"><option value="">— pick —</option>${shop_opts}</select></div>`
      : `<div><label>Cropster id</label><input id="q-cropster" value="${esc(q.cropster)}" placeholder="e.g. 14231" autocomplete="off" /></div>`}
      <div><label>Type</label><select id="q-type" style="min-width:130px"><option value="">All</option>${FILTER_TYPES.map(t => `<option value="${t}" ${q.type === t ? "selected" : ""}>${t === "Bucket" ? "Buckets" : t}</option>`).join("")}</select></div>
      ${q.type === "Bags" ? `<div><label>Size</label><select id="q-size" style="min-width:110px"><option value="">Any</option>${BAG_SIZES.map(s => `<option ${q.size === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>` : ""}
      <button class="btn" id="q-go" ${state.busy ? "disabled" : ""}>${state.busy ? "Tracing…" : "🔎 Trace"}</button>
      ${state.result && state.result.roasts.length ? `<button class="btn btn-light" id="q-print">🖨️ Print / PDF</button>` : ""}
    </div>
    ${state.err ? `<div class="doc empty" style="color:#dc2626">${esc(state.err)}</div>` : ""}
    ${state.result ? result_html(state.result) : (state.busy ? "" : `<div class="doc empty">${by_date
      ? "Enter the date, coffee and where it went — e.g. 24/09/2026, Holy Roast, Sandyford."
      : "Enter a Cropster roast id to see its roast, drum, green and everywhere it went."}</div>`)}`;

  main.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
    if (state.mode === b.dataset.mode) return;
    state.mode = b.dataset.mode; state.result = null; state.err = ""; render();
  }));
  document.getElementById("q-date")?.addEventListener("change", e => { state.q.date = e.target.value; });
  main.querySelectorAll("[data-on]").forEach(b => b.addEventListener("click", () => {
    if (state.q.on === b.dataset.on) return;
    state.q.on = b.dataset.on; state.result = null; state.err = ""; render();
  }));
  document.getElementById("q-coffee")?.addEventListener("change", e => { state.q.coffee_id = e.target.value; });
  document.getElementById("q-shop")?.addEventListener("change", e => { state.q.shop = e.target.value; });
  document.getElementById("q-type").addEventListener("change", e => {
    state.q.type = e.target.value;
    if (state.q.type !== "Bags") state.q.size = "";
    render();   // shows / hides the Size box
  });
  document.getElementById("q-size")?.addEventListener("change", e => { state.q.size = e.target.value; });
  const cr = document.getElementById("q-cropster");
  if (cr) {
    cr.addEventListener("input", e => { state.q.cropster = e.target.value; });
    cr.addEventListener("keydown", e => { if (e.key === "Enter") { state.q.cropster = cr.value; run_cropster(); } });
    if (!state.result && !state.busy) cr.focus();
  }
  document.getElementById("q-go").addEventListener("click", go);
  document.getElementById("q-print")?.addEventListener("click", () => window.print());
  main.querySelectorAll("[data-near]").forEach(b => b.addEventListener("click", () => { state.q.date = b.dataset.near; run_trace(); }));
}

function result_html(r) {
  if (r.mode === "cropster") {
    const head = `
      <div class="doc-title">Cropster roast ${esc(r.cropster)}${r.filter ? ` · ${esc(r.filter)} only` : ""}</div>
      <div class="doc-sub">prepared ${esc(nice_date(local_iso(new Date())))}</div>`;
    if (!r.roasts.length) return `<div class="doc">${head}<div class="empty">${r.unlinked
      ? `Cropster ${esc(r.cropster)} is logged, but its roast isn't linked to a drum, so there's nothing to follow.`
      : `No roast with Cropster id ${esc(r.cropster)} has been logged. Check the number on Cropster.`}</div></div>`;
    const groups = merge_roasts(r.roasts);
    return `<div class="doc">${head}${groups.map((x, i) => simple_html(x, null, i, groups.length)).join("")}</div>`;
  }
  const coffee = state.coffees.find(c => c.id === r.coffee_id)?.name || "Coffee";
  const head = `
    <div class="doc-title">${esc(coffee)}${r.filter ? ` · ${esc(r.filter)}` : ""} · ${esc(r.shop)}</div>
    <div class="doc-sub">${r.on === "delivery" ? "Delivered" : "Roasted"}: ${esc(nice_date(r.date))} · prepared ${esc(nice_date(local_iso(new Date())))}</div>`;
  if (!r.roasts.length) {
    return `<div class="doc">${head}
      <div class="empty">${r.on === "delivery"
        ? `No ${esc(coffee)}${r.filter ? ` ${esc(r.filter)}` : ""} was delivered to ${esc(r.shop)} on ${esc(nice_date(r.date))}.`
        : `No ${esc(coffee)}${r.filter ? ` ${esc(r.filter)}` : ""} roasted on ${esc(nice_date(r.date))} went to ${esc(r.shop)}.`}</div>
      ${r.near.length ? `<div class="near">${r.on === "delivery" ? `Deliveries of ${esc(coffee)} to ${esc(r.shop)}` : `${esc(coffee)} roasts`} close to that date: ${r.near.map(d => `<button data-near="${d}">${esc(nice_date(d))}</button>`).join("")}</div>` : ""}
    </div>`;
  }
  const groups = merge_roasts(r.roasts);
  return `<div class="doc">${head}${groups.map((x, i) => simple_html(x, r.shop, i, groups.length)).join("")}</div>`;
}

// Roasts of the same coffee made from the same green (same ICO lots / deliveries) read as ONE summary, even
// across different drums: drums, roast dates and Cropster roasts are listed together, and deliveries from
// them are added up (two drums on the same delivery become one line).
function merge_roasts(roasts) {
  const groups = {};
  roasts.forEach(x => {
    const key = `${x.coffee_id ?? state.result?.coffee_id}|${x.lots.map(l => l.key).sort().join(",")}`;
    const g = groups[key];
    if (!g) { groups[key] = { ...x, sessions: [...x.sessions], drums: [...x.drums], lots: x.lots.map(l => ({ ...l })),
                              dispatches: x.dispatches.map(d => ({ ...d, lines: [...d.lines] })) }; return; }
    g.sessions.push(...x.sessions);
    x.drums.forEach(d => { if (!g.drums.includes(d)) g.drums.push(d); });
    x.lots.forEach(l => { const m = g.lots.find(y => y.key === l.key); if (m) m.kg += l.kg; else g.lots.push({ ...l }); });
    x.dispatches.forEach(d => {
      const m = g.dispatches.find(y => y.id === d.id);
      if (m) m.lines.push(...d.lines); else g.dispatches.push({ ...d, lines: [...d.lines] });
    });
    g.name = null;   // several roasts now — not one named combined roast
  });
  return Object.values(groups).map(g => {
    g.sessions.sort((a, b) => (a.date || "").localeCompare(b.date || "") || String(a.id).localeCompare(String(b.id)));
    g.drums.sort();
    g.dispatches.sort((a, b) => (a.date || "").localeCompare(b.date || "") || String(a.id).localeCompare(String(b.id)));
    return g;
  });
}

// ── The plain summary (what's shown by default) ─────────────────────────────
// A few lines anyone can read: coffee + what + where, when and in which drum it was roasted, the Cropster
// roasts, the green coffee's ICO, and what was delivered when.
function simple_html(x, shop, i, count) {
  const coffee = state.coffees.find(c => c.id === (x.coffee_id ?? state.result?.coffee_id))?.name || "Coffee";
  const roast_dates = [...new Set(x.sessions.map(s => s.date))].map(nice_date).join(" and ");
  const cropster = [...new Set(x.sessions.flatMap(s => (s.roast_batches || []).map(b => b.cropster_id)).filter(Boolean))];
  // Each green lot: ICO (green, supplier) — when it was delivered, and when its contract was logged if it has one
  const known_lots = x.lots.filter(l => !l.unknown);
  const icos = known_lots.map(l => `<b>${esc(l.ico || "no ICO entered")}</b>`
    + (l.green_name || l.supplier ? ` <span class="muted">(${esc([l.green_name, l.supplier].filter(Boolean).join(", "))})</span>` : "")
    + ` — delivered <b>${esc(nice_date(l.date))}</b>`
    + (l.contract_logged ? `, on the ${esc(l.contract_supplier || "")} contract logged ${esc(nice_date(l.contract_logged))}` : ""));
  const what = d => {
    const parts = {};
    d.lines.forEach(l => {
      const t = line_type(l);
      const k = t.type === "Bags" ? `${t.size} bag` : t.type === "Bucket" ? "5kg bucket" : t.type.toLowerCase();
      const e = (parts[k] = parts[k] || { counted: t.counted, qty: 0, kg: 0, order: TYPE_ORDER.indexOf(t.type) * 10 + Math.max(0, BAG_SIZES.indexOf(t.size)) });
      e.qty += Number(t.qty) || 0; e.kg += Number(l.kg) || 0;
    });
    // Bags smallest first, then buckets, batch brew, samples
    return Object.entries(parts).sort((a, b) => a[1].order - b[1].order).map(([k, e]) => e.counted ? `${e.qty} × ${k}${e.qty === 1 ? "" : "s"}` : `${kg(e.kg)} ${k}`).join(", ");
  };
  const deliveries = x.dispatches.map(d => `<b>${esc(what(d))}</b> on ${esc(nice_date(d.date))}`);
  // Cropster search: just the forms the batch went into, added up across everything sent out (write-offs aside)
  const went_into = what({ lines: x.dispatches.flatMap(d => d.lines).filter(l => line_type(l).type !== "Write-off") });
  // The page title already says coffee · place · date; a card only needs a label when there's more than one
  // (or, for a Cropster search, which coffee it is)
  const label = shop == null ? coffee : count > 1 ? `Batch ${i + 1}` : "";
  return `
    <div class="simple">
      ${label ? `<div class="simple-title">${esc(label)}</div>` : ""}
      <div class="simple-row">Roasted <b>${esc(roast_dates)}</b> in ${x.drums.length > 1 ? "drums" : "drum"} <b>${esc(x.drums.join(", ") || "—")}</b>${x.name ? ` <span class="muted">(combined roast)</span>` : ""}</div>
      <div class="simple-row">Cropster roast${cropster.length === 1 ? "" : "s"}: <b>${esc(cropster.join(", ") || "none recorded")}</b></div>
      <div class="simple-row">Green coffee: ${icos.length ? `ICO ${icos.join("<br>and ICO ")}` : `<span class="muted">not known</span>`}</div>
      ${known_lots.length ? `<div class="simple-row">Green QC: ${known_lots.length === 1 ? green_qc_html(known_lots[0], x.qc)
        : known_lots.map(l => `ICO ${esc(l.ico || "—")}: ${green_qc_html(l, x.qc)}`).join("<br>")}</div>` : ""}
      <div class="simple-row">Roast colour: ${colour_html(x.sessions[0]?.date, coffee, x.qc)}</div>
      ${shop == null
        ? `<div class="simple-row">Went into: ${went_into ? `<b>${esc(went_into)}</b>` : `<span class="muted">nothing packed from it yet</span>`}</div>`
        : `<div class="simple-row">Delivered: ${deliveries.length ? deliveries.join("<br>") : `<span class="muted">not dispatched yet</span>`}</div>`}
    </div>`;
}

// What a dispatch line is: Bags (by size), Bucket (5kg), Batch brew, Samples, Write-off (emptied), Bulk.
// counted = sold by the unit (qty × size); otherwise by weight.
const TYPE_ORDER = ["Bags", "Bucket", "Batch brew", "Samples", "Bulk", "Write-off"];
function line_type(l) {
  const bs = l.bag_size || "";
  if (bs === "Bar 5kg") return { type: "Bucket", size: "5kg", qty: l.bags || 1, counted: true };
  if (bs === "Batch brew") return { type: "Batch brew", size: "", qty: "", counted: false };
  if (bs === "30g sample") return { type: "Samples", size: "30g", qty: l.bags || "", counted: true };
  if (bs === "Emptied") return { type: "Write-off", size: "", qty: "", counted: false };
  if (l.type === "bulk") return { type: "Bulk", size: bs, qty: "", counted: false };
  return { type: "Bags", size: bs || "?", qty: l.bags || "", counted: true };
}

// The Type / Size filter: does this dispatch line count?
const FILTER_TYPES = ["Bags", "Bucket", "Batch brew", "Samples"];
const BAG_SIZES = ["100g", "200g", "500g", "1kg"];
function line_matches(l) {
  const { type, size } = state.q;
  if (!type) return true;
  const t = line_type(l);
  return t.type === type && (type !== "Bags" || !size || t.size === size);
}
function filter_label() {
  const { type, size } = state.q;
  if (!type) return "";
  return type === "Bags" ? `${size ? size + " " : ""}bags` : type === "Bucket" ? "buckets" : type.toLowerCase();
}
function filter_qs() {
  return (state.q.type ? `&type=${encodeURIComponent(state.q.type)}` : "") + (state.q.type === "Bags" && state.q.size ? `&size=${encodeURIComponent(state.q.size)}` : "");
}

</script>
<!-- Sends the user to log in if this login is ended elsewhere, then back here -->
<script src="session-guard.js"></script>
</body>
</html>
