<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Bear Roastery</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f0eb; min-height: 100vh; color: #1a1008; }
    input, select, button { font-family: inherit; font-size: 14px; } button { cursor: pointer; }
    .header { background: #1a1008; color: #e8d5b0; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-back { background: none; border: none; color: #c8a96e; font-size: 13px; cursor: pointer; padding: 4px 0; }
    .header-back:hover { color: #e8d5b0; }
    .header-title { font-weight: 700; font-size: 18px; }
    .header-sub { font-size: 12px; color: #c8a96e; margin-top: 1px; }
    .btn-logout { background: none; border: 1px solid #c8a96e; color: #c8a96e; border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-logout:hover { background: #c8a96e; color: #1a1008; }
    .content { padding: 24px; max-width: 860px; margin: 0 auto; }
    .section { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 20px; overflow: hidden; }
    .section-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #f0ebe4; cursor: pointer; user-select: none; }
    .section-header:hover { background: #fdfaf7; }
    .section-title { font-weight: 700; font-size: 16px; color: #1a1008; display: flex; align-items: center; gap: 10px; }
    .section-title .icon { font-size: 20px; }
    .section-desc { font-size: 13px; color: #888; margin-top: 2px; }
    .section-arrow { font-size: 16px; color: #c8a96e; font-weight: 700; }
    .section-body { padding: 20px; }
    .card { background: #f5f0eb; border-radius: 8px; padding: 14px; margin-bottom: 10px; }
    .card-white { background: #fff; border: 1px solid #e0d5c5; border-radius: 8px; overflow: hidden; }
    label.lbl { display: block; font-size: 12px; color: #888; margin-bottom: 4px; font-weight: 500; }
    input, select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px; background: #fff; }
    input:focus, select:focus { outline: 2px solid #c8a96e; border-color: #c8a96e; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-size: 14px; font-weight: 600; }
    .btn-dark { background: #1a1008; } .btn-amber { background: #c8a96e; } .btn-green { background: #4a9e6b; }
    .btn-ghost { background: #f5f0eb; color: #5a3e1b; border: 1px solid #e0d5c5; }
    .btn-red { background: #e05c2a; }
    .btn-sm { padding: 4px 10px; font-size: 12px; } .btn-lg { padding: 12px 24px; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .tag { border-radius: 10px; padding: 2px 8px; font-size: 12px; font-weight: 600; display: inline-block; }

    /* Coffee cards */
    .coffee-card { border: 1px solid #e0d5c5; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
    .coffee-card-header { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #fff; cursor: pointer; user-select: none; }
    .coffee-card-header:hover { background: #fdfaf7; }
    .coffee-card-header.open { background: #fff8ee; }
    .coffee-card-body { padding: 16px; background: #fffdf9; border-top: 1px solid #e0d5c5; }

    /* FP code table */
    .fp-table-header { display: grid; grid-template-columns: 1fr 1fr auto; background: #f5f0eb; padding: 8px 12px; border-bottom: 1px solid #e0d5c5; gap: 8px; }
    .fp-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; padding: 8px 12px; }
    .fp-row + .fp-row { border-top: 1px solid #f0ebe4; }

    /* Supplier cards */
    .supplier-card { border: 1px solid #e0d5c5; border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
    .supplier-header { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #fff; cursor: pointer; user-select: none; }
    .supplier-header:hover { background: #fdfaf7; }
    .supplier-header.open { background: #fff8ee; }
    .supplier-body { padding: 14px; background: #fffdf9; border-top: 1px solid #e0d5c5; }
    .coffee-map-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; padding: 8px 12px; }
    .coffee-map-row + .coffee-map-row { border-top: 1px solid #f0ebe4; }

    .save-bar { position: sticky; bottom: 0; background: #fff; border-top: 1px solid #e0d5c5; padding: 14px 24px; display: flex; align-items: center; gap: 14px; box-shadow: 0 -2px 8px rgba(0,0,0,0.06); }
    .mono { font-family: monospace; } .err { color: #e05c2a; font-size: 13px; margin-top: 6px; } .hint { color: #888; font-size: 13px; }
    .section-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #c8a96e; margin-bottom: 10px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .mt-8{margin-top:8px} .mt-12{margin-top:12px} .mt-16{margin-top:16px} .mb-8{margin-bottom:8px} .mb-12{margin-bottom:12px}
    .loading { text-align: center; padding: 60px 20px; color: #888; font-size: 15px; }
    .parse-status { font-size: 13px; margin-top: 8px; padding: 8px 12px; border-radius: 6px; }
    .parse-status.ok { background: #edf7f0; color: #4a9e6b; }
    .parse-status.err { background: #fff0ee; color: #e05c2a; }
    .parse-status.info { background: #fff8ee; color: #c8a96e; }
    .inline-err { color: #e05c2a; font-size: 12px; margin-top: 4px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } .content { padding: 16px; } }
  </style>
</head>
<body>
<div id="app"></div>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// BEAR ROASTERY — Settings
// Coffees → coffees table (id, name)
// FP Codes → fp_codes table (id, coffee_id, fp_code, bag_size)
// QR base URL → settings table row id=1
// Supplier templates → supplier_templates table
// ─────────────────────────────────────────────────────────────────────────────

const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if (!session) window.location.href = "login.html";
  else init();
});

const BAG_SIZES = ["100g","200g","500g","1kg"];

const state = {
  base_url: "",
  coffees: [],          // [{ id, name, fp_codes: [{id, fp_code, bag_size}] }]
  supplier_templates: [],
  loading: true,
  saving: false,
  saved: false,
  open_section: "coffees",
  ui: {
    open_coffee: null,
    new_coffee_name: "",
    coffee_err: "",
    // per-coffee inline new FP row: { [coffee_id]: { fp_code:"", bag_size:"100g", err:"" } }
    new_fp: {},
    url_status: null,
    open_supplier: null,
    supplier_err: "",
    parsing_supplier: false,
    parse_status: null,
  },
};

function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ── LOAD ──────────────────────────────────────────────────────────────────────
async function load_base_url() {
  const { data, error } = await supabaseClient.from("settings").select("base_url").eq("id",1).single();
  if (!error && data) state.base_url = data.base_url || "";
}

async function load_coffees() {
  const { data: coffees, error: ce } = await supabaseClient.from("coffees").select("*").order("name");
  if (ce) { console.error("Failed to load coffees:", ce); return; }
  const { data: fp_codes, error: fe } = await supabaseClient.from("fp_codes").select("*").order("fp_code");
  if (fe) { console.error("Failed to load fp_codes:", fe); return; }
  state.coffees = (coffees||[]).map(c => ({
    ...c,
    fp_codes: (fp_codes||[]).filter(f => f.coffee_id === c.id),
  }));
}

async function load_supplier_templates() {
  const { data, error } = await supabaseClient.from("supplier_templates").select("*").order("supplier_name");
  if (error) { console.error("Failed to load supplier templates:", error); return; }
  state.supplier_templates = data || [];
}

async function init() {
  await Promise.all([load_base_url(), load_coffees(), load_supplier_templates()]);
  state.loading = false;
  render();
}

// ── SAVE BASE URL ─────────────────────────────────────────────────────────────
async function save_base_url() {
  state.saving = true; render();
  const { error } = await supabaseClient.from("settings").update({ base_url: state.base_url }).eq("id",1);
  state.saving = false;
  if (!error) { state.saved = true; render(); setTimeout(()=>{ state.saved=false; render(); },3000); }
  else { alert("Failed to save URL: " + error.message); render(); }
}

// ── COFFEES ───────────────────────────────────────────────────────────────────
async function add_coffee(name) {
  const { data, error } = await supabaseClient.from("coffees").insert({ name }).select().single();
  if (error) { state.ui.coffee_err = error.message; render(); return; }
  state.coffees.push({ ...data, fp_codes: [] });
  state.coffees.sort((a,b)=>a.name.localeCompare(b.name));
  state.ui.new_coffee_name = "";
  state.ui.coffee_err = "";
  state.ui.open_coffee = data.id;
  render();
}

async function delete_coffee(id) {
  if (!confirm("Delete this coffee and all its FP codes?")) return;
  const { error } = await supabaseClient.from("coffees").delete().eq("id",id);
  if (error) { alert("Failed to delete: " + error.message); return; }
  state.coffees = state.coffees.filter(c => c.id !== id);
  if (state.ui.open_coffee === id) state.ui.open_coffee = null;
  render();
}

async function rename_coffee(id, new_name) {
  const { error } = await supabaseClient.from("coffees").update({ name: new_name }).eq("id",id);
  if (error) { alert("Failed to rename: " + error.message); return; }
  const c = state.coffees.find(c=>c.id===id);
  if (c) { c.name = new_name; state.coffees.sort((a,b)=>a.name.localeCompare(b.name)); }
  render();
}

// ── FP CODES ──────────────────────────────────────────────────────────────────
async function add_fp_code(coffee_id, fp_code, bag_size) {
  const { data, error } = await supabaseClient.from("fp_codes")
    .insert({ coffee_id, fp_code: fp_code.toUpperCase(), bag_size })
    .select().single();
  if (error) {
    state.ui.new_fp[coffee_id] = { ...state.ui.new_fp[coffee_id], err: error.message };
    render(); return;
  }
  const coffee = state.coffees.find(c=>c.id===coffee_id);
  if (coffee) { coffee.fp_codes.push(data); coffee.fp_codes.sort((a,b)=>a.fp_code.localeCompare(b.fp_code)); }
  state.ui.new_fp[coffee_id] = { fp_code:"", bag_size:"100g", err:"" };
  render();
}

async function delete_fp_code(coffee_id, fp_id) {
  const { error } = await supabaseClient.from("fp_codes").delete().eq("id",fp_id);
  if (error) { alert("Failed to delete FP code: " + error.message); return; }
  const coffee = state.coffees.find(c=>c.id===coffee_id);
  if (coffee) coffee.fp_codes = coffee.fp_codes.filter(f=>f.id!==fp_id);
  render();
}

// ── SUPPLIERS ─────────────────────────────────────────────────────────────────
async function save_supplier_template(template) {
  const { error } = await supabaseClient.from("supplier_templates").upsert(template, { onConflict: "supplier_name" });
  if (error) { console.error("Failed to save supplier template:", error); return false; }
  return true;
}

async function delete_supplier_template(supplier_name) {
  await supabaseClient.from("supplier_templates").delete().eq("supplier_name", supplier_name);
  await load_supplier_templates();
  render();
}

// ── PDF PARSING ───────────────────────────────────────────────────────────────
async function load_pdf_js() {
  if (window.pdfjsLib) return window.pdfjsLib;
  await new Promise((res,rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = res; s.onerror = () => rej(new Error("Could not load PDF reader."));
    document.head.appendChild(s);
  });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  return window.pdfjsLib;
}

async function extract_pdf_text(file) {
  const lib = await load_pdf_js();
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data: buf }).promise;
  let full = "";
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const tc   = await page.getTextContent();
    const items = tc.items.slice().sort((a,b) => {
      const dy = Math.round(b.transform[5]) - Math.round(a.transform[5]);
      return dy !== 0 ? dy : a.transform[4] - b.transform[4];
    });
    full += items.map(i => i.str).join("\n") + "\n";
  }
  return full;
}

function generate_template_from_text(raw) {
  const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
  const template = {
    invoice_number_keyword: null, invoice_date_keyword: null, due_date_keyword: null,
    no_bags_column: null, description_column: null, ico_column: null,
    price_column: null, weight_column: null, value_column: null,
    coffee_mappings: [],
  };
  const find = (candidates) => candidates.find(c => lines.some(l => l.includes(c))) || null;
  template.invoice_number_keyword = find(["INVOICE No.","Invoice No.","Invoice Number","INV No.","Invoice #"]);
  template.invoice_date_keyword   = find(["Date:","Invoice Date:","Order Date:","Dated:"]);
  template.due_date_keyword       = find(["Due date:","Due Date:","Payment Due:","Due:"]);
  template.no_bags_column         = find(["No bags","No. of Bags","Bags","Quantity"]);
  template.description_column     = find(["Description","Product","Coffee","Item","Details"]);
  template.ico_column             = find(["Marks","ICO","ICO Number","Lot Ref","Reference","Batch"]);
  template.weight_column          = find(["Net weight (kg)","Net Weight","Weight (kg)","Weight","Kgs","KG"]);
  template.price_column           = find(["Price per kg","Price/kg","Unit Price","Rate","Price per Kg"]);
  template.value_column           = find(["Value","Amount","Line Total"]);
  const desc_idx = template.description_column ? lines.findIndex(l => l.includes(template.description_column)) : -1;
  if (desc_idx >= 0) {
    const NUM_RE = /^\d+(\.\d+)?$/;
    for (let i = desc_idx + 1; i < Math.min(desc_idx + 30, lines.length); i++) {
      const l = lines[i];
      if (l.length > 5 && !/^\d/.test(l) && !NUM_RE.test(l) && l.includes(",")) {
        if (!template.coffee_mappings.find(m => m.supplier_description === l))
          template.coffee_mappings.push({ supplier_description: l, our_coffee_id: null });
        if (template.coffee_mappings.length >= 10) break;
      }
    }
  }
  return template;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() { document.getElementById("app").innerHTML = build_app(); attach_listeners(); }

function build_app() {
  const header = `
    <div class="header">
      <div class="header-left">
        <button class="header-back" id="go-dashboard">← Dashboard</button>
        <div style="width:1px;height:28px;background:#333;margin:0 4px"></div>
        <div><div class="header-title">⚙️ Settings</div><div class="header-sub">Bear Roastery</div></div>
      </div>
      <button class="btn-logout" id="logout-btn">Log Out</button>
    </div>`;
  if (state.loading) return header + `<div class="loading">Loading settings…</div>`;
  return header + `
    <div class="content">
      <p class="hint" style="margin-bottom:20px">Manage your master coffee list, FP codes, QR base URL, and supplier templates here.</p>
      ${build_coffees_section()}
      ${build_traceability_section()}
      ${build_suppliers_section()}
    </div>`;
}

// ── COFFEES SECTION ───────────────────────────────────────────────────────────
function build_coffees_section() {
  const open = state.open_section === "coffees";
  const coffees = state.coffees;
  const total_fp = coffees.reduce((n,c)=>n+c.fp_codes.length, 0);

  const coffees_html = coffees.map(c => {
    const is_open = state.ui.open_coffee === c.id;
    const nfp = state.ui.new_fp[c.id] || { fp_code:"", bag_size:"100g", err:"" };

    const fp_rows = c.fp_codes.map(f => `
      <div class="fp-row">
        <span class="mono" style="font-size:13px;font-weight:600;color:#1a1008">${esc(f.fp_code)}</span>
        <span class="tag" style="background:#f0ebe4;color:#5a3e1b;font-size:11px">${esc(f.bag_size)}</span>
        <button style="background:none;border:none;color:#e05c2a;cursor:pointer;font-size:16px;line-height:1;padding:0 2px" data-delete-fp="${c.id}__${f.id}" title="Remove FP code">✕</button>
      </div>`).join("");

    return `
      <div class="coffee-card">
        <div class="coffee-card-header ${is_open?"open":""}" data-toggle-coffee="${c.id}">
          <span style="font-size:15px;color:#c8a96e">${is_open?"▾":"▸"}</span>
          <span style="flex:1;font-weight:600;font-size:14px;color:#1a1008">${esc(c.name)}</span>
          <span class="hint" style="font-size:12px;margin-right:8px">${c.fp_codes.length} FP code${c.fp_codes.length!==1?"s":""}</span>
          <button data-delete-coffee="${c.id}" style="background:none;border:none;color:#e05c2a;cursor:pointer;font-size:16px;padding:0 6px;line-height:1" onclick="event.stopPropagation()">✕</button>
        </div>
        ${is_open ? `
          <div class="coffee-card-body">

            <div class="mb-12">
              <label class="lbl">Coffee Name</label>
              <div style="display:flex;gap:8px">
                <input class="coffee-rename-input" data-cid="${c.id}" value="${esc(c.name)}" style="max-width:320px" />
                <button class="btn btn-ghost btn-sm coffee-rename-btn" data-cid="${c.id}">Rename</button>
              </div>
            </div>

            <div class="section-label">FP Codes</div>
            <div class="card-white" style="margin-bottom:12px">
              <div class="fp-table-header">
                <span class="lbl" style="margin:0">FP Code</span>
                <span class="lbl" style="margin:0">Size</span>
                <span></span>
              </div>
              ${c.fp_codes.length===0?'<div style="padding:10px 12px;font-size:12px;color:#aaa;font-style:italic">No FP codes yet. Add one below.</div>':""}
              ${fp_rows}
              <div style="padding:10px 12px;border-top:1px solid #f0ebe4;background:#fdfaf7">
                <div style="display:grid;grid-template-columns:1.2fr 1.5fr 1fr auto;gap:8px;align-items:flex-end">
                  <div>
                    <label class="lbl">FP Code *</label>
                    <input class="new-fp-code" data-cid="${c.id}" value="${esc(nfp.fp_code)}" placeholder="e.g. FP0046" style="font-family:monospace;font-size:13px" />
                  </div>
                  <div>
                    <label class="lbl">Size *</label>
                    <select class="new-fp-bag-size" data-cid="${c.id}" style="font-size:13px">
                      ${BAG_SIZES.map(s=>`<option value="${s}" ${nfp.bag_size===s?"selected":""}>${s}</option>`).join("")}
                    </select>
                  </div>
                  <button class="btn btn-amber btn-sm add-fp-btn" data-cid="${c.id}" style="margin-top:18px">+ Add</button>
                </div>
                ${nfp.err?`<p class="inline-err">${esc(nfp.err)}</p>`:""}
              </div>
            </div>

          </div>` : ""}
      </div>`;
  }).join("");

  const body = open ? `
    <div class="section-body">
      <p class="hint mb-12">Master coffee names used across all modules. Each coffee can have multiple FP codes for different bag sizes and SKUs.</p>

      ${coffees.length===0?'<p class="hint" style="font-style:italic;margin-bottom:12px">No coffees yet. Add one below.</p>':""}
      ${coffees_html}

      <div class="card mt-12">
        <label class="lbl">Add New Coffee</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="new-coffee-name" value="${esc(state.ui.new_coffee_name)}" placeholder="e.g. Holy Roast" style="max-width:320px" />
          <button class="btn btn-dark btn-sm" id="add-coffee-btn">Add Coffee</button>
        </div>
        ${state.ui.coffee_err?`<p class="inline-err">${esc(state.ui.coffee_err)}</p>`:""}
      </div>
    </div>` : "";

  return `
    <div class="section">
      <div class="section-header" data-toggle-section="coffees">
        <div>
          <div class="section-title"><span class="icon">☕</span> Coffees &amp; FP Codes</div>
          <div class="section-desc">${coffees.length} coffee${coffees.length!==1?"s":""} · ${total_fp} FP code${total_fp!==1?"s":""}</div>
        </div>
        <span class="section-arrow">${open?"▾":"▸"}</span>
      </div>
      ${body}
    </div>`;
}

// ── TRACEABILITY SECTION (QR URL only) ───────────────────────────────────────
function build_traceability_section() {
  const open = state.open_section === "traceability";
  const { url_status } = state.ui;

  const body = open ? `
    <div class="section-body">
      <div class="section-label">QR Code Base URL</div>
      <div class="card">
        <p class="hint mb-12">The URL embedded in every container QR code. Update this before going live.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
          <div style="flex:1;min-width:240px"><input id="base-url" value="${esc(state.base_url)}" placeholder="https://your-domain-here/scan" style="font-family:monospace;font-size:13px" /></div>
          <button class="btn btn-dark btn-sm" id="check-url">🔍 Check</button>
          <button class="btn btn-green btn-sm" id="save-url" ${state.saving?"disabled":""}>💾 Save URL</button>
        </div>
        ${url_status==="ok"?'<p style="margin-top:8px;font-size:13px;color:#4a9e6b;font-weight:600">✓ Valid URL format.</p>':""}
        ${url_status==="unreachable"?'<p style="margin-top:8px;font-size:13px;color:#e05c2a;font-weight:600">⚠️ Invalid URL format.</p>':""}
        ${state.saved?'<p style="margin-top:8px;font-size:13px;color:#4a9e6b;font-weight:600">✓ Saved.</p>':""}
      </div>
    </div>` : "";

  return `
    <div class="section">
      <div class="section-header" data-toggle-section="traceability">
        <div>
          <div class="section-title"><span class="icon">📍</span> Traceability</div>
          <div class="section-desc">QR base URL for container scanning</div>
        </div>
        <span class="section-arrow">${open?"▾":"▸"}</span>
      </div>
      ${body}
    </div>`;
}

// ── SUPPLIERS SECTION ─────────────────────────────────────────────────────────
function build_suppliers_section() {
  const open = state.open_section === "suppliers";
  const suppliers = state.supplier_templates;
  const { open_supplier, parsing_supplier, parse_status } = state.ui;

  const suppliers_html = suppliers.map((s,i) => {
    const is_open = open_supplier === i;
    const template = s.template || {};
    const coffee_maps = template.coffee_mappings || [];

    const coffee_map_rows = coffee_maps.map((m,j) => `
      <div class="coffee-map-row">
        <input class="sup-coffee-supplier" data-si="${i}" data-ci="${j}" value="${esc(m.supplier_description)}" placeholder="Supplier's description" style="font-size:13px" />
        <select class="sup-coffee-ours" data-si="${i}" data-ci="${j}" style="font-size:13px">
          <option value="">— Our coffee —</option>
          ${state.coffees.map(c=>`<option value="${c.id}" ${String(m.our_coffee_id)===String(c.id)?"selected":""}>${esc(c.name)}</option>`).join("")}
        </select>
        <button style="background:none;border:none;color:#e05c2a;cursor:pointer;font-size:18px;line-height:1" data-remove-coffee-map="${i}-${j}">✕</button>
      </div>`).join("");

    return `
      <div class="supplier-card">
        <div class="supplier-header ${is_open?"open":""}" data-toggle-supplier="${i}">
          <span style="font-size:15px;color:#c8a96e">${is_open?"▾":"▸"}</span>
          <span style="flex:1;font-weight:600;font-size:14px;color:#1a1008">${esc(s.supplier_name)}</span>
          ${s.template?`<span class="tag" style="background:#edf7f0;color:#4a9e6b;font-size:11px">✓ Template saved</span>`:`<span class="tag" style="background:#fff3e0;color:#e0a82a;font-size:11px">No template yet</span>`}
          <button data-delete-supplier="${esc(s.supplier_name)}" style="background:none;border:none;color:#e05c2a;cursor:pointer;font-size:16px;padding:0 6px;line-height:1" onclick="event.stopPropagation()">✕</button>
        </div>
        ${is_open ? `
          <div class="supplier-body">
            <div class="grid-2 mb-12">
              <div><label class="lbl">Supplier Name *</label><input class="sup-name" data-si="${i}" value="${esc(s.supplier_name)}" /></div>
              <div><label class="lbl">Contact / Email</label><input class="sup-contact" data-si="${i}" value="${esc(s.contact||"")}" placeholder="orders@supplier.com" /></div>
            </div>

            <div class="section-label">Field Mappings</div>
            <div class="card" style="margin-bottom:12px">
              <p class="hint mb-12">Keywords that tell the parser where to find each field in this supplier's invoices. Auto-generated from your sample PDF — edit if needed.</p>
              <div class="grid-2">
                <div><label class="lbl">Invoice Number keyword</label><input class="sup-field" data-si="${i}" data-field="invoice_number_keyword" value="${esc(template.invoice_number_keyword||"")}" placeholder="e.g. INVOICE No." /></div>
                <div><label class="lbl">Invoice Date keyword</label><input class="sup-field" data-si="${i}" data-field="invoice_date_keyword" value="${esc(template.invoice_date_keyword||"")}" placeholder="e.g. Date:" /></div>
                <div><label class="lbl">Due Date keyword</label><input class="sup-field" data-si="${i}" data-field="due_date_keyword" value="${esc(template.due_date_keyword||"")}" placeholder="e.g. Due date:" /></div>
                <div><label class="lbl">No. of Bags column</label><input class="sup-field" data-si="${i}" data-field="no_bags_column" value="${esc(template.no_bags_column||"")}" placeholder="e.g. No bags" /></div>
                <div><label class="lbl">Description column</label><input class="sup-field" data-si="${i}" data-field="description_column" value="${esc(template.description_column||"")}" placeholder="e.g. Description" /></div>
                <div><label class="lbl">ICO column</label><input class="sup-field" data-si="${i}" data-field="ico_column" value="${esc(template.ico_column||"")}" placeholder="e.g. Marks" /></div>
                <div><label class="lbl">Weight column</label><input class="sup-field" data-si="${i}" data-field="weight_column" value="${esc(template.weight_column||"")}" placeholder="e.g. Net weight (kg)" /></div>
                <div><label class="lbl">Price per kg column</label><input class="sup-field" data-si="${i}" data-field="price_column" value="${esc(template.price_column||"")}" placeholder="e.g. Price per kg" /></div>
                <div><label class="lbl">Value (€) column</label><input class="sup-field" data-si="${i}" data-field="value_column" value="${esc(template.value_column||"")}" placeholder="e.g. Value" /></div>
              </div>
            </div>

            <div class="section-label">Upload Sample PDF to Generate Template</div>
            <div class="card" style="margin-bottom:12px">
              <p class="hint mb-12">Upload a sample invoice from this supplier. The parser will analyse it and fill in the field mappings above automatically.</p>
              <input type="file" id="sup-pdf-${i}" accept=".pdf" style="display:none" />
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                <button class="btn btn-dark btn-sm sup-upload-btn" data-si="${i}" ${parsing_supplier?"disabled":""}>${parsing_supplier?"⏳ Parsing…":"📄 Upload Sample PDF"}</button>
                ${s.sample_text?`<span style="font-size:12px;color:#4a9e6b">✓ Sample loaded</span>`:`<span class="hint">No sample uploaded yet</span>`}
              </div>
              ${parse_status&&open_supplier===i?`<div class="parse-status ${parse_status.type}">${parse_status.msg}</div>`:""}
            </div>

            <div class="section-label">Coffee Name Translations</div>
            <div class="card-white" style="margin-bottom:12px">
              <div style="display:grid;grid-template-columns:1fr 1fr auto;background:#f5f0eb;padding:8px 12px;border-bottom:1px solid #e0d5c5">
                <span class="lbl" style="margin:0">Supplier's Description</span>
                <span class="lbl" style="margin:0">Our Coffee</span>
                <span></span>
              </div>
              ${coffee_maps.length===0?'<div style="padding:10px 12px;font-size:12px;color:#aaa;font-style:italic">No translations yet. Upload a sample PDF or add manually.</div>':""}
              ${coffee_map_rows}
              <div style="padding:8px 12px"><button class="btn btn-amber btn-sm" data-add-coffee-map="${i}">+ Add Translation</button></div>
            </div>

            <div style="display:flex;gap:8px">
              <button class="btn btn-dark btn-sm sup-save-btn" data-si="${i}" ${state.saving?"disabled":""}>Save Supplier</button>
            </div>
          </div>` : ""}
      </div>`;
  }).join("");

  const body = open ? `
    <div class="section-body">
      <p class="hint mb-12">Register your green coffee suppliers here. Upload a sample PDF to auto-generate a parsing template for each supplier's invoice format.</p>
      <div class="flex-between mb-12">
        <div class="section-label" style="margin:0">Suppliers</div>
        <button class="btn btn-dark btn-sm" id="add-supplier">+ Add Supplier</button>
      </div>
      ${suppliers.length===0?'<p class="hint" style="font-style:italic;margin-bottom:12px">No suppliers yet.</p>':""}
      ${suppliers_html}
      <div id="new-supplier-form" style="display:none" class="card">
        <div style="display:flex;gap:8px;align-items:flex-end">
          <div style="flex:1"><label class="lbl">Supplier Name *</label><input id="new-supplier-name" placeholder="e.g. D.R. Wakefield" /></div>
          <button class="btn btn-dark" id="save-new-supplier">Add</button>
          <button class="btn btn-ghost" id="cancel-new-supplier">Cancel</button>
        </div>
        ${state.ui.supplier_err?`<p class="err">${esc(state.ui.supplier_err)}</p>`:""}
      </div>
    </div>` : "";

  return `
    <div class="section">
      <div class="section-header" data-toggle-section="suppliers">
        <div>
          <div class="section-title"><span class="icon">🚚</span> Suppliers</div>
          <div class="section-desc">${suppliers.length} supplier${suppliers.length!==1?"s":""} · PDF invoice parser</div>
        </div>
        <span class="section-arrow">${open?"▾":"▸"}</span>
      </div>
      ${body}
    </div>`;
}

// ── LISTENERS ─────────────────────────────────────────────────────────────────
function attach_listeners() {
  const app = document.getElementById("app");

  app.querySelector("#go-dashboard")?.addEventListener("click", () => window.location.href="index.html");
  app.querySelector("#logout-btn")?.addEventListener("click", async () => { await supabaseClient.auth.signOut(); window.location.href="login.html"; });
  app.querySelectorAll("[data-toggle-section]").forEach(el => el.addEventListener("click", () => {
    state.open_section = state.open_section===el.dataset.toggleSection ? null : el.dataset.toggleSection;
    render();
  }));

  // ── URL
  app.querySelector("#base-url")?.addEventListener("input", e => { state.base_url=e.target.value; state.ui.url_status=null; state.saved=false; });
  app.querySelector("#check-url")?.addEventListener("click", () => {
    const target=document.getElementById("base-url")?.value.trim(); if(!target) return;
    try { new URL(target); state.ui.url_status="ok"; } catch { state.ui.url_status="unreachable"; } render();
  });
  app.querySelector("#save-url")?.addEventListener("click", () => {
    const bu=document.getElementById("base-url"); if(bu) state.base_url=bu.value.trim();
    save_base_url();
  });

  // ── Coffees
  app.querySelectorAll("[data-toggle-coffee]").forEach(el => el.addEventListener("click", () => {
    const id = Number(el.dataset.toggleCoffee);
    state.ui.open_coffee = state.ui.open_coffee===id ? null : id;
    render();
  }));
  app.querySelector("#new-coffee-name")?.addEventListener("input", e => { state.ui.new_coffee_name=e.target.value; });
  app.querySelector("#new-coffee-name")?.addEventListener("keydown", e => { if(e.key==="Enter") app.querySelector("#add-coffee-btn")?.click(); });
  app.querySelector("#add-coffee-btn")?.addEventListener("click", () => {
    const val = document.getElementById("new-coffee-name")?.value.trim();
    if (!val) { state.ui.coffee_err="Please enter a coffee name."; render(); return; }
    if (state.coffees.find(c=>c.name.toLowerCase()===val.toLowerCase())) { state.ui.coffee_err="Coffee already exists."; render(); return; }
    add_coffee(val);
  });
  app.querySelectorAll("[data-delete-coffee]").forEach(btn => btn.addEventListener("click", e => {
    e.stopPropagation();
    delete_coffee(Number(btn.dataset.deleteCoffee));
  }));
  app.querySelectorAll(".coffee-rename-btn").forEach(btn => btn.addEventListener("click", () => {
    const cid = Number(btn.dataset.cid);
    const inp = app.querySelector(`.coffee-rename-input[data-cid="${cid}"]`);
    const new_name = inp?.value.trim();
    if (!new_name) return;
    rename_coffee(cid, new_name);
  }));

  // ── FP Codes
  app.querySelectorAll(".new-fp-code").forEach(inp => inp.addEventListener("input", e => {
    const cid = Number(inp.dataset.cid);
    if (!state.ui.new_fp[cid]) state.ui.new_fp[cid] = { fp_code:"", bag_size:"100g", err:"" };
    state.ui.new_fp[cid].fp_code = e.target.value;
  }));
  app.querySelectorAll(".new-fp-bag-size").forEach(sel => sel.addEventListener("change", e => {
    const cid = Number(sel.dataset.cid);
    if (!state.ui.new_fp[cid]) state.ui.new_fp[cid] = { fp_code:"", bag_size:"100g", err:"" };
    state.ui.new_fp[cid].bag_size = e.target.value;
  }));
  app.querySelectorAll(".add-fp-btn").forEach(btn => btn.addEventListener("click", () => {
    const cid = Number(btn.dataset.cid);
    const nfp = state.ui.new_fp[cid] || { fp_code:"", bag_size:"100g", err:"" };
    const fp_code = (document.querySelector(`.new-fp-code[data-cid="${cid}"]`)?.value || nfp.fp_code).trim();
    const bag_size = nfp.bag_size || "100g";
    if (!fp_code) {
      state.ui.new_fp[cid] = { ...nfp, fp_code, err:"FP code is required." };
      render(); return;
    }
    add_fp_code(cid, fp_code, bag_size);
  }));
  app.querySelectorAll("[data-delete-fp]").forEach(btn => btn.addEventListener("click", () => {
    const [cid, fid] = btn.dataset.deleteFp.split("__").map(Number);
    delete_fp_code(cid, fid);
  }));

  // ── Suppliers
  app.querySelectorAll("[data-toggle-supplier]").forEach(el => el.addEventListener("click", () => {
    const i=Number(el.dataset.toggleSupplier);
    state.ui.open_supplier = state.ui.open_supplier===i ? null : i;
    state.ui.parse_status = null;
    render();
  }));
  app.querySelector("#add-supplier")?.addEventListener("click", () => {
    const form=document.getElementById("new-supplier-form");
    if (form) form.style.display=form.style.display==="none"?"block":"none";
  });
  app.querySelector("#save-new-supplier")?.addEventListener("click", async () => {
    const name=document.getElementById("new-supplier-name")?.value.trim();
    if (!name) { state.ui.supplier_err="Please enter a supplier name."; render(); return; }
    if (state.supplier_templates.find(s=>s.supplier_name===name)) { state.ui.supplier_err="Supplier already exists."; render(); return; }
    const new_supplier = { supplier_name: name, contact: "", template: null, sample_text: null };
    const ok = await save_supplier_template(new_supplier);
    if (ok) {
      state.ui.supplier_err = "";
      await load_supplier_templates();
      state.ui.open_supplier = state.supplier_templates.findIndex(s=>s.supplier_name===name);
      render();
    }
  });
  app.querySelector("#cancel-new-supplier")?.addEventListener("click", () => { state.ui.supplier_err=""; render(); });

  app.querySelectorAll("[data-delete-supplier]").forEach(btn => btn.addEventListener("click", async e => {
    e.stopPropagation();
    const name=btn.dataset.deleteSupplier;
    if (!confirm(`Delete supplier "${name}" and their template?`)) return;
    await delete_supplier_template(name);
  }));

  app.querySelectorAll(".sup-upload-btn").forEach(btn => btn.addEventListener("click", () => {
    document.getElementById(`sup-pdf-${btn.dataset.si}`)?.click();
  }));

  app.querySelectorAll("[id^='sup-pdf-']").forEach(input => input.addEventListener("change", async e => {
    const file=e.target.files?.[0]; if(!file) return;
    const si=Number(input.id.replace("sup-pdf-",""));
    state.ui.parsing_supplier=true; state.ui.parse_status={ type:"info", msg:"Reading PDF…" }; render();
    try {
      const raw=await extract_pdf_text(file);
      const template=generate_template_from_text(raw);
      state.supplier_templates[si].template    = template;
      state.supplier_templates[si].sample_text = raw;
      const ok=await save_supplier_template(state.supplier_templates[si]);
      state.ui.parse_status=ok
        ?{ type:"ok",  msg:`✓ Template generated — ${template.coffee_mappings.length} coffee description${template.coffee_mappings.length!==1?"s":""} found. Review mappings below.` }
        :{ type:"err", msg:"Failed to save template. Please try again." };
    } catch(err) {
      state.ui.parse_status={ type:"err", msg:`Failed to parse PDF: ${err.message}` };
    }
    state.ui.parsing_supplier=false;
    await load_supplier_templates();
    render();
    e.target.value="";
  }));

  app.querySelectorAll(".sup-save-btn").forEach(btn => btn.addEventListener("click", async () => {
    const si=Number(btn.dataset.si);
    const s=state.supplier_templates[si];
    const name_el=app.querySelector(`.sup-name[data-si="${si}"]`);
    const contact_el=app.querySelector(`.sup-contact[data-si="${si}"]`);
    if (name_el)    s.supplier_name=name_el.value.trim();
    if (contact_el) s.contact=contact_el.value.trim();
    app.querySelectorAll(`.sup-field[data-si="${si}"]`).forEach(inp => {
      if (!s.template) s.template={};
      s.template[inp.dataset.field]=inp.value.trim();
    });
    if (s.template) {
      const maps=[];
      app.querySelectorAll(`.sup-coffee-supplier[data-si="${si}"]`).forEach((inp,j) => {
        const our_el=app.querySelector(`.sup-coffee-ours[data-si="${si}"][data-ci="${j}"]`);
        maps.push({ supplier_description: inp.value.trim(), our_coffee_id: our_el?.value ? Number(our_el.value) : null });
      });
      s.template.coffee_mappings=maps;
    }
    state.saving=true; render();
    const ok=await save_supplier_template(s);
    state.saving=false;
    if (ok) { await load_supplier_templates(); state.ui.parse_status={ type:"ok", msg:"✓ Supplier saved." }; }
    render();
  }));

  app.querySelectorAll("[data-add-coffee-map]").forEach(btn => btn.addEventListener("click", () => {
    const si=Number(btn.dataset.addCoffeeMap);
    if (!state.supplier_templates[si].template) state.supplier_templates[si].template={};
    if (!state.supplier_templates[si].template.coffee_mappings) state.supplier_templates[si].template.coffee_mappings=[];
    state.supplier_templates[si].template.coffee_mappings.push({ supplier_description:"", our_coffee_id: null });
    render();
  }));

  app.querySelectorAll("[data-remove-coffee-map]").forEach(btn => btn.addEventListener("click", () => {
    const [si,ci]=btn.dataset.removeCoffeeMap.split("-").map(Number);
    state.supplier_templates[si].template.coffee_mappings.splice(ci,1);
    render();
  }));

  app.querySelectorAll(".sup-coffee-supplier").forEach(inp => inp.addEventListener("input", e => {
    const si=Number(inp.dataset.si), ci=Number(inp.dataset.ci);
    state.supplier_templates[si].template.coffee_mappings[ci].supplier_description=e.target.value;
  }));
  app.querySelectorAll(".sup-coffee-ours").forEach(sel => sel.addEventListener("change", e => {
    const si=Number(sel.dataset.si), ci=Number(sel.dataset.ci);
    state.supplier_templates[si].template.coffee_mappings[ci].our_coffee_id = e.target.value ? Number(e.target.value) : null;
  }));
}
</script>
</body>
</html>
