function render() { document.getElementById("app").innerHTML = build_app(); attach_listeners(); }

function build_app() {
  const header = `
    <div class="header">
      <div class="header-left">
        <button class="header-back" id="go-dashboard">← Dashboard</button>
        <button class="header-back" id="go-print-qr" style="color:#fff;background:#333;padding:6px 12px;border-radius:6px">🖨️ Print QR Codes</button>
        <div style="width:1px;height:28px;background:#333;margin:0 4px"></div>
        <div><div class="header-title">⚙️ Settings</div><div class="header-sub">Bear Mrkt</div></div>
      </div>
      <button class="btn-logout" id="logout-btn">Log Out</button>
    </div>`;
  if (state.loading) return header + `<div class="loading">Loading settings…</div>`;
  const tabs = [
    { id: "catalogue",  label: "Catalogue",  icon: "📚" },
    { id: "operations", label: "Operations", icon: "🏭" },
    { id: "people",     label: "People",     icon: "👥" },
  ];
  const active = state.active_tab || "catalogue";
  const tab_bar = `
    <div style="display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid #e8e6e1;flex-wrap:wrap">
      ${tabs.map(t => `
        <button data-settings-tab="${t.id}" style="background:none;border:none;border-bottom:3px solid ${active===t.id?'#1a1a1a':'transparent'};color:${active===t.id?'#1a1a1a':'#999'};font-weight:${active===t.id?'700':'500'};font-size:14px;padding:10px 16px;cursor:pointer;margin-bottom:-2px">${t.icon} ${t.label}</button>
      `).join("")}
    </div>`;
  const sections =
      active === "operations" ? `${build_shops_section()}${build_containers_section()}${build_buckets_section()}${build_bucket_restore_section()}${build_qr_tester_section()}`
    : active === "people"     ? `${build_users_section()}`
    :                           `${build_coffees_section()}${build_label_data_section()}`;
  return header + `
    <div class="content">
      ${tab_bar}
      ${sections}
    </div>`;
}

// ── COFFEES SECTION ───────────────────────────────────────────────────────────
function build_coffees_section() {
  const open = state.open_section === "coffees";
  const all_coffees = state.coffees;
  const active_coffees  = all_coffees.filter(c => !c.retired_at);
  const retired_coffees = all_coffees.filter(c =>  c.retired_at);
  const filter = state.ui.coffee_filter || "active";
  const showing = filter === "retired" ? retired_coffees : active_coffees;
  const total_active_fp = active_coffees.reduce((n,c)=>n+c.fp_codes.filter(f=>!f.retired_at).length, 0);

  const coffees_html = showing.map(c => {
    const is_open = state.ui.open_coffee === c.id;
    const nfp = state.ui.new_fp[c.id] || { fp_code:"", bag_size:"100g", err:"" };
    const is_retired_coffee = !!c.retired_at;

    const active_fps  = c.fp_codes.filter(f => !f.retired_at);
    const retired_fps = c.fp_codes.filter(f =>  f.retired_at);
    const show_retired_fps = !!state.ui.show_retired_fp[c.id];

    // Coffee-level reassign: move ALL active codes (each keeps its bag size) to another coffee.
    const ra_open = state.ui.reassign_open === c.id;
    const ra = state.ui.reassign_form || {};
    const ra_coffee_opts = state.coffees.filter(x => !x.retired_at && x.id !== c.id)
      .map(x => `<option value="${x.id}" ${String(ra.coffee_id)===String(x.id)?"selected":""}>${esc(x.name)}</option>`).join("");
    const reassign_control = (is_retired_coffee || active_fps.length === 0) ? "" : (ra_open ? `
      <div style="padding:10px 12px;background:#fbf7ef;border:1px solid #f0e3c8;border-radius:8px;margin-bottom:12px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#a07b1f;margin-bottom:4px">Reassign this coffee's codes to another coffee</div>
        <div style="font-size:12px;color:#666;margin-bottom:8px">Moves all ${active_fps.length} active code${active_fps.length!==1?"s":""} (${active_fps.map(f=>esc(f.fp_code)).join(", ")}) — each keeps its bag size and starts a fresh label under the new coffee.</div>
        <div style="display:grid;grid-template-columns:1.6fr 1fr auto auto;gap:8px;align-items:flex-end">
          <div><label class="lbl">New coffee</label><select class="reassign-coffee" style="font-size:13px"><option value="">— pick —</option>${ra_coffee_opts}</select></div>
          <div><label class="lbl">Effective date</label><input type="date" class="reassign-date" value="${esc(ra.date||today())}" style="font-size:13px" /></div>
          <button class="btn btn-amber btn-sm" data-reassign-confirm="${c.id}" ${ra.saving?"disabled":""} style="margin-top:18px">${ra.saving?"Saving…":"Confirm"}</button>
          <button class="btn btn-ghost btn-sm" data-reassign-cancel="1" style="margin-top:18px">Cancel</button>
        </div>
        ${ra.err?`<p class="inline-err">${esc(ra.err)}</p>`:""}
      </div>` : `
      <button class="btn btn-ghost btn-sm" data-reassign-toggle="${c.id}" style="margin-bottom:12px" title="Reassign this coffee's FP codes to another coffee">⇄ Reassign codes to another coffee</button>`);

    const fp_row = (f, retired) => {
      const versions = assignments_for(f.fp_code);
      const history = versions.length > 1 ? `<div style="padding:2px 12px 8px;font-size:11px;color:#888;background:#fafaf8">
          <span style="font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#aaa">Versions:</span>
          ${versions.map(v => `<span style="margin-left:6px;${v.effective_end==null?'color:#1a1a1a;font-weight:600':''}">${esc(coffee_name_by_id(v.coffee_id))} <span class="mono" style="color:#999">(${v.effective_start||"start"}→${v.effective_end||"now"})</span></span>`).join(" · ")}
        </div>` : "";
      return `
      <div class="fp-row" style="${retired?'opacity:0.6':''}">
        <span class="mono" style="font-size:13px;font-weight:600;color:#1a1a1a">${esc(f.fp_code)}</span>
        <span class="tag" style="background:#f0eee9;color:#1a1a1a;font-size:11px">${esc(f.bag_size)}</span>
        <div style="display:flex;gap:4px">
          ${retired
            ? `<button class="btn btn-ghost btn-sm" data-restore-fp="${c.id}__${f.id}" title="Restore FP code">♻️ Restore</button>`
            : `<button style="background:none;border:none;color:#666;cursor:pointer;font-size:13px;padding:0 4px" data-retire-fp="${c.id}__${f.id}" title="Retire FP code">🗄️</button>
               <button style="background:none;border:none;color:#dc2626;cursor:pointer;font-size:16px;line-height:1;padding:0 2px" data-delete-fp="${c.id}__${f.id}" title="Delete FP code (permanent)">✕</button>`
          }
        </div>
      </div>${history}`;
    };

    const active_fp_rows  = active_fps.map(f => fp_row(f, false)).join("");
    const retired_fp_rows = retired_fps.map(f => fp_row(f, true)).join("");

    return `
      <div class="coffee-card" style="${is_retired_coffee?'opacity:0.85;background:#fafaf8':''}">
        <div class="coffee-card-header ${is_open?"open":""}" data-toggle-coffee="${c.id}">
          <span style="font-size:15px;color:#666">${is_open?"▾":"▸"}</span>
          <span style="flex:1;font-weight:600;font-size:14px;color:#1a1a1a">${esc(c.name)}${is_retired_coffee?' <span class="tag" style="background:#fff7ed;color:#d97706;font-size:10px;margin-left:6px">RETIRED</span>':""}</span>
          <span class="hint" style="font-size:12px;margin-right:8px">${active_fps.length} active${retired_fps.length?` · ${retired_fps.length} retired`:""}</span>
          ${is_retired_coffee
            ? `<button data-restore-coffee="${c.id}" class="btn btn-ghost btn-sm" onclick="event.stopPropagation()">♻️ Restore</button>`
            : `<button data-retire-coffee="${c.id}" style="background:none;border:none;color:#666;cursor:pointer;font-size:14px;padding:0 6px" title="Retire coffee" onclick="event.stopPropagation()">🗄️</button>
               <button data-delete-coffee="${c.id}" style="background:none;border:none;color:#dc2626;cursor:pointer;font-size:16px;padding:0 6px;line-height:1" title="Delete (permanent)" onclick="event.stopPropagation()">✕</button>`
          }
        </div>
        ${is_open ? `
          <div class="coffee-card-body">

            <div class="mb-12">
              <label class="lbl">Coffee Name</label>
              <div style="display:flex;gap:8px">
                <input class="coffee-rename-input" data-cid="${c.id}" value="${esc(c.name)}" style="max-width:320px" ${is_retired_coffee?"disabled":""} />
                <button class="btn btn-ghost btn-sm coffee-rename-btn" data-cid="${c.id}" ${is_retired_coffee?"disabled":""}>Rename</button>
              </div>
            </div>

            <div class="section-label">Active FP Codes</div>
            <div class="card-white" style="margin-bottom:12px">
              <div class="fp-table-header">
                <span class="lbl" style="margin:0">FP Code</span>
                <span class="lbl" style="margin:0">Size</span>
                <span></span>
              </div>
              ${active_fps.length===0?'<div style="padding:10px 12px;font-size:12px;color:#999;font-style:italic">No active FP codes.</div>':""}
              ${active_fp_rows}
              ${is_retired_coffee ? "" : `
              <div style="padding:10px 12px;border-top:1px solid #f0eee9;background:#fafaf8">
                <div style="display:grid;grid-template-columns:1.2fr 1.5fr 1fr auto;gap:8px;align-items:flex-end">
                  <div>
                    <label class="lbl">FP Code *</label>
                    <input class="new-fp-code" data-cid="${c.id}" value="${esc(nfp.fp_code)}" placeholder="e.g. FP0046" style="font-family:monospace;font-size:13px" />
                  </div>
                  <div>
                    <label class="lbl">Size *</label>
                    <select class="new-fp-bag-size" data-cid="${c.id}" style="font-size:13px">
                      ${BAG_SIZES.map(s=>`<option value="${s}" ${nfp.bag_size===s?"selected":""}>${s}</option>`).join("")}
                    </select>
                  </div>
                  <button class="btn btn-amber btn-sm add-fp-btn" data-cid="${c.id}" style="margin-top:18px">+ Add</button>
                </div>
                ${nfp.err?`<p class="inline-err">${esc(nfp.err)}</p>`:""}
              </div>`}
            </div>

            ${reassign_control}

            ${retired_fps.length > 0 ? `
            <div class="section-label" style="cursor:pointer;user-select:none" data-toggle-retired-fp="${c.id}">
              ${show_retired_fps?"▾":"▸"} Retired FP Codes (${retired_fps.length})
            </div>
            ${show_retired_fps ? `
              <div class="card-white" style="margin-bottom:12px">
                ${retired_fp_rows}
              </div>` : ""}
            ` : ""}

          </div>` : ""}
      </div>`;
  }).join("");

  const filter_tabs = `
    <div style="display:flex;gap:0;margin-bottom:12px;background:#f4f2ed;padding:3px;border-radius:8px;width:fit-content">
      <button class="btn ${filter==='active'?'btn-dark':'btn-ghost'} btn-sm" data-coffee-filter="active" style="${filter==='active'?'color:#fff':''}">Active (${active_coffees.length})</button>
      <button class="btn ${filter==='retired'?'btn-dark':'btn-ghost'} btn-sm" data-coffee-filter="retired" style="${filter==='retired'?'color:#fff':''}">🗄️ Retired (${retired_coffees.length})</button>
    </div>`;

  const body = open ? `
    <div class="section-body">
      <p class="hint mb-12">Master coffee names used across all modules. Retire a coffee (or individual FP code) to hide it from packing/printing/labels while keeping it in reports.</p>

      ${filter_tabs}

      ${showing.length===0?`<p class="hint" style="font-style:italic;margin-bottom:12px">${filter==='retired'?'No retired coffees.':'No active coffees. Add one below.'}</p>`:""}
      ${coffees_html}

      ${filter === "active" ? `
      <div class="card mt-12">
        <label class="lbl">Add New Coffee</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="new-coffee-name" value="${esc(state.ui.new_coffee_name)}" placeholder="e.g. Holy Roast" style="max-width:320px" />
          <button class="btn btn-dark btn-sm" id="add-coffee-btn">Add Coffee</button>
        </div>
        ${state.ui.coffee_err?`<p class="inline-err">${esc(state.ui.coffee_err)}</p>`:""}
      </div>` : ""}
    </div>` : "";

  return `
    <div class="section">
      <div class="section-header" data-toggle-section="coffees">
        <div>
          <div class="section-title"><span class="icon">☕</span> Coffees &amp; FP Codes</div>
          <div class="section-desc">${active_coffees.length} active${retired_coffees.length?` · ${retired_coffees.length} retired`:""} · ${total_active_fp} active FP code${total_active_fp!==1?"s":""}</div>
        </div>
        <span class="section-arrow">${open?"▾":"▸"}</span>
      </div>
      ${body}
    </div>`;
}

// ── BAG LABEL DATA SECTION ───────────────────────────────────────────────────
// One row per FP code (excl. "Bar 5kg" — not a retail bag).
// Stored in fp_label_data table, keyed by fp_code.
// "Copy from..." pre-fills shared fields from a sibling FP (same coffee, different size) to save typing.
function build_label_data_section() {
  const open = state.open_section === "label_data";
  // Flatten all FP codes across active coffees, filtering out Bar 5kg AND retired entities
  const rows = [];
  state.coffees
    .filter(c => !c.retired_at)
    .forEach(c => {
      c.fp_codes
        .filter(f => !f.retired_at)
        .filter(f => f.bag_size && f.bag_size.toLowerCase() !== "bar 5kg")
        .forEach(f => rows.push({ coffee: c, fp: f }));
    });

  const filled_count = rows.filter(r => label_for_fp(r.fp.fp_code)).length;

  // Group rows by coffee for readability
  const by_coffee = {};
  rows.forEach(r => {
    if (!by_coffee[r.coffee.id]) by_coffee[r.coffee.id] = { coffee: r.coffee, fps: [] };
    by_coffee[r.coffee.id].fps.push(r.fp);
  });

  const get_draft = (fp_code) => {
    const saved = label_for_fp(fp_code) || {};
    const draft = state.ui.label_edit[fp_code];
    // If there's a working draft with dirty=true, use it; otherwise show saved
    if (draft && draft.dirty) return draft;
    return saved;
  };

  const groups_html = Object.values(by_coffee).map(g => {
    const fps_html = g.fps.map(f => {
      const d = get_draft(f.fp_code);
      const saved = label_for_fp(f.fp_code);
      const ui_state = state.ui.label_edit[f.fp_code] || {};
      const is_dirty = ui_state.dirty;
      const is_saving = ui_state.saving;
      const flash_active = ui_state.saved_flash_until && Date.now() < ui_state.saved_flash_until;
      // Build copy-from options: siblings of this FP (same coffee, different fp_code, has saved data)
      const siblings = g.fps.filter(s => s.fp_code !== f.fp_code && label_for_fp(s.fp_code));
      const copy_options = siblings.map(s => `<option value="${esc(s.fp_code)}">${esc(s.fp_code)} (${esc(s.bag_size)})</option>`).join("");
      return `
        <div class="label-fp-card" data-fp-card="${esc(f.fp_code)}">
          <div class="label-fp-header">
            <span class="mono" style="font-size:14px;font-weight:700;color:#1a1a1a">${esc(f.fp_code)}</span>
            <span class="tag" style="background:#f0eee9;color:#1a1a1a;font-size:11px">${esc(f.bag_size)}</span>
            ${saved ? '<span class="tag" style="background:#e7f5ec;color:#16a34a;font-size:10px">SAVED</span>' : '<span class="tag" style="background:#fff7ed;color:#d97706;font-size:10px">EMPTY</span>'}
            ${siblings.length > 0 ? `
              <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
                <label class="lbl" style="margin:0;font-size:10px">📋 Copy from</label>
                <select class="label-copy-from" data-fp="${esc(f.fp_code)}" style="font-size:12px;padding:3px 6px">
                  <option value="">— pick FP —</option>
                  ${copy_options}
                </select>
              </div>
            ` : ""}
          </div>
          <div class="label-fp-body">
            <div class="label-grid">
              <div>
                <label class="lbl">Roast Type</label>
                <input class="label-input" data-fp="${esc(f.fp_code)}" data-field="roast_type" value="${esc(d.roast_type||"")}" placeholder="Espresso / Filter" />
              </div>
              <div>
                <label class="lbl">Region</label>
                <input class="label-input" data-fp="${esc(f.fp_code)}" data-field="region" value="${esc(d.region||"")}" placeholder="e.g. Colombia Huila" />
              </div>
              <div>
                <label class="lbl">Process</label>
                <input class="label-input" data-fp="${esc(f.fp_code)}" data-field="process" value="${esc(d.process||"")}" placeholder="e.g. Washed" />
              </div>
              <div>
                <label class="lbl">Altitude</label>
                <input class="label-input" data-fp="${esc(f.fp_code)}" data-field="altitude" value="${esc(d.altitude||"")}" placeholder="e.g. 1800 Masl" />
              </div>
              <div>
                <label class="lbl">Flavour 1</label>
                <input class="label-input" data-fp="${esc(f.fp_code)}" data-field="flavour_1" value="${esc(d.flavour_1||"")}" placeholder="e.g. Chocolate" />
              </div>
              <div>
                <label class="lbl">Flavour 2</label>
                <input class="label-input" data-fp="${esc(f.fp_code)}" data-field="flavour_2" value="${esc(d.flavour_2||"")}" placeholder="e.g. Caramel" />
              </div>
              <div>
                <label class="lbl">Flavour 3</label>
                <input class="label-input" data-fp="${esc(f.fp_code)}" data-field="flavour_3" value="${esc(d.flavour_3||"")}" placeholder="e.g. Hazelnut" />
              </div>
              <div>
                <label class="lbl">Price</label>
                <input class="label-input" data-fp="${esc(f.fp_code)}" data-field="price" value="${esc(d.price||"")}" placeholder="e.g. €14.00" />
              </div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
              <button class="btn ${is_dirty?"btn-dark":"btn-ghost"} btn-sm label-save-btn" data-fp="${esc(f.fp_code)}" ${(!is_dirty || is_saving)?"disabled":""}>${is_saving?"Saving…":"💾 Save"}</button>
              ${flash_active ? '<span style="color:#16a34a;font-size:12px;font-weight:600">✓ Saved</span>' : ""}
              ${ui_state.err ? `<span class="inline-err" style="margin:0">${esc(ui_state.err)}</span>` : ""}
              ${is_dirty && !is_saving ? '<span style="color:#d97706;font-size:12px;font-style:italic">unsaved changes</span>' : ""}
            </div>
          </div>
        </div>`;
    }).join("");

    return `
      <div class="label-coffee-group">
        <div class="label-coffee-name">☕ ${esc(g.coffee.name)} <span class="hint" style="font-weight:400;font-size:12px">· ${g.fps.length} bag size${g.fps.length!==1?"s":""}</span></div>
        ${fps_html}
      </div>`;
  }).join("");

  const body = open ? `
    <div class="section-body">
      <p class="hint mb-12">Marketing data printed on retail bag labels. Used by the A4 21-up bag-sticker print page. Each FP code (bag size SKU) can have its own data — use "📋 Copy from" to pre-fill from a sibling.</p>
      ${rows.length === 0 ? '<p class="hint" style="font-style:italic">No FP codes yet. Add some in the Coffees section first.</p>' : groups_html}
    </div>` : "";

  return `
    <div class="section">
      <div class="section-header" data-toggle-section="label_data">
        <div>
          <div class="section-title"><span class="icon">🏷️</span> Bag Label Data</div>
          <div class="section-desc">${filled_count}/${rows.length} filled · for A4 bag-sticker printing</div>
        </div>
        <span class="section-arrow">${open?"▾":"▸"}</span>
      </div>
      ${body}
    </div>`;
}

// ── SHOPS SECTION ────────────────────────────────────────────────────────────
function build_shops_section() {
  const open = state.open_section === "shops";
  const mappings = state.shop_mappings;
  const { new_shop_master, new_shop_kind, shop_err } = state.ui;
  const selected_kind = new_shop_kind || "shop";

  // One row per unique master_name; show its QR + kind
  const by_master = {};
  mappings.forEach(m => {
    if (!by_master[m.master_name]) by_master[m.master_name] = { master_name: m.master_name, shop_qr_id: m.shop_qr_id, id: m.id, kind: m.kind || "shop" };
    if (m.shop_qr_id) by_master[m.master_name].shop_qr_id = m.shop_qr_id;
    if (m.kind) by_master[m.master_name].kind = m.kind;
  });
  const entries = Object.values(by_master).sort((a,b) => a.master_name.localeCompare(b.master_name));

  const kind_badge = (kind) => {
    if (kind === "online")    return '<span style="background:#fff7ed;color:#d97706;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;margin-left:4px">ONLINE</span>';
    if (kind === "wholesale") return '<span style="background:#f0e9f7;color:#7e57c2;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;margin-left:4px">WHOLESALE</span>';
    return "";
  };

  const render_row = (s) => {
    const has_qr = s.kind === "shop";
    return `
      <div style="display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px;border-top:1px solid #f0eee9">
        <div>
          <div style="font-weight:700;font-size:14px">${esc(s.master_name)}${kind_badge(s.kind)}</div>
          ${!has_qr
            ? `<div style="font-size:11px;color:#666;margin-top:2px">${s.kind === "wholesale" ? "Wholesale customer — auto-confirmed on dispatch, no QR" : "Online — auto-confirmed on dispatch, no QR"}</div>`
            : s.shop_qr_id
            ? `<div style="font-size:11px;color:#666;font-family:monospace;margin-top:2px">${esc(s.shop_qr_id)}</div>`
            : '<div style="font-size:11px;color:#dc2626;margin-top:2px">No QR yet</div>'}
        </div>
        ${!has_qr
          ? '<span></span>'
          : s.shop_qr_id
          ? `<a href="print-qr.html?type=shop&ids=${encodeURIComponent(s.shop_qr_id)}" target="_blank" class="btn btn-ghost btn-sm" style="font-size:11px;text-decoration:none">🖨️</a>`
          : `<button data-generate-shop-qr="${esc(s.master_name)}" class="btn btn-dark btn-sm" style="font-size:11px">+ QR</button>`}
        <button data-delete-shop-master="${esc(s.master_name)}" style="background:none;border:none;color:#dc2626;cursor:pointer;font-size:16px;line-height:1;padding:0 4px" title="Remove">✕</button>
      </div>`;
  };

  const shops_list = entries.filter(e => e.kind === "shop");
  const wholesale_list = entries.filter(e => e.kind === "wholesale");
  const online_list = entries.filter(e => e.kind === "online");

  const group = (title, list) => list.length === 0 ? "" : `
    <div class="section-label" style="margin-top:14px">${title} (${list.length})</div>
    <div class="card-white" style="margin-bottom:0">
      ${list.map(render_row).join("")}
    </div>`;

  const body = open ? `
    <div class="section-body">
      <p class="hint mb-12">Three types of destinations: <strong>Shops</strong> (Bearmarket — QR-confirmed on delivery), <strong>Wholesale</strong> (third-party customers — auto-confirmed at pack), <strong>Online</strong> (web orders — auto-confirmed at pack).</p>

      ${entries.length === 0 ? '<div class="card-white" style="padding:14px 12px;font-size:13px;color:#999;font-style:italic">Nothing here yet — add an entry below.</div>' : ""}
      ${group("Shops", shops_list)}
      ${group("Wholesale", wholesale_list)}
      ${group("Online", online_list)}

      <div class="section-label" style="margin-top:16px">Add New</div>
      <div class="card">
        <div style="display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:flex-end">
          <div><label class="lbl">Name *</label><input id="new-shop-master" value="${esc(new_shop_master)}" placeholder="e.g. Stillorgan, or Bewleys Cafe" style="font-size:13px" /></div>
          <div><label class="lbl">Type</label>
            <select id="new-shop-kind" style="font-size:13px;width:130px">
              <option value="shop"      ${selected_kind==="shop"?"selected":""}>Shop</option>
              <option value="wholesale" ${selected_kind==="wholesale"?"selected":""}>Wholesale</option>
              <option value="online"    ${selected_kind==="online"?"selected":""}>Online</option>
            </select>
          </div>
          <button class="btn btn-dark btn-sm" id="add-shop-mapping">+ Add</button>
        </div>
        <p class="hint" style="font-size:12px;margin-top:8px">Shops get an auto-generated QR for delivery confirmation. Wholesale and Online auto-confirm at pack time.</p>
        ${shop_err ? `<p style="color:#dc2626;font-size:12px;margin-top:4px">${esc(shop_err)}</p>` : ""}
      </div>
    </div>` : "";
  return `
    <div class="section">
      <div class="section-header" data-toggle-section="shops">
        <div>
          <div class="section-title"><span class="icon">🏪</span> Shops</div>
          <div class="section-desc">${shops_list.length} shop${shops_list.length!==1?"s":""}${wholesale_list.length?` · ${wholesale_list.length} wholesale`:""}${online_list.length?` · ${online_list.length} online`:""}</div>
        </div>
        <span class="section-arrow">${open ? "▾" : "▸"}</span>
      </div>
      ${body}
    </div>`;
}

// ── LISTENERS ─────────────────────────────────────────────────────────────────
function attach_listeners() {
  const app = document.getElementById("app");

  app.querySelector("#go-dashboard")?.addEventListener("click", () => window.location.href="index.html");
  app.querySelector("#go-print-qr")?.addEventListener("click", () => window.location.href="print-qr.html");
  app.querySelector("#logout-btn")?.addEventListener("click", async () => { await supabaseClient.auth.signOut(); window.location.href="login.html"; });
  app.querySelectorAll("[data-settings-tab]").forEach(btn => btn.addEventListener("click", () => {
    const t = btn.dataset.settingsTab;
    state.active_tab = t;
    // Open the first section of the tab so it isn't a wall of collapsed headers.
    state.open_section = t === "operations" ? "shops" : t === "people" ? "users" : "coffees";
    render();
  }));
  app.querySelectorAll("[data-toggle-section]").forEach(el => el.addEventListener("click", () => {
    state.open_section = state.open_section===el.dataset.toggleSection ? null : el.dataset.toggleSection;
    render();
  }));

  // ── Coffees
  app.querySelectorAll("[data-toggle-coffee]").forEach(el => el.addEventListener("click", () => {
    const id = Number(el.dataset.toggleCoffee);
    state.ui.open_coffee = state.ui.open_coffee===id ? null : id;
    render();
  }));
  app.querySelector("#new-coffee-name")?.addEventListener("input", e => { state.ui.new_coffee_name=e.target.value; });
  app.querySelector("#new-coffee-name")?.addEventListener("keydown", e => { if(e.key==="Enter") app.querySelector("#add-coffee-btn")?.click(); });
  app.querySelector("#add-coffee-btn")?.addEventListener("click", () => {
    const val = document.getElementById("new-coffee-name")?.value.trim();
    if (!val) { state.ui.coffee_err="Please enter a coffee name."; render(); return; }
    if (state.coffees.find(c=>c.name.toLowerCase()===val.toLowerCase())) { state.ui.coffee_err="Coffee already exists."; render(); return; }
    add_coffee(val);
  });
  app.querySelectorAll("[data-delete-coffee]").forEach(btn => btn.addEventListener("click", e => {
    e.stopPropagation();
    delete_coffee(Number(btn.dataset.deleteCoffee));
  }));
  app.querySelectorAll(".coffee-rename-btn").forEach(btn => btn.addEventListener("click", () => {
    const cid = Number(btn.dataset.cid);
    const inp = app.querySelector(`.coffee-rename-input[data-cid="${cid}"]`);
    const new_name = inp?.value.trim();
    if (!new_name) return;
    rename_coffee(cid, new_name);
  }));

  // ── FP Codes
  app.querySelectorAll(".new-fp-code").forEach(inp => inp.addEventListener("input", e => {
    const cid = Number(inp.dataset.cid);
    if (!state.ui.new_fp[cid]) state.ui.new_fp[cid] = { fp_code:"", bag_size:"100g", err:"" };
    state.ui.new_fp[cid].fp_code = e.target.value;
  }));
  app.querySelectorAll(".new-fp-bag-size").forEach(sel => sel.addEventListener("change", e => {
    const cid = Number(sel.dataset.cid);
    if (!state.ui.new_fp[cid]) state.ui.new_fp[cid] = { fp_code:"", bag_size:"100g", err:"" };
    state.ui.new_fp[cid].bag_size = e.target.value;
  }));
  app.querySelectorAll(".add-fp-btn").forEach(btn => btn.addEventListener("click", () => {
    const cid = Number(btn.dataset.cid);
    const nfp = state.ui.new_fp[cid] || { fp_code:"", bag_size:"100g", err:"" };
    const fp_code = (document.querySelector(`.new-fp-code[data-cid="${cid}"]`)?.value || nfp.fp_code).trim();
    const bag_size = nfp.bag_size || "100g";
    if (!fp_code) {
      state.ui.new_fp[cid] = { ...nfp, fp_code, err:"FP code is required." };
      render(); return;
    }
    add_fp_code(cid, fp_code, bag_size);
  }));
  app.querySelectorAll("[data-delete-fp]").forEach(btn => btn.addEventListener("click", () => {
    const [cid, fid] = btn.dataset.deleteFp.split("__").map(Number);
    delete_fp_code(cid, fid);
  }));

  // ── Retire / Restore
  app.querySelectorAll("[data-retire-coffee]").forEach(btn => btn.addEventListener("click", e => {
    e.stopPropagation();
    retire_coffee(Number(btn.dataset.retireCoffee));
  }));
  app.querySelectorAll("[data-restore-coffee]").forEach(btn => btn.addEventListener("click", e => {
    e.stopPropagation();
    restore_coffee(Number(btn.dataset.restoreCoffee));
  }));
  app.querySelectorAll("[data-retire-fp]").forEach(btn => btn.addEventListener("click", () => {
    const [cid, fid] = btn.dataset.retireFp.split("__").map(Number);
    retire_fp_code(cid, fid);
  }));
  app.querySelectorAll("[data-restore-fp]").forEach(btn => btn.addEventListener("click", () => {
    const [cid, fid] = btn.dataset.restoreFp.split("__").map(Number);
    restore_fp_code(cid, fid);
  }));
  // ── Reassign (BC reuse) — coffee-level: moves all the coffee's active codes
  app.querySelectorAll("[data-reassign-toggle]").forEach(btn => btn.addEventListener("click", () => {
    const cid = Number(btn.dataset.reassignToggle);
    state.ui.reassign_open = state.ui.reassign_open === cid ? null : cid;
    state.ui.reassign_form = { coffee_id: "", date: today(), err: "", saving: false };
    render();
  }));
  app.querySelectorAll(".reassign-coffee").forEach(sel => sel.addEventListener("change", () => {
    state.ui.reassign_form = { ...state.ui.reassign_form, coffee_id: sel.value };
  }));
  app.querySelectorAll(".reassign-date").forEach(inp => inp.addEventListener("change", () => {
    state.ui.reassign_form = { ...state.ui.reassign_form, date: inp.value };
  }));
  app.querySelectorAll("[data-reassign-confirm]").forEach(btn => btn.addEventListener("click", () => {
    reassign_coffee_codes(Number(btn.dataset.reassignConfirm));
  }));
  app.querySelectorAll("[data-reassign-cancel]").forEach(btn => btn.addEventListener("click", () => {
    state.ui.reassign_open = null; state.ui.reassign_form = {}; render();
  }));
  // Coffee filter tabs (active / retired)
  app.querySelectorAll("[data-coffee-filter]").forEach(btn => btn.addEventListener("click", () => {
    state.ui.coffee_filter = btn.dataset.coffeeFilter;
    render();
  }));
  // Toggle retired FP section visibility per coffee
  app.querySelectorAll("[data-toggle-retired-fp]").forEach(el => el.addEventListener("click", () => {
    const cid = Number(el.dataset.toggleRetiredFp);
    state.ui.show_retired_fp[cid] = !state.ui.show_retired_fp[cid];
    render();
  }));

  // ── Bag Label Data
  // Input changes update the working draft (but don't render until save) — to keep typing fluid.
  app.querySelectorAll(".label-input").forEach(inp => inp.addEventListener("input", e => {
    const fp = inp.dataset.fp;
    const field = inp.dataset.field;
    const existing = state.ui.label_edit[fp] || { ...(label_for_fp(fp) || {}) };
    state.ui.label_edit[fp] = { ...existing, [field]: e.target.value, dirty: true };
    // Toggle the Save button's appearance without a full re-render
    const card = document.querySelector(`[data-fp-card="${fp.replace(/"/g, '\\"')}"]`);
    const save_btn = card?.querySelector(".label-save-btn");
    if (save_btn) {
      save_btn.disabled = false;
      save_btn.classList.remove("btn-ghost");
      save_btn.classList.add("btn-dark");
    }
  }));
  // Save button — triggers upsert + re-renders
  app.querySelectorAll(".label-save-btn").forEach(btn => btn.addEventListener("click", () => {
    save_fp_label_data(btn.dataset.fp);
  }));
  // Copy-from sibling: pre-fill all fields except price from the chosen FP code's saved data
  app.querySelectorAll(".label-copy-from").forEach(sel => sel.addEventListener("change", e => {
    const target_fp = sel.dataset.fp;
    const source_fp = e.target.value;
    if (!source_fp) return;
    const source = label_for_fp(source_fp);
    if (!source) return;
    const existing = state.ui.label_edit[target_fp] || { ...(label_for_fp(target_fp) || {}) };
    // Copy shared fields, leave price alone
    state.ui.label_edit[target_fp] = {
      ...existing,
      roast_type: source.roast_type || "",
      region:     source.region     || "",
      process:    source.process    || "",
      altitude:   source.altitude   || "",
      flavour_1:  source.flavour_1  || "",
      flavour_2:  source.flavour_2  || "",
      flavour_3:  source.flavour_3  || "",
      dirty: true,
    };
    render();
  }));

  // ── Shops
  app.querySelector("#new-shop-master")?.addEventListener("input", e => { state.ui.new_shop_master = e.target.value; });
  app.querySelector("#new-shop-kind")?.addEventListener("change", e => { state.ui.new_shop_kind = e.target.value; });
  app.querySelector("#new-shop-master")?.addEventListener("keydown", e => { if (e.key==="Enter") app.querySelector("#add-shop-mapping")?.click(); });
  app.querySelector("#add-shop-mapping")?.addEventListener("click", () => {
    const master = document.getElementById("new-shop-master")?.value.trim();
    const kind = document.getElementById("new-shop-kind")?.value || "shop";
    if (!master) { state.ui.shop_err = "Please enter a name."; render(); return; }
    add_shop_mapping(master, kind);
  });
  app.querySelectorAll("[data-delete-shop-master]").forEach(btn => btn.addEventListener("click", () => {
    delete_shop_master(btn.dataset.deleteShopMaster);
  }));
  app.querySelectorAll("[data-generate-shop-qr]").forEach(btn => btn.addEventListener("click", () => {
    generate_shop_qr(btn.dataset.generateShopQr);
  }));

  // ── Buckets
  app.querySelector("#bucket-count")?.addEventListener("input", e => { state.ui.bucket_count = e.target.value; });
  app.querySelector("#bucket-prefix")?.addEventListener("input", e => { state.ui.bucket_prefix = e.target.value; });
  app.querySelector("#print-range-btn")?.addEventListener("click", () => {
    const pre = (document.getElementById("range-prefix")?.value||"").trim().toLowerCase();
    const fromV = document.getElementById("range-from")?.value, toV = document.getElementById("range-to")?.value;
    const from = (fromV===""||fromV==null) ? null : parseInt(fromV,10);
    const to   = (toV===""||toV==null) ? null : parseInt(toV,10);
    const num = b => { const m = String(b.name||b.id||"").match(/(\d+)\s*$/); return m ? parseInt(m[1],10) : null; };
    let list = state.buckets.filter(b => !b.retired_at);
    if (pre) list = list.filter(b => String(b.name||"").toLowerCase().includes(pre));
    if (from!=null || to!=null) list = list.filter(b => { const n = num(b); return n!=null && (from==null||n>=from) && (to==null||n<=to); });
    list = list.map(b => ({ b, n: num(b) })).sort((a,b) => (a.n??1e9)-(b.n??1e9)).map(x => x.b);
    if (!list.length) { state.ui.bucket_err = "No active buckets match that range."; render(); return; }
    window.open(`print-qr.html?ids=${list.map(b => encodeURIComponent(b.id)).join(",")}`, "_blank");
  });
  app.querySelector("#generate-buckets-btn")?.addEventListener("click", () => {
    const n = document.getElementById("bucket-count")?.value;
    const p = document.getElementById("bucket-prefix")?.value;
    generate_buckets(n, p);
  });
  app.querySelector("#qr-test-btn")?.addEventListener("click", () => { test_qr(document.getElementById("qr-test-input")?.value); });
  app.querySelector("#qr-test-input")?.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); test_qr(e.target.value); } });
  app.querySelector("#bucket-restore-name")?.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); document.getElementById("bucket-restore-input")?.focus(); } });
  app.querySelector("#bucket-restore-btn")?.addEventListener("click", () => restore_bucket(document.getElementById("bucket-restore-input")?.value, document.getElementById("bucket-restore-name")?.value));
  app.querySelector("#bucket-restore-input")?.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); restore_bucket(e.target.value, document.getElementById("bucket-restore-name")?.value); } });
  app.querySelector("#bucket-restore-clear")?.addEventListener("click", () => { state.restore_log = []; render(); });
  app.querySelectorAll("[data-bucket-filter]").forEach(btn => btn.addEventListener("click", () => {
    state.ui.bucket_filter = btn.dataset.bucketFilter;
    render();
  }));
  app.querySelectorAll("[data-retire-bucket]").forEach(btn => btn.addEventListener("click", () => {
    retire_bucket(btn.dataset.retireBucket);
  }));
  app.querySelectorAll("[data-restore-bucket]").forEach(btn => btn.addEventListener("click", () => {
    restore_bucket(btn.dataset.restoreBucket);
  }));
  app.querySelectorAll("[data-bucket-name]").forEach(inp => {
    const save = async () => {
      const id = inp.dataset.bucketName;
      const name = inp.value.trim() || null;
      const current = state.buckets.find(x => x.id === id);
      if (current && current.name === name) return;  // no change
      const { error } = await supabaseClient.from("buckets").update({ name }).eq("id", id);
      if (error) { alert("Failed to save name: " + error.message); return; }
      if (current) current.name = name;
      // Visual confirmation — brief green flash on the input
      inp.style.borderColor = "#16a34a";
      inp.style.boxShadow = "0 0 0 3px rgba(22,163,74,0.15)";
      setTimeout(() => { inp.style.borderColor = ""; inp.style.boxShadow = ""; }, 800);
    };
    inp.addEventListener("change", save);
    inp.addEventListener("blur", save);
  });

  // ── Containers
  app.querySelector("#new-container-id")?.addEventListener("input", e => { state.ui.new_container_id = e.target.value; });
  app.querySelector("#new-container-name")?.addEventListener("input", e => { state.ui.new_container_name = e.target.value; });
  app.querySelector("#new-container-empty")?.addEventListener("input", e => { state.ui.new_container_empty = e.target.value; });
  app.querySelector("#new-container-id")?.addEventListener("keydown", e => { if (e.key==="Enter") app.querySelector("#add-container-btn")?.click(); });
  app.querySelector("#new-container-name")?.addEventListener("keydown", e => { if (e.key==="Enter") app.querySelector("#add-container-btn")?.click(); });
  app.querySelector("#new-container-empty")?.addEventListener("keydown", e => { if (e.key==="Enter") app.querySelector("#add-container-btn")?.click(); });
  app.querySelector("#add-container-btn")?.addEventListener("click", () => {
    const id = document.getElementById("new-container-id")?.value;
    const name = document.getElementById("new-container-name")?.value;
    const empty_kg = document.getElementById("new-container-empty")?.value;
    add_container(id, name, empty_kg);
  });
  app.querySelectorAll("[data-container-filter]").forEach(btn => btn.addEventListener("click", () => {
    state.ui.container_filter = btn.dataset.containerFilter;
    render();
  }));
  app.querySelectorAll("[data-retire-container]").forEach(btn => btn.addEventListener("click", () => {
    retire_container(btn.dataset.retireContainer);
  }));
  app.querySelectorAll("[data-restore-container]").forEach(btn => btn.addEventListener("click", () => {
    restore_container(btn.dataset.restoreContainer);
  }));
  app.querySelectorAll("[data-container-name]").forEach(inp => {
    const save = async () => {
      const id = inp.dataset.containerName;
      const name = inp.value.trim() || null;
      const current = state.containers.find(x => x.id === id);
      if (current && current.name === name) return;
      const { error } = await supabaseClient.from("containers").update({ name }).eq("id", id);
      if (error) { alert("Failed to save name: " + error.message); return; }
      if (current) current.name = name;
      inp.style.borderColor = "#16a34a";
      inp.style.boxShadow = "0 0 0 3px rgba(22,163,74,0.15)";
      setTimeout(() => { inp.style.borderColor = ""; inp.style.boxShadow = ""; }, 800);
    };
    inp.addEventListener("change", save);
    inp.addEventListener("blur", save);
  });

  app.querySelectorAll("[data-container-empty]").forEach(inp => {
    const save = async () => {
      const id = inp.dataset.containerEmpty;
      const raw = inp.value.trim();
      const empty_kg = raw === "" ? null : Number(raw);
      if (empty_kg !== null && (isNaN(empty_kg) || empty_kg < 0)) {
        inp.style.borderColor = "#dc2626";
        return;
      }
      const current = state.containers.find(x => x.id === id);
      if (current && current.empty_kg === empty_kg) return;
      const { error } = await supabaseClient.from("containers").update({ empty_kg }).eq("id", id);
      if (error) { alert("Failed to save empty weight: " + error.message); return; }
      if (current) current.empty_kg = empty_kg;
      inp.style.borderColor = "#16a34a";
      inp.style.boxShadow = "0 0 0 3px rgba(22,163,74,0.15)";
      setTimeout(() => { inp.style.borderColor = ""; inp.style.boxShadow = ""; }, 800);
    };
    inp.addEventListener("change", save);
    inp.addEventListener("blur", save);
  });

  // ── Users
  app.querySelector("#new-user-email")?.addEventListener("input", e => { state.ui.new_user_email = e.target.value; });
  app.querySelector("#new-user-role")?.addEventListener("change", e => { state.ui.new_user_role = e.target.value; });
  app.querySelector("#invite-user-btn")?.addEventListener("click", () => {
    const email = document.getElementById("new-user-email")?.value.trim();
    const role  = document.getElementById("new-user-role")?.value;
    invite_user(email, role);
  });
  app.querySelectorAll(".user-role-select").forEach(sel => sel.addEventListener("change", e => {
    update_user_role(sel.dataset.uid, e.target.value);
  }));
  app.querySelectorAll("[data-user-name]").forEach(inp => {
    inp.addEventListener("change", async e => {
      const uid = inp.dataset.userName;
      const name = e.target.value.trim() || null;
      const { error } = await supabaseClient.from("user_roles").update({ display_name: name }).eq("user_id", uid);
      if (error) { alert("Failed to save name: " + error.message); return; }
      const u = state.user_roles.find(r => r.user_id === uid);
      if (u) u.display_name = name;
    });
  });
  app.querySelectorAll("[data-remove-user]").forEach(btn => btn.addEventListener("click", () => {
    const [uid, email] = btn.dataset.removeUser.split("__");
    remove_user(uid, email);
  }));
  app.querySelectorAll("[data-cancel-invite]").forEach(btn => btn.addEventListener("click", () => {
    cancel_invite(btn.dataset.cancelInvite);
  }));

}
</script>
</body>
</html>
